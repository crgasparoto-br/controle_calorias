name: Fix issue 880 pending audit findings

on:
  push:
    branches:
      - feat/875-professional-context-routes-fix880
    paths:
      - .github/workflows/fix-issue-880.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes-fix880
          fetch-depth: 0
      - name: Apply issue 880 fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('client/src/pages/professional/ProfessionalPatientWorkspace.tsx')
          source = path.read_text(encoding='utf-8')

          source = source.replace(
              'import React, { useEffect, useMemo, useRef, useState } from "react";',
              'import React, { useCallback, useEffect, useMemo, useRef, useState } from "react";'
          )

          source = source.replace(
              'const UNSAVED_MESSAGE =\n  "Existem alterações não salvas. Deseja sair e descartá-las?";\n',
              'const UNSAVED_MESSAGE =\n  "Existem alterações não salvas. Deseja sair e descartá-las?";\n\nexport function confirmDiscardUnsavedChanges(\n  dirty: boolean,\n  discardDrafts: () => void\n) {\n  if (!dirty) return true;\n  if (!window.confirm(UNSAVED_MESSAGE)) return false;\n  discardDrafts();\n  return true;\n}\n'
          )

          source = source.replace(
              'function useUnsavedNavigationGuard(dirty: boolean, currentPath: string) {',
              'function useUnsavedNavigationGuard(\n  dirty: boolean,\n  currentPath: string,\n  discardDrafts: () => void\n) {'
          )

          source = source.replace(
              '''      if (!window.confirm(UNSAVED_MESSAGE)) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
      } else {
        allowNavigationRef.current = true;
      }''',
              '''      if (!confirmDiscardUnsavedChanges(dirty, discardDrafts)) {
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
      } else {
        allowNavigationRef.current = true;
      }'''
          )

          source = source.replace(
              '  }, [dirty]);\n\n  useEffect(() => {\n    const guardBack = () => {',
              '  }, [dirty, discardDrafts]);\n\n  useEffect(() => {\n    const guardBack = () => {'
          )

          source = source.replace(
              '''      if (!window.confirm(UNSAVED_MESSAGE)) {
        window.history.pushState({ professionalDraftGuard: true }, "", currentPath);
      } else {
        allowNavigationRef.current = true;
      }''',
              '''      if (!confirmDiscardUnsavedChanges(dirty, discardDrafts)) {
        window.history.pushState({ professionalDraftGuard: true }, "", currentPath);
      } else {
        allowNavigationRef.current = true;
      }'''
          )

          source = source.replace(
              '  }, [currentPath, dirty]);',
              '  }, [currentPath, dirty, discardDrafts]);'
          )

          source = source.replace(
              '''    canNavigate() {
      if (!dirty || window.confirm(UNSAVED_MESSAGE)) {
        allowNavigationRef.current = true;
        return true;
      }
      return false;
    },''',
              '''    canNavigate() {
      if (!confirmDiscardUnsavedChanges(dirty, discardDrafts)) return false;
      allowNavigationRef.current = true;
      return true;
    },'''
          )

          source = source.replace(
              '''  useEffect(() => {
    setAssessment(emptyAssessment);
    setNote("");
    setGuidanceTitle("");
    setGuidance("");
    setTransitionReason("");
    setPage(1);
  }, [patientId]);''',
              '''  const discardDrafts = useCallback(() => {
    setAssessment(emptyAssessment);
    setNote("");
    setGuidanceTitle("");
    setGuidance("");
  }, []);

  useEffect(() => {
    discardDrafts();
    setTransitionReason("");
    setPage(1);
  }, [discardDrafts, patientId]);'''
          )

          source = source.replace(
              '  const guard = useUnsavedNavigationGuard(dirty, location);',
              '  const guard = useUnsavedNavigationGuard(dirty, location, discardDrafts);'
          )

          required = [
              'export function confirmDiscardUnsavedChanges',
              'useUnsavedNavigationGuard(dirty, location, discardDrafts)',
              'const discardDrafts = useCallback',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'missing expected marker after patch: {marker}')
          path.write_text(source, encoding='utf-8')

          test = Path('client/src/pages/professional/ProfessionalPatientWorkspace.unsavedNavigation.test.ts')
          test.write_text('''// @vitest-environment jsdom
import { afterEach, describe, expect, it, vi } from "vitest";
import { confirmDiscardUnsavedChanges } from "./ProfessionalPatientWorkspace";

afterEach(() => {
  vi.restoreAllMocks();
});

describe("confirmDiscardUnsavedChanges", () => {
  it("navigates without prompting when there is no draft", () => {
    const confirm = vi.spyOn(window, "confirm");
    const discard = vi.fn();

    expect(confirmDiscardUnsavedChanges(false, discard)).toBe(true);
    expect(confirm).not.toHaveBeenCalled();
    expect(discard).not.toHaveBeenCalled();
  });

  it("keeps the draft when the professional cancels navigation", () => {
    vi.spyOn(window, "confirm").mockReturnValue(false);
    const discard = vi.fn();

    expect(confirmDiscardUnsavedChanges(true, discard)).toBe(false);
    expect(discard).not.toHaveBeenCalled();
  });

  it("clears the active patient drafts before allowing navigation", () => {
    vi.spyOn(window, "confirm").mockReturnValue(true);
    const discard = vi.fn();

    expect(confirmDiscardUnsavedChanges(true, discard)).toBe(true);
    expect(discard).toHaveBeenCalledTimes(1);
  });
});
''', encoding='utf-8')

          docs = Path('docs/product-specs/professionals.md')
          doc = docs.read_text(encoding='utf-8')
          marker = '## Workspace contextual do paciente'
          addition = '''\n\n## Proteção de rascunhos no workspace do paciente\n\n- Avaliações, orientações e anotações não salvas devem bloquear navegação acidental pela subnavegação, navegação lateral, histórico do navegador, troca de paciente e fechamento ou recarga da página.\n- Ao permanecer na página, o rascunho atual deve ser preservado.\n- Ao confirmar o descarte, todos os campos não salvos do paciente atual devem ser limpos antes da navegação.\n- Rascunhos nunca podem ser reutilizados ao trocar de paciente.\n'''
          if '## Proteção de rascunhos no workspace do paciente' not in doc:
              doc += addition
              docs.write_text(doc, encoding='utf-8')

          workflow = Path('.github/workflows/fix-issue-880.yml')
          workflow.unlink()
          PY
      - name: Validate focused behavior
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec vitest run client/src/pages/professional/ProfessionalPatientWorkspace.unsavedNavigation.test.ts --maxWorkers=1 --minWorkers=1
          pnpm check
          pnpm docs:check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
                  client/src/pages/professional/ProfessionalPatientWorkspace.unsavedNavigation.test.ts \
                  docs/product-specs/professionals.md \
                  .github/workflows/fix-issue-880.yml
          git commit -m "fix: descartar rascunhos do workspace profissional (#880)"
          git push origin HEAD:feat/875-professional-context-routes-fix880
