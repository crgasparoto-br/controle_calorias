name: Issue 923 fix TypeScript cast

on:
  push:
    branches:
      - feat/923-ai-capabilities-question-nutrition-embedding

permissions:
  contents: write

concurrency:
  group: issue-923-fix-typescript
  cancel-in-progress: true

jobs:
  fix-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix isolated SDK cast and publish
        env:
          TARGET_BRANCH: feat/923-ai-capabilities-question-nutrition-embedding
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'server/_core/aiProvider.ts';
          const before = 'return { type: "web_search" } as OpenAiSdkTextTool;';
          const after = 'return { type: "web_search" } as unknown as OpenAiSdkTextTool;';
          const content = fs.readFileSync(path, 'utf8');
          const count = content.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected one SDK cast, found ${count}`);
          fs.writeFileSync(path, content.replace(before, after));
          NODE
          git rm .github/workflows/issue-923-fix-typescript.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_core/aiProvider.ts
          git commit -m "fix(ai): isolate stable web search SDK cast"
          git push origin "HEAD:${TARGET_BRANCH}"
