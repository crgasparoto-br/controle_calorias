name: Issue 880 correction builder

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".orchestrator/issue-880-corrections.py"
      - ".github/workflows/issue-880-correction-builder.yml"
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".orchestrator/issue-880-corrections.py"
      - ".github/workflows/issue-880-correction-builder.yml"

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout candidate parent
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture parent identity
        run: |
          mkdir -p /tmp/issue-880-builder
          git rev-parse HEAD > /tmp/issue-880-builder/parent-head-sha.txt
          git rev-parse 'HEAD^{tree}' > /tmp/issue-880-builder/parent-tree-sha.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply audited corrections
        run: |
          set +e
          python .orchestrator/issue-880-corrections.py 2>&1 | tee /tmp/issue-880-transform.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload transform diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-880-transform-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/issue-880-transform.log
          if-no-files-found: error
          retention-days: 3

      - name: Format changed sources
        run: |
          pnpm exec prettier --write \
            server/modules/professionals/patientContextService.ts \
            server/modules/professionals/patientContextService.test.ts \
            client/src/components/ProfessionalLayout.tsx \
            client/src/components/professional/ProfessionalUi.tsx \
            client/src/components/professional/ProfessionalUi.test.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.activity.test.ts \
            client/src/pages/professional/ProfessionalPatientWorkspace.access.test.tsx \
            visual-tests/professional-patient-workspace/trpcMock.ts \
            docs/design-docs/professional-navigation.md

      - name: Run focused regression tests
        env:
          NODE_ENV: test
        run: |
          pnpm exec vitest run \
            server/modules/professionals/patientContextService.test.ts \
            client/src/components/professional/ProfessionalUi.test.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.activity.test.ts \
            client/src/pages/professional/ProfessionalPatientWorkspace.access.test.tsx \
            client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx \
            --maxWorkers=1 --minWorkers=1

      - name: TypeScript check
        run: pnpm check

      - name: Render corrected workspace evidence
        run: bash scripts/render-professional-patient-workspace-visual.sh

      - name: Assemble exact candidate tree
        run: |
          rm -f .orchestrator/issue-880-corrections.py
          rm -f .github/workflows/issue-880-correction-builder.yml
          git diff --check
          git add -A
          git -c user.name='SolverIT Orchestrator' \
              -c user.email='orchestrator@solverit.invalid' \
              commit -m 'fix(professional): stabilize patient workspace context (#880)'
          git rev-parse HEAD > /tmp/issue-880-builder/local-candidate-head-sha.txt
          git rev-parse 'HEAD^{tree}' > /tmp/issue-880-builder/candidate-tree-sha.txt
          git diff-tree --no-commit-id --name-only -r HEAD > /tmp/issue-880-builder/changed-files.txt
          git format-patch -1 --stdout HEAD > /tmp/issue-880-builder/candidate.patch
          git bundle create /tmp/issue-880-builder/candidate.bundle HEAD
          git archive --format=tar.gz -o /tmp/issue-880-builder/candidate-source.tar.gz HEAD
          cp -R artifacts/professional-patient-workspace /tmp/issue-880-builder/visual-evidence

      - name: Upload correction candidate
        uses: actions/upload-artifact@v4
        with:
          name: issue-880-correction-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/issue-880-builder
          if-no-files-found: error
          retention-days: 7
