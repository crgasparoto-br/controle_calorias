name: Validate GitHub Audit MCP

# Offline authorization/security tests: independent CI job and trusted source.
# This check does NOT assert a human-independent reviewer.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  authorization:
    name: Offline authorization tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
      DATABASE_URL: ""
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run actual offline authorization regressions
        run: |
          pnpm exec vitest run \
            server/auth.local.test.ts \
            server/auth.logout.test.ts \
            server/modules/professionals/whatsappAuthorization.test.ts \
            server/modules/professionals/aiAuthorizationTelemetry.test.ts \
            server/modules/billing/billingRolloutAdminAuthorization.test.ts \
            --maxWorkers=1 --minWorkers=1
