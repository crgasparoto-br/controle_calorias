name: Fix issue 880 correction workflow

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/fix-patch-issue-880-workflow.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  fix-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Make repeated service replacement explicit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/patch-issue-880-audit-findings.yml')
          source = path.read_text(encoding='utf-8')
          old = '          ]:\n              replace_once(professional_service, old, new)\n'
          new = '''          ]:
              file = Path(professional_service)
              source = file.read_text(encoding="utf-8")
              expected = 2 if "const timeZone = await getEffectiveUserTimeZone" in old else 1
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f"{professional_service}: expected {expected} anchors, found {count}: {old[:100]!r}"
                  )
              file.write_text(source.replace(old, new), encoding="utf-8")
'''
          if source.count(old) != 1:
              raise SystemExit('expected one professional service loop anchor')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit workflow correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-patch-issue-880-workflow.yml
          git add .github/workflows/patch-issue-880-audit-findings.yml
          git diff --cached --check
          git commit -m "ci: fix issue 880 correction workflow"
          git push origin HEAD:feat/875-professional-context-routes
      - name: Dispatch corrected workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/patch-issue-880-audit-findings.yml/dispatches \
            --data '{"ref":"feat/875-professional-context-routes"}'
