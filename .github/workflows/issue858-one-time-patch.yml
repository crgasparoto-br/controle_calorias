name: Issue 858 one-time patch

on:
  push:
    branches:
      - feat/858-interactive-coverage

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/858-interactive-coverage
          fetch-depth: 0
      - name: Apply deterministic source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_exact(
              "server/whatsappIntentWebhook.ts",
              '''    if (precedenceGate.step !== "continue_pipeline") {
                markTextIntentMessageHandled(message.id);
                await clearPendingTextIntentContext(userId);
                await sendAndLogTextReply({''',
              '''    if (precedenceGate.step !== "continue_pipeline") {
                markTextIntentMessageHandled(message.id);
                const preservePendingAfterReplay =
                  precedenceGate.result.eventType === "whatsapp.interaction.pending_represented";
                if (!preservePendingAfterReplay) {
                  await clearPendingTextIntentContext(userId);
                }
                await sendAndLogTextReply({''',
          )
          replace_exact(
              "server/whatsappIntentWebhook.ts",
              '''      interactiveReplyId,
                sourcePhone,
              });''',
              '''      interactiveReplyId,
                sourcePhone,
                messageId: message.id,
              });''',
          )

          replace_exact(
              "server/modules/whatsapp/llmIntentActions.ts",
              '''import { createDrizzleWhatsAppPendingOperationRepository } from "../../repositories/whatsappPendingOperationRepository";''',
              '''import { createDrizzleWhatsAppPendingOperationRepository } from "../../repositories/whatsappPendingOperationRepository";
          import { createWhatsappIntentClarificationInteraction } from "./intentClarificationInteraction";''',
          )
          clarification = '''function buildClarification(intent: WhatsappInterpretedIntent): WhatsappLlmIntentResult {
            const clarificationQuestion = intent.intent === "unknown"
              ? WHATSAPP_GENERIC_CLARIFICATION_MESSAGE
              : intent.clarificationQuestion ?? WHATSAPP_GENERIC_CLARIFICATION_MESSAGE;

            return {
              handled: true,
              action: "clarification_needed",
              reply: buildWhatsAppClarificationReplyMessage(clarificationQuestion),
              eventType: "whatsapp.llm_intent.clarification_needed",
              detail: `Intencao ${intent.intent} exige esclarecimento antes de executar.`,
              data: {
                intent: intent.intent,
                intentConfidence: intent.confidence,
                possibleIntents: intent.possibleIntents,
              },
              toolTrace: [buildClarificationToolTrace(intent)],
            };
          }'''
          clarification_with_interaction = clarification + '''

          async function buildInteractiveClarification(
            userId: number,
            originalText: string,
            intent: WhatsappInterpretedIntent,
            receivedAt: Date,
          ): Promise<WhatsappLlmIntentResult> {
            const base = buildClarification(intent);
            if (!base.reply.includes(WHATSAPP_GENERIC_CLARIFICATION_MESSAGE)) return base;

            const interaction = await createWhatsappIntentClarificationInteraction({
              userId,
              originalText,
              bodyText: base.reply,
              receivedAt,
            });
            if (!interaction) return base;

            return {
              ...base,
              detail: `${base.detail} ${interaction.detail}`,
              data: { ...base.data, ...interaction.data },
              interactiveReply: interaction.interactiveReply,
            };
          }'''
          replace_exact(
              "server/modules/whatsapp/llmIntentActions.ts",
              clarification,
              clarification_with_interaction,
          )
          replace_exact(
              "server/modules/whatsapp/llmIntentActions.ts",
              '''      return finish(buildClarification(intent), clarificationFallbackReason);''',
              '''      return finish(await buildInteractiveClarification(userId, text, intent, receivedAt), clarificationFallbackReason);''',
          )
          replace_exact(
              "server/modules/whatsapp/llmIntentActions.ts",
              '''        return finish(buildClarification(intent), interpretation.fallbackReason);''',
              '''        return finish(await buildInteractiveClarification(userId, text, intent, receivedAt), interpretation.fallbackReason);''',
          )

          replace_exact(
              "server/modules/professionals/service.ts",
              '''import { buildWhatsAppCallbackId } from "../whatsapp/interactiveCallback";
          import {
            buttonsReply,
            type WhatsAppLogicalReply,
          } from "../whatsapp/replyContract";''',
              '''import { buildWhatsappClosedDecisionReply } from "../whatsapp/interactionPresentation";
          import type { WhatsAppLogicalReply } from "../whatsapp/replyContract";
          import {
            buildProfessionalAccessActions,
            PROFESSIONAL_ACCESS_AUTHORIZE_ACTION as AUTHORIZE_ACTION,
            PROFESSIONAL_ACCESS_REJECT_ACTION as REJECT_ACTION,
          } from "./accessInteractionContract";''',
          )
          replace_exact(
              "server/modules/professionals/service.ts",
              '''const AUTHORIZE_ACTION = "authorize";
          const REJECT_ACTION = "reject";
          ''',
              '''''',
          )
          replace_exact(
              "server/modules/professionals/service.ts",
              '''  const reply: WhatsAppLogicalReply = pendingOperation
              ? buttonsReply(message, [
                  {
                    id: buildWhatsAppCallbackId(pendingOperation.id, AUTHORIZE_ACTION),
                    title: "Autorizar",
                  },
                  {
                    id: buildWhatsAppCallbackId(pendingOperation.id, REJECT_ACTION),
                    title: "Recusar",
                  },
                ])
              : { kind: "functional", messages: [{ type: "text", body: message }] };''',
              '''  const reply: WhatsAppLogicalReply = pendingOperation
              ? buildWhatsappClosedDecisionReply({
                  bodyText: message,
                  pendingOperationId: pendingOperation.id,
                  actions: buildProfessionalAccessActions(),
                })
              : { kind: "functional", messages: [{ type: "text", body: message }] };''',
          )

          replace_exact(
              "server/modules/whatsapp/interactionRegistry.ts",
              '''import { DEFAULT_APP_TIME_ZONE } from "../../../shared/timeZone";''',
              '''import { DEFAULT_APP_TIME_ZONE } from "../../../shared/timeZone";
          import { buildProfessionalAccessActions } from "../professionals/accessInteractionContract";''',
          )
          replace_exact(
              "server/modules/whatsapp/interactionRegistry.ts",
              '''export function buildProfessionalAccessActions(): WhatsappInteractionAction[] {
            return [
              { id: "authorize", label: "Autorizar", effect: "grant_access" },
              { id: "reject", label: "Recusar", effect: "reject_access" },
            ];
          }

          ''',
              '''''',
          )

          Path(".github/workflows/issue858-one-time-patch.yml").unlink()
          PY
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(whatsapp): concluir centralização interativa da issue 858"
          git push origin HEAD:feat/858-interactive-coverage
