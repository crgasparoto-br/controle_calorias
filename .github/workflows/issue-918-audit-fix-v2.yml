name: Issue 918 audit fix v2

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: issue-918-audit-fix-v2
  cancel-in-progress: false

jobs:
  patch-and-validate:
    if: ${{ github.head_ref == 'fix/918-whatsapp-multiline-replacements' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/918-whatsapp-multiline-replacements
          fetch-depth: 0

      - name: Detect current state
        id: state
        run: |
          if grep -q 'WHATSAPP_FOOD_REPLACEMENT_COMMAND_PATTERN' server/modules/whatsapp/replacementCommandDetection.ts; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.state.outputs.already_applied == 'false'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.state.outputs.already_applied == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.state.outputs.already_applied == 'false'
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic patch
        if: steps.state.outputs.already_applied == 'false'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/issue-918-audit-fix.py')
          content = path.read_text(encoding='utf-8')
          content = content.replace("    '''export const WHATSAPP_FOOD_REPLACEMENT_COMMAND_PATTERN =", "    r'''export const WHATSAPP_FOOD_REPLACEMENT_COMMAND_PATTERN =", 1)
          content = content.replace("    separator_block = '''const REPLACEMENT_SEGMENT_SEPARATOR", "    separator_block = r'''const REPLACEMENT_SEGMENT_SEPARATOR", 1)
          path.write_text(content, encoding='utf-8')
          PY
          python scripts/issue-918-audit-fix.py

      - name: Validate focused regressions
        if: steps.state.outputs.already_applied == 'false'
        run: >-
          pnpm exec vitest run
          server/modules/whatsapp/contextualFoodReplacementIntent.multiline.test.ts
          server/modules/whatsapp/service.multilineReplacement.test.ts
          server/whatsappIntentWebhook.multilineReplacement.test.ts

      - name: Validate repository
        if: steps.state.outputs.already_applied == 'false'
        run: |
          pnpm agent:check
          pnpm build
          git diff --check

      - name: Commit audit fixes
        if: steps.state.outputs.already_applied == 'false'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/modules/whatsapp/replacementCommandDetection.ts \
            server/modules/whatsapp/contextualFoodReplacementIntent.ts \
            server/modules/whatsapp/contextualFoodReplacementIntent.multiline.test.ts \
            server/modules/whatsapp/service.multilineReplacement.test.ts \
            server/whatsappIntentWebhook.multilineReplacement.test.ts \
            docs/testing/whatsapp-response-contract-regression.md
          git commit -m "fix(whatsapp): bloqueia substituições incompletas [audit-fix]"
          git push origin HEAD:fix/918-whatsapp-multiline-replacements
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build repository snapshot
        if: steps.state.outputs.already_applied == 'false'
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          tar --exclude='./node_modules' --exclude='./dist' --exclude='./.cache' -czf /tmp/controle-calorias-issue-918-repo.tar.gz .

      - name: Upload repository snapshot
        if: steps.state.outputs.already_applied == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: issue-918-orchestration-repo-${{ steps.commit.outputs.head_sha }}
          path: /tmp/controle-calorias-issue-918-repo.tar.gz
          if-no-files-found: error
          retention-days: 7
