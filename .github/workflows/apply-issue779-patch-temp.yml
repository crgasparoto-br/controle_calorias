name: Apply issue 779 patch temporary

on:
  push:
    branches:
      - feat/779-concluir-respostas-whatsapp

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited patch
        run: |
          base64 --decode .github/issue779-local.patch.gz.b64 | gzip -d > /tmp/issue779.patch
          git apply --check /tmp/issue779.patch
          git apply /tmp/issue779.patch
          rm .github/issue779-local.patch.gz.b64
          rm .github/workflows/apply-issue779-patch-temp.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(whatsapp): concluir contexto de metas, medidas e acknowledgements (#779)"
          git push origin HEAD:feat/779-concluir-respostas-whatsapp
