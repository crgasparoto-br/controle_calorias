name: Apply issue 793 canonical v3

on:
  pull_request:
    types: [reopened]
    branches:
      - feat/795-timezone-backend-reports

permissions:
  contents: write

jobs:
  consolidate:
    if: github.head_ref == 'feat/796-timezone-whatsapp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: feat/796-timezone-whatsapp
          fetch-depth: 1
          show-progress: false

      - name: Verify and apply canonical implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          echo '25f203bf3fc7d1269d091109245aaf14bcb40a19a2482d5495a2993cea239a06  .github/issue-793-canonical-v3.part00' | sha256sum -c -
          echo 'b3d7c5f7940837f52bd91d69ae70b58d80a69310904fff2485f07524b7b270d2  .github/issue-793-canonical-v3.part01' | sha256sum -c -
          echo '068107a7e28bf5e3a0d333559d7607c9de05e50896a12c43adcba98467b4b6df  .github/issue-793-canonical-v3.part02' | sha256sum -c -
          echo '0178f17ff667d460d556b34e378403842eea99187fb01c912f9ead3d6190f8ea  .github/issue-793-canonical-v3.part03' | sha256sum -c -
          echo 'c3eeaf3bb502d9542adb8d54ebdc0d31af07e4bea0016b68aa119a7c357ae1e3  .github/issue-793-canonical-v3.part04' | sha256sum -c -
          echo 'a1c42e9230a87ecbf61b2dcdd7fc1b9d0a8ae8c350f3104d407c0cb2c96f4634  .github/issue-793-canonical-v3.part05' | sha256sum -c -
          echo '6ba6c20dcbb42d9c2842a6e420bfca3e090337bc97255f0db6ef98b7f2f76dea  .github/issue-793-canonical-v3.part06' | sha256sum -c -

          cat .github/issue-793-canonical-v3.part0{0..6} | base64 -d > /tmp/issue793.patch.xz
          echo '89df90c9d9ee586b7c242da0fafd78765ffc59b3cc645246b48253dc66be6c05  /tmp/issue793.patch.xz' | sha256sum -c -
          xz -t /tmp/issue793.patch.xz
          xz -dc /tmp/issue793.patch.xz > /tmp/issue793-full.patch

          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/issue793-full.patch').read_text()
          excluded = {
              '.github/apply-796.sh',
              '.github/trigger-796-2.txt',
              '.github/workflows/apply-issue-796-whatsapp.yml',
              '.github/workflows/export-793-source.yml',
          }
          sections = source.split('diff --git ')[1:]
          kept = []
          for section in sections:
              header = section.splitlines()[0]
              path = header.split(' b/', 1)[1]
              if path in excluded or path.startswith('.github/issue-796-patch.part'):
                  continue
              kept.append('diff --git ' + section)
          Path('/tmp/issue793-functional.patch').write_text(''.join(kept))
          PY

          git apply --check /tmp/issue793-functional.patch
          git apply /tmp/issue793-functional.patch

          rm -f .github/apply-796.sh
          rm -f .github/apply-issue-793-final.sh
          rm -f .github/trigger-796-2.txt
          rm -f .github/trigger-795.txt
          rm -f .github/issue-796-patch.part*
          rm -f .github/issue-793-canonical.part*
          rm -f .github/issue-793-canonical-v3.part*
          rm -f .github/issue-793-final.part*
          rm -f .github/issue-793-v2.part*

          git add -A
          git diff --cached --check
          git commit -m 'feat(timezone): consolidate effective owner timezone migration (#793)'
          git push origin HEAD:feat/796-timezone-whatsapp
