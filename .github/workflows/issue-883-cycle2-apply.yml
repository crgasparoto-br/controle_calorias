name: Apply issue 883 cycle 2 remediation

on:
  pull_request:
    paths:
      - ".github/workflows/issue-883-cycle2-apply.yml"

permissions:
  contents: write

jobs:
  apply-code:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PATCH_B64: ""
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Confirm exact input head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply cycle 2 patch
        run: |
          printf '%s' "${PATCH_B64}" | base64 -d | gzip -d > /tmp/issue-883-cycle2.patch
          git apply --check /tmp/issue-883-cycle2.patch
          git apply /tmp/issue-883-cycle2.patch
          git diff --check

      - name: Format touched source files
        run: |
          pnpm exec prettier --write \
            client/src/components/ProfessionalProfileSettings.tsx \
            client/src/components/PatientAccessRequestsCard.test.tsx \
            visual-tests/professional-home/main.tsx \
            visual-tests/professional-home/trpcMock.ts
          git diff --check
          bash -n scripts/render-professional-home-visual.sh

      - name: Run focused regression tests
        env:
          NODE_ENV: test
        run: |
          pnpm exec vitest run \
            client/src/components/PatientAccessRequestsCard.test.tsx \
            client/src/components/professional/ProfessionalUi.test.tsx \
            client/src/components/ProfessionalOperationalAlertsPanel.test.tsx \
            --maxWorkers=1 --minWorkers=1

      - name: Validate types and documentation
        run: |
          pnpm check
          pnpm docs:check

      - name: Commit cycle 2 remediation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/components/ProfessionalProfileSettings.tsx \
            client/src/components/PatientAccessRequestsCard.test.tsx \
            visual-tests/professional-home/main.tsx \
            visual-tests/professional-home/trpcMock.ts \
            scripts/render-professional-home-visual.sh
          git commit -m "fix: add local retry for professional profile"
          git push origin "HEAD:${HEAD_BRANCH}"
