name: Issue 923 remediation publisher

on:
  push:
    branches:
      - feat/923-ai-capabilities-question-nutrition-embedding
    paths:
      - .github/workflows/issue-923-remediation-publisher.yml

permissions:
  contents: write

concurrency:
  group: issue-923-remediation-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout publisher commit
        uses: actions/checkout@v4
        with:
          ref: feat/923-ai-capabilities-question-nutrition-embedding
          fetch-depth: 2
          persist-credentials: true

      - name: Verify parent and publish remediation
        shell: bash
        env:
          EXPECTED_PARENT: 32485e49254866db427099a6633b0c3e3906eac5
          TARGET_BRANCH: feat/923-ai-capabilities-question-nutrition-embedding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          printf '%s' '' > /tmp/issue923.patch.gz.b64
          base64 -d /tmp/issue923.patch.gz.b64 | gzip -d > /tmp/issue923.patch
          test "$(sha256sum /tmp/issue923.patch | awk '{print $1}')" = "a334c90c0c16ce7d8415f21dd96b6fea8bb4af5b615c1b500e106db904bbf5e7"
          git apply --index /tmp/issue923.patch
          rm .github/workflows/issue-923-remediation-publisher.yml
          git add -A
          git config user.name "Issue 923 Remediation Publisher"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(ai): govern provider attempts and live smoke credentials"
          git push origin "HEAD:${TARGET_BRANCH}"
