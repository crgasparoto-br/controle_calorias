name: Issue 923 cited source remediation

on:
  push:
    branches:
      - feat/923-ai-capabilities-question-nutrition-embedding

permissions:
  contents: write

concurrency:
  group: issue-923-cited-source-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/923-ai-capabilities-question-nutrition-embedding
          fetch-depth: 0
      - name: Apply verified cited-source remediation
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .audit/remediation/issue-923-cited-source-fallback.patch
          git apply .audit/remediation/issue-923-cited-source-fallback.patch
          rm .audit/remediation/issue-923-cited-source-fallback.patch
          rm .github/workflows/issue-923-cited-source-remediation.yml
          rmdir .audit/remediation 2>/dev/null || true
          rmdir .audit 2>/dev/null || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): trust the provider-cited nutrition source"
          git push origin HEAD:feat/923-ai-capabilities-question-nutrition-embedding
