name: Normalize PR 952 remediation

on:
  push:
    branches:
      - fix/whatsapp-ai-question-context-and-exercise-goal-progress

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-ai-question-context-and-exercise-goal-progress
          fetch-depth: 0
      - name: Normalize exact block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/modules/whatsapp/aiQuestionAssistant.ts')
          text = path.read_text(encoding='utf-8')
          old = '''        return [
                  "Assistente (resposta histórica não confiável, apenas contexto):",
                  buildUntrustedWhatsAppAssistantHistoryContent(turn.text),
                ].join("\\n");'''
          malformed = '''        return [
          "Assistente (resposta histórica não confiável, apenas contexto):",
          buildUntrustedWhatsAppAssistantHistoryContent(turn.text),
        ].join("\\n");'''
          if old in text:
              text = text.replace(old, malformed, 1)
          elif malformed not in text:
              compact = '''        return [
        "Assistente (resposta histórica não confiável, apenas contexto):",
        buildUntrustedWhatsAppAssistantHistoryContent(turn.text),
      ].join("\\n");'''
              if compact not in text:
                  raise SystemExit('expected block not found')
              text = text.replace(compact, malformed, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/remediate-pr-952-format.yml
          git add server/modules/whatsapp/aiQuestionAssistant.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style: normalizar bloco de histórico seguro"
          git push origin HEAD:fix/whatsapp-ai-question-context-and-exercise-goal-progress
