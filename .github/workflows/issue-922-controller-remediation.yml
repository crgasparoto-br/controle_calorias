name: Issue 922 controller remediation

on:
  push:
    branches:
      - feat/922-ai-capabilities-meal-whatsapp
    paths:
      - .github/workflows/issue-922-controller-remediation.yml
  pull_request:
    branches:
      - develop
    types:
      - synchronize
    paths:
      - .github/workflows/issue-922-controller-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: feat/922-ai-capabilities-meal-whatsapp
          fetch-depth: 0

      - name: Centralize WhatsApp intent policy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          resolver = Path("server/_core/ai/configResolver.ts")
          text = resolver.read_text()
          model_start_marker = '  const hasNewModel = Boolean(readTrimmed(env, "AI_WHATSAPP_INTENT_MODEL"));'
          policy_start_marker = '  const hasNewTimeout = Boolean(readTrimmed(env, "AI_WHATSAPP_INTENT_TIMEOUT_MS"));'
          model_start = text.find(model_start_marker)
          policy_start = text.find(policy_start_marker, model_start)
          if model_start < 0 or policy_start < 0:
              raise SystemExit("canonical WhatsApp model block delimiters not found")
          new_model = dedent('''
            const hasNewModel = Boolean(readTrimmed(env, "AI_WHATSAPP_INTENT_MODEL"));
            const specificLegacyModel = readTrimmed(env, "OPENAI_WHATSAPP_INTENT_MODEL");
            const legacyTextModel = readTrimmed(env, "OPENAI_TEXT_MODEL");
            const usesOpenAiWire = primary?.provider === "openai" || primary?.provider === "openai-compatible";

            if (primary && usesOpenAiWire && !hasNewModel) {
              const legacyModel = specificLegacyModel || legacyTextModel;
              const legacyEnv = specificLegacyModel
                ? "OPENAI_WHATSAPP_INTENT_MODEL"
                : legacyTextModel
                  ? "OPENAI_TEXT_MODEL"
                  : null;
              if (legacyModel && legacyEnv) {
                primary = { ...primary, model: legacyModel };
                usedLegacyVariables = true;
                diagnostics.push(
                  `[deprecated] capability=WHATSAPP_INTENT resolved model via legacy variable ${legacyEnv}; migrate to AI_WHATSAPP_INTENT_MODEL`,
                );
              }
            }

          ''')
          text = text[:model_start] + new_model + text[policy_start:]

          policy_start = text.find(policy_start_marker)
          return_marker = "  return {"
          policy_end = text.find(return_marker, policy_start)
          if policy_start < 0 or policy_end < 0:
              raise SystemExit("canonical WhatsApp timeout/retry block delimiters not found")
          new_policy = dedent('''
            const hasNewTimeout = Boolean(readTrimmed(env, "AI_WHATSAPP_INTENT_TIMEOUT_MS"));
            const legacyTimeout = hasNewTimeout
              ? null
              : readPositiveInteger(env, "OPENAI_WHATSAPP_INTENT_TIMEOUT_MS");
            const timeoutMs = hasNewTimeout
              ? config.timeoutMs
              : legacyTimeout ?? WHATSAPP_INTENT_BASELINE_TIMEOUT_MS;
            if (legacyTimeout !== null) {
              usedLegacyVariables = true;
              diagnostics.push(
                "[deprecated] capability=WHATSAPP_INTENT resolved timeout via legacy variable OPENAI_WHATSAPP_INTENT_TIMEOUT_MS; migrate to AI_WHATSAPP_INTENT_TIMEOUT_MS",
              );
            }

            const hasNewMaxAttempts = Boolean(readTrimmed(env, "AI_WHATSAPP_INTENT_MAX_ATTEMPTS"));
            const legacyRetries = hasNewMaxAttempts ? null : readLegacyRetryCount(env);
            const maxAttempts = hasNewMaxAttempts
              ? config.maxAttempts
              : legacyRetries !== null
                ? legacyRetries + 1
                : WHATSAPP_INTENT_BASELINE_MAX_ATTEMPTS;
            if (legacyRetries !== null) {
              usedLegacyVariables = true;
              diagnostics.push(
                "[deprecated] capability=WHATSAPP_INTENT resolved attempts via legacy variable OPENAI_WHATSAPP_INTENT_RETRIES; migrate to AI_WHATSAPP_INTENT_MAX_ATTEMPTS",
              );
            }

          ''')
          resolver.write_text(text[:policy_start] + new_policy + text[policy_end:])

          interpreter = Path("server/modules/whatsapp/intentInterpreter.ts")
          text = interpreter.read_text()
          old_import = 'import { resolveCapabilityConfig, type ResolvedCapabilityConfig } from "../../_core/ai/configResolver";'
          if old_import not in text:
              raise SystemExit("intent interpreter resolver import not found")
          text = text.replace(
              old_import,
              'import { resolveCapabilityConfig } from "../../_core/ai/configResolver";',
              1,
          )
          text = text.replace("const MAX_LLM_RETRIES = 2;\n", "", 1)
          local_policy_start = text.find("function readPositiveIntegerEnv(name: string): number | null {")
          classifier_start = text.find("async function callWhatsappIntentClassifier(")
          if local_policy_start < 0 or classifier_start < 0 or classifier_start <= local_policy_start:
              raise SystemExit("consumer-local WhatsApp policy block delimiters not found")
          text = text[:local_policy_start] + text[classifier_start:]
          old_call = "  const policy = resolveWhatsappIntentPolicy();"
          if old_call not in text:
              raise SystemExit("consumer-local policy call not found")
          text = text.replace(old_call, '  const policy = resolveCapabilityConfig("WHATSAPP_INTENT");', 1)
          if "resolveWhatsappIntentPolicy" in text or "OPENAI_WHATSAPP_INTENT_RETRIES" in text:
              raise SystemExit("consumer-local policy logic remains after remediation")
          interpreter.write_text(text)

          tests = Path("server/_core/ai/__tests__/configResolverWhatsappLegacy.test.ts")
          text = tests.read_text()
          anchor = '  it("uses OPENAI_TEXT_MODEL only for an OpenAI wire when no more specific model exists", () => {'
          addition = dedent('''
            it("prefers the specific legacy WhatsApp model in the canonical resolver", () => {
              const config = resolveCapabilityConfig("WHATSAPP_INTENT", openAiEnv({
                OPENAI_WHATSAPP_INTENT_MODEL: "gpt-whatsapp-specific",
                OPENAI_TEXT_MODEL: "gpt-text-legacy",
              }));

              expect(config.primary).toEqual({ provider: "openai", model: "gpt-whatsapp-specific" });
              expect(config.usedLegacyVariables).toBe(true);
              expect(config.diagnostics).toContainEqual(expect.stringContaining("OPENAI_WHATSAPP_INTENT_MODEL"));
            });

          ''')
          if "prefers the specific legacy WhatsApp model" not in text:
              if anchor not in text:
                  raise SystemExit("config resolver test insertion anchor not found")
              text = text.replace(anchor, addition + anchor, 1)
          tests.write_text(text)

          runtime_test = Path("server/modules/whatsapp/intentPolicyCanonical.test.ts")
          runtime_test.write_text(dedent('''
            import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
            import type { WhatsappIntentContext } from "./intentContext";

            const createTextResponseMock = vi.hoisted(() => vi.fn());

            vi.mock("../../_core/ai/providerResolver", () => ({
              getAiProviderById: () => ({
                createTextResponse: (request: unknown, options?: unknown) => createTextResponseMock(request, options),
              }),
            }));

            import { resolveCapabilityConfig } from "../../_core/ai/configResolver";
            import { interpretWhatsappMessageWithDiagnostics } from "./intentInterpreter";

            const context: WhatsappIntentContext = {
              version: "whatsapp-intent-context/v1",
              nowIso: "2026-07-28T12:00:00.000Z",
              timezone: "America/Sao_Paulo",
              mealAliases: {},
              latestMeal: null,
              mealsToday: [],
              recentFoodNames: [],
              contextualMemories: [],
              pendingClarification: null,
            };

            const originalEnv = { ...process.env };

            describe("canonical WHATSAPP_INTENT policy", () => {
              beforeEach(() => {
                createTextResponseMock.mockReset();
                process.env.OPENAI_API_KEY = "test-openai-key";
                process.env.OPENAI_WHATSAPP_INTENT_MODEL = "gpt-whatsapp-specific";
                process.env.OPENAI_TEXT_MODEL = "gpt-text-legacy";
                process.env.OPENAI_WHATSAPP_INTENT_RETRIES = "0";
                delete process.env.AI_WHATSAPP_INTENT_MODEL;
                delete process.env.AI_WHATSAPP_INTENT_MAX_ATTEMPTS;
                delete process.env.AI_WHATSAPP_INTENT_TIMEOUT_MS;
                delete process.env.AI_VISION_PROVIDER;
              });

              afterEach(() => {
                process.env = { ...originalEnv };
              });

              it("passes the canonical resolved model directly to the provider adapter", async () => {
                const resolved = resolveCapabilityConfig("WHATSAPP_INTENT");
                createTextResponseMock.mockResolvedValueOnce({
                  id: "intent",
                  outputText: JSON.stringify({
                    intent: "list_meal_records",
                    confidence: 0.91,
                    date: null,
                    meal: null,
                    items: [],
                    sourceFood: null,
                    targetFood: null,
                    quantity: null,
                    requiresConfirmation: false,
                    clarificationQuestion: null,
                    possibleIntents: [],
                    reason: "Consulta de registros.",
                  }),
                  raw: {},
                });

                const result = await interpretWhatsappMessageWithDiagnostics("registro", context);

                expect(resolved.primary).toEqual({ provider: "openai", model: "gpt-whatsapp-specific" });
                expect(createTextResponseMock).toHaveBeenCalledTimes(1);
                expect(createTextResponseMock.mock.calls[0][0]).toEqual(expect.objectContaining({
                  model: resolved.primary?.model,
                }));
                expect(result.source).toBe("llm");
                expect(result.operationalTrace.modelName).toBe(resolved.primary?.model);
              });
            });
          ''').lstrip())

          doc = Path("docs/design-docs/whatsapp-llm-intents.md")
          text = doc.read_text()
          old = '`intentInterpreter.ts` usa `resolveCapabilityConfig("WHATSAPP_INTENT")` e `executeResolvedCapability`. O adapter recebe o `AbortSignal` da tentativa e a resposta passa por `domainTextResponse.ts`, que remove `raw` do SDK antes da validação Zod. Não existe loop local concorrente de timeout/retry. A compatibilidade do baseline legado é aplicada somente a `WHATSAPP_INTENT` antes da execução comum; outras capacidades mantêm os defaults globais do resolvedor.'
          new = '`intentInterpreter.ts` usa diretamente `resolveCapabilityConfig("WHATSAPP_INTENT")` e `executeResolvedCapability`. Toda a precedência legada de modelo, timeout e tentativas fica centralizada em `server/_core/ai/configResolver.ts`; o consumidor não altera a política resolvida. O adapter recebe o `AbortSignal` da tentativa e a resposta passa por `domainTextResponse.ts`, que remove `raw` do SDK antes da validação Zod. Não existe loop local concorrente de timeout/retry; outras capacidades mantêm os defaults globais do resolvedor.'
          if old not in text:
              raise SystemExit("WhatsApp intent design paragraph not found")
          doc.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/_core/ai/configResolver.ts \
                  server/_core/ai/__tests__/configResolverWhatsappLegacy.test.ts \
                  server/modules/whatsapp/intentInterpreter.ts \
                  server/modules/whatsapp/intentPolicyCanonical.test.ts \
                  docs/design-docs/whatsapp-llm-intents.md
          git commit -m "fix(ai): centralize WhatsApp intent legacy policy"
          git push origin HEAD:feat/922-ai-capabilities-meal-whatsapp
