name: Finalize issue 882 persistence gate remediation

on:
  pull_request:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".audit/issue-882-persistence-gate-remediation-trigger.txt"

permissions:
  contents: write

concurrency:
  group: issue-882-persistence-gate-remediation
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'chore/issue-882-persistence-gate-remediation-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 2

      - name: Verify and apply persistence gate patch
        run: |
          echo "60d40f126f180b366bcace43357bcf712005e9d4aef44ebe791a5074c7c51722  .audit/issue-882-remediation/persistence-gate.patch" | sha256sum -c -
          git apply --check .audit/issue-882-remediation/persistence-gate.patch
          git apply --index .audit/issue-882-remediation/persistence-gate.patch

      - name: Remove temporary applicator and publish corrected candidate
        run: |
          git rm -r .audit/issue-882-remediation
          git rm .github/workflows/issue-882-finalize-persistence-gate-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: make professional access privacy gate structural"
          git push origin HEAD:feat/875-professional-context-routes
