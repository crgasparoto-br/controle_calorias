# Gate refresh for PR 952
name: Apply PR 952 exact remediation

on:
  push:
    branches:
      - fix/whatsapp-ai-question-context-and-exercise-goal-progress

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited patch and verify exact tree
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/<<'B64'/,/^B64$/p" .github/workflows/apply-remediation-952.yml | sed '1d;$d' > /tmp/remediation.patch.gz.b64
          base64 -d /tmp/remediation.patch.gz.b64 | gzip -d > /tmp/remediation.patch
          echo "4b982db20272a57e4bc8853a87caec3b5b8b59931e7255881e772b62cfd5c847  /tmp/remediation.patch" | sha256sum -c -
          git apply --check /tmp/remediation.patch
          git apply /tmp/remediation.patch
          git checkout 523fbee88bc069f7bf1af0c785eadcee99c54ae0 -- .github/workflows/whatsapp-context-tidb.yml
          git rm .github/workflows/apply-remediation-952.yml .github/workflows/run-remediation-952.yml .audit-trigger-952
          git add .github/workflows/whatsapp-context-tidb.yml docs server
          test "$(git write-tree)" = "ab8f76fa057368c18c5fcc1be5a391e8a4c9fdab"
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: isolar contexto por conversa logica"
          git push origin HEAD:fix/whatsapp-ai-question-context-and-exercise-goal-progress
