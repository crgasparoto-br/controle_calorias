name: WhatsApp context TiDB gate

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "server/modules/whatsapp/**"
      - "server/repositories/whatsapp**"
      - "server/whatsapp*Webhook*.ts"
      - ".github/workflows/whatsapp-context-tidb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tidb-context-regression:
    name: TiDB context regression
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias
      WHATSAPP_CONTEXT_READ_MODE: persistent
      WHATSAPP_CONTEXT_ROLLOUT_PERCENT: "100"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start TiDB and wait for SQL readiness
        run: |
          docker run -d --name whatsapp-context-tidb -p 4000:4000 pingcap/tidb:v8.5.1
          for attempt in $(seq 1 90); do
            if node --input-type=module -e 'import mysql from "mysql2/promise"; const connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" }); await connection.query("SELECT 1"); await connection.end();'; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 whatsapp-context-tidb
          exit 1

      - name: Create validation database and wait for DDL readiness
        run: |
          node --input-type=module <<'NODE'
          import mysql from "mysql2/promise";

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let lastError;

          for (let attempt = 1; attempt <= 30; attempt += 1) {
            let connection;
            try {
              connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" });
              await connection.query("CREATE DATABASE IF NOT EXISTS controle_calorias");
              await connection.changeUser({ database: "controle_calorias" });
              await connection.query("CREATE TABLE IF NOT EXISTS __workflow_ddl_readiness (id INT PRIMARY KEY)");
              await connection.query("DROP TABLE __workflow_ddl_readiness");
              await connection.end();
              process.exit(0);
            } catch (error) {
              lastError = error;
              if (connection) await connection.end().catch(() => undefined);
              await sleep(2000);
            }
          }

          throw lastError ?? new Error("TiDB não ficou pronto para DDL no tempo esperado.");
          NODE

      - name: Apply current repository schema
        run: |
          if ! pnpm exec drizzle-kit push --force > /tmp/drizzle-push.log 2>&1; then
            tail -n 200 /tmp/drizzle-push.log
            exit 1
          fi
          tail -n 80 /tmp/drizzle-push.log

      - name: Upload schema diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-context-drizzle-push-log
          path: /tmp/drizzle-push.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Validate referential integrity
        run: pnpm db:check-integrity

      - name: Run pending operation insert id regression
        run: pnpm exec tsx scripts/test-whatsapp-pending-operation-tidb.ts

      - name: Run persistent context regression
        env:
          DATABASE_URL: ""
        run: |
          pnpm exec vitest run \
            server/whatsappPersistentContextWebhook.test.ts \
            server/whatsappImageIdempotencyWebhook.failure.test.ts \
            server/whatsappIntentWebhook.selection.test.ts \
            server/modules/whatsapp/deleteIntent.selection.test.ts \
            server/modules/whatsapp/conversationContextRollout.test.ts \
            server/modules/whatsapp/intentContext.rollout.test.ts \
            server/modules/whatsapp/intentContext.currentMessage.test.ts \
            server/modules/whatsapp/intentContext.shadowComparison.test.ts \
            server/modules/whatsapp/shadowIntentComparison.test.ts \
            server/modules/whatsapp/messageLifecycle.processingClaim.test.ts \
            server/modules/whatsapp/messageDeduplicationCache.test.ts \
            server/modules/whatsapp/webhookMediaPipeline.test.ts \
            server/repositories/whatsappConversationMessageEnrichmentRepository.test.ts

      - name: Show TiDB logs on failure
        if: failure()
        run: docker logs --tail 100 whatsapp-context-tidb
