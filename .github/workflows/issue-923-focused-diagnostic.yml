name: Issue 923 focused diagnostic

on:
  push:
    branches:
      - feat/923-ai-capabilities-question-nutrition-embedding

permissions:
  contents: write

concurrency:
  group: issue-923-focused-diagnostic
  cancel-in-progress: true

jobs:
  focused-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/923-ai-capabilities-question-nutrition-embedding
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run and publish focused diagnostic
        env:
          TARGET_BRANCH: feat/923-ai-capabilities-question-nutrition-embedding
        run: |
          set +e
          pnpm exec vitest run server/issue923.focusedDiagnostic.test.ts --maxWorkers=1 --minWorkers=1 --reporter=verbose > /tmp/issue923-diagnostic.log 2>&1
          status=$?
          set -e
          mkdir -p .automation
          {
            echo "exit_status=${status}"
            cat /tmp/issue923-diagnostic.log
          } > .automation/issue923-focused-diagnostic-result.txt
          git rm .github/workflows/issue-923-focused-diagnostic.yml
          git rm .automation/issue923-focused-diagnostic-trigger
          git rm server/issue923.focusedDiagnostic.test.ts
          git add .automation/issue923-focused-diagnostic-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: publish issue 923 focused diagnostic"
          git push origin "HEAD:${TARGET_BRANCH}"
