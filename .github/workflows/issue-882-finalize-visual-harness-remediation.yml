name: Finalize issue 882 visual harness remediation

on:
  pull_request:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".audit/issue-882-visual-harness-remediation-trigger.txt"

permissions:
  contents: write

concurrency:
  group: issue-882-visual-harness-remediation
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'chore/issue-882-visual-harness-remediation-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 2

      - name: Verify and apply visual harness patch
        run: |
          echo "cd01a221e6f96f6a9505956199c5b5ff73a01ca88744b4de9d9b4b20b6c66a5d  .audit/issue-882-remediation/visual-harness.patch" | sha256sum -c -
          git apply --check .audit/issue-882-remediation/visual-harness.patch
          git apply --index .audit/issue-882-remediation/visual-harness.patch

      - name: Remove temporary applicator and publish corrected candidate
        run: |
          git rm -r .audit/issue-882-remediation
          git rm .github/workflows/issue-882-finalize-visual-harness-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: scope professional messages visual diagnostics"
          git push origin HEAD:feat/875-professional-context-routes
