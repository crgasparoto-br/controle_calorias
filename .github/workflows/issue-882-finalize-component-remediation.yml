name: Finalize issue 882 component remediation

on:
  pull_request:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".audit/issue-882-component-remediation-trigger.txt"

permissions:
  contents: write

concurrency:
  group: issue-882-component-remediation
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'chore/issue-882-component-remediation-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 2

      - name: Verify and apply component patch
        run: |
          echo "1201a53c0bd032d37ff54d4f57034350925e327e8c557e0163d833846acf3c14  .audit/issue-882-remediation/component.patch" | sha256sum -c -
          git apply --check .audit/issue-882-remediation/component.patch
          git apply --index .audit/issue-882-remediation/component.patch

      - name: Remove temporary applicator and publish corrected candidate
        run: |
          git rm -r .audit/issue-882-remediation
          git rm .github/workflows/issue-882-finalize-component-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: restore professional messages component integrity"
          git push origin HEAD:feat/875-professional-context-routes
