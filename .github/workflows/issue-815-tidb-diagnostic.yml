name: Issue 815 TiDB diagnostic capture

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/issue-815-tidb-diagnostic.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/815-retire-professional-legacy
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start TiDB
        run: |
          docker run -d --name issue-815-tidb-diagnostic -p 4000:4000 pingcap/tidb:v8.5.1
          for attempt in $(seq 1 90); do
            if node --input-type=module -e 'import mysql from "mysql2/promise"; const connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" }); await connection.query("CREATE DATABASE IF NOT EXISTS controle_calorias"); await connection.end();'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Capture repository validation
        run: |
          set +e
          {
            pnpm exec drizzle-kit push --force
            pnpm exec drizzle-kit generate || true
            git checkout -- drizzle
            pnpm db:test:professionals
          } > /tmp/issue-815-tidb.log 2>&1
          status=$?
          cat /tmp/issue-815-tidb.log
          rm -f .github/workflows/issue-815-tidb-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            cp /tmp/issue-815-tidb.log scripts/issue-815-final-tidb-diagnostic.txt
          else
            rm -f scripts/issue-815-final-tidb-diagnostic.txt
          fi
          git add -A
          git commit -m "chore: registrar diagnóstico final TiDB #815"
          git push origin HEAD:cleanup/815-retire-professional-legacy
          exit 0
