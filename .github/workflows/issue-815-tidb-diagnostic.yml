name: Issue 815 TiDB correction

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/issue-815-tidb-diagnostic.yml

permissions:
  contents: write

jobs:
  correct-validate-commit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/815-retire-professional-legacy
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add read-only preflight before migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          retirement_path = Path('scripts/retire-professional-legacy-preferences.ts')
          text = retirement_path.read_text()
          start_marker = '  const migration = await migrateAllLegacyProfessionalData();\n'
          end_marker = '  const verification = await verifyCanonicalCoverage(db, rows);\n'
          start = text.find(start_marker)
          end_start = text.find(end_marker, start)
          if start < 0 or end_start < 0:
              raise SystemExit(f'retirement markers not found: start={start}, end={end_start}')
          end = end_start + len(end_marker)
          replacement = textwrap.indent(textwrap.dedent('''
          const rowsBeforeMigration = await db
            .select()
            .from(userPreferences)
            .where(inArray(userPreferences.preferenceKey, [...legacyKeys]));
          const preflight = await verifyCanonicalCoverage(db, rowsBeforeMigration);
          if (preflight.invalidPreferences > 0) {
            throw new Error(
              "Existem preferências profissionais legadas inválidas; nenhuma migração ou exclusão foi executada."
            );
          }

          const migration = await migrateAllLegacyProfessionalData();
          const goalSuggestionMigration =
            await migrateAllLegacyProfessionalGoalSuggestions();
          const rows = await db
            .select()
            .from(userPreferences)
            .where(inArray(userPreferences.preferenceKey, [...legacyKeys]));
          const verification = await verifyCanonicalCoverage(db, rows);
          ''').strip() + '\n', '  ')
          retirement_path.write_text(text[:start] + replacement + text[end:])

          test_path = Path('scripts/test-professional-persistence-tidb.ts')
          test = test_path.read_text()
          message_marker = '"equal-version conflicting legacy copies must block retirement"'
          message_pos = test.find(message_marker)
          start = test.rfind('    assert.throws(', 0, message_pos)
          end = test.find('    const [rowsAfterEqualVersionConflict]', message_pos)
          if message_pos < 0 or start < 0 or end < 0:
              raise SystemExit(f'equal-version markers not found: message={message_pos}, start={start}, end={end}')
          replacement = textwrap.indent(textwrap.dedent('''
          assert.throws(
            () => runLegacyRetirement(true),
            /preferências profissionais legadas inválidas|Command failed/i,
            "equal-version conflicting legacy copies must block retirement"
          );
          const [canonicalAfterEqualVersionConflict] = await connection.query<
            mysql.RowDataPacket[]
          >(
            "SELECT reason FROM professionalPatientAuthorizations WHERE id = ?",
            [untouched.id]
          );
          assert.equal(
            canonicalAfterEqualVersionConflict[0]?.reason,
            untouched.reason,
            "preflight conflict must not mutate the canonical authorization"
          );
          const [goalAfterEqualVersionConflict] = await connection.query<
            mysql.RowDataPacket[]
          >(
            "SELECT rationale FROM professionalGoalSuggestions WHERE id = ?",
            [retirementLegacyGoal.id]
          );
          assert.equal(
            goalAfterEqualVersionConflict[0]?.rationale,
            retirementLegacyGoal.rationale,
            "preflight conflict must not mutate the canonical goal suggestion"
          );
          ''').strip() + '\n', '    ')
          test_path.write_text(test[:start] + replacement + test[end:])
          PY
      - name: Remove temporary diagnostics
        run: |
          rm -f .github/workflows/issue-815-tidb-diagnostic.yml
          rm -f scripts/issue-815-tidb-error.txt
          rm -f scripts/issue-815-preflight-gate-error.txt
      - name: Format and run repository gates
        run: |
          {
            pnpm exec prettier --write scripts/retire-professional-legacy-preferences.ts scripts/test-professional-persistence-tidb.ts
            git diff --check
            pnpm agent:check
            pnpm build
          } > /tmp/issue-815-preflight-gate.log 2>&1 || {
            cat /tmp/issue-815-preflight-gate.log
            exit 1
          }
      - name: Persist repository gate diagnostic
        if: failure()
        run: |
          if [ -f /tmp/issue-815-preflight-gate.log ]; then
            cp /tmp/issue-815-preflight-gate.log scripts/issue-815-preflight-gate-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/issue-815-preflight-gate-error.txt
            git commit -m "chore: registrar falha do preflight #815"
            git push origin HEAD:cleanup/815-retire-professional-legacy
          fi
      - name: Start TiDB
        run: |
          docker run -d --name issue-815-tidb -p 4000:4000 pingcap/tidb:v8.5.1
          for attempt in $(seq 1 90); do
            if node --input-type=module -e 'import mysql from "mysql2/promise"; const connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" }); await connection.query("CREATE DATABASE IF NOT EXISTS controle_calorias"); await connection.end();'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Apply schema and run TiDB gates
        run: |
          pnpm exec drizzle-kit push --force
          pnpm db:test:professionals
          pnpm db:migrate:professionals
          pnpm db:migrate:professionals
          pnpm db:check-integrity
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(professional): validar conflitos antes do backfill (#815)"
          git push origin HEAD:cleanup/815-retire-professional-legacy
