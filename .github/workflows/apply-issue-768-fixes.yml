name: Apply issue 768 fixes

on:
  push:
    branches:
      - feat/768-whatsapp-multichannel-rollout
    paths:
      - scripts/apply_issue_768_idempotency.py
      - scripts/apply_issue_768_rollout.py
      - scripts/apply_issue_768_selection.py
      - .github/workflows/apply-issue-768-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/768-whatsapp-multichannel-rollout
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Apply focused patches
        run: |
          python3 scripts/apply_issue_768_idempotency.py
          python3 scripts/apply_issue_768_rollout.py
          python3 scripts/apply_issue_768_selection.py

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_issue_768_idempotency.py
          rm scripts/apply_issue_768_rollout.py
          rm scripts/apply_issue_768_selection.py
          rm .github/workflows/apply-issue-768-fixes.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate implementation
        run: |
          pnpm check
          pnpm test
          pnpm architecture:check
          pnpm docs:check
          pnpm build
          pnpm agent:check

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(whatsapp): resolve persistent context rollout blockers"
          git push origin HEAD:feat/768-whatsapp-multichannel-rollout
