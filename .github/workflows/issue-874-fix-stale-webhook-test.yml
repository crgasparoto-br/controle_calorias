name: Issue 874 fix stale webhook test

on:
  push:
    branches:
      - fix/874-whatsapp-correction-completion
    paths:
      - ".github/workflows/issue-874-fix-stale-webhook-test.yml"
      - ".github/issue-874-fix-stale-test.trigger"

permissions:
  contents: write

concurrency:
  group: issue-874-fix-stale-webhook-test
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/874-whatsapp-correction-completion
          fetch-depth: 0

      - name: Update obsolete assertion
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const path = "server/whatsappWebhook.test.ts";
          const source = fs.readFileSync(path, "utf8");
          const before = `    expect(lastSentWhatsAppBody).toContain(\n      "Você quer que eu mova apenas os itens marcados como Lanche"\n    );`;
          const after = `    expect(lastSentWhatsAppBody).toContain(\n      "Encontrei 1 registro(s) recente(s) marcados como Lanche"\n    );\n    expect(lastSentWhatsAppBody).toContain(\n      "Responda SIM para confirmar a mudança para Café da manhã"\n    );`;
          if (!source.includes(before)) {
            throw new Error("Obsolete assertion anchor not found");
          }
          fs.writeFileSync(path, source.replace(before, after));
          NODE
          git diff --check

      - name: Commit patch and remove temporary files
        run: |
          rm -f .github/workflows/issue-874-fix-stale-webhook-test.yml
          rm -f .github/issue-874-fix-stale-test.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/whatsappWebhook.test.ts .github/workflows/issue-874-fix-stale-webhook-test.yml .github/issue-874-fix-stale-test.trigger
          git commit -m "test(whatsapp): alinhar confirmação de reclassificação"
          git push origin HEAD:fix/874-whatsapp-correction-completion
