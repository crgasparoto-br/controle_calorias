name: Issue 857 refresh tests

on:
  push:
    branches:
      - fix/857-whatsapp-regression-gate
    paths:
      - .github/workflows/issue-857-refresh-tests.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/857-whatsapp-regression-gate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update legacy assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}")
              file.write_text(text.replace(old, new))

          replace(
              "server/whatsappWebhook.test.ts",
              '''    expect(lastSentWhatsAppBody).toContain("*Almoço Registrado às 08:52hs.*");
              expect(lastSentWhatsAppBody).toContain("• 🍚 arroz — 100g");
              expect(lastSentWhatsAppBody).toContain("Total da refeição:");
              expect(lastSentWhatsAppBody).toContain("*Meta:* 2.200 kcal");
              expect(lastSentWhatsAppBody).toContain("*Exercícios:* 0 kcal");
              expect(lastSentWhatsAppBody).toContain("*Consumo:* 130 kcal");
              expect(lastSentWhatsAppBody).toContain("*Déficit:* 2.070 kcal (-94%)");
              expect(lastSentWhatsAppBody).not.toContain("Meta estimada");
              expect(lastSentWhatsAppBody).not.toContain("Meta ajustada");''',
              '''    const primaryPayload = sentWhatsAppPayloads.find(payload => payload.type === "text");
              const primaryBody = primaryPayload?.text?.body ?? "";
              expect(primaryBody).toContain("*Almoço Registrado às 08:52hs.*");
              expect(primaryBody).toContain("• 🍚 arroz — 100g");
              expect(primaryBody).toContain("Total da refeição:");
              expect(primaryBody).toContain("*Meta:* 2.200 kcal");
              expect(primaryBody).toContain("*Exercícios:* 0 kcal");
              expect(primaryBody).toContain("*Consumo:* 130 kcal");
              expect(primaryBody).toContain("*Déficit:* 2.070 kcal (-94%)");
              expect(primaryBody).not.toContain("Meta estimada");
              expect(primaryBody).not.toContain("Meta ajustada");''',
          )

          replace(
              "server/whatsappWebhook.audioTranscription.test.ts",
              '    expect(outboundTextBodies().at(-1)).toContain("*Almoço Registrado");',
              '    expect(outboundTextBodies().some(body => body.includes("*Almoço Registrado"))).toBe(true);',
          )

          replace(
              "server/whatsappIntentWebhook.test.ts",
              '    expect(sentMessages.at(-1)).toContain("de 150 g para 100 g");',
              '    expect(sentMessages.some(message => message.includes("de 150 g para 100 g"))).toBe(true);',
          )

          replace(
              "server/modules/whatsapp/intentActions.quantityCorrection.test.ts",
              '    expect(result?.reply).toContain("⚠️ Valores nutricionais estimados pela IA.");',
              '    expect(result?.reply).not.toContain("⚠️ Valores nutricionais estimados pela IA.");',
          )

          replace(
              "server/modules/whatsapp/replyTemplates.test.ts",
              '''  it("marca como estimado todo item que não veio integralmente do catálogo", () => {
              expect(buildWhatsAppFoodLines({ ...banana, source: undefined })).toEqual([
                "• 🍌 Banana prata — 1 unidade (aprox. 80g)",
                "72 kcal | P 0,9 g | C 18,6 g | G 0,2 g",
                "⚠️ Valores nutricionais estimados pela IA.",
              ]);
              expect(buildWhatsAppFoodLines({ ...banana, source: "hybrid" })).toHaveLength(3);
              expect(buildWhatsAppFoodLines({ ...banana, source: "heuristic" })).toHaveLength(3);
            });''',
              '''  it("preserva nutrientes estimados sem exibir aviso visual", () => {
              const expected = [
                "• 🍌 Banana prata — 1 unidade (aprox. 80g)",
                "72 kcal | P 0,9 g | C 18,6 g | G 0,2 g",
              ];
              expect(buildWhatsAppFoodLines({ ...banana, source: undefined })).toEqual(expected);
              expect(buildWhatsAppFoodLines({ ...banana, source: "hybrid" })).toEqual(expected);
              expect(buildWhatsAppFoodLines({ ...banana, source: "heuristic" })).toEqual(expected);
            });''',
          )

          replace(
              "server/modules/whatsapp/replyMessages.estimatedNutrition.test.ts",
              '''  it.each([
                ["catalog"],
                ["heuristic"],
                ["hybrid"],
                ["catalog", "hybrid", "heuristic"],
                ["heuristic", "hybrid", "heuristic"],
              ] as Source[][])("não exibe aviso visual para origens %j", sources => {''',
              '''  it.each([
                [["catalog"]],
                [["heuristic"]],
                [["hybrid"]],
                [["catalog", "hybrid", "heuristic"]],
                [["heuristic", "hybrid", "heuristic"]],
              ] as Array<[Source[]]>)("não exibe aviso visual para origens %j", sources => {''',
          )

          Path(".github/workflows/issue-857-refresh-tests.yml").unlink()
          PY
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(whatsapp): alinhar regressões ao contrato da issue 857"
          git push origin HEAD:fix/857-whatsapp-regression-gate
