name: Orchestrator issue 880 correction retry

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize
    paths:
      - .github/workflows/orchestrator-issue-880-retry.yml

permissions:
  contents: write

jobs:
  apply-corrections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply corrections with YAML-preserved script
        shell: bash
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/orchestrator-issue-880.yml")
            step = workflow.fetch("jobs").fetch("apply-corrections").fetch("steps").find { |item| item["name"] == "Apply issue 880 corrections" }
            abort("apply step not found") unless step && step["run"]
            File.write("/tmp/apply-issue-880.sh", step["run"])
          '
          bash /tmp/apply-issue-880.sh
          rm -f \
            .github/workflows/orchestrator-issue-880-pr.yml \
            .github/workflows/orchestrator-issue-880-diagnostic.yml \
            .github/workflows/orchestrator-issue-880-retry.yml

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            client/src/lib/professionalPatientDraftStore.ts \
            client/src/lib/professionalPatientDraftStore.test.ts \
            client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx \
            client/src/components/ProfessionalLayout.tsx \
            client/src/components/ProfessionalLayout.test.tsx \
            docs/design-docs/professional-navigation.md \
            docs/PRIVACY_LGPD.md

      - name: Run focused regression tests
        run: |
          pnpm exec vitest run \
            client/src/lib/professionalPatientDraftStore.test.ts \
            client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx \
            client/src/components/ProfessionalLayout.test.tsx \
            client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx

      - name: Run type and documentation checks
        run: |
          pnpm check
          pnpm docs:check

      - name: Commit and push corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close issue 880 audit findings"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
