name: Issue 815 equal-version conflict correction

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/issue-815-equal-version-conflict-fix.yml

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/815-retire-professional-legacy
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Block equal-version legacy conflicts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def sub_once(text, pattern, replacement, label, flags=0):
              result, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label} structural match count={count}')
              return result

          retirement_path = Path('scripts/retire-professional-legacy-preferences.ts')
          text = retirement_path.read_text()
          helpers = textwrap.dedent('''
          function nullableInstantValue(value: Date | string | number | null) {
            return value === null ? null : new Date(value).getTime();
          }

          function legacyAuthorizationSignature(access: LegacyProfessionalAccess) {
            const value = legacyAccessToCanonical(access);
            return JSON.stringify({
              id: value.id,
              professionalUserId: value.professionalUserId,
              patientUserId: value.patientUserId,
              status: value.status,
              reason: value.reason,
              requestedAt: value.requestedAt.getTime(),
              approvedAt: nullableInstantValue(value.approvedAt),
              rejectedAt: nullableInstantValue(value.rejectedAt),
              revokedAt: nullableInstantValue(value.revokedAt),
              respondedAt: nullableInstantValue(value.respondedAt),
              responseOrigin: value.responseOrigin,
              responseDecision: value.responseDecision,
              authorizationMessageStatus: value.authorizationMessageStatus,
              authorizationMessageSentAt: nullableInstantValue(
                value.authorizationMessageSentAt
              ),
              authorizationMessageError: value.authorizationMessageError,
              sourceUpdatedAt: value.sourceUpdatedAt.getTime(),
            });
          }

          function legacyGoalSuggestionSignature(
            suggestion: NonNullable<ReturnType<typeof normalizeLegacyGoalSuggestion>>
          ) {
            return JSON.stringify({
              id: suggestion.id,
              professionalUserId: suggestion.professionalUserId,
              patientUserId: suggestion.patientUserId,
              rationale: suggestion.rationale,
              status: suggestion.status,
              goal: suggestion.goal,
              createdAt: suggestion.createdAt,
              sentAt: suggestion.sentAt,
              respondedAt: suggestion.respondedAt,
            });
          }
          ''').strip()
          text = sub_once(
              text,
              r'(function sameGoal\(left: unknown, right: unknown\) \{.*?\n\})\n\n(function authorizationStatusCovers)',
              lambda m: f'{m.group(1)}\n\n{helpers}\n\n{m.group(2)}',
              'signature helpers',
              re.S,
          )

          text = sub_once(
              text,
              r'(?P<indent>\s*)if \(!previous \|\| previousVersion < normalizedVersion\) \{\s*expectedGoalSuggestions\.set\(normalized\.id, normalized\);\s*\}',
              lambda m: textwrap.indent(textwrap.dedent('''
              if (!previous || previousVersion < normalizedVersion) {
                expectedGoalSuggestions.set(normalized.id, normalized);
              } else if (
                previousVersion === normalizedVersion &&
                legacyGoalSuggestionSignature(previous) !==
                  legacyGoalSuggestionSignature(normalized)
              ) {
                invalidPreferences += 1;
              }
              ''').strip(), m.group('indent')),
              'goal conflict',
          )

          text = sub_once(
              text,
              r'(?P<indent>\s*)if \(\s*!previous \|\|\s*legacyAccessToCanonical\(previous\)\.sourceUpdatedAt\.getTime\(\) <\s*legacyAccessToCanonical\(access\)\.sourceUpdatedAt\.getTime\(\)\s*\) \{\s*expectedAuthorizations\.set\(access\.id, access\);\s*\}',
              lambda m: textwrap.indent(textwrap.dedent('''
              const previousVersion = previous
                ? legacyAccessToCanonical(previous).sourceUpdatedAt.getTime()
                : -1;
              const accessVersion =
                legacyAccessToCanonical(access).sourceUpdatedAt.getTime();
              if (!previous || previousVersion < accessVersion) {
                expectedAuthorizations.set(access.id, access);
              } else if (
                previousVersion === accessVersion &&
                legacyAuthorizationSignature(previous) !==
                  legacyAuthorizationSignature(access)
              ) {
                invalidPreferences += 1;
              }
              ''').strip(), m.group('indent')),
              'authorization conflict',
              re.S,
          )
          retirement_path.write_text(text)

          test_path = Path('scripts/test-professional-persistence-tidb.ts')
          test = test_path.read_text()
          conflict_test = textwrap.dedent('''
          const sameVersionAccessConflict = {
            ...untouched,
            reason: "Conflito legado com a mesma versão",
          };
          const sameVersionGoalConflict = {
            ...retirementLegacyGoal,
            rationale: "Conflito de sugestão com a mesma versão",
          };
          await connection.query(
            "INSERT INTO userPreferences (userId, preferenceKey, preferenceValue, createdAt, updatedAt) VALUES (?, ?, ?, ?, ?)",
            [
              8066,
              "patient_professional_access_requests_v1",
              JSON.stringify([sameVersionAccessConflict]),
              new Date("2026-07-14T20:00:00.000Z"),
              new Date("2026-07-14T20:03:00.000Z"),
            ]
          );
          await connection.query(
            "UPDATE userPreferences SET preferenceValue = ? WHERE userId = ? AND preferenceKey = ?",
            [
              JSON.stringify([retirementLegacyGoal, sameVersionGoalConflict]),
              8062,
              "patient_professional_goal_suggestions_v1",
            ]
          );
          assert.throws(
            () => runLegacyRetirement(true),
            /preferências profissionais legadas inválidas|Command failed/i,
            "equal-version conflicting legacy copies must block retirement"
          );
          const [rowsAfterEqualVersionConflict] = await connection.query<
            mysql.RowDataPacket[]
          >(
            "SELECT COUNT(*) AS total FROM userPreferences WHERE preferenceKey IN (?, ?, ?, ?)",
            [
              "professional_profile_v1",
              "professional_accesses_v1",
              "patient_professional_access_requests_v1",
              "patient_professional_goal_suggestions_v1",
            ]
          );
          assert.equal(
            Number(rowsAfterEqualVersionConflict[0]?.total) > 0,
            true,
            "equal-version conflicts must preserve every legacy preference"
          );
          await connection.query(
            "DELETE FROM userPreferences WHERE userId = ? AND preferenceKey = ?",
            [8066, "patient_professional_access_requests_v1"]
          );
          await connection.query(
            "UPDATE userPreferences SET preferenceValue = ? WHERE userId = ? AND preferenceKey = ?",
            [
              JSON.stringify([retirementLegacyGoal]),
              8062,
              "patient_professional_goal_suggestions_v1",
            ]
          );
          ''').strip()
          test = sub_once(
              test,
              r'(?P<delete>\s*await connection\.query\(\s*"DELETE FROM userPreferences WHERE userId = \? AND preferenceKey = \?",\s*\[8067, "professional_profile_v1"\]\s*\);)(?P<after>\s*await connection\.query\(\s*"UPDATE professionalPatientAuthorizations SET reason = \?, sourceUpdatedAt = \? WHERE id = \?",)',
              lambda m: f'{m.group("delete")}\n\n{textwrap.indent(conflict_test, "    ")}\n\n{m.group("after").lstrip()}',
              'TiDB conflict test',
              re.S,
          )
          test_path.write_text(test)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/issue-815-equal-version-conflict-fix.yml
      - name: Format and validate
        run: |
          pnpm exec prettier --write scripts/retire-professional-legacy-preferences.ts scripts/test-professional-persistence-tidb.ts
          git diff --check
          pnpm agent:check
          pnpm build
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(professional): bloquear conflitos legados de mesma versão (#815)"
          git push origin HEAD:cleanup/815-retire-professional-legacy
