name: Finalize issue 882 remediation

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".audit/issue-882-remediation/messageService.patch"
      - ".github/workflows/issue-882-finalize-remediation.yml"

permissions:
  contents: write

concurrency:
  group: issue-882-finalize-remediation
  cancel-in-progress: false

jobs:
  finalize:
    if: github.ref_name == 'feat/875-professional-context-routes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 2

      - name: Verify and apply final service patch
        run: |
          echo "9daca20a81b2f94783653dfcc3ebdace149e60a12f13300d36e2b8c8d3bea725  .audit/issue-882-remediation/messageService.patch" | sha256sum -c -
          git apply --check .audit/issue-882-remediation/messageService.patch
          git apply --index .audit/issue-882-remediation/messageService.patch

      - name: Remove temporary applicator and publish final candidate
        run: |
          git rm -r .audit/issue-882-remediation
          git rm .github/workflows/issue-882-finalize-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: remediate professional message audit findings"
          git push origin HEAD:feat/875-professional-context-routes
