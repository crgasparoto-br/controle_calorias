name: Issue 923 apply remediation

on:
  push:
    branches:
      - feat/923-ai-capabilities-question-nutrition-embedding

permissions:
  contents: write

concurrency:
  group: issue-923-apply-remediation
  cancel-in-progress: true

jobs:
  apply-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited remediation and publish
        env:
          BASE_SHA: 673eed668e2d7113cb597152aca32ec60479ab1e
          PATCH_BRANCH: automation/923-remediation-publisher
          PATCH_SHA256: 6b5df5acb86b4c384d2cecd95acf5c5a6e59938bf44fefa2b378dc05c2e9b7f2
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          git fetch --no-tags origin "${PATCH_BRANCH}"
          for part in 00 01 02 03; do
            git show "FETCH_HEAD:.automation/issue923-remediation.patch.part-${part}"
          done > /tmp/issue923-remediation.patch
          echo "${PATCH_SHA256}  /tmp/issue923-remediation.patch" | sha256sum -c -
          git apply --index --whitespace=error-all /tmp/issue923-remediation.patch
          git rm --cached --ignore-unmatch .github/workflows/issue-923-apply-remediation.yml .automation/issue923-remediation-trigger
          rm -f .github/workflows/issue-923-apply-remediation.yml .automation/issue923-remediation-trigger
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ai): remediate issue 923 audit findings"
          git push origin HEAD:feat/923-ai-capabilities-question-nutrition-embedding
