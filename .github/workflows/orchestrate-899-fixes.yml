name: Orchestrate issue 899 fixes

on:
  push:
    branches:
      - fix/899-whatsapp-meal-intent-context
    paths:
      - scripts/apply_issue_899_fixes.py
      - scripts/apply_issue_899_fixes_v2.py
      - .github/workflows/orchestrate-899-fixes.yml
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - scripts/apply_issue_899_fixes.py
      - scripts/apply_issue_899_fixes_v2.py
      - .github/workflows/orchestrate-899-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'fix/899-whatsapp-meal-intent-context' || github.ref_name == 'fix/899-whatsapp-meal-intent-context'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/899-whatsapp-meal-intent-context
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply orchestrated corrections
        run: |
          python scripts/apply_issue_899_fixes.py
          python scripts/apply_issue_899_fixes_v2.py
      - name: Focused regressions
        id: focused
        shell: bash
        run: |
          set +e
          pnpm vitest run server/modules/whatsapp/confirmedMealRegistration.test.ts server/modules/whatsapp/mealIntentDecisionInteraction.test.ts server/modules/whatsapp/foodAssistant.test.ts > issue899-focused.log 2>&1
          status=$?
          cat issue899-focused.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Remaining validation gates
        id: gates
        shell: bash
        run: |
          set +e
          pnpm check > issue899-types.log 2>&1
          types=$?
          pnpm architecture:check > issue899-architecture.log 2>&1
          architecture=$?
          pnpm docs:check > issue899-docs.log 2>&1
          docs=$?
          pnpm build > issue899-build.log 2>&1
          build=$?
          cat issue899-types.log
          cat issue899-architecture.log
          cat issue899-docs.log
          cat issue899-build.log
          echo "types=$types" >> "$GITHUB_OUTPUT"
          echo "architecture=$architecture" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload orchestration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-899-orchestration-diagnostics
          path: |
            issue899-focused.log
            issue899-types.log
            issue899-architecture.log
            issue899-docs.log
            issue899-build.log
      - name: Stop after validation failure
        if: steps.focused.outputs.status != '0' || steps.gates.outputs.types != '0' || steps.gates.outputs.architecture != '0' || steps.gates.outputs.docs != '0' || steps.gates.outputs.build != '0'
        run: exit 1
      - name: Commit corrections
        run: |
          git config user.name "chatgpt-orchestrator"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(whatsapp): concluir pendências da issue 899"
          git push origin HEAD:fix/899-whatsapp-meal-intent-context
