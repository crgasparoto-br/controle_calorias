name: Sync develop for issue 879

on:
  pull_request:
    paths:
      - ".github/workflows/sync-develop-879.yml"
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/sync-develop-879.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Merge current develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-ff --no-commit origin/develop
          git rm .github/workflows/sync-develop-879.yml
          git diff --cached --check
          git commit -m "chore: sync issue 879 branch with develop"
      - name: Push synchronized branch
        if: github.event_name == 'push'
        run: git push origin HEAD:feat/875-professional-context-routes
      - name: Verify merge only on pull request
        if: github.event_name == 'pull_request'
        run: |
          git merge-base --is-ancestor origin/develop HEAD
          git status --short
