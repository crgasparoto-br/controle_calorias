name: Issue 922 finalize remediation

on:
  push:
    branches:
      - feat/922-ai-capabilities-meal-whatsapp-rebased
    paths:
      - .audit/issue-922-docs.patch

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issue-922-finalize-remediation
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish exact candidate with canonical docs
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .audit/issue-922-docs.patch
          git apply .audit/issue-922-docs.patch
          rm .audit/issue-922-docs.patch
          rm .github/workflows/issue-922-finalize-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ai): remediate audit findings for issue 922"
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Focused production fallback controls
        run: pnpm vitest run server/_core/ai/__tests__/configResolver.test.ts server/_core/ai/__tests__/crossProviderFallbackIntegration.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Architecture check
        run: pnpm architecture:check

      - name: Documentation check
        run: pnpm docs:check

      - name: Agent check
        run: pnpm agent:check

      - name: Build
        run: pnpm build

      - name: Verify frozen working tree
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${FINAL_SHA}"

      - name: Record successful exact-head validation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 953 --body "## Issue Loop Engineer — remediação da #922\n\nHead exacto \`${FINAL_SHA}\` validado no workflow \`${GITHUB_RUN_ID}\`.\n\n- cross-provider em produção: bloqueado fail-closed;\n- fallback same-provider: preservado;\n- testes focados: sucesso;\n- \`pnpm check\`: sucesso;\n- \`pnpm test\`: sucesso;\n- \`pnpm architecture:check\`: sucesso;\n- \`pnpm docs:check\`: sucesso;\n- \`pnpm agent:check\`: sucesso;\n- \`pnpm build\`: sucesso.\n\nO smoke real continua condicionado à existência de \`OPENAI_API_KEY\` ou \`GEMINI_API_KEY\` nos Actions secrets."

      - name: Record failed exact-head validation
        if: failure() && env.FINAL_SHA != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 953 --body "## Issue Loop Engineer — falha na validação da #922\n\nO head \`${FINAL_SHA}\` foi publicado, mas o workflow \`${GITHUB_RUN_ID}\` encontrou uma falha executável. Consulte os logs antes de considerar o candidato validado."
