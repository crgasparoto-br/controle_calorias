name: Temporary CI sibling mocks issue 1054
on:
  push:
    branches:
      - tmp/1054-ci-mock-siblings-20260909
permissions:
  contents: write
jobs:
  patch-mocks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/1054-ci-mock-siblings-20260909
          fetch-depth: 0
      - name: Patch all full nutritionEngine mocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def find_calls(text):
              out=[]
              pos=0
              marker='vi.mock('
              while True:
                  s=text.find(marker,pos)
                  if s < 0:
                      break
                  qpos=s+len(marker)
                  if qpos >= len(text) or text[qpos] not in ('\"', "'"):
                      pos=qpos
                      continue
                  quote_target=text[qpos]
                  target_end=text.find(quote_target,qpos+1)
                  if target_end < 0:
                      break
                  target=text[qpos+1:target_end]
                  if 'nutritionEngine' not in target:
                      pos=target_end+1
                      continue
                  i=text.find('(',s)+1
                  depth=1
                  quote=None
                  esc=False
                  while i < len(text) and depth:
                      c=text[i]
                      if quote:
                          if esc:
                              esc=False
                          elif c=='\\':
                              esc=True
                          elif c==quote:
                              quote=None
                      else:
                          if c in "'\"`":
                              quote=c
                          elif c=='(':
                              depth+=1
                          elif c==')':
                              depth-=1
                      i+=1
                  out.append((s,i,text[s:i]))
                  pos=i
              return out

          changed=[]
          for p in Path('server').rglob('*.test.ts'):
              text=p.read_text()
              edits=[]
              for s,e,b in find_calls(text):
                  if 'resolveCommercialFoodIdentity' in b:
                      continue
                  if 'importActual' in b or 'importOriginal' in b or '...actual' in b:
                      continue
                  if '=> ({' in b:
                      local=b.find('=> ({')+len('=> ({')
                      edits.append((s+local, ' resolveCommercialFoodIdentity: vi.fn(),'))
                  else:
                      local=b.rfind('return {')
                      if local < 0:
                          raise SystemExit(f'full nutritionEngine mock without return object: {p}')
                      local += len('return {')
                      edits.append((s+local, ' resolveCommercialFoodIdentity: vi.fn(),'))
              if edits:
                  for idx,ins in sorted(edits, reverse=True):
                      text=text[:idx]+ins+text[idx:]
                  p.write_text(text)
                  changed.append(str(p))

          if len(changed) != 34:
              raise SystemExit(f'expected 34 full mock files, changed {len(changed)}: {changed}')

          remaining=[]
          for p in Path('server').rglob('*.test.ts'):
              for s,e,b in find_calls(p.read_text()):
                  if 'resolveCommercialFoodIdentity' in b:
                      continue
                  if 'importActual' in b or 'importOriginal' in b or '...actual' in b:
                      continue
                  remaining.append(str(p))
          if remaining:
              raise SystemExit(f'full nutritionEngine mocks still missing export: {remaining}')
          PY
          git add server
          git rm .audit/entregar-issue/issue-1054/temporary-ci-sibling-mocks.patch.gz.b64
          git rm .github/workflows/tmp-ci-mock-siblings-1054.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(whatsapp): update full nutrition engine mocks"
          git push origin HEAD:tmp/1054-ci-mock-siblings-20260909
