name: Capture develop conflicts for issue 880

on:
  push:
    branches:
      - feat/875-professional-context-routes

permissions:
  contents: write

jobs:
  capture-conflicts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Capture conflict paths
        shell: bash
        run: |
          git config user.name 'solverit-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin develop
          if git merge --no-commit --no-ff origin/develop; then
            printf '%s\n' 'NO_CONFLICTS' > .orchestrator-conflicts-880.txt
            git merge --abort || true
          else
            git diff --name-only --diff-filter=U | sort > /tmp/conflicts.txt
            git merge --abort
            cp /tmp/conflicts.txt .orchestrator-conflicts-880.txt
          fi
          rm .github/workflows/orchestrator-capture-conflicts-880.yml
          git add -A
          git commit -m 'chore: capture develop conflicts for issue 880'
          git push origin HEAD:feat/875-professional-context-routes
