name: Issue 858 debug

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  typecheck-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture TypeScript check
        shell: bash
        run: |
          set +e
          pnpm check > issue858-check.log 2>&1
          status=$?
          echo "$status" > issue858-check.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: issue858-typecheck
          path: |
            issue858-check.log
            issue858-check.status
          retention-days: 1
