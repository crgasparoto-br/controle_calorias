name: Apply issue 880 audit corrections

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/apply-issue-880-audit-corrections.yml"

permissions:
  contents: write

concurrency:
  group: apply-issue-880-audit-corrections
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Apply verified correction payload
        run: python3 .tmp/issue-880/apply.py
      - name: Validate patch shape
        run: |
          git diff --check
          test -f client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx
          grep -q 'official_goal_revised' client/src/pages/professional/ProfessionalPatientWorkspace.tsx
          grep -q 'Paginação de' client/src/pages/professional/ProfessionalPatientWorkspace.tsx
      - name: Commit functional correction and remove temporary applicator
        run: |
          rm -rf .tmp/issue-880
          rm -f .github/workflows/apply-issue-880-audit-corrections.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: corrigir pendências da issue 880"
          git push origin HEAD:feat/875-professional-context-routes
