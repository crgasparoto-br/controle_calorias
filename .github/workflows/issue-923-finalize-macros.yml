name: Issue 923 finalize macro evidence

on:
  push:
    branches:
      - feat/923-ai-capabilities-question-nutrition-embedding

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/923-ai-capabilities-question-nutrition-embedding
          fetch-depth: 0
      - name: Apply final evidence rule
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('server/catalogSemanticSearch.ts')
          source = source_path.read_text()
          old = '''  for (const [label, expected] of labelledClaims) {
              if (!isNonNegativeNumber(expected)) continue;
              const values = extractLabelledGramValues(text, label);
              if (values.length && !values.some(value => approximatelyEqual(value, expected as number))) return false;
            }'''
          new = '''  for (const [label, expected] of labelledClaims) {
              if (!isNonNegativeNumber(expected)) return false;
              const values = extractLabelledGramValues(text, label);
              if (!values.some(value => approximatelyEqual(value, expected))) return false;
            }'''
          if source.count(old) != 1:
              raise SystemExit('nutrition concordance block not found exactly once')
          source_path.write_text(source.replace(old, new))

          test_path = Path('server/catalogSemanticSearch.test.ts')
          test = test_path.read_text()
          marker = '''  it("returns null when the semantic compatibility guard rejects an ambiguous flavor/complement match", async () => {'''
          case = '''  it("rejeita fonte que omite qualquer macronutriente estruturado", async () => {
              resolveCapabilityConfigMock.mockReturnValue(READY_POLICY);
              createTextResponseMock.mockResolvedValue({});
              mockExecuteWithOutput(JSON.stringify({
                found: true,
                matchedProductName: "Chocolate KitKat 41,5g",
                brandName: "Nestlé",
                servingLabel: "1 unidade (41,5g)",
                gramsPerServing: 41.5,
                calories: 218,
                protein: 2.7,
                carbs: 26.3,
                fat: 11.2,
                confidence: 0.9,
                sourceUrl: "https://www.nestle.com.br/marcas/kitkat",
                evidence: "Porção de 41,5 g: 218 kcal e proteínas 2,7 g.",
              }), {
                executed: true,
                sources: [{
                  url: "https://www.nestle.com.br/marcas/kitkat",
                  supportingText: ["Porção de 41,5 g: 218 kcal e proteínas 2,7 g."],
                }],
              });

              const result = await findPackagedSnackByWebSearch("kit kat 41,5g", "chocolate");

              expect(result).toBeNull();
              expect(executeResolvedCapabilityMock).toHaveBeenCalledTimes(1);
              expect(createTextResponseMock).toHaveBeenCalledTimes(1);
            });

          '''
          if case not in test:
              if test.count(marker) != 1:
                  raise SystemExit('test marker not found exactly once')
              test = test.replace(marker, case + marker)
              test_path.write_text(test)
          PY
          rm -f server/nutritionEvidenceValidation.ts
          rm -f .audit/remediation/issue-923-complete-macros.patch
          rm -f .github/workflows/issue-923-finalize-macros.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): exigir evidência de todos os macronutrientes"
          git push origin HEAD:feat/923-ai-capabilities-question-nutrition-embedding
