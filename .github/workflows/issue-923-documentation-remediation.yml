name: Issue 923 documentation remediation

on:
  pull_request:
    types:
      - synchronize
    branches:
      - develop
    paths:
      - ".github/workflows/issue-923-documentation-remediation.yml"

permissions:
  contents: write

concurrency:
  group: issue-923-documentation-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.ref == 'feat/923-ai-capabilities-question-nutrition-embedding'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Apply documentation remediation
        shell: bash
        env:
          EXPECTED_PARENT: 87a12c0fee0c0aa90bf36e8d12921b2c06fd2d53
          TARGET_BRANCH: feat/923-ai-capabilities-question-nutrition-embedding
          PATCH_SHA256: efce3c4c2f323c453c86c1f360a79904dcd64019a96de61492cad3bae59fe2af
          WORKFLOW_PATH: .github/workflows/issue-923-documentation-remediation.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          printf '%s' '' > /tmp/issue923-doc-fix.patch.gz.b64
          base64 -d /tmp/issue923-doc-fix.patch.gz.b64 | gzip -d > /tmp/issue923-doc-fix.patch
          test "$(sha256sum /tmp/issue923-doc-fix.patch | awk '{print $1}')" = "${PATCH_SHA256}"
          git apply --index /tmp/issue923-doc-fix.patch
          git rm "${WORKFLOW_PATH}"
          git config user.name "Issue 923 Documentation Remediation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "docs(ai): align embedding migration status"
          git push origin "HEAD:${TARGET_BRANCH}"
