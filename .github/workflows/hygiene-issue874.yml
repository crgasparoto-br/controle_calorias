name: Hygiene issue 874 implementation

on:
  push:
    branches:
      - fix/874-whatsapp-correction-completion
    paths:
      - .github/workflows/hygiene-issue874.yml
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/hygiene-issue874.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hygiene-issue-874-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refactor-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/874-whatsapp-correction-completion
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rename permanent modules by domain responsibility
        shell: bash
        run: |
          mv server/modules/whatsapp/issue874Clarification.ts server/modules/whatsapp/foodQuantityClarification.ts
          mv server/modules/whatsapp/issue874Clarification.test.ts server/modules/whatsapp/foodQuantityClarification.test.ts
          mv server/modules/quickEdit/issue874Service.ts server/modules/quickEdit/mealUpdateConfirmation.ts
          mv server/modules/quickEdit/issue874Service.test.ts server/modules/quickEdit/mealUpdateConfirmation.test.ts
          grep -RIl 'issue874Clarification\|Issue874MealItemCorrectionContext\|Issue874FoodClarificationTarget\|createIssue874ClarificationService\|issue874Service' server | while read -r file; do
            sed -i \
              -e 's/issue874Clarification/foodQuantityClarification/g' \
              -e 's/Issue874MealItemCorrectionContext/MealItemCorrectionContext/g' \
              -e 's/Issue874FoodClarificationTarget/FoodQuantityClarificationTarget/g' \
              -e 's/createIssue874ClarificationService/createFoodQuantityClarificationService/g' \
              -e 's/issue874Service/mealUpdateConfirmation/g' \
              "$file"
          done
          sed -i \
            -e 's/Clarificação da issue 874/Clarificação de quantidade/g' \
            -e 's/quick edit issue 874 completion/quick edit meal update confirmation/g' \
            server/modules/whatsapp/foodQuantityClarification.ts \
            server/modules/quickEdit/mealUpdateConfirmation.test.ts

      - name: Recalculate heuristic quantity changes in backend
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'server/modules/quickEdit/mealUpdateConfirmation.ts';
          let source = fs.readFileSync(path, 'utf8');
          const explicitPattern = /function explicitFoodText\(item: MealItemInput\) \{\s*return `\$\{item\.quantity\} \$\{item\.unit\} de \$\{item\.foodName\}`;\s*\}/m;
          if (!explicitPattern.test(source)) throw new Error('nutrition anchor not found');
          source = source.replace(
            explicitPattern,
            `function nutritionInputChanged(
              current: MealItemInput | undefined,
              next: MealItemInput
            ) {
              if (!current) return true;
              return (
                foodIdentityChanged(current, next) ||
                Number(current.quantity) !== Number(next.quantity) ||
                normalizeText(current.unit ?? "") !== normalizeText(next.unit ?? "") ||
                normalizeText(current.portionText ?? "") !==
                  normalizeText(next.portionText ?? "") ||
                Number(current.estimatedGrams) !== Number(next.estimatedGrams)
              );
            }

            function explicitFoodText(item: MealItemInput) {
              return \`${'${item.quantity} ${item.unit} de ${item.foodName}'}\`;
            }`
          );
          const conditionPattern = /if \(next\.foodId \|\| !foodIdentityChanged\(current, next\)\) \{/;
          if (!conditionPattern.test(source)) throw new Error('recalculation condition not found');
          source = source.replace(
            conditionPattern,
            'if (next.foodId || !nutritionInputChanged(current, next)) {'
          );
          fs.writeFileSync(path, source);
          NODE

      - name: Add quantity-only backend regression
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'server/modules/quickEdit/mealUpdateConfirmation.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const anchor = '  it("preserva a edição quando a entrega da confirmação falha", async () => {';
          const test = `  it("recalcula no backend quando apenas a quantidade heurística muda", async () => {
            processMealInputMock.mockResolvedValueOnce({
              items: [
                {
                  ...currentMeal.items[0],
                  quantity: 60,
                  estimatedGrams: 60,
                  portionText: "60 g",
                  calories: 252,
                  protein: 20,
                  carbs: 2,
                  fat: 18,
                },
              ],
            });

            const result = await updateQuickEditMealWithWhatsappConfirmation(
              "x".repeat(32),
              {
                mealLabel: "Lanche",
                dateTimeLocal: "2026-07-22T12:00",
                items: [
                  {
                    ...currentMeal.items[0],
                    quantity: 60,
                    estimatedGrams: 60,
                    portionText: "60 g",
                    calories: 999,
                  },
                ],
              }
            );

            expect(processMealInputMock).toHaveBeenCalledWith(
              expect.objectContaining({ text: "60 g de 30G" })
            );
            expect(result.items[0]).toEqual(
              expect.objectContaining({ calories: 252, estimatedGrams: 60 })
            );
          });

          `;
          if (!source.includes(anchor)) throw new Error('test insertion anchor not found');
          source = source.replace(anchor, test + anchor);
          fs.writeFileSync(path, source);
          NODE

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            server/modules/whatsapp/foodQuantityClarification.ts \
            server/modules/whatsapp/foodQuantityClarification.test.ts \
            server/modules/whatsapp/contextualFoodReplacementIntent.ts \
            server/modules/whatsapp/foodClarificationPersistence.ts \
            server/whatsappWebhook.ts \
            server/modules/quickEdit/mealUpdateConfirmation.ts \
            server/modules/quickEdit/mealUpdateConfirmation.test.ts \
            server/modules/quickEdit/router.ts

      - name: Focused regression tests
        run: |
          pnpm exec vitest run \
            server/modules/whatsapp/foodQuantityClarification.test.ts \
            server/modules/whatsapp/contextualFoodReplacementIntent.test.ts \
            server/modules/quickEdit/mealUpdateConfirmation.test.ts \
            server/modules/quickEdit/router.test.ts \
            server/whatsappWebhook.test.ts

      - name: TypeScript check
        run: pnpm check

      - name: Full agent gate
        run: pnpm agent:check

      - name: Production build
        run: pnpm build

      - name: Hygiene checks
        shell: bash
        run: |
          ! grep -R "issue874" server/modules/whatsapp server/modules/quickEdit
          git diff --check

      - name: Commit validated hygiene
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "refactor: harden and name issue 874 flows by domain"
          git push origin HEAD:fix/874-whatsapp-correction-completion
