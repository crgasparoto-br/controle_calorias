name: Apply issue 882 visual remediation

on:
  pull_request:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".audit/issue-882-visual-remediation-trigger.txt"

permissions:
  contents: write

concurrency:
  group: issue-882-visual-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'chore/issue-882-visual-remediation-trigger'
    runs-on: ubuntu-latest
    env:
      PATCH_SHA256: dd51711a2983614f1ee31387e0032666586ea3f421e736d25920c83d9a8ca891
      PATCH_BLOB: 39d7ce66b055cc4a9fa54e38f36c9610508eed90
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 2

      - name: Fetch and verify visual remediation patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB}" \
            | jq -r '.content' \
            | tr -d '\n' \
            | base64 -d \
            > /tmp/issue-882-visual.patch
          echo "${PATCH_SHA256}  /tmp/issue-882-visual.patch" | sha256sum -c -
          git apply --check /tmp/issue-882-visual.patch

      - name: Apply visual remediation and remove applicator
        run: |
          git apply --index /tmp/issue-882-visual.patch
          git rm .github/workflows/issue-882-visual-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: stabilize issue 882 visual evidence"
          git push origin HEAD:feat/875-professional-context-routes
