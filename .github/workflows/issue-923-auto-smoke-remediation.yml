name: Issue 923 automatic smoke remediation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - develop
    paths:
      - .github/workflows/issue-923-auto-smoke-remediation.yml

permissions:
  contents: write

concurrency:
  group: issue-923-auto-smoke-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.ref == 'feat/923-ai-capabilities-question-nutrition-embedding'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Apply automatic smoke remediation
        shell: bash
        env:
          EXPECTED_PARENT: 7a8af8eb019068f0064d09fb093d6fcec101a62f
          TARGET_BRANCH: feat/923-ai-capabilities-question-nutrition-embedding
          PATCH_SHA256: e15bbad5dbec38b96636d8d459e31449245c245bd339d353a201f7bfd3cb38f8
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          printf '%s' '' > /tmp/issue923-auto-smoke.patch.gz.b64
          base64 -d /tmp/issue923-auto-smoke.patch.gz.b64 | gzip -d > /tmp/issue923-auto-smoke.patch
          test "$(sha256sum /tmp/issue923-auto-smoke.patch | awk '{print $1}')" = "${PATCH_SHA256}"
          git apply --index /tmp/issue923-auto-smoke.patch
          git rm .github/workflows/issue-923-auto-smoke-remediation.yml
          git config user.name "Issue 923 Auto Smoke Remediation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "ci(ai): run issue 923 provider smoke without manual head approval"
          git push origin "HEAD:${TARGET_BRANCH}"
