name: Apply issue 881 clock fix

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".issue881-clock/ready"

permissions:
  contents: write

jobs:
  apply-clock-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply deterministic fixture patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .issue881-clock/change.patch
          git apply .issue881-clock/change.patch
          git rm -r .issue881-clock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-professional-operational-alerts-tidb.ts
          git commit -m 'test: make operational alert fixtures time independent'
          git push origin HEAD:${GITHUB_REF_NAME}
