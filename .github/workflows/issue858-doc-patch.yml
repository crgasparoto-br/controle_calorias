name: Issue 858 documentation patch

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/858-interactive-coverage
          fetch-depth: 0
      - name: Append issue 858 documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          design = Path("docs/design-docs/whatsapp-ingestion.md")
          marker = "## Registro executável de interações fechadas (issue #858)"
          text = design.read_text()
          if marker not in text:
              text += '''

## Registro executável de interações fechadas (issue #858)

O WhatsApp usa `server/modules/whatsapp/interactionRegistry.ts` como registro executável, transversal e versionado das interações vinculadas a `whatsappPendingOperations`. O registro não é uma segunda persistência: ele associa o tipo e o `target` canônico já produzido pelo domínio a um identificador estável, classificação, ações, componente, estratégia de reconstrução e efeitos permitidos/proibidos.

- Pergunta aberta (`quantity`, marca, tamanho ou outro valor não enumerável) permanece textual.
- Decisão fechada com até três ações no total, contando **Cancelar**, usa botões.
- Decisão fechada com quatro ou mais ações usa lista.
- Produtores fornecem ações estruturadas e reutilizam `buildWhatsappClosedDecisionReply`.
- Callbacks usam IDs opacos e são validados por usuário, canal, tipo, ação, versão, expiração e estado.

O registro cobre exclusão, seleção de item para ajuste/substituição, confirmação genérica, reclassificação de escopo, período de resumo, autorização profissional, clarificação genérica de intenção e os contratos alimentares `quantity`, `confirmation` e `selection` da issue #855.

### Resolução e reapresentação

`messageRouter.ts` resolve callbacks antes de qualquer classificador ou fallback. Resposta compatível reivindica atomicamente a mesma operação; resposta incompatível mantém a operação ativa e reconstrói as mesmas ações, ordem e rótulos sem criar pendência equivalente; novo comando completo substitui a pendência incompatível e segue o fluxo normal. Pendência expirada, consumida, cancelada, adulterada, de outro usuário ou obsoleta responde indisponibilidade sem recriação silenciosa.

A reapresentação registra `interactionId`, origem, classificação, componente, quantidade de ações, ciclo de vida e motivo da resposta inválida, sem conteúdo sensível. Webhook, áudio transcrito e simulador usam o mesmo gate persistente antes do pipeline nutricional.
'''
              design.write_text(text)

          regression = Path("docs/testing/whatsapp-response-contract-regression.md")
          marker = "## Matriz interativa transversal da issue #858"
          text = regression.read_text()
          if marker not in text:
              text += '''

## Matriz interativa transversal da issue #858

| Cenário | Componente esperado | Resolução textual | Resposta inválida | Proteção obrigatória |
|---|---|---|---|---|
| Confirmar/Cancelar | 2 botões | SIM/CANCELAR | reapresentar os 2 botões | nenhuma mutação antes da confirmação |
| 2 candidatos + Cancelar | 3 botões | índice/ordinal/CANCELAR | mesma ordem | sem efeito prematuro |
| 3+ candidatos + Cancelar | lista | índice/ordinal/CANCELAR | mesmas linhas | callback opaco e isolado |
| Período | lista com 4 períodos e Cancelar | período/CANCELAR | manter pendência | cancelamento sem resumo |
| Reclassificação | 3 botões | APENAS/TODOS/CANCELAR | `sim` não escolhe escopo | revalidar registros atuais |
| Clarificação genérica | lista com 4 ações | número/rótulo/CANCELAR | preservar texto original | nunca persistir comando como alimento |
| Alimento `quantity` | texto | quantidade/unidade | instrução específica | preservar contrato #855 |
| Alimento `confirmation`/`selection` | botão/lista | ação equivalente | manter pendência | sem fallback implícito de 100 g |
| Autorização profissional | 2 botões | AUTORIZAR/NEGAR | recarregar domínio | reentrega idempotente |

A suíte valida descoberta de tipos `PENDING_*_TYPE`, ausência de registros paralelos, limites de cardinalidade, reentrega, expiração, adulteração, isolamento, resposta inválida sem mutação, comando completo incompatível, preservação no webhook, paridade dos entrypoints e clarificação genérica interativa do LLM.
'''
              regression.write_text(text)

          Path(".github/issue858-doc-trigger").unlink(missing_ok=True)
          Path(".github/workflows/issue858-doc-patch.yml").unlink()
          PY
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(whatsapp): documentar registro interativo da issue 858"
          git push origin HEAD:feat/858-interactive-coverage
