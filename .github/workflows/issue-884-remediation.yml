name: Issue 884 remediation

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - .github/workflows/issue-884-remediation.yml

permissions:
  contents: write

jobs:
  remediate-and-validate:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply audited remediation
        shell: bash
        run: |
          printf '%s' ' >...' | base64 -d > /tmp/issue-884.patch
          git apply --index /tmp/issue-884.patch
          git rm .github/workflows/issue-884-remediation.yml
          git diff --cached --check

      - name: Commit exact candidate
        id: candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: corrigir ativação e deep link profissional"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Focused regression
        run: pnpm exec vitest run client/src/pages/SettingsPageRouter.test.tsx client/src/components/PatientAccessRequestsCard.test.tsx --maxWorkers=1 --minWorkers=1

      - name: TypeScript check
        run: pnpm check

      - name: Architecture check
        run: pnpm architecture:check

      - name: Documentation check
        run: pnpm docs:check

      - name: Build
        run: pnpm build

      - name: Publish validated candidate
        run: git push origin HEAD:feat/875-professional-context-routes