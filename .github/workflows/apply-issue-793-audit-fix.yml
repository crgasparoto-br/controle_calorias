name: Apply issue 793 audit fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-audit-fix:
    if: github.head_ref == 'feat/793-centralizar-timezone' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/793-centralizar-timezone
          fetch-depth: 0

      - name: Verify and decode fix payload
        run: |
          echo "25e5a0b00a1a8e8b46822be1ee95ff05be981092a2e0f4db01fcf7bc58805d70  .github/issue-793-audit-fix-v3.part00" | sha256sum -c -
          echo "58856057ffbe1b963b384f42ccb75c58dc878041d29c413d597e9b717f7bc3a8  .github/issue-793-audit-fix-v3.part01" | sha256sum -c -
          echo "9be97456531eeca4e461c889aeaf902e83319854927449782e5562e34562e305  .github/issue-793-audit-fix-v3.part02a" | sha256sum -c -
          echo "6d03b090dabbd44b7ef72efbd47a17429b708016cdf097f0e881a5c8cd6e7c4d  .github/issue-793-audit-fix-v3.part02b" | sha256sum -c -
          echo "43b20c8c69e48d05e61eee7d35e8dc459a7b160155f44d85ddcde68ff0c05f0a  .github/issue-793-audit-fix-v3.part02c" | sha256sum -c -
          echo "21884fd77cb704ad7e66a9ceafbedda8a7cc96d16f8f8e2420449011c9cf42fe  .github/issue-793-audit-fix-v3.part02d" | sha256sum -c -
          echo "9817d146c8939fb67b6b37d597a1a0fc12df37ae81c419e4ab8cfde22fb502c0  .github/issue-793-audit-fix-v3.part03a" | sha256sum -c -
          echo "c4a1548f0d37fda3052fe2f1ffa1905c0f884cca3800f97c2d0c2510a5cbcaf9  .github/issue-793-audit-fix-v3.part03b" | sha256sum -c -
          echo "c456168eb7a1b728aaac140d0bc2729d907ad2997781add53289b728a78d6d4a  .github/issue-793-audit-fix-v3.part03c" | sha256sum -c -
          echo "a0ff1eb19acca93b4395d4478ca406ddaff67930a6e1c935991d43852f61103e  .github/issue-793-audit-fix-v3.part03d" | sha256sum -c -
          echo "0efaa72c3b6ecafaf2968541891e3c6e067dfdd098498c1a686be30afcaa0e7a  .github/issue-793-audit-fix-v3.part04" | sha256sum -c -
          cat \
            .github/issue-793-audit-fix-v3.part00 \
            .github/issue-793-audit-fix-v3.part01 \
            .github/issue-793-audit-fix-v3.part02a \
            .github/issue-793-audit-fix-v3.part02b \
            .github/issue-793-audit-fix-v3.part02c \
            .github/issue-793-audit-fix-v3.part02d \
            .github/issue-793-audit-fix-v3.part03a \
            .github/issue-793-audit-fix-v3.part03b \
            .github/issue-793-audit-fix-v3.part03c \
            .github/issue-793-audit-fix-v3.part03d \
            .github/issue-793-audit-fix-v3.part04 > /tmp/issue793-audit-fix.b64
          echo "d1037411a025773ec22c3761cf0d1d0ba581a14eb97f404a1b2f4a64974fb8ca  /tmp/issue793-audit-fix.b64" | sha256sum -c -
          base64 -d /tmp/issue793-audit-fix.b64 | gzip -dc > /tmp/apply_issue793_audit_fix.py
          echo "e60fccc93eef975866d9aec2d6b0e872dc6a430d283ea12765c98efd3de412d7  /tmp/apply_issue793_audit_fix.py" | sha256sum -c -

      - name: Apply audited corrections
        run: python /tmp/apply_issue793_audit_fix.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        id: check
        continue-on-error: true
        run: pnpm check > /tmp/check.log 2>&1

      - name: Tests
        id: test
        continue-on-error: true
        run: pnpm test > /tmp/test.log 2>&1

      - name: Architecture check
        id: architecture
        continue-on-error: true
        run: pnpm architecture:check > /tmp/architecture.log 2>&1

      - name: Documentation check
        id: docs
        continue-on-error: true
        run: pnpm docs:check > /tmp/docs.log 2>&1

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build > /tmp/build.log 2>&1

      - name: Agent check
        id: agent
        continue-on-error: true
        run: pnpm agent:check > /tmp/agent.log 2>&1

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-793-audit-fix-diagnostics
          path: |
            /tmp/check.log
            /tmp/test.log
            /tmp/architecture.log
            /tmp/docs.log
            /tmp/build.log
            /tmp/agent.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Enforce validation result
        run: |
          failed=0
          for result in \
            "${{ steps.check.outcome }}" \
            "${{ steps.test.outcome }}" \
            "${{ steps.architecture.outcome }}" \
            "${{ steps.docs.outcome }}" \
            "${{ steps.build.outcome }}" \
            "${{ steps.agent.outcome }}"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more validation gates failed. Inspect the diagnostics artifact."
            exit 1
          fi

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(timezone): validate owner civil time on server (#793)"
          git push origin HEAD:feat/793-centralizar-timezone
