name: Apply issue 793 audit fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-audit-fix:
    if: github.head_ref == 'feat/793-centralizar-timezone' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/793-centralizar-timezone
          fetch-depth: 0

      - name: Verify and decode fix payload
        run: |
          echo "ee4d0fd3bf61be9eb326337cae23ac0dcc5736a38b86d0d64d57cf2235b330c7  .github/issue-793-audit-fix.py.gz.b64" | sha256sum -c -
          base64 -d .github/issue-793-audit-fix.py.gz.b64 | gzip -dc > /tmp/apply_issue793_audit_fix.py
          echo "cabea571183178550146dc61b647ae1f2a5a6c54ae9b720e92ccbfef9a2ce3cb  /tmp/apply_issue793_audit_fix.py" | sha256sum -c -

      - name: Apply audited corrections
        run: python /tmp/apply_issue793_audit_fix.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        id: check
        continue-on-error: true
        run: pnpm check > /tmp/check.log 2>&1

      - name: Tests
        id: test
        continue-on-error: true
        run: pnpm test > /tmp/test.log 2>&1

      - name: Architecture check
        id: architecture
        continue-on-error: true
        run: pnpm architecture:check > /tmp/architecture.log 2>&1

      - name: Documentation check
        id: docs
        continue-on-error: true
        run: pnpm docs:check > /tmp/docs.log 2>&1

      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build > /tmp/build.log 2>&1

      - name: Agent check
        id: agent
        continue-on-error: true
        run: pnpm agent:check > /tmp/agent.log 2>&1

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-793-audit-fix-diagnostics
          path: |
            /tmp/check.log
            /tmp/test.log
            /tmp/architecture.log
            /tmp/docs.log
            /tmp/build.log
            /tmp/agent.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Enforce validation result
        run: |
          failed=0
          for result in \
            "${{ steps.check.outcome }}" \
            "${{ steps.test.outcome }}" \
            "${{ steps.architecture.outcome }}" \
            "${{ steps.docs.outcome }}" \
            "${{ steps.build.outcome }}" \
            "${{ steps.agent.outcome }}"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more validation gates failed. Inspect the diagnostics artifact."
            exit 1
          fi

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(timezone): validate owner civil time on server (#793)"
          git push origin HEAD:feat/793-centralizar-timezone
