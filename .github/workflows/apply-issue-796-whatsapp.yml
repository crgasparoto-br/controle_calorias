name: Apply issue 796 WhatsApp

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/795-timezone-backend-reports

permissions:
  contents: write

jobs:
  apply-whatsapp:
    if: github.head_ref == 'feat/796-timezone-whatsapp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/796-timezone-whatsapp
          fetch-depth: 0

      - name: Apply reviewed WhatsApp change
        shell: bash
        run: |
          set -u
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat .github/issue-796-patch.part* | base64 -d | gzip -dc > /tmp/issue796.patch
          set +e
          git am /tmp/issue796.patch > /tmp/issue796-am.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git am --abort || true
            cp /tmp/issue796-am.log .github/issue-796-debug.txt
            git add .github/issue-796-debug.txt
            git commit -m 'chore(ci): record issue 796 patch failure'
            git push origin HEAD:feat/796-timezone-whatsapp
            exit "$status"
          fi
          rm -f .github/issue-796-patch.part*
          rm -f .github/trigger-796-2.txt
          rm -f .github/issue-796-debug.txt
          rm -f .github/workflows/apply-issue-796-whatsapp.yml
          git add -A
          git diff --cached --check
          git commit -m 'chore: remove issue 796 transfer artifacts'
          git push origin HEAD:feat/796-timezone-whatsapp
