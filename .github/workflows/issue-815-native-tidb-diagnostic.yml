name: Issue 815 goal suggestion version correction

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/issue-815-native-tidb-diagnostic.yml

permissions:
  contents: write

jobs:
  correct-validate-commit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/815-retire-professional-legacy
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve legacy goal suggestion version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          repository_path = Path('server/repositories/professionalContentRepository.ts')
          text = repository_path.read_text()
          start = text.find('  async function createGoalSuggestion(')
          end = text.find('  async function readGoalSuggestionsByPatient(', start)
          if start < 0 or end < 0:
              raise SystemExit(f'createGoalSuggestion boundaries not found: start={start}, end={end}')
          segment = text[start:end]
          marker = '    const suggestion: ProfessionalGoalSuggestion = {'
          if marker not in segment:
              raise SystemExit('suggestion marker not found')
          updated_at_block = textwrap.dedent('''
          const updatedAt = Math.max(
            createdAt,
            sentAt ?? 0,
            respondedAt ?? 0
          );
          ''').strip()
          segment = segment.replace(
              marker,
              textwrap.indent(updated_at_block, '    ') + '\n    const suggestion: ProfessionalGoalSuggestion = {',
              1,
          )
          if '      updatedAt: createdAt,' not in segment:
              raise SystemExit('in-memory updatedAt marker not found')
          segment = segment.replace('      updatedAt: createdAt,', '      updatedAt,', 1)
          if '          updatedAt: new Date(createdAt),' not in segment:
              raise SystemExit('database updatedAt marker not found')
          segment = segment.replace(
              '          updatedAt: new Date(createdAt),',
              '          updatedAt: new Date(updatedAt),',
              1,
          )
          repository_path.write_text(text[:start] + segment + text[end:])

          test_path = Path('scripts/test-professional-persistence-tidb.ts')
          test = test_path.read_text()
          start_marker = '    assert.equal(firstGoalSuggestionBackfill.migrated, 1);\n'
          end_marker = '    const secondGoalSuggestionBackfill =\n'
          start = test.find(start_marker)
          end = test.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'goal backfill assertion boundaries not found: start={start}, end={end}')
          replacement = textwrap.indent(textwrap.dedent('''
          assert.equal(firstGoalSuggestionBackfill.migrated, 1);
          const migratedRetirementGoal = (
            await contentRepository.listGoalSuggestionsByPatient(8062)
          ).find(item => item.id === retirementLegacyGoal.id);
          assert.ok(
            migratedRetirementGoal,
            "explicit backfill must migrate legacy goal suggestions"
          );
          assert.equal(
            migratedRetirementGoal.updatedAt,
            retirementLegacyGoal.sentAt,
            "legacy backfill must preserve the latest lifecycle timestamp as its canonical version"
          );
          ''').strip() + '\n', '    ')
          test_path.write_text(test[:start] + replacement + test[end:])
          PY
      - name: Remove temporary diagnostic artifacts
        run: |
          rm -f .github/workflows/issue-815-native-tidb-diagnostic.yml
          rm -f scripts/issue-815-native-tidb-error.txt
          rm -f scripts/issue-815-goal-version-gate-error.txt
      - name: Format and run repository gates
        run: |
          {
            pnpm exec prettier --write server/repositories/professionalContentRepository.ts scripts/test-professional-persistence-tidb.ts
            git diff --check
            pnpm agent:check
            pnpm build
          } > /tmp/issue-815-goal-version-gate.log 2>&1 || {
            cat /tmp/issue-815-goal-version-gate.log
            exit 1
          }
      - name: Persist repository gate diagnostic
        if: failure()
        run: |
          if [ -f /tmp/issue-815-goal-version-gate.log ]; then
            cp /tmp/issue-815-goal-version-gate.log scripts/issue-815-goal-version-gate-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/issue-815-goal-version-gate-error.txt
            git commit -m "chore: registrar falha da versão de sugestão #815"
            git push origin HEAD:cleanup/815-retire-professional-legacy
          fi
      - name: Start TiDB
        run: |
          docker run -d --name issue-815-native-tidb -p 4000:4000 pingcap/tidb:v8.5.1
          for attempt in $(seq 1 90); do
            if node --input-type=module -e 'import mysql from "mysql2/promise"; const connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" }); await connection.query("CREATE DATABASE IF NOT EXISTS controle_calorias"); await connection.end();'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Apply schema and reproduce native TiDB gate
        run: |
          pnpm exec drizzle-kit push --force
          pnpm exec drizzle-kit generate
          git checkout -- drizzle
          pnpm db:test:professionals
          pnpm db:migrate:professionals
          pnpm db:migrate:professionals
          pnpm db:check-integrity
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(professional): preservar versão de sugestão legada (#815)"
          git push origin HEAD:cleanup/815-retire-professional-legacy
