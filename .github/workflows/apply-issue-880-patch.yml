name: Apply issue 880 semantic closure

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - .orchestrator-apply-880.patch.gz

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/875-professional-context-routes

      - name: Apply audited correction
        run: |
          gzip -dc .orchestrator-apply-880.patch.gz > /tmp/issue-880.patch
          echo '102c2b6b25ddd7a994c85c07a343887e0972c9ed6f2645227150b5f548169d7a  /tmp/issue-880.patch' | sha256sum -c -
          git apply --index /tmp/issue-880.patch
          git rm .orchestrator-apply-880.patch.gz
          git rm .github/workflows/apply-issue-880-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close issue 880 semantic audit gaps"
          git push origin HEAD:feat/875-professional-context-routes
