name: Temporary audited patch apply

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/temporary-source-export.yml"

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Verify exact input head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Apply audited issue 880 patch
        run: |
          cat .orchestrator/issue-880.patch.part.* | base64 -d | gzip -d > /tmp/issue-880.patch
          git apply --check /tmp/issue-880.patch
          git apply /tmp/issue-880.patch
          rm -rf .orchestrator
          rm -f .github/workflows/temporary-source-export.yml
          git diff --check
      - name: Commit and push functional correction
        run: |
          git config user.name "solverit-orchestrator"
          git config user.email "solverit-orchestrator@users.noreply.github.com"
          git add -A
          git commit -m "fix: concluir pendencias da auditoria da issue 880"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
