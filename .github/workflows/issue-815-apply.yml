name: Apply issue 815 retirement

on:
  push:
    branches:
      - cleanup/815-retire-professional-legacy
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: issue-815-retirement
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/815-retire-professional-legacy
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply and validate retirement
        id: pipeline
        continue-on-error: true
        run: |
          rm -f .github/issue-815-pipeline.log
          set -o pipefail
          (
            set -e
            if [ ! -f .github/issue-815-checkpoint ]; then
              node scripts/issue-815-bootstrap-fix.mjs
              node scripts/issue-815-transform.mjs
              node scripts/issue-815-fixup.mjs
            fi
            node scripts/issue-815-checkpoint-fix.mjs
            pnpm exec prettier --write \
              client/src/App.tsx \
              client/src/App.professionalNavigation.test.tsx \
              client/src/components/ProfessionalLayout.tsx \
              server/repositories/professionalRepository.ts \
              server/modules/professionals/service.ts \
              server/modules/professionals/service.test.ts \
              server/modules/professionals/schemas.ts \
              server/modules/professionals/legacyRetirement.test.ts \
              server/nutritionRouter.ts \
              scripts/retire-professional-legacy-preferences.ts \
              package.json \
              ARCHITECTURE.md \
              docs/README.md \
              docs/product-specs/professionals.md \
              docs/design-docs/database-persistence.md \
              docs/runbooks/professional-legacy-retirement.md
            pnpm docs:generate:trpc
            pnpm check
            pnpm test
            pnpm architecture:check
            pnpm docs:check
            pnpm build
          ) 2>&1 | tee .github/issue-815-pipeline.log

      - name: Publish pipeline diagnostics and checkpoint
        if: steps.pipeline.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Diagnóstico automático do pipeline da issue #815"
            echo
            echo '```text'
            tail -n 240 .github/issue-815-pipeline.log
            echo '```'
          } > /tmp/issue-815-pipeline-comment.md
          rm -f .github/issue-815-pipeline.log
          touch .github/issue-815-checkpoint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: checkpoint issue 815 implementation diagnostics"
            git push origin HEAD:cleanup/815-retire-professional-legacy
          fi
          gh pr comment 864 --body-file /tmp/issue-815-pipeline-comment.md
          exit 1

      - name: Remove one-shot automation
        run: |
          rm -f .github/issue-815-pipeline.log
          rm -f .github/issue-815-checkpoint
          rm scripts/issue-815-bootstrap-fix.mjs
          rm scripts/issue-815-transform.mjs
          rm scripts/issue-815-fixup.mjs
          rm scripts/issue-815-checkpoint-fix.mjs
          rm .github/workflows/issue-815-apply.yml
          rm .github/issue-815-trigger

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(professional): retire legacy compatibility (#815)"
          git push origin HEAD:cleanup/815-retire-professional-legacy
