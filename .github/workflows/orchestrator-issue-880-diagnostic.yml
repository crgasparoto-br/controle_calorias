name: Orchestrator issue 880 diagnostic

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize
    paths:
      - .github/workflows/orchestrator-issue-880-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Extract and run correction script
        id: diagnose
        shell: bash
        run: |
          python <<'PYEXTRACT'
          from pathlib import Path
          source = Path(".github/workflows/orchestrator-issue-880.yml").read_text(encoding="utf-8")
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          Path("/tmp/apply_issue_880.py").write_text(script + "\n", encoding="utf-8")
          PYEXTRACT
          set +e
          python /tmp/apply_issue_880.py > orchestrator-issue-880-diagnostic.txt 2>&1
          status=$?
          cat orchestrator-issue-880-diagnostic.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-issue-880-diagnostic-${{ github.sha }}
          path: orchestrator-issue-880-diagnostic.txt
          if-no-files-found: error
