name: Resolve develop sync for issue 880

on:
  push:
    branches:
      - feat/875-professional-context-routes

permissions:
  contents: write

jobs:
  resolve-develop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Merge develop with reviewed workflow resolution
        shell: bash
        run: |
          git config user.name 'solverit-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin develop
          if git merge --no-commit --no-ff origin/develop; then
            true
          else
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            if [ "${conflicts}" != '.github/workflows/agent-check.yml' ]; then
              echo "Unexpected conflicts:"
              printf '%s\n' "${conflicts}"
              git merge --abort
              exit 1
            fi
            git checkout --ours .github/workflows/agent-check.yml
            git add .github/workflows/agent-check.yml
          fi
          rm -f .orchestrator-conflicts-880.txt
          rm .github/workflows/orchestrator-resolve-develop-880.yml
          git add -A
          git commit -m 'merge: sync develop into professional workspace branch'
          git push origin HEAD:feat/875-professional-context-routes
