name: Orchestrator issue 880 retained validation

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/orchestrator-issue-880-retained-validation.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
    steps:
      - name: Checkout full branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/875-professional-context-routes

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply secure retained-validation correction
        run: python scripts/apply-issue-880-retained-validation-fix.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused continuity and authorization tests
        env:
          NODE_ENV: test
        run: >-
          pnpm exec vitest run
          client/src/components/ProfessionalLayout.test.tsx
          client/src/pages/ProfessionalAreaPage.draftDiscard.test.tsx
          client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx
          client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx
          --maxWorkers=1 --minWorkers=1

      - name: TypeScript check
        run: pnpm check

      - name: Architecture check
        run: pnpm architecture:check

      - name: Documentation check
        run: pnpm docs:check

      - name: Remove temporary orchestrator files
        run: |
          rm scripts/apply-issue-880-retained-validation-fix.py
          rm .github/workflows/orchestrator-issue-880-retained-validation.yml

      - name: Commit secure correction
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: retain only revalidated professional context (#880)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package repository with Git history
        run: |
          mkdir -p /tmp/orchestrator-issue-880
          printf '{"repository":"%s","issue":880,"source_sha":"%s","result_sha":"%s","branch":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "${{ steps.commit.outputs.sha }}" "$GITHUB_REF_NAME" \
            > /tmp/orchestrator-issue-880/manifest.json
          tar \
            --exclude='./node_modules' \
            --exclude='./dist' \
            --exclude='./artifacts' \
            --exclude='./.vite' \
            -czf /tmp/orchestrator-issue-880/repository.tgz .

      - name: Upload repository handoff
        uses: actions/upload-artifact@v4
        with:
          name: orchestrator-issue-880-secure-repository-${{ steps.commit.outputs.sha }}
          path: /tmp/orchestrator-issue-880
          if-no-files-found: error
          retention-days: 7

      - name: Push corrected branch
        run: git push origin HEAD:feat/875-professional-context-routes
