name: Issue 922 live provider smoke

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: issue-922-live-provider-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-provider-smoke:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'crgasparoto-br' &&
      startsWith(github.event.pull_request.head.ref, 'feat/922-ai-capabilities-meal-whatsapp')
    name: live-provider-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: issue-922-live-smoke
    env:
      OPENAI_WHATSAPP_INTENT_ENABLED: "true"
      AI_MEAL_TEXT_MAX_ATTEMPTS: "1"
      AI_MEAL_VISION_MAX_ATTEMPTS: "1"
      AI_WHATSAPP_INTENT_MAX_ATTEMPTS: "1"
      AI_MEAL_TEXT_FALLBACK_ENABLED: "false"
      AI_MEAL_VISION_FALLBACK_ENABLED: "false"
      AI_WHATSAPP_INTENT_FALLBACK_ENABLED: "false"

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify trusted pull request identity and approved SHA
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APPROVED_HEAD_SHA: ${{ vars.ISSUE_922_SMOKE_APPROVED_SHA }}
          EXPECTED_HEAD_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_OWNER: crgasparoto-br
          ACTUAL_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          ACTUAL_HEAD_OWNER: ${{ github.event.pull_request.user.login }}
          ACTUAL_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD_SHA}"
          test "${ACTUAL_HEAD_REPOSITORY}" = "${EXPECTED_HEAD_REPOSITORY}"
          test "${ACTUAL_HEAD_OWNER}" = "${EXPECTED_HEAD_OWNER}"
          case "${ACTUAL_HEAD_BRANCH}" in
            feat/922-ai-capabilities-meal-whatsapp*) ;;
            *) echo "Unexpected pull request head branch." >&2; exit 1 ;;
          esac
          if [ -z "${APPROVED_HEAD_SHA}" ] || [ "${APPROVED_HEAD_SHA}" != "${EXPECTED_HEAD_SHA}" ]; then
            echo "Set repository variable ISSUE_922_SMOKE_APPROVED_SHA to the reviewed PR head before releasing provider credentials." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies without provider credentials
        run: pnpm install --frozen-lockfile

      - name: Run approved live text, photo and intent smoke
        env:
          ISSUE_922_SMOKE_OPENAI_API_KEY: ${{ secrets.ISSUE_922_SMOKE_OPENAI_API_KEY }}
          ISSUE_922_SMOKE_GEMINI_API_KEY: ${{ secrets.ISSUE_922_SMOKE_GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${ISSUE_922_SMOKE_OPENAI_API_KEY}" ]; then
            export OPENAI_API_KEY="${ISSUE_922_SMOKE_OPENAI_API_KEY}"
            export SMOKE_PROVIDER="openai"
            export SMOKE_MODEL="gpt-4.1-mini"
          elif [ -n "${ISSUE_922_SMOKE_GEMINI_API_KEY}" ]; then
            export GEMINI_API_KEY="${ISSUE_922_SMOKE_GEMINI_API_KEY}"
            export SMOKE_PROVIDER="gemini"
            export SMOKE_MODEL="gemini-2.5-flash"
          else
            echo "The protected issue-922-live-smoke environment has no dedicated provider credential." >&2
            exit 1
          fi

          unset ISSUE_922_SMOKE_OPENAI_API_KEY ISSUE_922_SMOKE_GEMINI_API_KEY

          export AI_MEAL_TEXT_PROVIDER="${SMOKE_PROVIDER}"
          export AI_MEAL_TEXT_MODEL="${SMOKE_MODEL}"
          export AI_MEAL_VISION_PROVIDER="${SMOKE_PROVIDER}"
          export AI_MEAL_VISION_MODEL="${SMOKE_MODEL}"
          export AI_WHATSAPP_INTENT_PROVIDER="${SMOKE_PROVIDER}"
          export AI_WHATSAPP_INTENT_MODEL="${SMOKE_MODEL}"
          export OPENAI_WHATSAPP_INTENT_RETRIES="0"

          pnpm exec tsx scripts/issue-922-live-provider-smoke.ts
