name: Restore issue 801 schema documentation

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/801-soft-delete-food-catalog' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Support formatted Drizzle declarations
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/generate-db-schema-doc.ts';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            '/^\\s*(\\w+):\\s*(?:int|double|text|timestamp|varchar|mysqlEnum)\\("([^"]+)"/gm',
            '/^\\s*(\\w+):\\s*(?:int|double|boolean|json|text|timestamp|varchar|mysqlEnum)\\("([^"]+)"/gm'
          );
          source = source.replace(
            '/export const (\\w+) = mysqlTable\\("([^"]+)"/g',
            '/export const (\\w+) = mysqlTable\\(\\s*"([^"]+)"\\s*,/g'
          );
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --write scripts/generate-db-schema-doc.ts
          pnpm docs:generate:db
          grep -Fq '| `users` | `users` |' docs/generated/db-schema.md
          grep -Fq '| `foodCatalog` | `foodCatalog` |' docs/generated/db-schema.md
          pnpm docs:check

      - name: Commit documentation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-db-schema-doc.ts docs/generated/db-schema.md
          git commit -m "fix: preserve generated schema documentation (#801)"
          git push origin HEAD:feat/801-soft-delete-food-catalog
