name: Issue 815 final audit corrections

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/issue-815-merge-ref-tidb-diagnostic.yml

permissions:
  contents: write

jobs:
  correct-validate-commit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/815-retire-professional-legacy
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audit corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          retirement_path = Path('scripts/retire-professional-legacy-preferences.ts')
          retirement = retirement_path.read_text()
          pattern = re.compile(
              r'function sameGoal\(left: unknown, right: unknown\) \{\n'
              r'\s*return JSON\.stringify\(left\) === JSON\.stringify\(right\);\n'
              r'\}'
          )
          replacement = textwrap.dedent('''
          function stableJson(value: unknown): unknown {
            if (Array.isArray(value)) return value.map(stableJson);
            if (value && typeof value === "object") {
              return Object.fromEntries(
                Object.entries(value as Record<string, unknown>)
                  .sort(([left], [right]) => left.localeCompare(right))
                  .map(([key, nested]) => [key, stableJson(nested)])
              );
            }
            return value;
          }

          function sameGoal(left: unknown, right: unknown) {
            return JSON.stringify(stableJson(left)) === JSON.stringify(stableJson(right));
          }
          ''').strip()
          retirement, count = pattern.subn(replacement, retirement, count=1)
          if count != 1:
              raise SystemExit(f'sameGoal structural match count={count}')
          retirement, count = re.subn(
              r'(?m)^(\s*)goal: suggestion\.goal,$',
              r'\1goal: stableJson(suggestion.goal),',
              retirement,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'goal signature structural match count={count}')
          retirement_path.write_text(retirement)

          tidb_test_path = Path('scripts/test-professional-persistence-tidb.ts')
          tidb_test = tidb_test_path.read_text()
          needle = '    await connection.query(\n      "UPDATE professionalPatientAuthorizations SET reason = ?, sourceUpdatedAt = ? WHERE id = ?",'
          insertion_position = tidb_test.find(needle)
          if insertion_position < 0:
              raise SystemExit('semantic order insertion marker not found')
          semantic_block = textwrap.indent(textwrap.dedent('''
          const sameVersionGoalEquivalent = {
            ...retirementLegacyGoal,
            goal: {
              exceptions: [],
              defaultGoal: {
                fatGrams: 58,
                carbsGrams: 195,
                proteinGrams: 125,
                calories: 1850,
              },
            },
          };
          await connection.query(
            "UPDATE userPreferences SET preferenceValue = ? WHERE userId = ? AND preferenceKey = ?",
            [
              JSON.stringify([retirementLegacyGoal, sameVersionGoalEquivalent]),
              8062,
              "patient_professional_goal_suggestions_v1",
            ]
          );
          const semanticOrderDryRun = runLegacyRetirement();
          assert.equal(
            semanticOrderDryRun.apply,
            false,
            "semantically equal goal JSON with different property order must not be treated as a conflict"
          );
          await connection.query(
            "UPDATE userPreferences SET preferenceValue = ? WHERE userId = ? AND preferenceKey = ?",
            [
              JSON.stringify([retirementLegacyGoal]),
              8062,
              "patient_professional_goal_suggestions_v1",
            ]
          );

          ''').strip() + '\n', '    ')
          tidb_test_path.write_text(
              tidb_test[:insertion_position] + semantic_block + tidb_test[insertion_position:]
          )

          architecture_test_path = Path('server/modules/professionals/legacyRetirement.test.ts')
          architecture_test = architecture_test_path.read_text()
          architecture_test = architecture_test.replace(
              '    expect(migration).toContain("patient_professional_goal_suggestions_v1");',
              textwrap.dedent('''
                  expect(migration).toContain("PATIENT_GOAL_SUGGESTIONS_PREFERENCE_KEY");
                  expect(migration).toMatch(
                    /const legacyKeys = \\[[\\s\\S]*PATIENT_GOAL_SUGGESTIONS_PREFERENCE_KEY/
                  );
              ''').rstrip(),
          )
          architecture_test = architecture_test.replace(
              '    expect(inventory).toContain("Área do Paciente");',
              '    expect(inventory).toContain("Paciente — Hoje");',
          )
          architecture_test = architecture_test.replace(
              '    expect(inventory).toContain("Área Profissional");',
              '    expect(inventory).toContain("Profissional — autorização");',
          )
          architecture_test_path.write_text(architecture_test)

          nutrition_test_path = Path('client/src/pages/nutritionPages.test.tsx')
          nutrition_test = nutrition_test_path.read_text()
          nutrition_test = nutrition_test.replace(
              'import React from "react";\nimport { renderToString } from "react-dom/server";',
              'import { PassThrough } from "node:stream";\nimport React from "react";\nimport { renderToPipeableStream, renderToString } from "react-dom/server";',
          )
          helper_anchor = 'const adminWhatsappTokenStatusMock = vi.fn();\n'
          helper = textwrap.dedent('''

          async function renderSuspenseToString(element: React.ReactElement) {
            return new Promise<string>((resolve, reject) => {
              const destination = new PassThrough();
              let html = "";
              destination.setEncoding("utf8");
              destination.on("data", chunk => {
                html += chunk;
              });
              destination.on("end", () => resolve(html));
              destination.on("error", reject);

              const { pipe } = renderToPipeableStream(element, {
                onAllReady() {
                  pipe(destination);
                },
                onShellError(error) {
                  reject(error);
                },
                onError(error) {
                  reject(error);
                },
              });
            });
          }
          ''')
          if helper_anchor not in nutrition_test:
              raise SystemExit('nutrition helper anchor not found')
          nutrition_test = nutrition_test.replace(helper_anchor, helper_anchor + helper, 1)
          target = '    const html = renderToString(React.createElement(RegisteredMealsPage));\n\n    expect(html).toContain("Almoço");'
          replacement_target = '    const html = await renderSuspenseToString(\n      React.createElement(RegisteredMealsPage)\n    );\n\n    expect(html).toContain("Almoço");'
          if target not in nutrition_test:
              raise SystemExit('registered meals render anchor not found')
          nutrition_test = nutrition_test.replace(target, replacement_target, 1)
          nutrition_test_path.write_text(nutrition_test)
          PY
      - name: Remove temporary diagnostics
        run: |
          rm -f .github/workflows/issue-815-merge-ref-tidb-diagnostic.yml
          rm -f scripts/issue-815-merge-ref-tidb-error.txt
          rm -f scripts/issue-815-semantic-goal-gate-error.txt
      - name: Format and run repository gates
        run: |
          pnpm exec prettier --write \
            scripts/retire-professional-legacy-preferences.ts \
            scripts/test-professional-persistence-tidb.ts \
            server/modules/professionals/legacyRetirement.test.ts \
            client/src/pages/nutritionPages.test.tsx
          git diff --check
          pnpm agent:check
          pnpm build
      - name: Start TiDB
        run: |
          docker run -d --name issue-815-final-tidb -p 4000:4000 pingcap/tidb:v8.5.1
          for attempt in $(seq 1 90); do
            if node --input-type=module -e 'import mysql from "mysql2/promise"; const connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" }); await connection.query("CREATE DATABASE IF NOT EXISTS controle_calorias"); await connection.end();'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Apply schema and run complete TiDB gates
        run: |
          pnpm exec drizzle-kit push --force
          pnpm exec drizzle-kit generate || true
          git checkout -- drizzle
          pnpm db:test:professionals
          pnpm db:migrate:professionals
          pnpm db:migrate:professionals
          pnpm db:check-integrity
      - name: Commit validated corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(professional): concluir correções da auditoria #815"
          git push origin HEAD:cleanup/815-retire-professional-legacy
