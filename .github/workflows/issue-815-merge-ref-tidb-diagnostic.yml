name: Issue 815 merge-ref TiDB diagnostic

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/issue-815-merge-ref-tidb-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record checked out commits
        run: |
          git rev-parse HEAD
          git show -s --format='%H %P %s' HEAD
      - name: Start TiDB
        run: |
          docker run -d --name issue-815-merge-ref-tidb -p 4000:4000 pingcap/tidb:v8.5.1
          for attempt in $(seq 1 90); do
            if node --input-type=module -e 'import mysql from "mysql2/promise"; const connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" }); await connection.query("CREATE DATABASE IF NOT EXISTS controle_calorias"); await connection.end();'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Apply schema and reproduce official sequence
        run: |
          {
            pnpm exec drizzle-kit push --force
            pnpm exec drizzle-kit generate
            git checkout -- drizzle
            pnpm db:test:professionals
          } > /tmp/issue-815-merge-ref-tidb.log 2>&1 || {
            cat /tmp/issue-815-merge-ref-tidb.log
            exit 1
          }
      - name: Persist merge-ref diagnostic
        if: failure()
        run: |
          if [ -f /tmp/issue-815-merge-ref-tidb.log ]; then
            cp /tmp/issue-815-merge-ref-tidb.log /tmp/issue-815-merge-ref-tidb-error.txt
            git checkout cleanup/815-retire-professional-legacy
            cp /tmp/issue-815-merge-ref-tidb-error.txt scripts/issue-815-merge-ref-tidb-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/issue-815-merge-ref-tidb-error.txt
            git commit -m "chore: registrar falha TiDB do merge ref #815"
            git push origin HEAD:cleanup/815-retire-professional-legacy
          fi
