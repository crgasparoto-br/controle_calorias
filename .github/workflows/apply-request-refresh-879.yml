name: Apply request refresh resilience for issue 879

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/apply-request-refresh-879.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Patch refresh resilience
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path("client/src/pages/professional/ProfessionalPatients.tsx")
          source = page.read_text(encoding="utf-8")
          if "await Promise.allSettled([" not in source:
              pattern = re.compile(
                  r"(?P<indent>[ \t]*)await Promise\.all\(\[\n"
                  r"[ \t]*utils\.nutrition\.professionals\.myAccesses\.invalidate\(\),\n"
                  r"[ \t]*portfolio\.refetch\(\),\n"
                  r"[ \t]*\]\);\n"
                  r"[ \t]*setLocation\(\n"
                  r"[ \t]*`/professional/patients\?authorization=\$\{success\.authorizationStatus\}`,\n"
                  r"[ \t]*\{ replace: true \}\n"
                  r"[ \t]*\);"
              )
              match = pattern.search(source)
              if not match:
                  raise SystemExit("request refresh block not found")
              indent = match.group("indent")
              dollar = "$"
              replacement = (
                  f"{indent}setLocation(\n"
                  f"{indent}  `/professional/patients?authorization={dollar}{{success.authorizationStatus}}`,\n"
                  f"{indent}  {{ replace: true }}\n"
                  f"{indent});\n"
                  f"{indent}await Promise.allSettled([\n"
                  f"{indent}  utils.nutrition.professionals.myAccesses.invalidate(),\n"
                  f"{indent}  portfolio.refetch(),\n"
                  f"{indent}]);"
              )
              page.write_text(
                  source[:match.start()] + replacement + source[match.end():],
                  encoding="utf-8",
              )

          test = Path("client/src/pages/professional/ProfessionalPatients.test.tsx")
          source = test.read_text(encoding="utf-8")
          title = "keeps the persisted success visible when the portfolio refresh fails"
          if title not in source:
              anchor = '  it("keeps an already approved relationship in the approved view", async () => {'
              if source.count(anchor) != 1:
                  raise SystemExit("approved relationship test anchor not found")
              insertion = '''  it("keeps the persisted success visible when the portfolio refresh fails", async () => {
    window.history.replaceState(
      {},
      "",
      "/professional/patients?search=ana&authorization=approved&page=3"
    );
    refetch.mockRejectedValueOnce(new Error("temporary refresh failure"));
    render(<ProfessionalPatients />);

    submitRequest();

    await waitFor(() => {
      expect(window.location.search).toBe("?authorization=pending");
      expect(screen.getByRole("status").textContent).toContain(
        "Solicitação registrada."
      );
    });
    expect(refetch).toHaveBeenCalledTimes(1);
    expect(invalidate).toHaveBeenCalledTimes(1);
  });

'''
              test.write_text(source.replace(anchor, insertion + anchor), encoding="utf-8")
          PY
          git diff --check
          grep -n "Promise.allSettled\|persisted success visible" client/src/pages/professional/ProfessionalPatients.tsx client/src/pages/professional/ProfessionalPatients.test.tsx
      - name: Commit correction and remove transient workflows
        run: |
          rm -f .github/workflows/patch-request-refresh-879.yml
          rm -f .github/workflows/apply-request-refresh-879.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: preservar sucesso quando refresh da carteira falhar (#879)"
          git push origin HEAD:feat/875-professional-context-routes
