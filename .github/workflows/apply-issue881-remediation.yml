name: Apply issue 881 remediation

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".issue881-remediation/ready"

permissions:
  contents: write

jobs:
  apply-remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify and apply remediation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .issue881-remediation/part-* > /tmp/issue881.patch.gz.b64
          printf '%s  %s\n' 'ce06a227130b7306e183eb8b6b6ea4d81947ab0bfa4279605cfff7bf7b20b475' '/tmp/issue881.patch.gz.b64' | sha256sum -c -
          base64 --decode /tmp/issue881.patch.gz.b64 | gzip --decompress > /tmp/issue881.patch
          git apply --binary --index /tmp/issue881.patch
          git rm -r .issue881-remediation .github/workflows/apply-issue881-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: remediate professional report audit findings'
          git push origin HEAD:${{ github.ref_name }}
