name: Orchestrator issue 880 correction retry 3

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize
    paths:
      - .github/workflows/orchestrator-issue-880-retry3.yml

permissions:
  contents: write

jobs:
  apply-corrections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply corrections with paragraph-aware anchors
        shell: bash
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/orchestrator-issue-880.yml")
            step = workflow.fetch("jobs").fetch("apply-corrections").fetch("steps").find { |item| item["name"] == "Apply issue 880 corrections" }
            abort("apply step not found") unless step && step["run"]
            File.write("/tmp/apply-issue-880.sh", step["run"])
          '
          python <<'PY'
          from pathlib import Path

          shell = Path("/tmp/apply-issue-880.sh").read_text(encoding="utf-8")
          start_marker = "python <<'PY'\n"
          end_marker = "\nPY\n"
          start = shell.index(start_marker) + len(start_marker)
          end = shell.index(end_marker, start)
          script = shell[start:end]
          needle = '''    count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")'''
          replacement = '''    count = text.count(old)
              if count == 0 and "\\n" in old:
                  lines = old.splitlines()
                  adjusted_lines = [lines[0]]
                  restore_indent = True
                  for line in lines[1:]:
                      if line == "":
                          restore_indent = False
                          adjusted_lines.append(line)
                      elif restore_indent:
                          adjusted_lines.append(f"  {line}")
                      else:
                          adjusted_lines.append(line)
                  adjusted = "\\n".join(adjusted_lines)
                  adjusted_count = text.count(adjusted)
                  if adjusted_count == 1:
                      old = adjusted
                      count = adjusted_count
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")'''
          if script.count(needle) != 1:
              raise SystemExit("replace_once implementation anchor not found")
          Path("/tmp/apply-issue-880.py").write_text(
              script.replace(needle, replacement, 1) + "\n", encoding="utf-8"
          )
          PY
          python /tmp/apply-issue-880.py
          rm -f .github/workflows/orchestrator-issue-880*.yml

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            client/src/lib/professionalPatientDraftStore.ts \
            client/src/lib/professionalPatientDraftStore.test.ts \
            client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx \
            client/src/components/ProfessionalLayout.tsx \
            client/src/components/ProfessionalLayout.test.tsx \
            docs/design-docs/professional-navigation.md \
            docs/PRIVACY_LGPD.md

      - name: Run focused regression tests
        run: |
          pnpm exec vitest run \
            client/src/lib/professionalPatientDraftStore.test.ts \
            client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx \
            client/src/components/ProfessionalLayout.test.tsx \
            client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx

      - name: Run type and documentation checks
        run: |
          pnpm check
          pnpm docs:check

      - name: Commit and push corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close issue 880 audit findings"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
