name: Apply issue 880 audit corrections

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/patch-issue-880-audit-findings.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audited corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:100]!r}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8")

          # A-001: ended tracking only exposes the audit history surface.
          route_guard = "client/src/pages/professional/ProfessionalPatientRouteGuard.tsx"
          replace_once(
              route_guard,
              'import { parseProfessionalPatientRoute } from "@/lib/professionalRoutes";\nimport React from "react";',
              'import {\n  parseProfessionalPatientRoute,\n  professionalPatientPath,\n} from "@/lib/professionalRoutes";\nimport React, { useEffect } from "react";',
          )
          replace_once(
              route_guard,
              '  const [location] = useLocation();\n  const route = parseProfessionalPatientRoute(location);\n\n  if (!selectedPatient || route.kind !== "patient") {',
              '  const [location, setLocation] = useLocation();\n  const route = parseProfessionalPatientRoute(location);\n  const endedOutsideHistory = Boolean(\n    selectedPatient?.trackingStatus === "ended" &&\n      route.kind === "patient" &&\n      route.section !== "history"\n  );\n\n  useEffect(() => {\n    if (!endedOutsideHistory || !selectedPatient) return;\n    setLocation(professionalPatientPath(selectedPatient.patientId, "history"));\n  }, [endedOutsideHistory, selectedPatient, setLocation]);\n\n  if (!selectedPatient || route.kind !== "patient") {',
          )
          replace_once(
              route_guard,
              '  const pathname = location.split(/[?#]/, 1)[0].replace(/\\/+$/, "") || "/";\n  return <ProfessionalPatientWorkspace key={pathname} />;',
              '  if (endedOutsideHistory) {\n    return (\n      <ProfessionalAsyncState\n        icon="empty"\n        title="Acompanhamento encerrado"\n        description="Somente o histórico profissional necessário para auditoria permanece disponível."\n      />\n    );\n  }\n\n  const pathname = location.split(/[?#]/, 1)[0].replace(/\\/+$/, "") || "/";\n  return <ProfessionalPatientWorkspace key={pathname} />;',
          )

          workspace = "client/src/pages/professional/ProfessionalPatientWorkspace.tsx"
          replace_once(
              workspace,
              '  useEffect(() => {\n    allowNavigationRef.current = false;\n  }, [currentPath]);\n\n  useEffect(() => {\n    const beforeUnload',
              '  useEffect(() => {\n    allowNavigationRef.current = false;\n  }, [currentPath]);\n\n  useEffect(() => {\n    if (dirty) allowNavigationRef.current = false;\n  }, [dirty]);\n\n  useEffect(() => {\n    const beforeUnload',
          )

          record_service = "server/modules/professionals/recordService.ts"
          replace_once(
              record_service,
              '  const scope = await requireProfessionalScope(professionalUserId, input.patientId);\n  const offset = (input.page - 1) * input.pageSize;',
              '  const scope = await requireProfessionalScope(professionalUserId, input.patientId);\n  const historyOnly = scope.trackingStatus === "ended";\n  const offset = (input.page - 1) * input.pageSize;',
          )
          replace_once(
              record_service,
              '      SELECT id, eventType, entityType, entityId, occurredAt\n      FROM professionalHistoryEvents',
              '      SELECT id, eventType, occurredAt\n      FROM professionalHistoryEvents',
          )
          replace_once(record_service, '    latestAssessment: latest\n      ? {', '    latestAssessment: historyOnly\n      ? null\n      : latest\n        ? {')
          replace_once(record_service, '      : null,\n    assessmentHistory: rows(assessmentHistoryResult).map(row => ({', '        : null,\n    assessmentHistory: historyOnly ? [] : rows(assessmentHistoryResult).map(row => ({')
          replace_once(record_service, '    notes: rows(notesResult).map(row => ({', '    notes: historyOnly ? [] : rows(notesResult).map(row => ({')
          replace_once(record_service, '    guidances: rows(guidancesResult).map(row => ({', '    guidances: historyOnly ? [] : rows(guidancesResult).map(row => ({')
          replace_once(
              record_service,
              '    timeline: rows(timelineResult).map(row => ({\n      id: String(row.id), eventType: String(row.eventType), entityType: row.entityType ? String(row.entityType) : null,\n      entityId: row.entityId ? String(row.entityId) : null, occurredAt: timestamp(row.occurredAt),\n    })),',
              '    timeline: rows(timelineResult).map(row => ({\n      id: String(row.id),\n      eventType: String(row.eventType),\n      occurredAt: timestamp(row.occurredAt),\n    })),',
          )
          replace_once(
              record_service,
              '      totals,\n      hasMore: Object.values(totals).some(total => total > input.page * input.pageSize),',
              '      totals: historyOnly\n        ? { assessments: 0, notes: 0, guidances: 0, timeline: totals.timeline }\n        : totals,\n      hasMore: totals.timeline > input.page * input.pageSize,',
          )

          professional_service = "server/modules/professionals/service.ts"
          replace_once(
              professional_service,
              'async function assertApprovedAccess(\n  professionalUserId: number,\n  patientUserId: number\n) {\n  const access = await getApprovedAccess(professionalUserId, patientUserId);\n  if (!access) {\n    throw new Error(\n      "Acesso profissional não autorizado pela pessoa acompanhada."\n    );\n  }\n  await assertActiveProfessionalProfile(professionalUserId);\n  return access;\n}\n',
              'async function assertApprovedAccess(\n  professionalUserId: number,\n  patientUserId: number\n) {\n  const access = await getApprovedAccess(professionalUserId, patientUserId);\n  if (!access) {\n    throw new Error(\n      "Acesso profissional não autorizado pela pessoa acompanhada."\n    );\n  }\n  await assertActiveProfessionalProfile(professionalUserId);\n  return access;\n}\n\nasync function assertOpenProfessionalAccess(\n  professionalUserId: number,\n  patientUserId: number\n) {\n  const access = await assertApprovedAccess(professionalUserId, patientUserId);\n  const tracking = await professionalRepository.getTrackingByAuthorization(\n    access.id\n  );\n  if (tracking?.status === "ended") {\n    throw new Error(\n      "O acompanhamento foi encerrado. Somente o histórico profissional permanece disponível."\n    );\n  }\n  return access;\n}\n',
          )
          for old, new in [
              ('  await assertApprovedAccess(professionalUserId, patientUserId);\n  return resolveEffectiveUserTimeZone(patientUserId);', '  await assertOpenProfessionalAccess(professionalUserId, patientUserId);\n  return resolveEffectiveUserTimeZone(patientUserId);'),
              ('  await assertApprovedAccess(professionalUserId, patientUserId);\n  const timeZone = await getEffectiveUserTimeZone(patientUserId);', '  await assertOpenProfessionalAccess(professionalUserId, patientUserId);\n  const timeZone = await getEffectiveUserTimeZone(patientUserId);'),
              ('  await assertApprovedAccess(professionalUserId, input.patientId);\n  return professionalContentRepository.createComment({', '  await assertOpenProfessionalAccess(professionalUserId, input.patientId);\n  return professionalContentRepository.createComment({'),
              ('  await assertApprovedAccess(professionalUserId, input.patientId);\n  return professionalContentRepository.createGoalSuggestion({', '  await assertOpenProfessionalAccess(professionalUserId, input.patientId);\n  return professionalContentRepository.createGoalSuggestion({'),
              ('  await assertApprovedAccess(professionalUserId, input.patientId);\n  return professionalContentRepository.createMealSuggestion({', '  await assertOpenProfessionalAccess(professionalUserId, input.patientId);\n  return professionalContentRepository.createMealSuggestion({'),
          ]:
              replace_once(professional_service, old, new)

          message_service = "server/modules/professionals/messageService.ts"
          replace_once(
              message_service,
              'export async function listProfessionalMessages(\n  professionalUserId: number,\n  input: ProfessionalMessageListInput\n) {\n  const db = await dbRequired();\n  const patientFilter = input.patientId',
              'export async function listProfessionalMessages(\n  professionalUserId: number,\n  input: ProfessionalMessageListInput\n) {\n  const patientScope = input.patientId\n    ? await professionalScope(professionalUserId, input.patientId)\n    : null;\n  if (patientScope?.trackingStatus === "ended") {\n    throw new Error(\n      "O acompanhamento foi encerrado. Somente o histórico profissional permanece disponível."\n    );\n  }\n  const db = patientScope?.db ?? (await dbRequired());\n  const patientFilter = input.patientId',
          )

          # Discriminating UI tests for ended tracking and repeated edit cycles.
          route_guard_test = "client/src/pages/ProfessionalAreaPage.draftDiscard.test.tsx"
          source = Path(route_guard_test).read_text(encoding="utf-8")
          # This file covers remounts only; the actual guard behavior lives in the unsaved navigation test below.

          unsaved_test = "client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx"
          replace_once(
              unsaved_test,
              'function NavigationHarness({',
              'function SaveThenEditHarness({ onNavigate }: { onNavigate: () => void }) {\n  const [dirty, setDirty] = React.useState(true);\n  const guard = useUnsavedNavigationGuard(\n    dirty,\n    "/professional/patients/41/assessment"\n  );\n  return (\n    <>\n      <button\n        type="button"\n        onClick={() => {\n          guard.markSaved();\n          setDirty(false);\n        }}\n      >\n        Salvar\n      </button>\n      <button type="button" onClick={() => setDirty(true)}>\n        Editar novamente\n      </button>\n      <button\n        type="button"\n        data-professional-navigation\n        onClick={() => {\n          if (guard.canNavigate()) onNavigate();\n        }}\n      >\n        Navegar após nova edição\n      </button>\n    </>\n  );\n}\n\nfunction NavigationHarness({',
          )
          replace_once(
              unsaved_test,
              '  it("does not ask for confirmation after the draft is clean", async () => {',
              '  it("protects a new draft created after a successful save", async () => {\n    const confirm = vi.spyOn(window, "confirm").mockReturnValue(false);\n    const onNavigate = vi.fn();\n    render(<SaveThenEditHarness onNavigate={onNavigate} />);\n\n    await userEvent.click(screen.getByRole("button", { name: "Salvar" }));\n    await userEvent.click(\n      screen.getByRole("button", { name: "Editar novamente" })\n    );\n    await userEvent.click(\n      screen.getByRole("button", { name: "Navegar após nova edição" })\n    );\n\n    expect(confirm).toHaveBeenCalledTimes(1);\n    expect(onNavigate).not.toHaveBeenCalled();\n  });\n\n  it("does not ask for confirmation after the draft is clean", async () => {',
          )

          route_test = "client/src/pages/ProfessionalAreaPage.draftDiscard.test.tsx"
          # Keep the route remount tests unchanged; add ended-route behavior to the dedicated guard test.
          route_guard_test = "client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx"
          replace_once(
              route_guard_test,
              'import { cleanup, render, screen } from "@testing-library/react";',
              'import { cleanup, render, screen, waitFor } from "@testing-library/react";',
          )
          replace_once(
              route_guard_test,
              'let location = "/professional/patients/41/assessment";\nlet mounts = 0;',
              'let location = "/professional/patients/41/assessment";\nlet mounts = 0;\nlet trackingStatus: "active" | "ended" = "active";\nconst setLocation = vi.fn();',
          )
          replace_once(
              route_guard_test,
              'vi.mock("wouter", () => ({\n  useLocation: () => [location, vi.fn()],\n}));',
              'vi.mock("wouter", () => ({\n  useLocation: () => [location, setLocation],\n}));',
          )
          replace_once(
              route_guard_test,
              '      displayName: "Paciente autorizado",\n    },',
              '      displayName: "Paciente autorizado",\n      trackingStatus,\n    },',
          )
          replace_once(
              route_guard_test,
              '  location = "/professional/patients/41/assessment";\n  mounts = 0;',
              '  location = "/professional/patients/41/assessment";\n  mounts = 0;\n  trackingStatus = "active";\n  setLocation.mockReset();',
          )
          replace_once(
              route_guard_test,
              '  it("remounts when changing patients so drafts cannot cross patient boundaries", async () => {',
              '  it("redirects ended tracking to the audit history surface", async () => {\n    trackingStatus = "ended";\n    const { default: ProfessionalPatientRouteGuard } = await import(\n      "./ProfessionalPatientRouteGuard"\n    );\n    render(<ProfessionalPatientRouteGuard />);\n\n    expect(screen.getByText("Acompanhamento encerrado")).toBeTruthy();\n    expect(screen.queryByText(/workspace-/)).toBeNull();\n    await waitFor(() =>\n      expect(setLocation).toHaveBeenCalledWith(\n        "/professional/patients/41/history"\n      )\n    );\n  });\n\n  it("remounts when changing patients so drafts cannot cross patient boundaries", async () => {',
          )

          authorship_test = "server/modules/professionals/recordService.authorship.test.ts"
          replace_once(
              authorship_test,
              '      .mockResolvedValueOnce([[]])\n      .mockResolvedValueOnce([[{ total: 1 }]])',
              '      .mockResolvedValueOnce([\n        [\n          {\n            id: "history-1",\n            eventType: "private_note_created",\n            entityType: "note",\n            entityId: "note-1",\n            occurredAt: new Date("2026-07-22T12:00:00Z"),\n          },\n        ],\n      ])\n      .mockResolvedValueOnce([[{ total: 1 }]])',
          )
          replace_once(
              authorship_test,
              '      .mockResolvedValueOnce([[{ total: 0 }]]);',
              '      .mockResolvedValueOnce([[{ total: 1 }]]);',
          )
          replace_once(
              authorship_test,
              '    expect(result.guidances[0]?.authorName).toBe("Nutricionista Autora");\n\n    for (const callIndex of [1, 2, 3]) {',
              '    expect(result.guidances[0]?.authorName).toBe("Nutricionista Autora");\n    expect(result.timeline[0]).toEqual({\n      id: "history-1",\n      eventType: "private_note_created",\n      occurredAt: new Date("2026-07-22T12:00:00Z").getTime(),\n    });\n    expect(result.timeline[0]).not.toHaveProperty("entityType");\n    expect(result.timeline[0]).not.toHaveProperty("entityId");\n\n    for (const callIndex of [1, 2, 3]) {',
          )
          insert = '''\n\n  it("returns only paginated audit history after tracking is ended", async () => {\n    mocks.execute\n      .mockResolvedValueOnce([[{\n        authorizationId: "authorization-ended",\n        trackingStatus: "ended",\n        patientName: "Paciente",\n        patientEmail: "paciente@example.com",\n      }]])\n      .mockResolvedValueOnce([[{ id: "assessment-latest", objective: "Sensitive" }]])\n      .mockResolvedValueOnce([[{ id: "assessment-history", objective: "Sensitive" }]])\n      .mockResolvedValueOnce([[{ id: "note-sensitive", content: "Sensitive" }]])\n      .mockResolvedValueOnce([[{ id: "guidance-sensitive", content: "Sensitive" }]])\n      .mockResolvedValueOnce([[{\n        id: "history-ended",\n        eventType: "tracking_ended",\n        entityType: "tracking",\n        entityId: "internal-id",\n        occurredAt: new Date("2026-07-23T12:00:00Z"),\n      }]])\n      .mockResolvedValueOnce([[{ total: 25 }]])\n      .mockResolvedValueOnce([[{ total: 25 }]])\n      .mockResolvedValueOnce([[{ total: 25 }]])\n      .mockResolvedValueOnce([[{ total: 1 }]]);\n\n    const result = await getProfessionalRecord(11, {\n      patientId: 22,\n      page: 1,\n      pageSize: 20,\n    });\n\n    expect(result.latestAssessment).toBeNull();\n    expect(result.assessmentHistory).toEqual([]);\n    expect(result.notes).toEqual([]);\n    expect(result.guidances).toEqual([]);\n    expect(result.timeline).toEqual([\n      {\n        id: "history-ended",\n        eventType: "tracking_ended",\n        occurredAt: new Date("2026-07-23T12:00:00Z").getTime(),\n      },\n    ]);\n    expect(result.pagination).toEqual({\n      page: 1,\n      pageSize: 20,\n      totals: { assessments: 0, notes: 0, guidances: 0, timeline: 1 },\n      hasMore: false,\n    });\n  });\n'''
          path = Path(authorship_test)
          source = path.read_text(encoding="utf-8")
          marker = "\n});\n"
          if not source.endswith(marker):
              raise SystemExit("recordService.authorship.test.ts: unexpected ending")
          path.write_text(source[:-len(marker)] + insert + marker, encoding="utf-8")

          service_test = "server/modules/professionals/service.test.ts"
          replace_once(
              service_test,
              '  getProfessionalPatientTimeZone,\n  getProfessionalProfile,',
              '  getProfessionalPatientPeriodBundle,\n  getProfessionalPatientTimeZone,\n  getProfessionalProfile,',
          )
          replace_once(
              service_test,
              '  suggestMealPlan,\n  upsertProfessionalProfile,',
              '  suggestMealPlan,\n  transitionPatientTracking,\n  upsertProfessionalProfile,',
          )
          service_insert = '''\n\ndescribe("ended professional tracking", () => {\n  it("blocks patient data surfaces while preserving the separate audit history contract", async () => {\n    const professionalUserId = 24980;\n    const patientUserId = 24981;\n    await upsertProfessionalProfile(professionalUserId, {\n      displayName: "Nutricionista Auditora",\n      active: true,\n    });\n    const access = await requestPatientAccess(professionalUserId, {\n      patientContact: `user-${patientUserId}@example.com`,\n      reason: "Acompanhamento",\n    });\n    await approvePatientAccess(patientUserId, access.id);\n    await transitionPatientTracking(professionalUserId, {\n      accessId: access.id,\n      status: "ended",\n    });\n\n    await expect(\n      getProfessionalPatientTimeZone(professionalUserId, patientUserId)\n    ).rejects.toThrow(\n      "O acompanhamento foi encerrado. Somente o histórico profissional permanece disponível."\n    );\n    await expect(\n      getProfessionalPatientPeriodBundle(professionalUserId, patientUserId, {\n        startDate: "2026-07-01",\n        endDate: "2026-07-07",\n      })\n    ).rejects.toThrow(\n      "O acompanhamento foi encerrado. Somente o histórico profissional permanece disponível."\n    );\n  });\n});\n'''
          path = Path(service_test)
          path.write_text(path.read_text(encoding="utf-8") + service_insert, encoding="utf-8")

          message_test = Path("server/modules/professionals/messageService.endedAccess.test.ts")
          message_test.write_text('''import { beforeEach, describe, expect, it, vi } from "vitest";\n\nconst mocks = vi.hoisted(() => ({\n  execute: vi.fn(),\n  getDb: vi.fn(),\n}));\n\nvi.mock("../../db", () => ({\n  getDb: mocks.getDb,\n  getUserWhatsappConnection: vi.fn(),\n  logPersistenceWarning: vi.fn(),\n}));\nvi.mock("../whatsapp/logicalReplyDelivery", () => ({\n  sendWhatsAppStandaloneLogicalReply: vi.fn(),\n}));\nvi.mock("../whatsapp/replyContract", () => ({\n  textReply: vi.fn(),\n}));\n\nimport { listProfessionalMessages } from "./messageService";\n\nbeforeEach(() => {\n  mocks.execute.mockReset();\n  mocks.getDb.mockReset();\n  mocks.getDb.mockResolvedValue({ execute: mocks.execute });\n});\n\ndescribe("listProfessionalMessages ended tracking", () => {\n  it("blocks the individual conversation before message rows are queried", async () => {\n    mocks.execute.mockResolvedValueOnce([[{\n      authorizationId: "authorization-ended",\n      authorizationStatus: "approved",\n      trackingStatus: "ended",\n      profileActive: 1,\n    }]]);\n\n    await expect(\n      listProfessionalMessages(7, { patientId: 41, pageSize: 20 })\n    ).rejects.toThrow(\n      "O acompanhamento foi encerrado. Somente o histórico profissional permanece disponível."\n    );\n    expect(mocks.execute).toHaveBeenCalledTimes(1);\n  });\n});\n''', encoding="utf-8")

          # Permanent documentation and visual regression contract.
          docs = "docs/testing/professional-workspace-routing.md"
          replace_once(
              docs,
              '## Proteção de rascunho\n',
              '## Acompanhamento encerrado\n\nQuando o acompanhamento está `ended`, qualquer rota individual diferente de `/history` redireciona para a linha do tempo auditável antes de montar relatórios, mensagens ou formulários. O backend não retorna avaliação, anotações ou orientações por `professionalRecord.get`, e bloqueia timezone, dashboard, relatório de período e conversa individual. A timeline pública contém somente identificador opaco do evento, tipo de domínio permitido e data; identificadores técnicos da entidade não atravessam o contrato público.\n\n## Proteção de rascunho\n',
          )
          replace_once(
              docs,
              '- Salvar ou descartar deve permitir as navegações seguintes sem reapresentar um rascunho já resolvido.',
              '- Salvar ou descartar deve permitir a navegação que encerra aquele rascunho. Se o profissional iniciar uma nova edição na mesma rota, o guard é rearmado e volta a exigir confirmação.\n- A paginação do histórico é derivada exclusivamente do total da timeline; avaliações, orientações ou anotações adicionais não podem criar páginas vazias na linha do tempo.',
          )

          design_docs = "docs/design-docs/professional-navigation.md"
          replace_once(
              design_docs,
              '- Falhas temporárias de timezone ou bundle no relatório individual mantêm os dados parciais ocultos e oferecem a ação **Tentar novamente** no próprio contexto do relatório.\n',
              '- Falhas temporárias de timezone ou bundle no relatório individual mantêm os dados parciais ocultos e oferecem a ação **Tentar novamente** no próprio contexto do relatório.\n- Acompanhamento `ended` mantém somente `/history`: as demais rotas individuais redirecionam antes de montar conteúdo, e as APIs de prontuário, timezone, dashboard, relatório de período e conversa individual deixam de retornar dados do paciente.\n',
          )

          visual = "scripts/render-professional-patient-workspace-visual.sh"
          replace_once(visual, 'capture "ended-summary-390x1200"', 'capture "ended-history-390x1200"')
          replace_once(
              visual,
              'assert_dom \\\n  "ended" \\\n  "$BASE_URL?state=ended" \\\n  "O acompanhamento foi encerrado. O histórico permanece disponível para auditoria."',
              'assert_dom \\\n  "ended" \\\n  "$BASE_URL?state=ended" \\\n  "Linha do tempo profissional" \\\n  "Histórico"\nfor forbidden in "Ciclo de acompanhamento" "Nova versão da avaliação" "Nova orientação ao paciente" "Nova anotação privada"; do\n  if grep -Fq "$forbidden" "$OUTPUT_DIR/ended.html"; then\n    echo "Ended tracking exposed a non-audit surface: $forbidden"\n    exit 1\n  fi\ndone',
          )
          replace_once(
              visual,
              'assertions=patient identity and internal areas, operational alert, versioned assessment, guidance and private note separation, stable history, paused and ended restrictions, loading and recoverable error states, contained horizontal subnavigation, mobile subnav scrolling and no page-level horizontal overflow',
              'assertions=patient identity and internal areas, operational alert, versioned assessment, guidance and private note separation, stable history pagination, paused restrictions, ended history-only routing, loading and recoverable error states, contained horizontal subnavigation, mobile subnav scrolling and no page-level horizontal overflow',
          )
          PY
      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            client/src/pages/professional/ProfessionalPatientRouteGuard.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
            client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx \
            client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx \
            server/modules/professionals/recordService.ts \
            server/modules/professionals/recordService.authorship.test.ts \
            server/modules/professionals/service.ts \
            server/modules/professionals/service.test.ts \
            server/modules/professionals/messageService.ts \
            server/modules/professionals/messageService.endedAccess.test.ts \
            docs/testing/professional-workspace-routing.md \
            docs/design-docs/professional-navigation.md
      - name: Run focused tests and checks
        env:
          NODE_ENV: test
          PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
        run: |
          pnpm exec vitest run \
            client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx \
            client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx \
            server/modules/professionals/recordService.authorship.test.ts \
            server/modules/professionals/service.test.ts \
            server/modules/professionals/messageService.endedAccess.test.ts \
            --maxWorkers=1 --minWorkers=1
          pnpm check
          pnpm docs:check
          bash scripts/render-professional-patient-workspace-visual.sh
      - name: Commit corrections and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-issue-880-audit-findings.yml
          git add \
            client/src/pages/professional/ProfessionalPatientRouteGuard.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
            client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx \
            client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx \
            server/modules/professionals/recordService.ts \
            server/modules/professionals/recordService.authorship.test.ts \
            server/modules/professionals/service.ts \
            server/modules/professionals/service.test.ts \
            server/modules/professionals/messageService.ts \
            server/modules/professionals/messageService.endedAccess.test.ts \
            docs/testing/professional-workspace-routing.md \
            docs/design-docs/professional-navigation.md \
