name: Patch final issue 880 audit findings

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/patch-issue-880-final-findings.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Apply issue 880 corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/pages/professional/ProfessionalPatientWorkspace.tsx')
          source = path.read_text(encoding='utf-8')
          marker = 'function formatDate(value: number | null | undefined) {\n'
          helper = 'export function getLatestPatientActivityAt(record: { timeline?: Array<{ occurredAt?: number | null }> }) {\n  return record.timeline?.[0]?.occurredAt ?? null;\n}\n\n'
          if helper not in source:
              source = source.replace(marker, helper + marker)
          old = '        trackingStatus={trackingStatus}\n        nextReviewAt={latest?.nextReviewAt}'
          new = '        trackingStatus={trackingStatus}\n        lastActivityAt={getLatestPatientActivityAt(record.data)}\n        nextReviewAt={latest?.nextReviewAt}'
          if old in source:
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')

          Path('client/src/pages/professional/ProfessionalPatientWorkspace.activity.test.ts').write_text('''import { describe, expect, it } from "vitest";\nimport { getLatestPatientActivityAt } from "./ProfessionalPatientWorkspace";\n\ndescribe("workspace patient activity", () => {\n  it("uses the newest canonical timeline event instead of the review date", () => {\n    const activityAt = Date.UTC(2026, 6, 25, 18, 30);\n    const reviewAt = Date.UTC(2026, 7, 20, 12);\n    const record = { latestAssessment: { nextReviewAt: reviewAt }, timeline: [{ occurredAt: activityAt }] };\n    expect(getLatestPatientActivityAt(record)).toBe(activityAt);\n    expect(getLatestPatientActivityAt(record)).not.toBe(reviewAt);\n  });\n  it("uses the documented fallback only without timeline activity", () => {\n    expect(getLatestPatientActivityAt({ timeline: [] })).toBeNull();\n    expect(getLatestPatientActivityAt({})).toBeNull();\n  });\n});\n''', encoding='utf-8')

          docs = Path('docs/testing/professional-workspace-routing.md')
          content = docs.read_text(encoding='utf-8')
          section = '''\n\n## Cabeçalho contextual\n\nA última atividade exibida no cabeçalho vem do primeiro evento da timeline canônica já ordenada pelo backend. A próxima revisão não pode ser usada como substituta. O fallback `Não informado` é usado somente quando a timeline não possui atividade.\n'''
          if '## Cabeçalho contextual' not in content:
              docs.write_text(content.rstrip() + section, encoding='utf-8')
          PY
          git diff --check
          git add client/src/pages/professional/ProfessionalPatientWorkspace.tsx client/src/pages/professional/ProfessionalPatientWorkspace.activity.test.ts docs/testing/professional-workspace-routing.md
          git rm .github/workflows/patch-issue-880-final-findings.yml
          git diff --cached --check
          git commit -m "fix: expose canonical patient activity in workspace header"
          git push origin HEAD:feat/875-professional-context-routes
