name: Patch exact-head manifests for issue 879

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/patch-exact-head-manifests-879.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Bind verification artifacts to the exact PR head
        run: |
          python - <<'PY'
          from pathlib import Path

          expression = "$" + "{{ github.event.pull_request.head.sha || github.sha }}"

          agent = Path(".github/workflows/agent-check.yml")
          source = agent.read_text(encoding="utf-8")
          env_anchor = "      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory\n"
          if source.count(env_anchor) != 1:
              raise SystemExit("expected one Agent-first environment anchor")
          source = source.replace(
              env_anchor,
              env_anchor + f"      VERIFICATION_HEAD_SHA: {expression}\n",
          )
          start = source.index("      - name: Create verification manifest")
          end = source.index("      - name: Database integrity check", start)
          replacement = f'''      - name: Create exact-head verification manifest
        run: |
          mkdir -p /tmp/agent-first-verification
          cat > /tmp/agent-first-verification/manifest.json <<EOF
          {{
            "schemaVersion": 2,
            "repository": "${{GITHUB_REPOSITORY}}",
            "headSha": "${{VERIFICATION_HEAD_SHA}}",
            "checkoutSha": "${{GITHUB_SHA}}",
            "runId": "${{GITHUB_RUN_ID}}",
            "workflow": "${{GITHUB_WORKFLOW}}",
            "event": "${{GITHUB_EVENT_NAME}}",
            "ref": "${{GITHUB_REF}}",
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }}
          EOF
          node --input-type=module -e 'import fs from "node:fs"; const value = JSON.parse(fs.readFileSync("/tmp/agent-first-verification/manifest.json", "utf8")); if (value.headSha !== process.env.VERIFICATION_HEAD_SHA) throw new Error("verification manifest does not match PR head");'
          cat /tmp/agent-first-verification/manifest.json

      - name: Upload exact-head verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-verification-{expression}
          path: /tmp/agent-first-verification/manifest.json
          if-no-files-found: error
          retention-days: 30

'''
          agent.write_text(source[:start] + replacement + source[end:], encoding="utf-8")

          professional = Path(".github/workflows/professional-persistence-tidb.yml")
          source = professional.read_text(encoding="utf-8")
          old_expression = "$" + "{{ github.sha }}"
          old = f"          name: professional-access-boundary-{old_expression}\n"
          new = f"          name: professional-access-boundary-{expression}\n"
          if source.count(old) != 1:
              raise SystemExit("expected one professional artifact name")
          professional.write_text(source.replace(old, new), encoding="utf-8")
          PY
          git diff --check
          grep -n "VERIFICATION_HEAD_SHA\|agent-first-verification\|professional-access-boundary" .github/workflows/agent-check.yml .github/workflows/professional-persistence-tidb.yml
      - name: Commit manifest corrections and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-check.yml .github/workflows/professional-persistence-tidb.yml
          git rm .github/workflows/patch-exact-head-manifests-879.yml
          git diff --cached --check
          git commit -m "ci: bind verification artifacts to exact PR head (#879)"
          git push origin HEAD:feat/875-professional-context-routes
