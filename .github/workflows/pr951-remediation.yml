name: PR 951 remediation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr951-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply scoped tooltip remediation
        run: |
          cat > /tmp/pr951-remediation.patch <<'PATCH'
          diff --git a/client/src/components/ui/button.test.tsx b/client/src/components/ui/button.test.tsx
          index b2b32889..3cc037c3 100644
          --- a/client/src/components/ui/button.test.tsx
          +++ b/client/src/components/ui/button.test.tsx
          @@ -6,29 +6,21 @@ import { Button } from "./button";
           
           afterEach(cleanup);
           
          -function renderTrackingButtons() {
          -  render(
          -    <>
          -      <Button variant="outline">Pausar</Button>
          -      <Button variant="destructive">Encerrar</Button>
          -    </>
          -  );
          -}
          -
          -describe("Button tracking action tooltips", () => {
          -  it("explains what pausing and ending the follow-up cycle do", () => {
          -    renderTrackingButtons();
          +describe("Button title contract", () => {
          +  it("does not infer follow-up semantics from generic button labels", () => {
          +    render(
          +      <>
          +        <Button variant="outline">Pausar</Button>
          +        <Button variant="destructive">Encerrar</Button>
          +      </>
          +    );
           
               expect(
                 screen.getByRole("button", { name: "Pausar" }).getAttribute("title")
          -    ).toBe(
          -      "Suspende temporariamente o acompanhamento. O histórico continua disponível, mas novas intervenções ficam bloqueadas até a retomada."
          -    );
          +    ).toBeNull();
               expect(
                 screen.getByRole("button", { name: "Encerrar" }).getAttribute("title")
          -    ).toBe(
          -      "Finaliza o acompanhamento. Após o encerramento, somente as mensagens anteriores e o histórico permanecem disponíveis para consulta."
          -    );
          +    ).toBeNull();
             });
           
             it("preserves an explicitly provided title", () => {
          @@ -42,12 +34,4 @@ describe("Button tracking action tooltips", () => {
                 screen.getByRole("button", { name: "Pausar" }).getAttribute("title")
               ).toBe("Título específico");
             });
          -
          -  it("does not add a cycle tooltip to unrelated buttons", () => {
          -    render(<Button variant="outline">Voltar</Button>);
          -
          -    expect(
          -      screen.getByRole("button", { name: "Voltar" }).getAttribute("title")
          -    ).toBeNull();
          -  });
           });
          diff --git a/client/src/components/ui/button.tsx b/client/src/components/ui/button.tsx
          index 06bd4976..68bbf001 100644
          --- a/client/src/components/ui/button.tsx
          +++ b/client/src/components/ui/button.tsx
          @@ -41,7 +41,6 @@ function Button({
             variant,
             size,
             asChild = false,
          -  title,
             children,
             ...props
           }: React.ComponentProps<"button"> &
          @@ -62,18 +61,10 @@ function Button({
               return null;
             }
           
          -  const trackingActionTooltip =
          -    variant === "outline" && childText === "Pausar"
          -      ? "Suspende temporariamente o acompanhamento. O histórico continua disponível, mas novas intervenções ficam bloqueadas até a retomada."
          -      : variant === "destructive" && childText === "Encerrar"
          -        ? "Finaliza o acompanhamento. Após o encerramento, somente as mensagens anteriores e o histórico permanecem disponíveis para consulta."
          -        : undefined;
          -
             return (
               <Comp
                 data-slot="button"
                 className={cn(buttonVariants({ variant, size, className }))}
          -      title={title ?? trackingActionTooltip}
                 {...props}
               >
                 {children}
          diff --git a/client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx b/client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx
          index 2bde6bf9..f53f08cb 100644
          --- a/client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx
          +++ b/client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx
          @@ -565,6 +565,24 @@ describe("professional patient workspace audit corrections", () => {
               expect(screen.getByTestId("goal-exception-count").textContent).toBe("0");
             });
           
          +
          +  it("explains pause and end consequences on the follow-up cycle controls", () => {
          +    location = "/professional/patients/41";
          +    recordData = recordFixture();
          +    render(<ProfessionalPatientWorkspace />);
          +
          +    expect(
          +      screen.getByRole("button", { name: "Pausar" }).getAttribute("title")
          +    ).toBe(
          +      "Suspende temporariamente o acompanhamento. O histórico continua disponível, mas novas intervenções ficam bloqueadas até a retomada."
          +    );
          +    expect(
          +      screen.getByRole("button", { name: "Encerrar" }).getAttribute("title")
          +    ).toBe(
          +      "Finaliza o acompanhamento. Após o encerramento, somente as mensagens anteriores e o histórico permanecem disponíveis para consulta."
          +    );
          +  });
          +
             it("redirects immediately to history and refreshes canonical context when tracking ends", async () => {
               const user = userEvent.setup();
               location = "/professional/patients/41";
          diff --git a/client/src/pages/professional/ProfessionalPatientWorkspace.tsx b/client/src/pages/professional/ProfessionalPatientWorkspace.tsx
          index 12f8b499..8bb71a7c 100644
          --- a/client/src/pages/professional/ProfessionalPatientWorkspace.tsx
          +++ b/client/src/pages/professional/ProfessionalPatientWorkspace.tsx
          @@ -117,6 +117,11 @@ function historyEventLabel(item: { label?: string | null }) {
             return item.label?.trim() || "Evento profissional registrado";
           }
           
          +const PAUSE_TRACKING_TITLE =
          +  "Suspende temporariamente o acompanhamento. O histórico continua disponível, mas novas intervenções ficam bloqueadas até a retomada.";
          +const END_TRACKING_TITLE =
          +  "Finaliza o acompanhamento. Após o encerramento, somente as mensagens anteriores e o histórico permanecem disponíveis para consulta.";
          +
           type AssessmentDraft = {
             objective: string;
             weightKg: string;
          @@ -1538,6 +1543,7 @@ export default function ProfessionalPatientWorkspace() {
                             <>
                               <Button
                                 variant="outline"
          +                    title={PAUSE_TRACKING_TITLE}
                                 disabled={transitionTracking.isPending}
                                 onClick={() => transition("paused")}
                               >
          @@ -1545,6 +1551,7 @@ export default function ProfessionalPatientWorkspace() {
                               </Button>
                               <Button
                                 variant="destructive"
          +                    title={END_TRACKING_TITLE}
                                 disabled={transitionTracking.isPending}
                                 onClick={() => transition("ended")}
                               >
          @@ -1562,6 +1569,7 @@ export default function ProfessionalPatientWorkspace() {
                               </Button>
                               <Button
                                 variant="destructive"
          +                    title={END_TRACKING_TITLE}
                                 disabled={transitionTracking.isPending}
                                 onClick={() => transition("ended")}
                               >
          PATCH
          sed -i 's/^          //' /tmp/pr951-remediation.patch
          git apply --check /tmp/pr951-remediation.patch
          git apply /tmp/pr951-remediation.patch
          pnpm exec prettier --write \
            client/src/components/ui/button.tsx \
            client/src/components/ui/button.test.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx
          git rm .github/workflows/pr951-remediation.yml
          git diff --check

      - name: Commit remediation candidate
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope tracking tooltips to patient workspace"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Focused regression tests
        env:
          NODE_ENV: test
          PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
        run: |
          pnpm exec vitest run \
            client/src/components/ui/button.test.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx \
            --maxWorkers=1 --minWorkers=1

      - name: TypeScript check
        run: pnpm check

      - name: Architecture check
        run: pnpm architecture:check

      - name: Build
        run: pnpm build

      - name: Create exact candidate bundle
        run: |
          mkdir -p /tmp/pr951-remediation
          git update-ref refs/orchestrator/head "${{ steps.commit.outputs.sha }}"
          git update-ref refs/orchestrator/base origin/develop
          git bundle create /tmp/pr951-remediation/repository.bundle \
            refs/orchestrator/head refs/orchestrator/base
          cat > /tmp/pr951-remediation/manifest.json <<EOF
          {
            "schemaVersion": 1,
            "repository": "${GITHUB_REPOSITORY}",
            "headSha": "${{ steps.commit.outputs.sha }}",
            "baseRef": "develop",
            "baseSha": "$(git rev-parse origin/develop)",
            "runId": "${GITHUB_RUN_ID}",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: pr951-remediation-${{ steps.commit.outputs.sha }}
          path: /tmp/pr951-remediation
          if-no-files-found: error
          retention-days: 7

      - name: Push remediation
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
