name: PR 951 remediation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: pr951-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply scoped tooltip remediation
        run: |
          python3 .github/pr951-remediate.py
          pnpm exec prettier --write \
            client/src/components/ui/button.tsx \
            client/src/components/ui/button.test.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx
          git rm .github/workflows/pr951-remediation.yml .github/pr951-remediate.py
          git diff --check

      - name: Commit remediation candidate
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: scope tracking tooltips to patient workspace"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Focused regression tests
        env:
          NODE_ENV: test
          PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
        run: |
          pnpm exec vitest run \
            client/src/components/ui/button.test.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx \
            --maxWorkers=1 --minWorkers=1

      - name: TypeScript check
        run: pnpm check

      - name: Architecture check
        run: pnpm architecture:check

      - name: Build
        run: pnpm build

      - name: Create exact candidate bundle
        run: |
          mkdir -p /tmp/pr951-remediation
          git update-ref refs/orchestrator/head "${{ steps.commit.outputs.sha }}"
          git update-ref refs/orchestrator/base origin/develop
          git bundle create /tmp/pr951-remediation/repository.bundle \
            refs/orchestrator/head refs/orchestrator/base
          cat > /tmp/pr951-remediation/manifest.json <<EOF
          {
            "schemaVersion": 1,
            "repository": "${GITHUB_REPOSITORY}",
            "headSha": "${{ steps.commit.outputs.sha }}",
            "baseRef": "develop",
            "baseSha": "$(git rev-parse origin/develop)",
            "runId": "${GITHUB_RUN_ID}",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: pr951-remediation-${{ steps.commit.outputs.sha }}
          path: /tmp/pr951-remediation
          if-no-files-found: error
          retention-days: 7

      - name: Push remediation
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
