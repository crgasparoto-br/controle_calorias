name: Patch issue 880 workspace visual evidence

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/patch-issue-880-workspace-visual-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Extend visual evidence to the patient workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          trpc = Path("visual-tests/professional-home/trpcMock.ts")
          source = trpc.read_text(encoding="utf-8")
          state_anchor = '''function visualState() {
            return new URLSearchParams(window.location.search).get("state") ?? "main";
          }
          '''
          if source.count(state_anchor) != 1:
              raise SystemExit("expected one visualState anchor")
          state_insert = state_anchor + '''
          function trackingStatusForState() {
            const state = visualState();
            if (state === "paused") return "paused" as const;
            if (state === "ended") return "ended" as const;
            return "active" as const;
          }

          function patientContextQuery(input: { patientId: number }) {
            return {
              data: {
                patientId: input.patientId,
                displayName: "Mariana de Almeida Vasconcelos e Silva",
                trackingStatus: trackingStatusForState(),
              },
              isLoading: false,
              isFetching: false,
              isError: false,
              isSuccess: true,
              isFetchedAfterMount: true,
              error: null,
              refetch: resolved,
            };
          }

          function recordQuery(input: { patientId: number; page?: number; pageSize?: number }) {
            const state = visualState();
            if (state === "patient-loading") {
              return {
                data: undefined,
                isLoading: true,
                isError: false,
                error: null,
                refetch: resolved,
              };
            }
            if (state === "patient-error") {
              return {
                data: undefined,
                isLoading: false,
                isError: true,
                error: new Error("Falha visual simulada ao carregar o prontuário"),
                refetch: resolved,
              };
            }

            const trackingStatus = trackingStatusForState();
            const timeline = [
              {
                id: "timeline-guidance",
                eventType: "guidance_created",
                label: "Orientação registrada para o paciente",
                occurredAt: now - 45 * 60_000,
              },
              {
                id: "timeline-assessment",
                eventType: "assessment_version_created",
                label: "Nova versão da avaliação criada",
                occurredAt: now - 2 * 86_400_000,
              },
              {
                id: "timeline-tracking",
                eventType: "tracking_started",
                label: "Acompanhamento profissional iniciado",
                occurredAt: now - 15 * 86_400_000,
              },
            ];

            return {
              data: {
                patient: {
                  authorizationId: "approved-1",
                  trackingStatus,
                },
                latestAssessment: {
                  id: "assessment-2",
                  version: 2,
                  objective: "Melhorar a composição corporal preservando desempenho e rotina alimentar.",
                  assessedAt: now - 2 * 86_400_000,
                  nextReviewAt: now + 12 * 86_400_000,
                },
                assessmentHistory: [
                  {
                    id: "assessment-2",
                    version: 2,
                    objective: "Melhorar a composição corporal preservando desempenho e rotina alimentar.",
                    assessedAt: now - 2 * 86_400_000,
                  },
                  {
                    id: "assessment-1",
                    version: 1,
                    objective: "Organizar horários e aumentar a regularidade das refeições.",
                    assessedAt: now - 30 * 86_400_000,
                  },
                ],
                guidances: [
                  {
                    id: "guidance-1",
                    title: "Organização do pré-treino",
                    version: 1,
                    content: "Planejar uma refeição leve antes do treino e registrar qualquer desconforto percebido.",
                    authorName: "Nutricionista de validação",
                    createdAt: now - 45 * 60_000,
                  },
                ],
                notes: [
                  {
                    id: "note-1",
                    content: "Paciente relatou boa adesão durante a semana e maior dificuldade nos fins de semana.",
                    authorName: "Nutricionista de validação",
                    createdAt: now - 3 * 60 * 60_000,
                  },
                ],
                timeline,
                pagination: {
                  page: input.page ?? 1,
                  pageSize: input.pageSize ?? 20,
                  hasMore: false,
                },
              },
              isLoading: false,
              isError: false,
              error: null,
              refetch: resolved,
            };
          }

          function operationalAlertsQuery() {
            return {
              data: [
                {
                  id: "alert-review-1",
                  patientUserId: 1,
                  patientName: "Mariana de Almeida Vasconcelos e Silva",
                  type: "record_requires_review",
                  severity: "attention",
                  reason: "Existe um registro recente que precisa de revisão profissional.",
                  suggestedAction: "Revisar o registro e documentar a decisão tomada.",
                  period: { start: now - 86_400_000, end: now },
                  origin: { type: "meals", id: "meal-visual-1" },
                },
              ],
              isLoading: false,
              isError: false,
              refetch: resolved,
            };
          }
          '''
          source = source.replace(state_anchor, state_insert, 1)

          context_anchor = '''    context: {
                useQuery: () => ({
                  data: null,
                  isLoading: false,
                  isFetching: false,
                  isError: false,
                  isSuccess: true,
                  isFetchedAfterMount: true,
                  error: null,
                  refetch: resolved,
                }),
              },
          '''
          if source.count(context_anchor) != 1:
              raise SystemExit("expected one professionalRecord.context anchor")
          context_replacement = '''    context: {
                useQuery: (input: { patientId: number }) => patientContextQuery(input),
              },
              get: {
                useQuery: (input: { patientId: number; page?: number; pageSize?: number }) =>
                  recordQuery(input),
              },
              saveAssessment: { useMutation: () => mutation() },
              createNote: { useMutation: () => mutation() },
              createGuidance: { useMutation: () => mutation() },
              transitionTracking: { useMutation: () => mutation() },
              operationalAlerts: {
                list: { useQuery: () => operationalAlertsQuery() },
                close: { useMutation: () => mutation() },
                evaluate: { useMutation: () => mutation() },
              },
          '''
          source = source.replace(context_anchor, context_replacement, 1)
          trpc.write_text(source, encoding="utf-8")

          main = Path("visual-tests/professional-home/main.tsx")
          source = main.read_text(encoding="utf-8")
          diagnostics_anchor = '''  if (primaryAction) {
              const rect = primaryAction.getBoundingClientRect();
              root.dataset.visualPrimaryActionVisible = String(
                rect.left >= 0 &&
                  rect.right <= window.innerWidth &&
                  rect.top >= 0 &&
                  rect.top < window.innerHeight
              );
            }
          '''
          if source.count(diagnostics_anchor) != 1:
              raise SystemExit("expected one primary action diagnostics anchor")
          diagnostics_replacement = diagnostics_anchor + '''
            const patientSubnav = document.querySelector<HTMLElement>(
              'nav[aria-label="Áreas do paciente"]'
            );
            if (patientSubnav) {
              const rect = patientSubnav.getBoundingClientRect();
              root.dataset.visualPatientSubnavContained = String(
                rect.left >= 0 && rect.right <= window.innerWidth
              );
              root.dataset.visualPatientSubnavScrollable = String(
                patientSubnav.scrollWidth >= patientSubnav.clientWidth
              );
            }
          '''
          source = source.replace(diagnostics_anchor, diagnostics_replacement, 1)
          main.write_text(source, encoding="utf-8")

          render = Path("scripts/render-professional-home-visual.sh")
          source = render.read_text(encoding="utf-8")
          urls_anchor = '''BASE_URL="http://127.0.0.1:${PORT}/professional"
          PATIENTS_URL="http://127.0.0.1:${PORT}/professional/patients"
          '''
          if source.count(urls_anchor) != 1:
              raise SystemExit("expected one visual URL anchor")
          urls_replacement = urls_anchor + '''PATIENT_URL="http://127.0.0.1:${PORT}/professional/patients/1"
          PATIENT_ASSESSMENT_URL="${PATIENT_URL}/assessment"
          PATIENT_GUIDANCE_URL="${PATIENT_URL}/guidance"
          PATIENT_NOTES_URL="${PATIENT_URL}/notes"
          PATIENT_HISTORY_URL="${PATIENT_URL}/history"
          '''
          source = source.replace(urls_anchor, urls_replacement, 1)

          capture_anchor = '''capture "patients-error-desktop-1366x768" "1366,768" "$PATIENTS_URL?state=portfolio-error"
          '''
          if source.count(capture_anchor) != 1:
              raise SystemExit("expected one patient portfolio capture anchor")
          capture_replacement = capture_anchor + '''
          capture "patient-summary-desktop-1440x900" "1440,900" "$PATIENT_URL"
          capture "patient-summary-notebook-1366x768" "1366,768" "$PATIENT_URL"
          capture "patient-summary-tablet-1024x768" "1024,768" "$PATIENT_URL"
          capture "patient-summary-mobile-390x844" "390,844" "$PATIENT_URL"
          capture "patient-assessment-desktop-1440x900" "1440,900" "$PATIENT_ASSESSMENT_URL"
          capture "patient-guidance-notebook-1366x768" "1366,768" "$PATIENT_GUIDANCE_URL"
          capture "patient-notes-mobile-390x1200" "390,1200" "$PATIENT_NOTES_URL"
          capture "patient-history-desktop-1366x768" "1366,768" "$PATIENT_HISTORY_URL"
          capture "patient-paused-assessment-1366x768" "1366,768" "$PATIENT_ASSESSMENT_URL?state=paused"
          capture "patient-ended-summary-390x1200" "390,1200" "$PATIENT_URL?state=ended"
          capture "patient-loading-tablet-1024x768" "1024,768" "$PATIENT_URL?state=patient-loading"
          capture "patient-error-desktop-1366x768" "1366,768" "$PATIENT_URL?state=patient-error"
          '''
          source = source.replace(capture_anchor, capture_replacement, 1)

          assertions_anchor = '''assert_dom_at_size \
            "patients-mobile-layout" \
            "390,844" \
            "$PATIENTS_URL" \
            'data-visual-horizontal-overflow="false"' \
            'data-visual-patient-cards-contained="true"'
          '''
          if source.count(assertions_anchor) != 1:
              raise SystemExit("expected one patients mobile assertion anchor")
          assertions_replacement = assertions_anchor + '''
          assert_dom \
            "patient-summary" \
            "$PATIENT_URL" \
            "Workspace do paciente" \
            "Mariana de Almeida Vasconcelos e Silva" \
            "Próximas ações" \
            "Pendências operacionais" \
            "Registro que exige revisão" \
            "Resumo" \
            "Avaliação" \
            "Metas" \
            "Orientações" \
            "Anotações" \
            "Relatórios" \
            "Mensagens" \
            "Histórico"
          assert_dom \
            "patient-assessment" \
            "$PATIENT_ASSESSMENT_URL" \
            "Nova versão da avaliação" \
            "Versões anteriores" \
            "Versão 2" \
            "Salvar nova versão"
          assert_dom \
            "patient-guidance" \
            "$PATIENT_GUIDANCE_URL" \
            "Nova orientação ao paciente" \
            "Orientações registradas" \
            "Nutricionista de validação"
          assert_dom \
            "patient-notes" \
            "$PATIENT_NOTES_URL" \
            "Nova anotação privada" \
            "Anotações anteriores" \
            "Paciente relatou boa adesão"
          assert_dom \
            "patient-history" \
            "$PATIENT_HISTORY_URL" \
            "Linha do tempo profissional" \
            "Orientação registrada para o paciente" \
            "Página 1"
          assert_dom \
            "patient-paused" \
            "$PATIENT_ASSESSMENT_URL?state=paused" \
            "Novas avaliações ficam bloqueadas enquanto o acompanhamento não estiver ativo."
          assert_dom \
            "patient-ended" \
            "$PATIENT_URL?state=ended" \
            "O acompanhamento foi encerrado. O histórico permanece disponível para auditoria."
          assert_dom \
            "patient-loading" \
            "$PATIENT_URL?state=patient-loading" \
            "Carregando prontuário e contexto do paciente..."
          assert_dom \
            "patient-error" \
            "$PATIENT_URL?state=patient-error" \
            "Não foi possível carregar o prontuário" \
            "Tentar novamente"
          assert_dom_at_size \
            "patient-tablet-layout" \
            "1024,768" \
            "$PATIENT_URL" \
            'data-visual-horizontal-overflow="false"' \
            'data-visual-patient-subnav-contained="true"'
          assert_dom_at_size \
            "patient-mobile-layout" \
            "390,844" \
            "$PATIENT_URL" \
            'data-visual-horizontal-overflow="false"' \
            'data-visual-patient-subnav-contained="true"' \
            'data-visual-patient-subnav-scrollable="true"'
          '''
          source = source.replace(assertions_anchor, assertions_replacement, 1)

          manifest_anchor = '''routes=/professional,/professional/patients
          commit=${GITHUB_SHA:-local}
          scenarios=main,complete-page-3,loading,empty,priority-error,portfolio-error,sidebar-collapsed,patients-main,patients-empty,patients-error
          viewports=1440x900,1366x768,1024x768,390x844,390x1200
          source=actual ProfessionalAreaPage, ProfessionalLayout and ProfessionalPatients with deterministic tRPC and auth fixtures
          interaction=sidebar collapsed through the actual sidebar trigger
          assertions=complete page 3 content, collapsed sidebar DOM state, patient authorization actions, privacy-neutral non-approved identities, no horizontal overflow and visible patient action at tablet width
          '''
          if source.count(manifest_anchor) != 1:
              raise SystemExit("expected one visual manifest anchor")
          manifest_replacement = '''routes=/professional,/professional/patients,/professional/patients/1,/professional/patients/1/assessment,/professional/patients/1/guidance,/professional/patients/1/notes,/professional/patients/1/history
          head_sha=${GITHUB_HEAD_SHA:-${GITHUB_SHA:-local}}
          checkout_sha=${GITHUB_SHA:-local}
          scenarios=main,complete-page-3,loading,empty,priority-error,portfolio-error,sidebar-collapsed,patients-main,patients-empty,patients-error,patient-summary,patient-assessment,patient-guidance,patient-notes,patient-history,patient-paused,patient-ended,patient-loading,patient-error
          viewports=1440x900,1366x768,1024x768,390x844,390x1200
          source=actual ProfessionalAreaPage, ProfessionalLayout, ProfessionalPatients and ProfessionalPatientWorkspace with deterministic tRPC and auth fixtures
          interaction=sidebar collapsed through the actual sidebar trigger; patient workspace exercised through canonical deep links
          assertions=complete page 3 content, collapsed sidebar DOM state, patient authorization actions, privacy-neutral non-approved identities, patient header and internal areas, paused and ended restrictions, loading and error states, contained horizontal subnavigation and no page-level horizontal overflow
          '''
          source = source.replace(manifest_anchor, manifest_replacement, 1)
          render.write_text(source, encoding="utf-8")

          workflow = Path(".github/workflows/professional-home-visual.yml")
          source = workflow.read_text(encoding="utf-8")
          env_anchor = '''    env:
                NODE_OPTIONS: --max-old-space-size=4096
          '''
          if source.count(env_anchor) != 1:
              raise SystemExit("expected one visual workflow env anchor")
          head_expression = "$" + "{{ github.event.pull_request.head.sha }}"
          env_replacement = env_anchor + f"      GITHUB_HEAD_SHA: {head_expression}\n"
          source = source.replace(env_anchor, env_replacement, 1)
          workflow.write_text(source, encoding="utf-8")

          docs = Path("docs/testing/professional-workspace-routing.md")
          source = docs.read_text(encoding="utf-8")
          docs_anchor = "## Regressão manual mínima\n"
          if source.count(docs_anchor) != 1:
              raise SystemExit("expected one manual regression docs anchor")
          docs_insert = '''## Evidência visual automatizada

          O workflow `Professional workspace visual evidence` deve renderizar, no head exato da pull request, as superfícies agregadas e o workspace individual real em rotas canônicas. Para a issue #880, o artefato precisa incluir resumo, avaliação, orientações, anotações e histórico, além dos estados pausado, encerrado, carregando e erro recuperável.

          As capturas obrigatórias cobrem 1440 × 900, 1366 × 768, 1024 × 768, 390 × 844 e 390 × 1200. O manifesto do artefato registra separadamente `head_sha` e `checkout_sha`, porque o checkout de eventos `pull_request` pode usar o merge preview. As asserções de DOM verificam ausência de overflow horizontal da página, contenção da subnavegação e rolagem horizontal da subnav no mobile.

          O harness usa `ProfessionalAreaPage`, `ProfessionalLayout`, `ProfessionalPatients` e `ProfessionalPatientWorkspace` reais, substituindo somente autenticação e transporte tRPC por fixtures determinísticas. Ele comprova composição, responsividade e estados visuais; autorização, persistência e contratos de backend permanecem cobertos pelos gates funcionais próprios.

          '''
          source = source.replace(docs_anchor, docs_insert + docs_anchor, 1)
          docs.write_text(source, encoding="utf-8")
          PY
          git diff --check
          git status --short
      - name: Commit visual evidence corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-tests/professional-home/trpcMock.ts visual-tests/professional-home/main.tsx scripts/render-professional-home-visual.sh .github/workflows/professional-home-visual.yml docs/testing/professional-workspace-routing.md
          git rm .github/workflows/patch-issue-880-workspace-visual-evidence.yml
          git diff --cached --check
          git commit -m "test: cover issue 880 patient workspace visually"
          git push origin HEAD:feat/875-professional-context-routes
