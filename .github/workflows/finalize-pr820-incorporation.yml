name: Finalize PR 820 incorporation

on:
  push:
    branches:
      - fix/779-concluir-auditoria

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Normalize final spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("server/whatsappIntentWebhook.ts")
          source = source_path.read_text(encoding="utf-8")
          source = source.replace(
              "    return true;\n  }\n  let nutritionFallback: WhatsappLlmNutritionFallback | null = null;",
              "    return true;\n  }\n\n  let nutritionFallback: WhatsappLlmNutritionFallback | null = null;",
              1,
          )
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("server/whatsappIntentWebhook.test.ts")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "    }));\n  });\n  it(\"substitui gramas do alimento existente e não delega para inferência nutricional\"",
              "    }));\n  });\n\n  it(\"substitui gramas do alimento existente e não delega para inferência nutricional\"",
              1,
          )
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Webhook regression test
        run: pnpm exec vitest run server/whatsappIntentWebhook.test.ts

      - name: Commit finalized incorporation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/whatsappIntentWebhook.ts server/whatsappIntentWebhook.test.ts
          git rm .github/workflows/finalize-pr820-incorporation.yml
          git commit -m "test(whatsapp): validar incorporação da PR #820"
          git push origin HEAD:fix/779-concluir-auditoria
