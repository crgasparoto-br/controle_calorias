name: Issue 813 TypeScript diagnostics

on:
  push:
    branches:
      - feat/813-professional-ai-assistance

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          pnpm check > issue-813-tsc.log 2>&1
          status=$?
          echo "$status" > issue-813-tsc.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: issue-813-typecheck-diagnostics
          path: |
            issue-813-tsc.log
            issue-813-tsc.exit
          if-no-files-found: error
