name: Issue 875 focus patch

on:
  push:
    branches: [feat/875-professional-context-routes]

permissions:
  contents: write

jobs:
  apply-focus-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Keep focus without scrolling under the sticky header
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("client/src/components/ProfessionalLayout.tsx")
          content = path.read_text()
          old = "mainRef.current?.focus();"
          new = "mainRef.current?.focus({ preventScroll: true });"
          if old not in content:
              raise SystemExit("expected focus call not found")
          path.write_text(content.replace(old, new, 1))
          PY
          rm .github/workflows/issue875-focus-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/ProfessionalLayout.tsx .github/workflows/issue875-focus-patch.yml
          git commit -m "fix(professional): preserve scroll position on route focus"
          git push origin HEAD:feat/875-professional-context-routes
