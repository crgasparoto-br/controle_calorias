name: Issue 923 fix labelled macros PR

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".ci/issue-923-labelled-macros-trigger"
      - ".github/workflows/issue-923-fix-labelled-macros-pr.yml"

permissions:
  contents: write

concurrency:
  group: issue-923-fix-labelled-macros-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/923-ai-capabilities-question-nutrition-embedding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Correct labelled macro parsing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('server/catalogSemanticSearch.ts')
          source = source_path.read_text()
          singular_pattern = 'prote[ií]na|protein'
          plural_pattern = 'prote[ií]nas?|proteins?'
          occurrences = source.count(singular_pattern)
          if occurrences < 2:
              raise SystemExit(f'expected at least two protein label patterns, found {occurrences}')
          source = source.replace(singular_pattern, plural_pattern)

          old = '''  const patterns = [
              new RegExp(`(?:${labelPattern})[^\\\\d]{0,24}(-?\\\\d+(?:[.,]\\\\d+)?)\\\\s*g`, "giu"),
              new RegExp(`(-?\\\\d+(?:[.,]\\\\d+)?)\\\\s*g[^a-z0-9]{0,12}(?:${labelPattern})`, "giu"),
            ];'''
          new = '''  const patterns = [
              new RegExp(`(?:${labelPattern})\\\\s*(?::|=)?\\\\s*(-?\\\\d+(?:[.,]\\\\d+)?)\\\\s*g`, "giu"),
              new RegExp(`(-?\\\\d+(?:[.,]\\\\d+)?)\\\\s*g\\\\s*(?:de\\\\s+)?(?:${labelPattern})`, "giu"),
            ];'''
          if source.count(old) != 1:
              raise SystemExit('labelled gram extraction block not found exactly once')
          source_path.write_text(source.replace(old, new))

          test_path = Path('server/catalogSemanticSearch.test.ts')
          test = test_path.read_text()
          marker = '''  it("returns null (without fabricating data) when confidence is below the threshold", async () => {'''
          case = '''  it("aceita grounding Gemini opaco com valores antes dos rótulos", async () => {
              const evidence = "De acordo com a tabela nutricional do KitKat ao leite de 41,5g (1 unidade) fornecida pela Loja Santo Antônio, a porção contém 220 kcal, 24g de carboidratos, 3,3g de proteínas e 12g de gorduras.";
              const opaqueSource = "https://vertexaisearch.cloud.google.com/grounding-api-redirect/opaque-token";
              resolveCapabilityConfigMock.mockReturnValue(READY_POLICY);
              createTextResponseMock.mockResolvedValue({});
              mockExecuteWithOutput(JSON.stringify({
                found: true,
                matchedProductName: "Chocolate KitKat Ao Leite 41,5g",
                brandName: "Nestlé",
                servingLabel: "1 unidade",
                gramsPerServing: 41.5,
                calories: 220,
                protein: 3.3,
                carbs: 24,
                fat: 12,
                confidence: 1,
                sourceUrl: "https://www.lojasantoantonio.com.br/chocolate-kitkat-ao-leite-41-5g-24-unidades-nestle",
                evidence,
              }), {
                executed: true,
                sources: [{
                  url: opaqueSource,
                  title: "lojasantoantonio.com.br",
                  supportingText: [evidence],
                }],
              });

              const result = await findPackagedSnackByWebSearch("KitKat ao leite 41,5g", "chocolate");

              expect(result).not.toBeNull();
              expect(result?.calories).toBe(220);
              expect(result?.protein).toBe(3.3);
              expect(result?.carbs).toBe(24);
              expect(result?.fat).toBe(12);
              expect(result?.aliases).toContain(`fonte: ${opaqueSource}`);
            });

          '''
          if case not in test:
              if test.count(marker) != 1:
                  raise SystemExit('test insertion marker not found exactly once')
              test_path.write_text(test.replace(marker, case + marker))
          PY
          rm -f .github/workflows/issue-923-fix-labelled-macros-pr.yml
          rm -f .ci/issue-923-labelled-macros-trigger
          git diff --check
          pnpm exec vitest run server/_core/ai/domainTextResponse.test.ts server/catalogSemanticSearch.test.ts --maxWorkers=1 --minWorkers=1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): reconhecer macros antes dos rótulos na evidência"
          git push origin HEAD:feat/923-ai-capabilities-question-nutrition-embedding
