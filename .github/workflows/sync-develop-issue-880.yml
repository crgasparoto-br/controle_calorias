name: Sync develop for issue 880

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - .github/workflows/sync-develop-issue-880.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Merge current develop and publish
        env:
          EXPECTED_TRIGGER_SHA: ${{ github.sha }}
          ORIGINAL_HEAD_SHA: 16c138bb59d8a596a75284e872951f7eef8938da
          BRANCH: feat/875-professional-context-routes
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          git reset --hard "${ORIGINAL_HEAD_SHA}"
          git config user.name "OpenAI Orchestrator"
          git config user.email "orchestrator@openai.invalid"
          git merge --no-edit origin/develop
          git push --force-with-lease=refs/heads/${BRANCH}:"${EXPECTED_TRIGGER_SHA}" origin HEAD:refs/heads/${BRANCH}
