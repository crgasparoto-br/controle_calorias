name: Apply issue 793 final

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/795-timezone-backend-reports

permissions:
  contents: write

jobs:
  apply-final:
    if: github.head_ref == 'feat/796-timezone-whatsapp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/796-timezone-whatsapp
          fetch-depth: 1
          show-progress: false

      - name: Apply verified final patch
        shell: bash
        run: bash .github/apply-issue-793-final.sh

      - name: Upload reconstructed payload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-793-final-payload-diagnostics
          path: |
            /tmp/issue793.patch.xz
            /tmp/issue793.patch
            /tmp/issue793.sha256
          if-no-files-found: warn
          retention-days: 1
