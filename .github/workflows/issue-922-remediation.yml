name: Issue 922 audit remediation

on:
  push:
    branches:
      - feat/922-ai-capabilities-meal-whatsapp
    paths:
      - .github/workflows/issue-922-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: feat/922-ai-capabilities-meal-whatsapp
          fetch-depth: 0

      - name: Apply and publish audited remediation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"replacement mismatch in {path}: {old[:100]!r}")
              file_path.write_text(text.replace(old, new))

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              file_path = Path(path)
              text = file_path.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"regex mismatch in {path}: {pattern[:100]!r}")
              file_path.write_text(updated)

          replace_once(
              "server/modules/whatsapp/intentInterpreter.ts",
              "const MAX_LLM_RETRIES = 2;",
              "const DEFAULT_LLM_TIMEOUT_MS = 8_000;\nconst DEFAULT_LLM_MAX_ATTEMPTS = 2;\nconst MAX_LLM_RETRIES = 2;",
          )

          sub_once(
              "server/modules/whatsapp/intentInterpreter.ts",
              r'''  const hasNewModel = Boolean\(process\.env\.AI_WHATSAPP_INTENT_MODEL\?\.trim\(\)\);.*?  const legacyTimeout =''',
              '''  const hasNewModel = Boolean(process.env.AI_WHATSAPP_INTENT_MODEL?.trim());
          const legacyOpenAiModelEnv = process.env.OPENAI_WHATSAPP_INTENT_MODEL?.trim()
            ? "OPENAI_WHATSAPP_INTENT_MODEL"
            : process.env.OPENAI_TEXT_MODEL?.trim()
              ? "OPENAI_TEXT_MODEL"
              : null;
          const legacyOpenAiModel = legacyOpenAiModelEnv
            ? process.env[legacyOpenAiModelEnv]?.trim()
            : null;
          const usesOpenAiWire = config.primary.provider === "openai" || config.primary.provider === "openai-compatible";
          if (!hasNewModel && usesOpenAiWire && legacyOpenAiModel && legacyOpenAiModelEnv) {
            model = legacyOpenAiModel;
            usedLegacyVariables = true;
            diagnostics.push(
              `[deprecated] capability=WHATSAPP_INTENT resolved model via legacy variable ${legacyOpenAiModelEnv}; migrate to AI_WHATSAPP_INTENT_MODEL`,
            );
          }

          const hasNewTimeout = Boolean(process.env.AI_WHATSAPP_INTENT_TIMEOUT_MS?.trim());
          const legacyTimeout =''',
          )

          sub_once(
              "server/modules/whatsapp/intentInterpreter.ts",
              r'''  const legacyTimeout = !process\.env\.AI_WHATSAPP_INTENT_TIMEOUT_MS\?\.trim\(\)\n    \? readPositiveIntegerEnv\("OPENAI_WHATSAPP_INTENT_TIMEOUT_MS"\)\n    : null;\n  const timeoutMs = legacyTimeout \?\? config\.timeoutMs;''',
              '''  const legacyTimeout = !hasNewTimeout
            ? readPositiveIntegerEnv("OPENAI_WHATSAPP_INTENT_TIMEOUT_MS")
            : null;
          const timeoutMs = hasNewTimeout
            ? config.timeoutMs
            : legacyTimeout ?? DEFAULT_LLM_TIMEOUT_MS;''',
          )

          sub_once(
              "server/modules/whatsapp/intentInterpreter.ts",
              r'''  const legacyRetriesRaw = Number\(process\.env\.OPENAI_WHATSAPP_INTENT_RETRIES\);\n  const hasLegacyRetries = !process\.env\.AI_WHATSAPP_INTENT_MAX_ATTEMPTS\?\.trim\(\)\n    && Number\.isFinite\(legacyRetriesRaw\)\n    && legacyRetriesRaw >= 0;\n  const maxAttempts = hasLegacyRetries\n    \? Math\.min\(Math\.floor\(legacyRetriesRaw\), MAX_LLM_RETRIES\) \+ 1\n    : config\.maxAttempts;''',
              '''  const hasNewMaxAttempts = Boolean(process.env.AI_WHATSAPP_INTENT_MAX_ATTEMPTS?.trim());
          const legacyRetriesRaw = Number(process.env.OPENAI_WHATSAPP_INTENT_RETRIES);
          const hasLegacyRetries = !hasNewMaxAttempts
            && Number.isFinite(legacyRetriesRaw)
            && legacyRetriesRaw >= 0;
          const maxAttempts = hasNewMaxAttempts
            ? config.maxAttempts
            : hasLegacyRetries
              ? Math.min(Math.floor(legacyRetriesRaw), MAX_LLM_RETRIES) + 1
              : DEFAULT_LLM_MAX_ATTEMPTS;''',
          )

          replace_once(
              "server/modules/whatsapp/intentInterpreter.test.ts",
              '''    delete process.env.OPENAI_WHATSAPP_INTENT_ENABLED;
              process.env.OPENAI_WHATSAPP_INTENT_RETRIES = "1";
              process.env.OPENAI_WHATSAPP_INTENT_MODEL = "gpt-4.1-mini";
              ''',
              '''    delete process.env.OPENAI_WHATSAPP_INTENT_ENABLED;
              delete process.env.OPENAI_TEXT_MODEL;
              delete process.env.OPENAI_WHATSAPP_INTENT_TIMEOUT_MS;
              process.env.OPENAI_WHATSAPP_INTENT_RETRIES = "1";
              process.env.OPENAI_WHATSAPP_INTENT_MODEL = "gpt-4.1-mini";
              ''',
          )

          replace_once(
              "server/modules/whatsapp/intentInterpreter.test.ts",
              '''  it("cai para deterministico quando o LLM retorna JSON invalido", async () => {
              ''',
              '''  it("preserva timeout e tentativas do baseline quando nao ha overrides", async () => {
                delete process.env.OPENAI_WHATSAPP_INTENT_TIMEOUT_MS;
                delete process.env.OPENAI_WHATSAPP_INTENT_RETRIES;
                delete process.env.AI_WHATSAPP_INTENT_TIMEOUT_MS;
                delete process.env.AI_WHATSAPP_INTENT_MAX_ATTEMPTS;
                const setTimeoutSpy = vi.spyOn(globalThis, "setTimeout");
                createTextResponseMock.mockRejectedValue(
                  Object.assign(new Error("provider unavailable"), { code: "ECONNRESET" }),
                );

                try {
                  const result = await interpretWhatsappMessageWithDiagnostics("registro", context);
                  expect(createTextResponseMock).toHaveBeenCalledTimes(2);
                  expect(setTimeoutSpy).toHaveBeenCalledWith(expect.any(Function), 8_000);
                  expect(result.source).toBe("deterministic");
                  expect(result.errorCode).toBe("network");
                  expect(result.operationalTrace.estimatedCostUnits).toBe(2);
                } finally {
                  setTimeoutSpy.mockRestore();
                }
              });

              it("preserva OPENAI_TEXT_MODEL como fallback legado para providers OpenAI", async () => {
                delete process.env.OPENAI_WHATSAPP_INTENT_MODEL;
                process.env.OPENAI_TEXT_MODEL = "gpt-text-legacy";
                createTextResponseMock.mockResolvedValueOnce({ outputText: llmIntentJson() });

                const result = await interpretWhatsappMessageWithDiagnostics("registro", context);
                expect(result.source).toBe("llm");
                expect(resolvedProviderIds).toEqual(["openai"]);
                expect(createTextResponseMock.mock.calls[0][0].model).toBe("gpt-text-legacy");
                expect(result.operationalTrace.modelName).toBe("gpt-text-legacy");
              });

              it("cai para deterministico quando o LLM retorna JSON invalido", async () => {
              ''',
          )

          replace_once(
              ".env.example",
              '''# Compatibilidade legada de intenção, somente para provider OpenAI/OpenAI-compatible:
          # OPENAI_WHATSAPP_INTENT_MODEL=gpt-4.1-mini
          # OPENAI_WHATSAPP_INTENT_TIMEOUT_MS=30000
          # OPENAI_WHATSAPP_INTENT_RETRIES=0
          ''',
              '''# Compatibilidade legada de intenção, somente para provider OpenAI/OpenAI-compatible.
          # Precedência de modelo: OPENAI_WHATSAPP_INTENT_MODEL > OPENAI_TEXT_MODEL >
          # modelo legado/default resolvido para o provider. Sem overrides de timeout ou
          # tentativas, preserva o baseline de 8000 ms e 1 retry (2 chamadas primárias).
          # OPENAI_WHATSAPP_INTENT_MODEL=gpt-4.1-mini
          # OPENAI_TEXT_MODEL=gpt-4.1-mini
          # OPENAI_WHATSAPP_INTENT_TIMEOUT_MS=8000
          # OPENAI_WHATSAPP_INTENT_RETRIES=1
          ''',
          )

          replace_once(
              "docs/design-docs/whatsapp-llm-intents.md",
              '''- `OPENAI_WHATSAPP_INTENT_MODEL`, `_TIMEOUT_MS`, `_RETRIES` e `_ENABLED` permanecem temporariamente compatíveis. O modelo específico OpenAI só pode substituir o primário quando o provider resolvido é `openai` ou `openai-compatible`; nunca quando é Gemini.
          ''',
              '''- `OPENAI_WHATSAPP_INTENT_MODEL`, `OPENAI_TEXT_MODEL`, `OPENAI_WHATSAPP_INTENT_TIMEOUT_MS`, `OPENAI_WHATSAPP_INTENT_RETRIES` e `_ENABLED` permanecem temporariamente compatíveis. Para providers `openai`/`openai-compatible`, a precedência legada de modelo é `OPENAI_WHATSAPP_INTENT_MODEL` > `OPENAI_TEXT_MODEL` > modelo resolvido; essas variáveis nunca substituem o modelo Gemini.
          - Sem variáveis novas ou legadas de timeout/tentativas, a capacidade preserva o baseline anterior à migração: timeout de 8 segundos e 1 retry, totalizando no máximo 2 chamadas primárias.
          ''',
          )

          state_path = Path(".audit/issue-loop-engineer/loop-state.json")
          state = json.loads(state_path.read_text())
          state["cycle"] = 5
          state["state"] = "internally-verified"
          state["blocking_findings"] = [
              "AUD-922-001: live provider smoke remains unavailable because no OpenAI or Gemini credential is configured in GitHub Actions"
          ]
          state.setdefault("regression_ledger", []).append({
              "cycle": 5,
              "finding": "WHATSAPP_INTENT lost the legacy 8-second timeout, one retry, and OPENAI_TEXT_MODEL precedence",
              "resolution": "restored capability-specific legacy defaults and model precedence with negative regression tests"
          })
          state["implementation_summary"] = (
              "Cycle 5 restored the WHATSAPP_INTENT legacy runtime baseline and OPENAI_TEXT_MODEL precedence, "
              "added negative regression coverage, and aligned canonical documentation. The live-provider smoke "
              "remains the only external limitation."
          )
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-922-remediation.yml
          git add server/modules/whatsapp/intentInterpreter.ts \
            server/modules/whatsapp/intentInterpreter.test.ts \
            .env.example \
            docs/design-docs/whatsapp-llm-intents.md \
            .audit/issue-loop-engineer/loop-state.json
          git commit -m "fix(ai): preserve WhatsApp intent legacy baseline"
          git push origin HEAD:feat/922-ai-capabilities-meal-whatsapp
