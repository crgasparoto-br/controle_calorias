name: Apply 779 final migration

on:
  push:
    branches:
      - fix/779-auditoria-callback-meta
    paths:
      - .github/workflows/apply-779-final.yml

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'apply 779 final migration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/779-auditoria-callback-meta
          fetch-depth: 0

      - name: Apply audited files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/779-concluir-respostas-whatsapp:refs/remotes/origin/feat/779-concluir-respostas-whatsapp
          old_ref=origin/feat/779-concluir-respostas-whatsapp
          files=(
            server/whatsappWebhook.ts
            server/whatsappWebhook.test.ts
            server/whatsappWebhook.reply.test.ts
            server/whatsappWebhook.audioTranscription.test.ts
            server/whatsappWebhook.image.test.ts
            server/whatsappWebhook.image.water.test.ts
            server/whatsappWebhook.mediaIntent.test.ts
            server/whatsappWebhook.smoke.test.ts
            server/whatsappAudioHydrationWebhook.test.ts
            server/whatsappAnnotatedImageWebhook.ts
            server/whatsappAnnotatedImageWebhook.test.ts
            server/modules/whatsapp/userMeasurementReplyContext.ts
            server/modules/whatsapp/userMeasurementReplyContext.test.ts
            server/modules/whatsapp/weightIdempotency.ts
            server/modules/whatsapp/weightIdempotency.test.ts
            server/modules/onboarding/webGreetingService.ts
            server/modules/onboarding/webGreetingService.test.ts
            server/modules/healthIntegrations/strava/exercises.ts
            server/modules/healthIntegrations/strava/exercises.notificationIdempotency.test.ts
            server/modules/healthIntegrations/strava/exercisesWhatsappNotification.test.ts
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "$old_ref:$file" > "$file"
          done

          cat > server/modules/whatsapp/mediaReplyMessages.ts <<'EOF'
          import { buildWhatsAppAuxiliaryReplyMessage } from "./replyMessages";

          export function buildWhatsAppImageNotRecognizedReplyMessage() {
            return buildWhatsAppAuxiliaryReplyMessage({
              title: "⚠️ Não consegui identificar a refeição",
              lines: ["Envie uma foto mais nítida ou descreva os alimentos e as quantidades por mensagem."],
            });
          }

          export function buildWhatsAppImageProcessingFailureReplyMessage() {
            return buildWhatsAppAuxiliaryReplyMessage({
              title: "⚠️ Não foi possível processar a imagem",
              lines: ["Tente enviar a foto novamente. Se o problema continuar, descreva a refeição por mensagem."],
            });
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          annotated = Path('server/whatsappAnnotatedImageWebhook.ts')
          text = annotated.read_text()
          old = '''import {
            buildWhatsAppConsolidatedMealReplyMessage,
            buildWhatsAppImageNotRecognizedReplyMessage,
            buildWhatsAppImageProcessingFailureReplyMessage,
            buildWhatsAppMealReplyMessage,
          } from "./modules/whatsapp/replyMessages";'''
          new = '''import {
            buildWhatsAppConsolidatedMealReplyMessage,
            buildWhatsAppMealReplyMessage,
          } from "./modules/whatsapp/replyMessages";
          import {
            buildWhatsAppImageNotRecognizedReplyMessage,
            buildWhatsAppImageProcessingFailureReplyMessage,
          } from "./modules/whatsapp/mediaReplyMessages";'''
          if old not in text:
              raise SystemExit('annotated import block not found')
          annotated.write_text(text.replace(old, new))

          base = Path('server/whatsappWebhook.ts')
          text = base.read_text()
          old_import = '''import {
            buildWhatsAppConsolidatedMealReplyMessage,
            buildWhatsAppMealReplyMessage,
            buildWhatsAppWaterLoggedReplyMessage,
            buildWhatsAppWaterVolumeNeededReplyMessage,
            buildWhatsAppWeightLoggedReplyMessage,
          } from "./modules/whatsapp/replyMessages";'''
          new_import = '''import {
            buildWhatsAppConsolidatedMealReplyMessage,
            buildWhatsAppMealReplyMessage,
            buildWhatsAppWaterVolumeNeededReplyMessage,
          } from "./modules/whatsapp/replyMessages";
          import {
            buildWhatsAppCanonicalWaterReply as formatCanonicalWaterReply,
            buildWhatsAppCanonicalWeightReply as formatCanonicalWeightReply,
          } from "./modules/whatsapp/domainReplyFormatters";'''
          if old_import not in text:
              raise SystemExit('base reply import block not found')
          text = text.replace(old_import, new_import)
          old_helpers = '''async function buildCanonicalWaterReply(userId: number, amountMl: number, occurredAt: Date) {
            const progress = await getWhatsAppWaterProgress(userId, occurredAt);
            return buildWhatsAppWaterLoggedReplyMessage({
              amountLabel: formatWhatsAppMacro(amountMl),
              occurredAtLabel: formatWhatsAppOccurredAt(occurredAt),
              totalMl: progress.totalMl,
              goalMl: progress.goalMl,
            });
          }

          async function buildCanonicalWeightReply(userId: number, weightKg: number, occurredAt: Date) {
            const { variationKg } = await getWhatsAppWeightVariation(userId, occurredAt, weightKg);
            return buildWhatsAppWeightLoggedReplyMessage({
              weightLabel: formatWhatsAppMacro(weightKg),
              occurredAtLabel: formatWhatsAppOccurredAt(occurredAt),
              variationLabel: variationKg === null
                ? "primeiro registro"
                : `${variationKg > 0 ? "+" : ""}${formatWhatsAppMacro(variationKg)} kg`,
            });
          }'''
          new_helpers = '''async function buildCanonicalWaterReply(userId: number, amountMl: number, occurredAt: Date) {
            const progress = await getWhatsAppWaterProgress(userId, occurredAt);
            return formatCanonicalWaterReply({
              amountMl,
              totalMl: progress.totalMl,
              goalMl: progress.goalMl,
              occurredAtLabel: formatWhatsAppOccurredAt(occurredAt),
              totalLabel: "Total",
            });
          }

          async function buildCanonicalWeightReply(userId: number, weightKg: number, occurredAt: Date) {
            const { variationKg } = await getWhatsAppWeightVariation(userId, occurredAt, weightKg);
            return formatCanonicalWeightReply({
              weightKg,
              variationKg,
              occurredAtLabel: formatWhatsAppOccurredAt(occurredAt),
            });
          }'''
          if old_helpers not in text:
              raise SystemExit('base helper block not found')
          base.write_text(text.replace(old_helpers, new_helpers))

          strava = Path('server/modules/healthIntegrations/strava/exercises.ts')
          text = strava.read_text()
          text = text.replace(
              'import { buildWhatsAppExerciseLoggedReplyMessage } from "../../whatsapp/replyMessages";',
              'import { buildWhatsAppCanonicalExerciseReply } from "../../whatsapp/domainReplyFormatters";'
          ).replace('buildWhatsAppExerciseLoggedReplyMessage({', 'buildWhatsAppCanonicalExerciseReply({')
          strava.write_text(text)

          db = Path('server/db.ts')
          text = db.read_text()
          target = 'async function listUserWeightEntries(userId: number) {'
          if target not in text:
              raise SystemExit('weight list function not found')
          db.write_text(text.replace(target, 'export async function listUserWeightEntries(userId: number) {', 1))
          PY

          rm .github/workflows/apply-779-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(whatsapp): migrar multimídia onboarding e Strava"
          git push origin HEAD:fix/779-auditoria-callback-meta
