name: Export source temporary

on:
  push:
    branches:
      - feat/779-concluir-respostas-whatsapp

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git -czf controle-calorias-source.tgz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: controle-calorias-source
          path: controle-calorias-source.tgz
          retention-days: 1
