name: Apply issue 883 remediation

on:
  pull_request:
    paths:
      - ".github/workflows/branch-source-snapshot.yml"

permissions:
  contents: write

jobs:
  apply-remediation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      PATCH_B64: ""
      ORIGINAL_WORKFLOW_B64: ""
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Confirm exact input head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply audited remediation patch
        run: |
          printf '%s' "${PATCH_B64}" | base64 -d | gzip -d > /tmp/issue-883.patch
          git apply --check /tmp/issue-883.patch
          git apply /tmp/issue-883.patch
          printf '%s' "${ORIGINAL_WORKFLOW_B64}" | base64 -d > .github/workflows/branch-source-snapshot.yml
          git diff --check

      - name: Format touched files
        run: |
          pnpm exec prettier --write             .github/workflows/professional-home-visual.yml             client/src/components/PatientAccessRequestsCard.test.tsx             client/src/components/ProfessionalOperationalAlertsPanel.test.tsx             client/src/components/ProfessionalOperationalAlertsPanel.tsx             client/src/components/ProfessionalProfileSettings.tsx             client/src/components/professional/ProfessionalUi.test.tsx             client/src/components/professional/ProfessionalUi.tsx             client/src/pages/professional/ProfessionalPatientWorkspace.tsx             docs/design-docs/professional-settings-entitlements.md             docs/product-specs/professionals.md             scripts/render-professional-home-visual.sh             server/modules/professionals/entitlementService.ts             shared/professionalEntitlements.ts             visual-tests/professional-home/main.tsx             visual-tests/professional-home/trpcMock.ts
          git diff --check

      - name: Run focused regression tests
        env:
          NODE_ENV: test
        run: |
          pnpm exec vitest run             client/src/components/professional/ProfessionalUi.test.tsx             client/src/components/PatientAccessRequestsCard.test.tsx             client/src/components/ProfessionalOperationalAlertsPanel.test.tsx             --maxWorkers=1 --minWorkers=1

      - name: Validate types and documentation
        run: |
          pnpm check
          pnpm docs:check

      - name: Commit remediation to shared branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             .github/workflows/branch-source-snapshot.yml             .github/workflows/professional-home-visual.yml             client/src/components/PatientAccessRequestsCard.test.tsx             client/src/components/ProfessionalOperationalAlertsPanel.test.tsx             client/src/components/ProfessionalOperationalAlertsPanel.tsx             client/src/components/ProfessionalProfileSettings.tsx             client/src/components/professional/ProfessionalUi.test.tsx             client/src/components/professional/ProfessionalUi.tsx             client/src/pages/professional/ProfessionalPatientWorkspace.tsx             docs/design-docs/professional-settings-entitlements.md             docs/product-specs/professionals.md             scripts/render-professional-home-visual.sh             server/modules/professionals/entitlementService.ts             shared/professionalEntitlements.ts             visual-tests/professional-home/main.tsx             visual-tests/professional-home/trpcMock.ts
          git commit -m "fix: remediate professional UI issue 883"
          git push origin "HEAD:${HEAD_BRANCH}"
