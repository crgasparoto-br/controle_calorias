name: Apply account deletion test contract

on:
  pull_request:
    paths:
      - ".github/workflows/branch-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/869-billing-foundation
          fetch-depth: 0
      - name: Update account deletion expectation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("server/repositories/repositories.persistence.test.ts")
          text = path.read_text()
          import_line = 'import { billingEntitlements } from "../../drizzle/billing-schema";\n'
          if import_line not in text:
              text = text.replace(
                  'import { describe, expect, it, vi } from "vitest";\n',
                  'import { describe, expect, it, vi } from "vitest";\n' + import_line,
                  1,
              )
          expected_line = "      billingEntitlements,\n"
          if expected_line not in text:
              text = text.replace(
                  "      whatsappConnections,\n      foodCatalog,\n",
                  "      whatsappConnections,\n      billingEntitlements,\n      foodCatalog,\n",
                  1,
              )
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/repositories/repositories.persistence.test.ts
          git commit -m "test(account): include billing grants in deletion contract"
          git push origin HEAD:feat/869-billing-foundation
