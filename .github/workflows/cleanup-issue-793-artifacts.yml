name: Cleanup issue 793 application artifacts

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'feat/793-centralizar-timezone' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/793-centralizar-timezone
          fetch-depth: 0

      - name: Remove temporary application artifacts
        run: |
          rm -f .github/issue-793-audit-fix*
          rm -f .github/issue-793-router-test-migration.py
          rm -f .github/workflows/apply-issue-793-audit-fix.yml
          rm -f .github/workflows/cleanup-issue-793-artifacts.yml

      - name: Commit clean tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove issue 793 application artifacts"
          git push origin HEAD:feat/793-centralizar-timezone
