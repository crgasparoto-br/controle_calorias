name: Apply issue 795 backend

on:
  pull_request:
    branches:
      - feat/793-centralizar-timezone

permissions:
  contents: write

jobs:
  apply-backend:
    if: github.head_ref == 'feat/795-timezone-backend-reports'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/795-timezone-backend-reports
          fetch-depth: 0

      - name: Apply reviewed backend change
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/issue-795-backend.patch.gz.b64 | gzip -dc > /tmp/issue795.patch
          git apply --index /tmp/issue795.patch
          rm -f .github/issue-795-backend.patch.gz.b64
          rm -f .github/workflows/apply-issue-795-backend.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(timezone): apply owner timezone to backend and reports (#795)'
          git push origin HEAD:feat/795-timezone-backend-reports
