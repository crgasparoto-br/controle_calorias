name: Issue 815 materialize final test correction

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/issue-815-final-correction.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/815-retire-professional-legacy
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Correct order-dependent assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('scripts/test-professional-persistence-tidb.ts')
          text = path.read_text()
          pattern = re.compile(
              r'    assert\.equal\(\n'
              r'      \(await contentSecondInstance\.listGoalSuggestionsByPatient\(8062\)\)\[0\]\?\.id,\n'
              r'      legacyGoal\.id\n'
              r'    \);'
          )
          replacement = textwrap.dedent('''
              assert.equal(
                (
                  await contentSecondInstance.listGoalSuggestionsByPatient(8062)
                ).some(item => item.id === legacyGoal.id),
                true,
                "explicit legacy backfill must preserve the migrated goal regardless of canonical result ordering"
              );
          ''').strip()
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'order-dependent assertion match count={count}')
          path.write_text(text)
          PY
      - name: Remove temporary artifacts
        run: |
          rm -f .github/workflows/issue-815-final-correction.yml
          rm -f scripts/issue-815-final-tidb-diagnostic.txt
      - name: Format and commit
        run: |
          pnpm exec prettier --write scripts/test-professional-persistence-tidb.ts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(professional): remover dependência de ordenação #815"
          git push origin HEAD:cleanup/815-retire-professional-legacy
