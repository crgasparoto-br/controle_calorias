name: Issue 815 final correction and validation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/issue-815-final-correction.yml

permissions:
  contents: write

jobs:
  correct-validate-commit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/815-retire-professional-legacy
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Correct order-dependent assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/test-professional-persistence-tidb.ts')
          text = path.read_text()
          old = '''    assert.equal(
              (await contentSecondInstance.listGoalSuggestionsByPatient(8062))[0]?.id,
              legacyGoal.id
            );'''
          new = '''    assert.equal(
              (
                await contentSecondInstance.listGoalSuggestionsByPatient(8062)
              ).some(item => item.id === legacyGoal.id),
              true,
              "explicit legacy backfill must preserve the migrated goal regardless of canonical result ordering"
            );'''
          if old not in text:
              raise SystemExit('order-dependent assertion anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary artifacts
        run: |
          rm -f .github/workflows/issue-815-final-correction.yml
          rm -f scripts/issue-815-final-tidb-diagnostic.txt
      - name: Format and validate repository
        run: |
          pnpm exec prettier --write scripts/test-professional-persistence-tidb.ts
          git diff --check
          pnpm agent:check
          pnpm build
      - name: Start TiDB
        run: |
          docker run -d --name issue-815-final-correction -p 4000:4000 pingcap/tidb:v8.5.1
          for attempt in $(seq 1 90); do
            if node --input-type=module -e 'import mysql from "mysql2/promise"; const connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" }); await connection.query("CREATE DATABASE IF NOT EXISTS controle_calorias"); await connection.end();'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Validate professional persistence
        run: |
          pnpm exec drizzle-kit push --force
          pnpm exec drizzle-kit generate || true
          git checkout -- drizzle
          pnpm db:test:professionals
          pnpm db:migrate:professionals
          pnpm db:migrate:professionals
          pnpm db:check-integrity
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(professional): remover dependência de ordenação #815"
          git push origin HEAD:cleanup/815-retire-professional-legacy
