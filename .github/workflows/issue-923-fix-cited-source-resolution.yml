name: Issue 923 fix cited source resolution

on:
  push:
    branches:
      - feat/923-ai-capabilities-question-nutrition-embedding

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/923-ai-capabilities-question-nutrition-embedding
          fetch-depth: 0
      - name: Resolve claims through the actually cited URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('server/catalogSemanticSearch.ts')
          source = source_path.read_text()
          old = '''function findVerifiedNutritionSource(
            requestedSourceUrl: unknown,
            evidence: string,
            result: Partial<SearchedNutritionResult>,
            webSearch: AiWebSearchResult | undefined,
          ): string | null {
            if (webSearch?.executed !== true || !webSearch.sources.length) return null;
            if (!numericClaimsSupportResult(evidence, result)) return null;
            const normalizedRequested = normalizeHttpUrl(requestedSourceUrl);

            const candidates = normalizedRequested
              ? webSearch.sources.filter(source => normalizeHttpUrl(source.url) === normalizedRequested)
              : webSearch.sources;

            for (const source of candidates) {
              if (!normalizeHttpUrl(source.url)) continue;
              if (source.supportingText?.some(text => (
                sourceSupportsEvidence(text, evidence)
                && numericClaimsSupportResult(text, result)
              ))) {
                return source.url.trim();
              }
            }
            return null;
          }'''
          new = '''function findVerifiedNutritionSource(
            requestedSourceUrl: unknown,
            evidence: string,
            result: Partial<SearchedNutritionResult>,
            webSearch: AiWebSearchResult | undefined,
          ): string | null {
            if (webSearch?.executed !== true || !webSearch.sources.length) return null;

            const evidenceHasNutritionClaim = (
              extractUnitValues(evidence, "kcal|calorias?").length > 0
              || ["prote[ií]na|protein", "carboidratos?|carbs?", "gorduras?(?:\\\\s+totais?)?|fat"]
                .some(label => extractLabelledGramValues(evidence, label).length > 0)
            );
            const evidenceMatchesResult = numericClaimsSupportResult(evidence, result);
            if (evidenceHasNutritionClaim && !evidenceMatchesResult) return null;

            const sourcesByUrl = new Map<string, { url: string; supportingText: string[] }>();
            for (const source of webSearch.sources) {
              const normalized = normalizeHttpUrl(source.url);
              if (normalized && !sourcesByUrl.has(normalized)) {
                sourcesByUrl.set(normalized, { url: source.url.trim(), supportingText: [] });
              }
            }

            for (const source of webSearch.sources) {
              const ownUrl = normalizeHttpUrl(source.url);
              for (const text of source.supportingText ?? []) {
                const linkedUrls = [...text.matchAll(/https?:\\/\\/[^\\s)\\]]+/giu)]
                  .map(match => normalizeHttpUrl(match[0]))
                  .filter((url): url is string => Boolean(url && sourcesByUrl.has(url)));
                const targets = linkedUrls.length > 0
                  ? [...new Set(linkedUrls)]
                  : ownUrl && sourcesByUrl.has(ownUrl)
                    ? [ownUrl]
                    : [];
                for (const target of targets) {
                  sourcesByUrl.get(target)?.supportingText.push(text);
                }
              }
            }

            const normalizedRequested = normalizeHttpUrl(requestedSourceUrl);
            const orderedSources = [
              ...(normalizedRequested && sourcesByUrl.has(normalizedRequested) ? [normalizedRequested] : []),
              ...[...sourcesByUrl.keys()].filter(url => url !== normalizedRequested),
            ];

            for (const sourceUrl of orderedSources) {
              const source = sourcesByUrl.get(sourceUrl);
              if (!source) continue;
              if (source.supportingText.some(text => (
                numericClaimsSupportResult(text, result)
                && (!evidenceMatchesResult || sourceSupportsEvidence(text, evidence))
              ))) {
                return source.url;
              }
            }
            return null;
          }'''
          if source.count(old) != 1:
              raise SystemExit('verified source function not found exactly once')
          source_path.write_text(source.replace(old, new))

          test_path = Path('server/catalogSemanticSearch.test.ts')
          test = test_path.read_text()
          marker = '''  it("returns null (without fabricating data) when confidence is below the threshold", async () => {'''
          case = '''  it("usa a URL realmente citada quando o JSON fornece uma URL não comprovada", async () => {
              resolveCapabilityConfigMock.mockReturnValue(READY_POLICY);
              createTextResponseMock.mockResolvedValue({});
              mockExecuteWithOutput(JSON.stringify({
                found: true,
                matchedProductName: "Chocolate KitKat ao leite 41,5g",
                brandName: "Nestlé",
                servingLabel: "1 unidade (41,5g)",
                gramsPerServing: 41.5,
                calories: 220,
                protein: 3.3,
                carbs: 24,
                fat: 12,
                confidence: 0.95,
                sourceUrl: "https://url-nao-citada.example/produto",
                evidence: "Informação nutricional disponível no site oficial da Nestlé.",
              }), {
                executed: true,
                sources: [
                  {
                    url: "https://www.nestle.com.br/marcas/chocolates/kitkat?utm_source=openai",
                    supportingText: ["([nestle.com.br](https://www.nestle.com.br/marcas/chocolates/kitkat?utm_source=openai))"],
                  },
                  {
                    url: "https://www.nestle.com.br/media/pressreleases/exemplo?utm_source=openai",
                    supportingText: [
                      "De acordo com a fonte, uma unidade de 41,5 g contém 220 kcal, proteínas 3,3 g, carboidratos 24 g e gorduras totais 12 g. ([nestle.com.br](https://www.nestle.com.br/marcas/chocolates/kitkat?utm_source=openai))",
                    ],
                  },
                ],
              });

              const result = await findPackagedSnackByWebSearch("kit kat ao leite 41,5g", "chocolate");

              expect(result).not.toBeNull();
              expect(result?.aliases).toContain(
                "fonte: https://www.nestle.com.br/marcas/chocolates/kitkat?utm_source=openai",
              );
              expect(result?.aliases).not.toContain("fonte: https://url-nao-citada.example/produto");
            });

          '''
          if case not in test:
              if test.count(marker) != 1:
                  raise SystemExit('test insertion marker not found exactly once')
              test_path.write_text(test.replace(marker, case + marker))
          PY
          rm -f .github/workflows/issue-923-fix-cited-source-resolution.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): resolver evidência pela URL efetivamente citada"
          git push origin HEAD:feat/923-ai-capabilities-question-nutrition-embedding
