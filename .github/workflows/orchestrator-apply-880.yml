name: Apply orchestrated issue 880 fix

on:
  push:
    branches:
      - feat/875-professional-context-routes

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Apply audited patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/issue-880.patch
          git apply --check /tmp/issue-880.patch
          git apply /tmp/issue-880.patch
          rm .github/workflows/orchestrator-apply-880.yml
          git config user.name 'solverit-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve professional workspace across entitlements'
          git push origin HEAD:feat/875-professional-context-routes
