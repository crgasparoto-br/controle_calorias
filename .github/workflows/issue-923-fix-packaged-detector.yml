name: Issue 923 fix packaged detector

on:
  push:
    branches:
      - feat/923-ai-capabilities-question-nutrition-embedding

permissions:
  contents: write

concurrency:
  group: issue-923-fix-packaged-detector
  cancel-in-progress: true

jobs:
  fix-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/923-ai-capabilities-question-nutrition-embedding
          fetch-depth: 0
      - name: Fix detector and clean diagnostics
        env:
          TARGET_BRANCH: feat/923-ai-capabilities-question-nutrition-embedding
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'server/catalogSemanticSearch.ts';
          const before = [
            'function hasAnyTerm(normalizedText: string, terms: string[]) {',
            '  return terms.some(term => new RegExp(`\\b${term}\\b`, "i").test(normalizedText));',
            '}',
          ].join('\n');
          const after = [
            'function hasAnyTerm(normalizedText: string, terms: string[]) {',
            '  const padded = ` ${normalizedText} `;',
            '  return terms.some(term => padded.includes(` ${term} `));',
            '}',
          ].join('\n');
          const content = fs.readFileSync(path, 'utf8');
          const count = content.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected one packaged-term detector, found ${count}`);
          fs.writeFileSync(path, content.replace(before, after));
          NODE
          git rm .github/workflows/issue-923-fix-packaged-detector.yml
          git rm .automation/issue923-packaged-detector-trigger
          git rm .automation/issue923-focused-diagnostic-result.txt
          git add server/catalogSemanticSearch.ts
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(nutrition): detect packaged product terms reliably"
          git push origin "HEAD:${TARGET_BRANCH}"
