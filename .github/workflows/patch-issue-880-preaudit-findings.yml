name: Patch issue 880 pre-audit findings

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/875-professional-context-routes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Apply issue 880 pre-audit corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if source.count(old) != 1:
                  raise SystemExit(f"expected one {label}, found {source.count(old)}")
              return source.replace(old, new, 1)

          workspace = Path("client/src/pages/professional/ProfessionalPatientWorkspace.tsx")
          source = workspace.read_text(encoding="utf-8")

          sections_anchor = '''const sections: Array<{
            section: ProfessionalPatientSection;
            label: string;
            icon: React.ComponentType<{ className?: string }>;
          }> = [
            { section: "record", label: "Resumo", icon: ClipboardList },
            { section: "assessment", label: "Avaliação", icon: FileText },
            { section: "goals", label: "Metas", icon: Target },
            { section: "guidance", label: "Orientações", icon: Send },
            { section: "notes", label: "Anotações", icon: StickyNote },
            { section: "reports", label: "Relatórios", icon: Scale },
            { section: "messages", label: "Mensagens", icon: MessageSquareText },
            { section: "history", label: "Histórico", icon: History },
          ];
          '''
          history_helpers = sections_anchor + '''
          const historyEventLabels: Record<string, string> = {
            access_requested: "Acesso profissional solicitado",
            access_approved: "Acesso profissional aprovado",
            access_rejected: "Acesso profissional recusado",
            access_revoked: "Acesso profissional revogado",
            access_authorization_whatsapp_sent: "Autorização enviada pelo WhatsApp",
            access_authorization_whatsapp_failed: "Falha ao enviar autorização pelo WhatsApp",
            tracking_started: "Acompanhamento iniciado",
            tracking_resumed: "Acompanhamento retomado",
            tracking_paused: "Acompanhamento pausado",
            tracking_ended: "Acompanhamento encerrado",
            tracking_status_changed: "Situação do acompanhamento alterada",
            assessment_version_created: "Nova versão da avaliação registrada",
            private_note_created: "Anotação privada registrada",
            guidance_created: "Orientação ao paciente registrada",
            official_goal_activated: "Meta oficial ativada",
            official_goal_notification_sent: "Notificação da meta enviada",
            official_goal_notification_failed: "Falha na notificação da meta",
            professional_message_created: "Mensagem profissional registrada",
            professional_message_sent: "Mensagem profissional enviada",
            professional_message_failed: "Falha no envio da mensagem profissional",
            professional_message_received: "Mensagem do paciente recebida",
          };

          function historyEventLabel(item: { label?: string | null; eventType?: string | null }) {
            if (item.label?.trim()) return item.label;
            if (item.eventType && historyEventLabels[item.eventType]) {
              return historyEventLabels[item.eventType];
            }
            return "Evento profissional registrado";
          }
          '''
          source = replace_once(source, sections_anchor, history_helpers, "sections anchor")

          assessment_meta = '''                  <p className="mt-2 text-xs">{formatDate(item.assessedAt)}</p>'''
          assessment_meta_new = '''                  <p className="mt-2 text-xs text-muted-foreground">
                    {item.authorName ?? "Autoria não informada"} · {formatDate(item.assessedAt)}
                  </p>'''
          source = replace_once(source, assessment_meta, assessment_meta_new, "assessment metadata")

          note_meta = '''                  <p className="mt-2 text-xs text-muted-foreground">
                    {formatDate(item.createdAt)}
                  </p>'''
          note_meta_new = '''                  <p className="mt-2 text-xs text-muted-foreground">
                    {item.authorName ?? "Autoria não informada"} · {formatDate(item.createdAt)}
                  </p>'''
          source = replace_once(source, note_meta, note_meta_new, "note metadata")

          raw_history = '''                  {item.label ?? item.eventType}'''
          safe_history = '''                  {historyEventLabel(item)}'''
          source = replace_once(source, raw_history, safe_history, "history label")

          query_block = '''  const record = trpc.professionalRecord.get.useQuery(
            { patientId, page, pageSize: 20 },
            {
              enabled: patientId > 0,
              retry: false,
              refetchOnWindowFocus: true,
              refetchInterval: 10_000,
            }
          );'''
          query_block_new = '''  const requiresProfessionalRecord =
            section !== "reports" && section !== "messages";
          const record = trpc.professionalRecord.get.useQuery(
            { patientId, page, pageSize: 20 },
            {
              enabled: patientId > 0 && requiresProfessionalRecord,
              retry: false,
              refetchOnWindowFocus: true,
              refetchInterval: requiresProfessionalRecord ? 10_000 : false,
            }
          );'''
          source = replace_once(source, query_block, query_block_new, "record query block")

          loading_guard = '''  if (record.isLoading) {'''
          source = replace_once(
              source,
              loading_guard,
              '''  if (requiresProfessionalRecord && record.isLoading) {''',
              "record loading guard",
          )
          error_guard = '''  if (record.isError || !record.data) {'''
          source = replace_once(
              source,
              error_guard,
              '''  if (requiresProfessionalRecord && (record.isError || !record.data)) {''',
              "record error guard",
          )

          state_block = '''  const trackingStatus = record.data.patient.trackingStatus ?? "not_started";
            const active = trackingStatus === "active";
            const latest = record.data.latestAssessment;
            const transition = (nextStatus: "active" | "paused" | "ended") =>
              transitionTracking.mutate({
                accessId: record.data.patient.authorizationId,
                status: nextStatus,
                reason: transitionReason || undefined,
              });'''
          state_block_new = '''  const professionalRecord = record.data;
            const trackingStatus =
              professionalRecord?.patient.trackingStatus ??
              selectedPatient.trackingStatus ??
              "not_started";
            const active = trackingStatus === "active";
            const latest = professionalRecord?.latestAssessment ?? null;
            const transition = (nextStatus: "active" | "paused" | "ended") => {
              if (!professionalRecord) return;
              transitionTracking.mutate({
                accessId: professionalRecord.patient.authorizationId,
                status: nextStatus,
                reason: transitionReason || undefined,
              });
            };'''
          source = replace_once(source, state_block, state_block_new, "record state block")

          if source.count('record={record.data}') != 4:
              raise SystemExit(f"expected four record props, found {source.count('record={record.data}')}")
          source = source.replace('record={record.data}', 'record={professionalRecord}', 4)
          source = replace_once(
              source,
              'lastActivityAt={getLatestPatientActivityAt(record.data)}',
              'lastActivityAt={getLatestPatientActivityAt(professionalRecord ?? {})}',
              "patient activity header",
          )
          source = replace_once(
              source,
              'accessId: record.data.patient.authorizationId,',
              'accessId: professionalRecord!.patient.authorizationId,',
              "tracking access id",
          ) if 'accessId: record.data.patient.authorizationId,' in source else source

          workspace.write_text(source, encoding="utf-8")

          service = Path("server/modules/professionals/recordService.ts")
          source = service.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '''    scope.db.execute(sql`
                SELECT * FROM professionalAssessments
                WHERE authorizationId = ${scope.authorizationId}
                ORDER BY version DESC LIMIT 1`),''',
              '''    scope.db.execute(sql`
                SELECT a.*, p.displayName AS authorName
                FROM professionalAssessments a
                LEFT JOIN professionalProfiles p ON p.userId = a.professionalUserId
                WHERE a.authorizationId = ${scope.authorizationId}
                ORDER BY a.version DESC LIMIT 1`),''',
              "latest assessment query",
          )
          source = replace_once(
              source,
              '''    scope.db.execute(sql`
                SELECT id, version, objective, assessedAt, nextReviewAt, createdAt
                FROM professionalAssessments
                WHERE authorizationId = ${scope.authorizationId}
                ORDER BY version DESC LIMIT ${input.pageSize} OFFSET ${offset}`),''',
              '''    scope.db.execute(sql`
                SELECT a.id, a.version, a.objective, a.assessedAt, a.nextReviewAt,
                  a.createdAt, p.displayName AS authorName
                FROM professionalAssessments a
                LEFT JOIN professionalProfiles p ON p.userId = a.professionalUserId
                WHERE a.authorizationId = ${scope.authorizationId}
                ORDER BY a.version DESC LIMIT ${input.pageSize} OFFSET ${offset}`),''',
              "assessment history query",
          )
          source = replace_once(
              source,
              '''    scope.db.execute(sql`
                SELECT id, content, createdAt, updatedAt FROM professionalNotes
                WHERE authorizationId = ${scope.authorizationId}
                ORDER BY createdAt DESC, id DESC LIMIT ${input.pageSize} OFFSET ${offset}`),''',
              '''    scope.db.execute(sql`
                SELECT n.id, n.content, n.createdAt, n.updatedAt,
                  p.displayName AS authorName
                FROM professionalNotes n
                LEFT JOIN professionalProfiles p ON p.userId = n.professionalUserId
                WHERE n.authorizationId = ${scope.authorizationId}
                ORDER BY n.createdAt DESC, n.id DESC
                LIMIT ${input.pageSize} OFFSET ${offset}`),''',
              "notes query",
          )
          source = replace_once(
              source,
              '''          createdAt: timestamp(latest.createdAt),
                }''',
              '''          createdAt: timestamp(latest.createdAt),
                  authorName: String(latest.authorName ?? "Profissional"),
                }''',
              "latest assessment mapping",
          )
          source = replace_once(
              source,
              '''    assessmentHistory: rows(assessmentHistoryResult).map(row => ({
                id: String(row.id), version: Number(row.version), objective: String(row.objective ?? ""),
                assessedAt: timestamp(row.assessedAt), nextReviewAt: timestamp(row.nextReviewAt), createdAt: timestamp(row.createdAt),
              })),
              notes: rows(notesResult).map(row => ({
                id: String(row.id), content: String(row.content ?? ""), createdAt: timestamp(row.createdAt), updatedAt: timestamp(row.updatedAt),
              })),''',
              '''    assessmentHistory: rows(assessmentHistoryResult).map(row => ({
                id: String(row.id), version: Number(row.version), objective: String(row.objective ?? ""),
                assessedAt: timestamp(row.assessedAt), nextReviewAt: timestamp(row.nextReviewAt), createdAt: timestamp(row.createdAt),
                authorName: String(row.authorName ?? "Profissional"),
              })),
              notes: rows(notesResult).map(row => ({
                id: String(row.id), content: String(row.content ?? ""), createdAt: timestamp(row.createdAt), updatedAt: timestamp(row.updatedAt),
                authorName: String(row.authorName ?? "Profissional"),
              })),''',
              "authorship mappings",
          )
          service.write_text(source, encoding="utf-8")

          visual_script = Path("scripts/render-professional-patient-workspace-visual.sh")
          source = visual_script.read_text(encoding="utf-8")
          source = replace_once(
              source,
              '''  "Anotações anteriores" \\
            "Paciente relatou boa adesão"''',
              '''  "Anotações anteriores" \\
            "Paciente relatou boa adesão" \\
            "Nutricionista de validação"''',
              "notes visual assertion",
          )
          visual_script.write_text(source, encoding="utf-8")

          docs = Path("docs/testing/professional-workspace-routing.md")
          source = docs.read_text(encoding="utf-8")
          docs_anchor = '''17. Conferir estados de loading, vazio, erro recuperável e acesso indisponível em cada superfície principal.
          '''
          docs_new = docs_anchor + '''18. Abrir relatório individual somente com `professional_reports` e conversa individual somente com `professional_messages`; nenhuma consulta `professionalRecord.get` pode ser disparada como dependência indireta.
          19. Conferir autoria e data nas versões de avaliação, orientações e anotações privadas.
          20. Conferir que a linha do tempo apresenta rótulos de domínio legíveis e nunca expõe o identificador técnico cru de um evento desconhecido.
          '''
          source = replace_once(source, docs_anchor, docs_new, "manual regression tail")
          docs.write_text(source, encoding="utf-8")

          test = Path("client/src/pages/professional/ProfessionalPatientWorkspace.access.test.tsx")
          test.write_text(r'''// @vitest-environment jsdom
          import React from "react";
          import { cleanup, render, screen } from "@testing-library/react";
          import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";

          let location = "/professional/patients/41/reports";
          let recordData: any = undefined;
          const setLocation = vi.fn();
          const getQuery = vi.fn();
          const invalidateRecord = vi.fn(async () => undefined);
          const invalidatePortfolio = vi.fn(async () => undefined);

          const mutation = () => ({
            mutate: vi.fn(),
            isPending: false,
            isError: false,
            error: null,
          });

          vi.mock("wouter", () => ({
            useLocation: () => [location, setLocation],
          }));
          vi.mock("@/components/ProfessionalLayout", () => ({
            useProfessionalWorkspace: () => ({
              selectedPatient: {
                patientId: 41,
                displayName: "Paciente autorizado",
                trackingStatus: "active",
              },
            }),
          }));
          vi.mock("@/components/ProfessionalMessagesPanel", () => ({
            default: () => <div>Conversa individual carregada</div>,
          }));
          vi.mock("@/components/ProfessionalReportsWorkspace", () => ({
            default: () => <div>Relatório individual carregado</div>,
          }));
          vi.mock("@/components/ProfessionalOfficialGoalCard", () => ({
            default: () => <div>Metas profissionais</div>,
          }));
          vi.mock("@/components/ProfessionalOperationalAlertsPanel", () => ({
            default: () => <div>Pendências operacionais</div>,
          }));
          vi.mock("@/components/professional/ProfessionalUi", () => ({
            ProfessionalAsyncState: ({ title }: { title: string }) => <div>{title}</div>,
            ProfessionalLoadingState: ({ label }: { label: string }) => <div>{label}</div>,
            ProfessionalPage: ({ children }: { children: React.ReactNode }) => <main>{children}</main>,
            ProfessionalPageHeader: ({ title, actions }: { title: string; actions?: React.ReactNode }) => (
              <header><h1>{title}</h1>{actions}</header>
            ),
            ProfessionalPatientHeader: ({ trackingStatus }: { trackingStatus: string }) => (
              <div>Estado do paciente: {trackingStatus}</div>
            ),
            ProfessionalSplitLayout: ({ children, aside }: { children: React.ReactNode; aside?: React.ReactNode }) => (
              <div>{children}{aside}</div>
            ),
          }));
          vi.mock("@/components/ui/button", () => ({
            Button: ({ children, ...props }: React.ButtonHTMLAttributes<HTMLButtonElement>) => (
              <button {...props}>{children}</button>
            ),
          }));
          vi.mock("@/components/ui/card", () => ({
            Card: ({ children }: { children: React.ReactNode }) => <section>{children}</section>,
            CardContent: ({ children }: { children: React.ReactNode }) => <div>{children}</div>,
            CardDescription: ({ children }: { children: React.ReactNode }) => <p>{children}</p>,
            CardHeader: ({ children }: { children: React.ReactNode }) => <div>{children}</div>,
            CardTitle: ({ children }: { children: React.ReactNode }) => <h2>{children}</h2>,
          }));
          vi.mock("@/components/ui/input", () => ({
            Input: (props: React.InputHTMLAttributes<HTMLInputElement>) => <input {...props} />,
          }));
          vi.mock("@/lib/trpc", () => ({
            trpc: {
              useUtils: () => ({
                professionalRecord: { get: { invalidate: invalidateRecord } },
                nutrition: { professionals: { portfolio: { invalidate: invalidatePortfolio } } },
              }),
              professionalRecord: {
                get: {
                  useQuery: (input: unknown, options: unknown) => {
                    getQuery(input, options);
                    return {
                      data: recordData,
                      isLoading: false,
                      isError: false,
                      error: null,
                      refetch: vi.fn(async () => undefined),
                    };
                  },
                },
                saveAssessment: { useMutation: mutation },
                createNote: { useMutation: mutation },
                createGuidance: { useMutation: mutation },
                transitionTracking: { useMutation: mutation },
              },
            },
          }));

          function recordFixture() {
            return {
              patient: { trackingStatus: "active", authorizationId: "authorization-41" },
              latestAssessment: null,
              assessmentHistory: [
                {
                  id: "assessment-1",
                  version: 1,
                  objective: "Objetivo",
                  assessedAt: Date.UTC(2026, 6, 20, 12),
                  authorName: "Nutricionista Teste",
                },
              ],
              notes: [
                {
                  id: "note-1",
                  content: "Conteúdo privado",
                  createdAt: Date.UTC(2026, 6, 21, 12),
                  authorName: "Nutricionista Teste",
                },
              ],
              guidances: [],
              timeline: [
                {
                  id: "history-1",
                  eventType: "private_note_created",
                  occurredAt: Date.UTC(2026, 6, 21, 12),
                },
                {
                  id: "history-2",
                  eventType: "unknown_internal_event",
                  occurredAt: Date.UTC(2026, 6, 20, 12),
                },
              ],
              pagination: { hasMore: false },
            };
          }

          beforeEach(() => {
            location = "/professional/patients/41/reports";
            recordData = undefined;
            setLocation.mockReset();
            getQuery.mockReset();
          });

          afterEach(cleanup);

          describe("ProfessionalPatientWorkspace access isolation", () => {
            it("does not require the professional record to render an individual report", async () => {
              const { default: ProfessionalPatientWorkspace } = await import(
                "./ProfessionalPatientWorkspace"
              );
              render(<ProfessionalPatientWorkspace />);

              expect(screen.getByText("Relatório individual carregado")).toBeTruthy();
              expect(screen.getByText("Estado do paciente: active")).toBeTruthy();
              expect(getQuery).toHaveBeenCalledWith(
                { patientId: 41, page: 1, pageSize: 20 },
                expect.objectContaining({ enabled: false, refetchInterval: false })
              );
            });

            it("does not require the professional record to render an individual conversation", async () => {
              location = "/professional/patients/41/messages";
              const { default: ProfessionalPatientWorkspace } = await import(
                "./ProfessionalPatientWorkspace"
              );
              render(<ProfessionalPatientWorkspace />);

              expect(screen.getByText("Conversa individual carregada")).toBeTruthy();
              expect(getQuery).toHaveBeenCalledWith(
                { patientId: 41, page: 1, pageSize: 20 },
                expect.objectContaining({ enabled: false, refetchInterval: false })
              );
            });

            it("shows authorship for private notes and assessment versions", async () => {
              recordData = recordFixture();
              location = "/professional/patients/41/notes";
              const { default: ProfessionalPatientWorkspace } = await import(
                "./ProfessionalPatientWorkspace"
              );
              const view = render(<ProfessionalPatientWorkspace />);

              expect(screen.getByText(/Nutricionista Teste ·/)).toBeTruthy();

              location = "/professional/patients/41/assessment";
              view.rerender(<ProfessionalPatientWorkspace />);
              expect(screen.getByText(/Nutricionista Teste ·/)).toBeTruthy();
            });

            it("maps history event identifiers to safe domain labels", async () => {
              recordData = recordFixture();
              location = "/professional/patients/41/history";
              const { default: ProfessionalPatientWorkspace } = await import(
                "./ProfessionalPatientWorkspace"
              );
              render(<ProfessionalPatientWorkspace />);

              expect(screen.getByText("Anotação privada registrada")).toBeTruthy();
              expect(screen.getByText("Evento profissional registrado")).toBeTruthy();
              expect(screen.queryByText("private_note_created")).toBeNull();
              expect(screen.queryByText("unknown_internal_event")).toBeNull();
            });
          });
          '''.replace("          ", ""), encoding="utf-8")

          server_test = Path("server/modules/professionals/recordService.authorship.test.ts")
          server_test.write_text(r'''import { beforeEach, describe, expect, it, vi } from "vitest";

          const mocks = vi.hoisted(() => ({
            execute: vi.fn(),
            getDb: vi.fn(),
          }));

          vi.mock("../../db", () => ({
            getDb: mocks.getDb,
            logPersistenceWarning: vi.fn(),
          }));

          import { getProfessionalRecord } from "./recordService";

          function collectStrings(value: unknown, seen = new WeakSet<object>()): string[] {
            if (typeof value === "string") return [value];
            if (!value || typeof value !== "object") return [];
            if (seen.has(value)) return [];
            seen.add(value);
            if (Array.isArray(value)) {
              return value.flatMap(item => collectStrings(item, seen));
            }
            return Object.values(value as Record<string, unknown>).flatMap(item =>
              collectStrings(item, seen)
            );
          }

          beforeEach(() => {
            mocks.execute.mockReset();
            mocks.getDb.mockReset();
            mocks.getDb.mockResolvedValue({ execute: mocks.execute });
          });

          describe("getProfessionalRecord authorship", () => {
            it("joins and returns the author of assessments, notes and guidances", async () => {
              mocks.execute
                .mockResolvedValueOnce([[{
                  authorizationId: "authorization-1",
                  authorizationStatus: "approved",
                  trackingStatus: "active",
                  patientName: "Paciente",
                  patientEmail: "paciente@example.com",
                }]])
                .mockResolvedValueOnce([[{
                  id: "assessment-latest",
                  version: 2,
                  objective: "Objetivo atual",
                  assessedAt: new Date("2026-07-20T12:00:00Z"),
                  nextReviewAt: null,
                  createdAt: new Date("2026-07-20T12:00:00Z"),
                  authorName: "Nutricionista Autora",
                }]])
                .mockResolvedValueOnce([[{
                  id: "assessment-history",
                  version: 1,
                  objective: "Objetivo anterior",
                  assessedAt: new Date("2026-06-20T12:00:00Z"),
                  nextReviewAt: null,
                  createdAt: new Date("2026-06-20T12:00:00Z"),
                  authorName: "Nutricionista Autora",
                }]])
                .mockResolvedValueOnce([[{
                  id: "note-1",
                  content: "Nota privada",
                  createdAt: new Date("2026-07-21T12:00:00Z"),
                  updatedAt: new Date("2026-07-21T12:00:00Z"),
                  authorName: "Nutricionista Autora",
                }]])
                .mockResolvedValueOnce([[{
                  id: "guidance-1",
                  version: 1,
                  title: "Orientação",
                  content: "Conteúdo",
                  visibility: "patient",
                  deliveryStatus: "sent",
                  supersedesGuidanceId: null,
                  createdAt: new Date("2026-07-22T12:00:00Z"),
                  authorName: "Nutricionista Autora",
                }]])
                .mockResolvedValueOnce([[]])
                .mockResolvedValueOnce([[{ total: 1 }]])
                .mockResolvedValueOnce([[{ total: 1 }]])
                .mockResolvedValueOnce([[{ total: 1 }]])
                .mockResolvedValueOnce([[{ total: 0 }]]);

              const result = await getProfessionalRecord(11, {
                patientId: 22,
                page: 1,
                pageSize: 20,
              });

              expect(result.latestAssessment?.authorName).toBe("Nutricionista Autora");
              expect(result.assessmentHistory[0]?.authorName).toBe("Nutricionista Autora");
              expect(result.notes[0]?.authorName).toBe("Nutricionista Autora");
              expect(result.guidances[0]?.authorName).toBe("Nutricionista Autora");

              for (const callIndex of [1, 2, 3]) {
                const queryText = collectStrings(mocks.execute.mock.calls[callIndex]?.[0]).join(" ");
                expect(queryText).toContain("professionalProfiles");
                expect(queryText).toContain("authorName");
              }
            });
          });
          '''.replace("          ", ""), encoding="utf-8")
          PY

          git diff --check
          git status --short

      - name: Commit issue 880 pre-audit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.access.test.tsx \
            server/modules/professionals/recordService.ts \
            server/modules/professionals/recordService.authorship.test.ts \
            scripts/render-professional-patient-workspace-visual.sh \
            docs/testing/professional-workspace-routing.md
          git rm .github/workflows/patch-issue-880-preaudit-findings.yml
          git diff --cached --check
          git commit -m "fix: close issue 880 pre-audit gaps"
          git push origin HEAD:feat/875-professional-context-routes
