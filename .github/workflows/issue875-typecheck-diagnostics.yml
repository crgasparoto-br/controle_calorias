name: Issue 875 typecheck diagnostics

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  typecheck-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture TypeScript diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm check > issue875-typecheck.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: issue875-typecheck-diagnostics
          path: issue875-typecheck.log
          if-no-files-found: error
          retention-days: 1
      - name: Preserve typecheck status
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
