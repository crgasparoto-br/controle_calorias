name: Issue 875 typecheck diagnostics

on:
  pull_request:
    branches: [develop]

jobs:
  typecheck-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm check > issue875-typecheck.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: issue875-typecheck-diagnostics
          path: issue875-typecheck.log
          retention-days: 1
      - if: steps.typecheck.outputs.status != '0'
        run: exit 1
