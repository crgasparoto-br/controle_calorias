name: Issue 923 finalize stabilization PR

on:
  pull_request:
    types: [synchronize]
    paths:
      - ".ci/issue-923-stabilize-trigger"
      - ".github/workflows/issue-923-finalize-stabilization-pr.yml"

permissions:
  contents: write

concurrency:
  group: issue-923-finalize-stabilization-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/923-ai-capabilities-question-nutrition-embedding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply verified stabilization and final fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/issue-923-stabilize-evidence-probe-pr.yml').read_text().splitlines()
          start = workflow.index("          python - <<'PY'") + 1
          end = workflow.index("          PY", start)
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in workflow[start:end]
          ) + "\n"
          Path('/tmp/issue-923-stabilize.py').write_text(script)
          PY
          python /tmp/issue-923-stabilize.py
          python - <<'PY'
          from pathlib import Path

          path = Path('server/_core/ai/domainTextResponse.test.ts')
          source = path.read_text()
          old = '''outputText: '{"found":true}',
          '''
          new = '''outputText: '{"found":true,"sourceUrl":"https://example.com/kitkat","evidence":"dados nutricionais a confirmar"}',
          '''
          matches = source.count(old)
          if matches < 2:
              raise SystemExit(f'expected at least two URL-only structured fixtures, found {matches}')
          path.write_text(source.replace(old, new))
          PY
          rm -f .github/workflows/issue-923-stabilize-evidence-probe.yml
          rm -f .github/workflows/issue-923-stabilize-evidence-probe-pr.yml
          rm -f .github/workflows/issue-923-finalize-stabilization-pr.yml
          rm -f .ci/issue-923-stabilize-trigger
          git diff --check
          pnpm exec vitest run server/_core/ai/domainTextResponse.test.ts server/catalogSemanticSearch.test.ts --maxWorkers=1 --minWorkers=1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): estabilizar recuperação de evidência pesquisada"
          git push origin HEAD:feat/923-ai-capabilities-question-nutrition-embedding
