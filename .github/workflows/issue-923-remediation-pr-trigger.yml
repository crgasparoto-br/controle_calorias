name: Issue 923 remediation PR trigger

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - develop
    paths:
      - .github/workflows/issue-923-remediation-pr-trigger.yml

permissions:
  contents: write

concurrency:
  group: issue-923-remediation-pr-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/923-ai-capabilities-question-nutrition-embedding'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Extract and publish audited remediation
        shell: bash
        env:
          EXPECTED_PARENT: 12dc7e150deba2555b9f9b71351ef57c057cc217
          TARGET_BRANCH: feat/923-ai-capabilities-question-nutrition-embedding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT}"
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/issue-923-remediation-publisher.yml').read_text(encoding='utf-8')
          prefix = "printf '%s' '"
          suffix = "' > /tmp/issue923.patch.gz.b64"
          payload = source.split(prefix, 1)[1].split(suffix, 1)[0]
          Path('/tmp/issue923.patch.gz.b64').write_text(payload, encoding='ascii')
          PY
          base64 -d /tmp/issue923.patch.gz.b64 | gzip -d > /tmp/issue923.patch
          test "$(sha256sum /tmp/issue923.patch | awk '{print $1}')" = "a334c90c0c16ce7d8415f21dd96b6fea8bb4af5b615c1b500e106db904bbf5e7"
          git apply --index /tmp/issue923.patch
          rm .github/workflows/issue-923-remediation-publisher.yml
          rm .github/workflows/issue-923-remediation-trigger.yml
          rm .github/workflows/issue-923-remediation-pr-trigger.yml
          git add -A
          git config user.name "Issue 923 Remediation Publisher"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(ai): govern provider attempts and live smoke credentials"
          git push origin "HEAD:${TARGET_BRANCH}"
