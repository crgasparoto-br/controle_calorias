name: Apply issue 793 photo path fix

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-photo-path-fix:
    if: github.head_ref == 'feat/793-centralizar-timezone' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/793-centralizar-timezone
          fetch-depth: 0

      - name: Verify and apply correction
        run: |
          echo "0c75c3cd72a32555978be67ba1b8907f3f073eb4bada25ffc410f8d1cb8a9643  .github/issue-793-photo-path-fix.py" | sha256sum -c -
          python .github/issue-793-photo-path-fix.py
          rm -f .github/issue-793-photo-path-fix.py
          rm -f .github/workflows/apply-issue-793-photo-path-fix.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Tests
        id: tests
        continue-on-error: true
        run: pnpm test > /tmp/photo-path-test.log 2>&1

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-793-photo-path-test-diagnostics
          path: /tmp/photo-path-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Enforce tests
        run: |
          test "${{ steps.tests.outcome }}" = "success"

      - name: Architecture check
        run: pnpm architecture:check

      - name: Documentation check
        run: pnpm docs:check

      - name: Build
        run: pnpm build

      - name: Agent check
        run: pnpm agent:check

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(timezone): validate photo confirmation civil time (#793)"
          git push origin HEAD:feat/793-centralizar-timezone
