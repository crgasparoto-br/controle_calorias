name: Issue 924 - benchmark confiavel de transcricao

on:
  push:
    branches:
      - feat/924-transcription-capability-benchmark
    paths:
      - ".github/workflows/issue-924-transcription-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: issue-924-transcription-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: whisper-1 vs gpt-4o-mini-transcribe
    if: github.repository == 'crgasparoto-br/controle_calorias'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do SHA disparador
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validar branch, SHA e arvore limpa
        id: identity
        shell: bash
        run: |
          set -euo pipefail

          expected_branch="feat/924-transcription-capability-benchmark"
          actual_sha="$(git rev-parse HEAD)"

          if [[ "$GITHUB_REF_NAME" != "$expected_branch" ]]; then
            echo "::error::Branch inesperada: $GITHUB_REF_NAME"
            exit 1
          fi

          if [[ "$actual_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::O checkout nao corresponde ao SHA disparador."
            echo "Esperado: $GITHUB_SHA"
            echo "Obtido:  $actual_sha"
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::A arvore de trabalho nao esta limpa."
            git status --short
            exit 1
          fi

          echo "tested_sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${actual_sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Revalidar arvore antes da credencial
        shell: bash
        run: |
          set -euo pipefail

          actual_sha="$(git rev-parse HEAD)"

          if [[ "$actual_sha" != "${{ steps.identity.outputs.tested_sha }}" ]]; then
            echo "::error::O SHA mudou durante a preparacao."
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::A instalacao alterou arquivos versionados."
            git status --short
            exit 1
          fi

      - name: Executar benchmark real
        id: benchmark
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSCRIPTION_BENCHMARK_TESTED_SHA: ${{ steps.identity.outputs.tested_sha }}
          TRANSCRIPTION_BENCHMARK_WHISPER_MODEL: whisper-1
          TRANSCRIPTION_BENCHMARK_GPT4O_MINI_MODEL: gpt-4o-mini-transcribe
        run: |
          set -euo pipefail

          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::O repository secret OPENAI_API_KEY nao esta disponivel."
            exit 1
          fi

          result_dir="${RUNNER_TEMP}/issue-924-benchmark"
          result_file="${result_dir}/$(date -u +%Y-%m-%d)-${GITHUB_SHA:0:12}.json"

          mkdir -p "$result_dir"

          pnpm benchmark:transcription -- "$result_file"

          echo "result_dir=$result_dir" >> "$GITHUB_OUTPUT"
          echo "result_file=$result_file" >> "$GITHUB_OUTPUT"

      - name: Validar resultado sanitizado
        shell: bash
        env:
          RESULT_FILE: ${{ steps.benchmark.outputs.result_file }}
          EXPECTED_SHA: ${{ steps.identity.outputs.tested_sha }}
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = process.env.RESULT_FILE;
          const expectedSha = process.env.EXPECTED_SHA;

          if (!file || !fs.existsSync(file)) {
            throw new Error("Arquivo de resultado nao encontrado.");
          }

          const result = JSON.parse(fs.readFileSync(file, "utf8"));

          if (result.testedSha !== expectedSha) {
            throw new Error(
              `testedSha divergente: esperado ${expectedSha}, obtido ${result.testedSha}`,
            );
          }

          const expectedModels = [
            "whisper-1",
            "gpt-4o-mini-transcribe",
          ];

          if (JSON.stringify(result.models) !== JSON.stringify(expectedModels)) {
            throw new Error(
              `Modelos inesperados: ${JSON.stringify(result.models)}`,
            );
          }

          if (!Array.isArray(result.results) || result.results.length !== 12) {
            throw new Error(
              `Quantidade inesperada de resultados: ${result.results?.length}`,
            );
          }

          const forbiddenKeys = new Set([
            "audio",
            "audioBase64",
            "prompt",
            "text",
            "transcript",
            "transcription",
          ]);

          function inspect(value, path = []) {
            if (Array.isArray(value)) {
              value.forEach((item, index) =>
                inspect(item, [...path, String(index)]),
              );
              return;
            }

            if (!value || typeof value !== "object") {
              return;
            }

            for (const [key, child] of Object.entries(value)) {
              if (forbiddenKeys.has(key)) {
                throw new Error(
                  `Campo sensivel encontrado: ${[...path, key].join(".")}`,
                );
              }

              inspect(child, [...path, key]);
            }
          }

          inspect(result);

          console.log(
            JSON.stringify(
              {
                testedSha: result.testedSha,
                models: result.models,
                summary: result.summary,
              },
              null,
              2,
            ),
          );
          NODE

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::O benchmark modificou a arvore do repositorio."
            git status --short
            exit 1
          fi

      - name: Gerar hash e proveniencia
        shell: bash
        env:
          RESULT_FILE: ${{ steps.benchmark.outputs.result_file }}
        run: |
          set -euo pipefail

          result_dir="$(dirname "$RESULT_FILE")"

          sha256sum "$RESULT_FILE" > "$result_dir/result.sha256"

          jq -n \
            --arg testedSha "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg runnerOs "$RUNNER_OS" \
            --arg runnerArch "$RUNNER_ARCH" \
            '{
              schemaVersion: 1,
              testedSha: $testedSha,
              repository: $repository,
              branch: $branch,
              workflow: $workflow,
              workflowRunId: $workflowRunId,
              workflowRunAttempt: $workflowRunAttempt,
              event: $event,
              runner: {
                os: $runnerOs,
                architecture: $runnerArch
              },
              credentialHandling: {
                secretName: "OPENAI_API_KEY",
                scope: "benchmark-step-only",
                persisted: false
              }
            }' > "$result_dir/provenance.json"

      - name: Publicar evidencia
        uses: actions/upload-artifact@v5
        with:
          name: issue-924-transcription-benchmark-${{ steps.identity.outputs.short_sha }}
          path: ${{ steps.benchmark.outputs.result_dir }}
          if-no-files-found: error
          retention-days: 7
