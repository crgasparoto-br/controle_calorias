name: Apply issue 879 audit fixes

on:
  workflow_dispatch:

jobs: {}

x-correction-script: |
  python - <<'PY'
  import subprocess

  path = ".github/workflows/apply-issue-879-audit-fixes.yml"
  source = subprocess.check_output(
      ["git", "show", f"HEAD^:{path}"],
      text=True,
  )
  marker = "          python - <<'PY'\n"
  start = source.index(marker) + len(marker)
  end = source.index("\n          PY\n", start)
  lines = source[start:end].splitlines()
  script = "\n".join(
      line[10:] if line.startswith("          ") else line for line in lines
  ) + "\n"

  old = """replace_once(receipt_repo, '          LIMIT ${MAX_SCANNED_RECEIPTS}\\n', '')
replace_once(receipt_repo, '          LIMIT ${MAX_SCANNED_RECEIPTS}\\n', '')
"""
  new = """file = Path(receipt_repo)
source = file.read_text(encoding=\"utf-8\")
limit_anchor = '          LIMIT ${MAX_SCANNED_RECEIPTS}\\n'
if source.count(limit_anchor) != 2:
    raise SystemExit(
        f\"expected two receipt scan limits; found {source.count(limit_anchor)}\"
    )
file.write_text(source.replace(limit_anchor, ''), encoding=\"utf-8\")
"""
  if old not in script:
      raise SystemExit("could not patch duplicate receipt limit replacements")
  script = script.replace(old, new)
  exec(compile(script, "/tmp/apply_issue_879_original.py", "exec"))
  PY
