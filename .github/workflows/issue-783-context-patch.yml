name: Issue 783 context patch

on:
  push:
    paths:
      - .github/workflows/issue-783-context-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Update context expectations and documentation
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              Path("server/whatsappWebhook.test.ts"): (
                  '      "*Almoço Registrado às 08:52hs.*",\n      "",\n      "Itens:",',
                  '      "*Almoço Registrado às 08:52hs.*",\n      "",\n      "🍽️ *Almoço* — 08:52",\n      "",\n      "Itens:",',
              ),
              Path("server/whatsappAnnotatedImageWebhook.test.ts"): (
                  '      "*Almoço Registrado às 13:00hs.*",\n      "",\n      "Itens:",',
                  '      "*Almoço Registrado às 13:00hs.*",\n      "",\n      "🍽️ *Almoço* — 13:00",\n      "",\n      "Itens:",',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Esperava uma ocorrência em {path}, encontrei {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          doc_path = Path("docs/design-docs/whatsapp-issue-783-completion.md")
          doc = doc_path.read_text(encoding="utf-8")
          section = """

## Bloco canônico de contexto

Registro, consolidação, consulta e mutações reutilizam `buildWhatsAppMealContextLine` para identificar a refeição no formato `🍽️ *<refeição>* — <horário>`. Em listagens diárias agrupadas, o mesmo bloco é usado sem horário para não atribuir uma única hora a várias ocorrências consolidadas.
"""
          if "## Bloco canônico de contexto" not in doc:
              doc_path.write_text(doc.rstrip() + section + "\n", encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/whatsappWebhook.test.ts server/whatsappAnnotatedImageWebhook.test.ts docs/design-docs/whatsapp-issue-783-completion.md
          git commit -m "test(whatsapp): alinhar expectativas ao contexto canônico (#783)"
          git push origin HEAD:${GITHUB_REF_NAME}
