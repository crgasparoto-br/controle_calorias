name: Issue 882 remediation runner

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/issue-882-remediation-runner.yml

permissions:
  contents: write

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
      EXPECTED_PARENT_SHA: 7163b3ca72fd730d378c8d76dabfc89dcff00684
      PATCH_BLOB_SHA: df969d56fda13ca6aa10a19545cbaec5f4557e6c
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD^)" = "${EXPECTED_PARENT_SHA}"
          test "$(git branch --show-current)" = "feat/875-professional-context-routes"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and apply verified patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" > /tmp/issue-882-remediation.patch.gz
          gzip -dc /tmp/issue-882-remediation.patch.gz > /tmp/issue-882-remediation.patch
          git apply --check /tmp/issue-882-remediation.patch
          git apply /tmp/issue-882-remediation.patch
          git diff --check

      - name: Focused regression tests
        env:
          NODE_ENV: test
        run: |
          pnpm exec vitest run \
            client/src/components/professional/ProfessionalMessagesExperience.test.tsx \
            server/modules/professionals/messageService.createConcurrency.test.ts \
            server/modules/professionals/messageService.listFilters.test.ts \
            server/modules/professionals/messageService.idempotency.test.ts \
            server/modules/professionals/messageService.supersession.test.ts \
            server/modules/professionals/messageRouter.createIdempotency.test.ts \
            server/modules/professionals/messageRouter.retryAccess.test.ts \
            --maxWorkers=1 --minWorkers=1

      - name: TypeScript check
        run: pnpm check

      - name: Generate TRPC documentation
        run: pnpm docs:generate:trpc

      - name: Architecture and documentation checks
        run: |
          pnpm architecture:check
          pnpm docs:check

      - name: Build
        run: pnpm build

      - name: Publish validated remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-882-remediation-runner.yml
          git add \
            client/src/components/professional/ProfessionalMessagesExperience.tsx \
            client/src/components/professional/ProfessionalMessagesExperience.test.tsx \
            docs/RELIABILITY.md \
            docs/design-docs/professional-navigation.md \
            docs/generated/trpc-routes.md \
            docs/product-specs/professionals.md \
            server/modules/professionals/messageRouter.createIdempotency.test.ts \
            server/modules/professionals/messageRouter.ts \
            server/modules/professionals/messageService.createConcurrency.test.ts \
            server/modules/professionals/messageService.idempotency.test.ts \
            server/modules/professionals/messageService.listFilters.test.ts \
            server/modules/professionals/messageService.supersession.test.ts \
            server/modules/professionals/messageService.ts \
            server/modules/professionals/schemas.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "fix: remediate issue 882 audit findings"
          git push origin HEAD:feat/875-professional-context-routes
