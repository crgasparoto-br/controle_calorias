name: Apply issue 882 visual stream remediation

on:
  pull_request:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".audit/issue-882-visual-stream-remediation-trigger.txt"

permissions:
  contents: write

concurrency:
  group: issue-882-visual-stream-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'chore/issue-882-visual-stream-remediation-trigger'
    runs-on: ubuntu-latest
    env:
      PATCH_SHA256: 0dc605808c27f73db854738d1cfd88b662c218ef418d788d4193f8ce143c26e2
      PATCH_BLOB: 9c97b66ec5e010585b252c8915e036d2bff97c9d
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 2

      - name: Fetch and verify stream remediation patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB}" \
            | jq -r '.content' \
            | tr -d '\n' \
            | base64 -d \
            > /tmp/issue-882-visual-stream.patch
          echo "${PATCH_SHA256}  /tmp/issue-882-visual-stream.patch" | sha256sum -c -
          git apply --check /tmp/issue-882-visual-stream.patch

      - name: Apply stream remediation and remove applicator
        run: |
          git apply --index /tmp/issue-882-visual-stream.patch
          git rm .github/workflows/issue-882-visual-stream-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: isolate issue 882 visual revocation stream"
          git push origin HEAD:feat/875-professional-context-routes
