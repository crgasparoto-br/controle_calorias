name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  agent-check:
    name: Agent-first gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply issue 801 implementation
        run: node scripts/bootstrap-issue-801.cjs

      - name: Format issue 801 sources
        run: |
          pnpm exec prettier --write \
            drizzle/schema.ts \
            drizzle/meta/_journal.json \
            drizzle/meta/0025_snapshot.json \
            server/schemaCompatibility.ts \
            server/repositories/foodCatalogRepository.ts \
            server/modules/foods/deprecationRegistry.ts \
            server/modules/foods/legacyDeletion.ts \
            server/modules/foods/legacyDeletion.test.ts \
            server/modules/foods/catalog.ts \
            server/modules/foods/catalog.test.ts \
            server/modules/foods/service.ts \
            server/modules/foods/schemas.ts \
            server/nutritionRouter.ts \
            client/src/pages/FoodsPage.tsx \
            docs/design-docs/custom-foods.md \
            docs/product-specs/meal-registration.md

      - name: Regenerate issue 801 documentation
        run: |
          pnpm docs:generate:db
          pnpm docs:generate:trpc

      - name: TypeScript check
        run: pnpm check

      - name: Tests
        run: |
          if ! pnpm test > /tmp/vitest.log 2>&1; then
            echo "Vitest failed. Showing the final 250 log lines:"
            tail -n 250 /tmp/vitest.log
            exit 1
          fi
          tail -n 80 /tmp/vitest.log

      - name: Upload Vitest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-vitest-log
          path: /tmp/vitest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Architecture check
        run: pnpm architecture:check

      - name: Documentation check
        run: pnpm docs:check

      - name: Build
        run: pnpm build

      - name: Agent check
        run: pnpm agent:check

      - name: CI gate docs check
        run: pnpm exec tsx scripts/check-ci-gate-docs.ts

      - name: Database integrity check
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          pnpm db:check-integrity
          {
            echo "## Agent-first gate"
            echo ""
            echo "Required status check: Agent-first gate"
            echo ""
            echo "Validated commands:"
            echo "- pnpm check"
            echo "- pnpm test"
            echo "- pnpm architecture:check"
            echo "- pnpm docs:check"
            echo "- pnpm build"
            echo "- pnpm agent:check"
            echo "- pnpm db:check-integrity"
            echo ""
            echo "Database integrity: executed with DATABASE_URL."
            echo "Vercel preview/deploy checks are complementary and do not replace this gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Database integrity check skipped
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "DATABASE_URL not available; pnpm db:check-integrity skipped."
          {
            echo "## Agent-first gate"
            echo ""
            echo "Required status check: Agent-first gate"
            echo ""
            echo "Validated commands:"
            echo "- pnpm check"
            echo "- pnpm test"
            echo "- pnpm architecture:check"
            echo "- pnpm docs:check"
            echo "- pnpm build"
            echo "- pnpm agent:check"
            echo ""
            echo "Database integrity: skipped because DATABASE_URL not available. PRs touching persistence must record alternative validation or residual risk."
            echo "Vercel preview/deploy checks are complementary and do not replace this gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect issue 801 generated files
        if: always()
        run: |
          mkdir -p /tmp/issue-801-export
          {
            git diff --name-only -z
            git ls-files --others --exclude-standard -z
          } | sort -zu | while IFS= read -r -d '' file; do
            mkdir -p "/tmp/issue-801-export/$(dirname "$file")"
            cp "$file" "/tmp/issue-801-export/$file"
          done

      - name: Upload issue 801 generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-801-generated-files
          path: /tmp/issue-801-export
          if-no-files-found: error
          retention-days: 3
