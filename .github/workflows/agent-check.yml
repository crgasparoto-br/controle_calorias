name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  agent-check:
    if: github.head_ref == 'fix/whatsapp-generic-clarification-consistency'
    name: Agent-first gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-generic-clarification-consistency
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize audited source files
        run: pnpm vitest run server/modules/whatsapp/zzzAuditPatchGenerator.test.ts || true

      - name: Restore repository workflows and remove temporary files
        run: |
          git fetch origin develop
          git show origin/develop:.github/workflows/agent-check.yml > .github/workflows/agent-check.yml
          rm -f .github/workflows/tmp-fix-whatsapp-clarification.yml
          rm -f server/modules/whatsapp/zzzAuditPatchGenerator.test.ts

      - name: Run focused validation for diagnostics
        continue-on-error: true
        run: |
          pnpm check
          pnpm vitest run server/modules/whatsapp/genericClarificationMessage.test.ts server/modules/whatsapp/service.test.ts server/modules/whatsapp/llmIntentActions.test.ts
          pnpm docs:check

      - name: Commit implementation for official validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-check.yml .github/workflows/tmp-fix-whatsapp-clarification.yml server/modules/whatsapp docs/design-docs/whatsapp-intent-router.md
          git commit -m "fix(whatsapp): concluir centralizacao da clarificacao"
          git push origin HEAD:fix/whatsapp-generic-clarification-consistency
