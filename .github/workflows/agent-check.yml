name: Agent-first gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    name: Agent-first gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: epic-779-source-snapshot
          path: |
            server
            scripts
            docs
            shared
            drizzle
            package.json
            pnpm-lock.yaml
            tsconfig.json
          retention-days: 1
