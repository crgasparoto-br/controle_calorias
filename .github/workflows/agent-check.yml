name: Apply issue 879 audit corrections

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/875-professional-context-routes'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recover patch and apply corrections
        run: |
          git show 2438645e5b618ad207fd71d97c61af115f59c29b:.github/workflows/agent-check.yml > /tmp/patch-source.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/patch-source.yml').read_text(encoding='utf-8')
          start_marker = "          cat > /tmp/issue879.patch.gz.b64 <<'PATCH'\n"
          end_marker = "\n          PATCH\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          encoded = ''.join(line.strip() for line in source[start:end].splitlines())
          Path('/tmp/issue879.patch.gz.b64').write_text(encoded, encoding='ascii')
          PY
          base64 -d /tmp/issue879.patch.gz.b64 | gzip -d > /tmp/issue879.patch
          git apply --check /tmp/issue879.patch
          git apply /tmp/issue879.patch
          cat > /tmp/issue879-new-files.tar.gz.b64 <<'NEWFILES'
