name: Agent-first gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  agent-check:
    name: Agent-first gate
    if: ${{ github.event.pull_request.head.ref == 'feat/875-professional-context-routes' }}
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic fixes
        run: |
          set -o pipefail
          {
            wc -c .github/issue-880-fixes.b64
            base64 -d .github/issue-880-fixes.b64 > /tmp/issue-880-fixes.gz
            wc -c /tmp/issue-880-fixes.gz
            gzip -t /tmp/issue-880-fixes.gz
            gzip -dc /tmp/issue-880-fixes.gz > /tmp/apply-issue-880-audit-fixes.mjs
            node --check /tmp/apply-issue-880-audit-fixes.mjs
            node /tmp/apply-issue-880-audit-fixes.mjs
          } 2>&1 | tee /tmp/issue-880-fix.log

      - name: Upload deterministic fix diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-880-fix-diagnostics
          path: /tmp/issue-880-fix.log
          if-no-files-found: error
          retention-days: 3

      - name: Format changed sources
        run: >-
          pnpm exec prettier --write
          ARCHITECTURE.md
          docs/product-specs/professionals.md
          docs/design-docs/professional-navigation.md
          server/modules/professionals/schemas.ts
          server/modules/professionals/recordRouter.ts
          server/modules/professionals/recordService.ts
          server/modules/professionals/recordService.endedAccess.test.ts
          server/modules/professionals/patientContextSchemas.ts
          server/modules/professionals/patientContextService.ts
          server/modules/professionals/patientContextService.test.ts
          client/src/components/ProfessionalLayout.tsx
          client/src/components/professional/ProfessionalUi.tsx
          client/src/components/professional/ProfessionalUi.test.tsx
          client/src/pages/professional/ProfessionalPatientWorkspace.tsx
          client/src/pages/professional/ProfessionalPatientWorkspace.activity.test.ts
          client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx

      - name: Focused regression tests
        run: >-
          pnpm exec vitest run --maxWorkers=1 --minWorkers=1
          server/modules/professionals/recordService.endedAccess.test.ts
          server/modules/professionals/recordService.test.ts
          server/modules/professionals/patientContextService.test.ts
          server/modules/professionals/patientContextRouter.integration.test.ts
          client/src/components/professional/ProfessionalUi.test.tsx
          client/src/pages/professional/ProfessionalPatientWorkspace.activity.test.ts
          client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx

      - name: TypeScript architecture and docs
        run: |
          pnpm check
          pnpm architecture:check
          pnpm docs:check

      - name: Restore trusted workflows and commit fixes
        run: |
          git show 70e7da8d53ccd2a48c0d62d45ead1f2098fd7194:.github/workflows/agent-check.yml > .github/workflows/agent-check.yml
          git rm .github/workflows/issue-880-audit-fixes.yml
          git rm .github/issue-880-fixes.b64
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: address issue 880 audit findings"
          git push origin HEAD:feat/875-professional-context-routes
