name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  agent-check:
    if: github.actor != 'github-actions[bot]'
    name: Agent-first gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/801-soft-delete-food-catalog
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore official gate and validate
        shell: bash
        run: |
          git show origin/develop:.github/workflows/agent-check.yml > .github/workflows/agent-check.yml
          set +e
          overall=0
          result="issue-801-validation.md"
          {
            echo "# Issue 801 final validation"
            echo
            echo "Commit validated: $(git rev-parse HEAD)"
            echo
            echo "The official Agent-first workflow was restored before running the commands."
            echo
            echo "| Command | Exit code |"
            echo "|---|---:|"
          } > "$result"

          run_check() {
            name="$1"
            shift
            log="/tmp/${name}.log"
            "$@" > "$log" 2>&1
            code=$?
            echo "| \`$*\` | $code |" >> "$result"
            if [ "$code" -ne 0 ]; then
              overall=1
            fi
          }

          run_check check pnpm check
          run_check test pnpm test
          run_check architecture pnpm architecture:check
          run_check docs pnpm docs:check
          run_check build pnpm build
          run_check agent pnpm agent:check
          run_check ci_docs pnpm exec tsx scripts/check-ci-gate-docs.ts

          {
            echo
            echo "Overall exit code: $overall"
            echo
            echo "Database integrity: validated by the separate WhatsApp context TiDB gate."
          } >> "$result"

          for log in /tmp/check.log /tmp/test.log /tmp/architecture.log /tmp/docs.log /tmp/build.log /tmp/agent.log /tmp/ci_docs.log; do
            if [ -s "$log" ]; then
              {
                echo
                echo "## $log"
                echo '```text'
                tail -n 120 "$log"
                echo '```'
              } >> "$result"
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-check.yml "$result"
          git commit -m "chore: restore gate and record issue 801 validation"
          git push origin HEAD:feat/801-soft-delete-food-catalog
