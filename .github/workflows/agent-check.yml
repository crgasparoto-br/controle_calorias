name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  agent-check:
    name: Agent-first gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply patches with diagnostics
        shell: bash
        run: |
          set +e
          python3 scripts/apply_issue_768_idempotency.py > idempotency.log 2>&1
          echo $? > idempotency.exit
          python3 scripts/apply_issue_768_rollout.py > rollout.log 2>&1
          echo $? > rollout.exit
          python3 scripts/apply_issue_768_selection.py > selection.log 2>&1
          echo $? > selection.exit
          git diff --binary > issue-768-applied.patch
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: issue-768-patch-diagnostics
          path: |
            *.log
            *.exit
            issue-768-applied.patch
