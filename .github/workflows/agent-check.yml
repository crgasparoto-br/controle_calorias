name: Agent-first gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  issue-923-remediation:
    if: github.event.pull_request.head.ref == 'feat/923-ai-capabilities-question-nutrition-embedding'
    name: Issue 923 remediation publisher
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply audited remediation
        env:
          BASE_SHA: 673eed668e2d7113cb597152aca32ec60479ab1e
          PATCH_BRANCH: automation/923-remediation-publisher
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          git fetch --no-tags origin "${PATCH_BRANCH}"
          for part in 00 01 02 03; do
            git show "FETCH_HEAD:.automation/issue923-remediation.patch.part-${part}"
          done > /tmp/issue923-remediation.patch
          sha256sum /tmp/issue923-remediation.patch
          git apply --check --whitespace=error-all /tmp/issue923-remediation.patch
          git apply --index --whitespace=error-all /tmp/issue923-remediation.patch
          git checkout "${BASE_SHA}" -- .github/workflows/agent-check.yml
          git rm --cached --ignore-unmatch .github/workflows/issue-923-apply-remediation.yml .automation/issue923-remediation-trigger
          rm -f .github/workflows/issue-923-apply-remediation.yml .automation/issue923-remediation-trigger
          git diff --cached --check
          echo "remediated_tree=$(git write-tree)"
          git diff --cached --stat

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused remediation tests
        env:
          NODE_ENV: test
          PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
        run: pnpm exec vitest run server/_core/aiProvider.toolContract.test.ts server/_core/geminiProvider.test.ts server/catalogSemanticSearch.test.ts --maxWorkers=1 --minWorkers=1

      - name: Required gates
        env:
          PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
        run: |
          pnpm check
          pnpm test
          pnpm architecture:check
          pnpm docs:check
          pnpm build
          pnpm agent:check

      - name: Commit and publish remediated tree
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ai): remediate issue 923 audit findings"
          echo "published_tree=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:feat/923-ai-capabilities-question-nutrition-embedding
