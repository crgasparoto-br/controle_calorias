name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  agent-check:
    if: github.actor != 'github-actions[bot]'
    name: Agent-first gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: feat/801-soft-delete-food-catalog
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused regressions and record log
        shell: bash
        run: |
          set +e
          pnpm exec vitest run \
            server/modules/foods/sleepKoalaRegression.test.ts \
            server/modules/insights/service.test.ts \
            client/src/pages/foodsPageState.test.ts \
            > /tmp/issue-801-focused.log 2>&1
          code=$?
          {
            echo "# Issue 801 focused validation"
            echo
            echo "Commit validated: $(git rev-parse HEAD)"
            echo
            echo "Exit code: $code"
            echo
            echo '```text'
            cat /tmp/issue-801-focused.log
            echo '```'
          } > issue-801-focused-validation.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue-801-focused-validation.md
          git commit -m "chore: record issue 801 focused validation"
          git push origin HEAD:feat/801-soft-delete-food-catalog
