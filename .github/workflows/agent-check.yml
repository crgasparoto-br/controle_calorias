name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  agent-check:
    name: Agent-first gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply issue 768 focused patches
        run: |
          python3 scripts/apply_issue_768_idempotency.py
          python3 scripts/apply_issue_768_rollout.py
          python3 scripts/apply_issue_768_selection.py

      - name: Capture applied patch
        run: git diff --binary > issue-768-applied.patch

      - name: Upload applied patch
        uses: actions/upload-artifact@v4
        with:
          name: issue-768-applied-patch
          path: issue-768-applied.patch

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Architecture check
        run: pnpm architecture:check

      - name: Documentation check
        run: pnpm docs:check

      - name: Build
        run: pnpm build

      - name: Agent check
        run: pnpm agent:check

      - name: CI gate docs check
        run: pnpm exec tsx scripts/check-ci-gate-docs.ts

      - name: Database integrity check
        if: ${{ env.DATABASE_URL != '' }}
        run: pnpm db:check-integrity

      - name: Database integrity check skipped
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "DATABASE_URL not available; pnpm db:check-integrity skipped."
