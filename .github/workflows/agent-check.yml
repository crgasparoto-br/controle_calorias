name: Apply issue 879 audit corrections

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/875-professional-context-routes'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recover patch and apply corrections
        run: |
          git show HEAD~2:.github/workflows/agent-check.yml > /tmp/parent-agent-check.yml
          python - <<'PY'
          from pathlib import Path
          source = Path('/tmp/parent-agent-check.yml').read_text(encoding='utf-8')
          start_marker = "          cat > /tmp/issue879.patch.gz.b64 <<'PATCH'\n"
          end_marker = "\n          PATCH\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          encoded = ''.join(line.strip() for line in source[start:end].splitlines())
          Path('/tmp/issue879.patch.gz.b64').write_text(encoded, encoding='ascii')
          PY
          base64 -d /tmp/issue879.patch.gz.b64 | gzip -d > /tmp/issue879.patch
          git apply --check /tmp/issue879.patch
          git apply /tmp/issue879.patch
          git show 6138b7c92090d09aa9aa894bf980be348c45959b:.github/workflows/agent-check.yml > .github/workflows/agent-check.yml
          rm -f .github/workflows/apply-issue-879-audit-fixes.yml

      - name: Format implementation
        run: |
          pnpm exec prettier --write \
            server/modules/professionals/accessRequestReceiptRepository.ts \
            server/modules/professionals/accessRequestReceiptRepository.pagination.test.ts \
            server/modules/professionals/portfolioPagination.ts \
            server/modules/professionals/portfolioPagination.test.ts \
            server/modules/professionals/requestAccessPublicBoundary.ts \
            server/modules/professionals/requestAccessPublicBoundary.test.ts \
            server/modules/professionals/service.ts \
            server/repositories/professionalPortfolioRepository.ts \
            client/src/pages/professional/ProfessionalPatients.tsx \
            client/src/pages/professional/ProfessionalPatients.test.tsx \
            client/src/pages/ProfessionalAreaPage.tsx \
            docs/product-specs/professionals.md \
            docs/design-docs/professional-portfolio-operational-schedule.md
          git diff --check

      - name: Archive formatted source
        if: always()
        run: |
          mkdir -p artifacts/issue-879
          tar --exclude='./node_modules' --exclude='./artifacts' -czf artifacts/issue-879/controle_calorias-formatted.tar.gz .

      - name: Validate focused behavior
        run: |
          set -o pipefail
          pnpm exec vitest run \
            server/modules/professionals/accessRequestReceiptRepository.pagination.test.ts \
            server/modules/professionals/portfolioPagination.test.ts \
            server/modules/professionals/requestAccessPublicBoundary.test.ts \
            client/src/pages/professional/ProfessionalPatients.test.tsx \
            --maxWorkers=1 --minWorkers=1 2>&1 | tee artifacts/issue-879/focused-tests.log
          pnpm check 2>&1 | tee artifacts/issue-879/typescript.log
          pnpm docs:check 2>&1 | tee artifacts/issue-879/docs-check.log
          pnpm exec tsx scripts/check-ci-gate-docs.ts 2>&1 | tee artifacts/issue-879/ci-docs-check.log
          git diff --check

      - name: Commit and push final correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve audit findings for issue 879"
          git push origin HEAD:feat/875-professional-context-routes
          printf '{"issue":879,"headSha":"%s","sourceEventSha":"%s"}\n' "$(git rev-parse HEAD)" "${GITHUB_SHA}" > artifacts/issue-879/implementation.json

      - name: Upload correction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-879-correction-${{ github.run_id }}
          path: artifacts/issue-879
          if-no-files-found: error
          retention-days: 7
