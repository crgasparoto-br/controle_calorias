name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  issue-783-apply:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/783-unificar-respostas-refeicoes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request merge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited issue 783 completion
        run: |
          cat .issue783-final/part* > /tmp/issue783.patch
          git apply --check /tmp/issue783.patch
          git apply /tmp/issue783.patch
          git diff --name-only -z > /tmp/issue783-files
          tar --null -T /tmp/issue783-files -cf /tmp/issue783-files.tar
          git fetch origin feat/783-unificar-respostas-refeicoes
          git checkout -B feat/783-unificar-respostas-refeicoes origin/feat/783-unificar-respostas-refeicoes
          tar -xf /tmp/issue783-files.tar
          rm -rf .issue783-final
          git show bc767414eb336e25ff7a4fc491c2bbf7da9350f2:.github/workflows/agent-check.yml > .github/workflows/agent-check.yml

      - name: Commit applied completion
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix(whatsapp): complete issue 783 response contract"
          branch: feat/783-unificar-respostas-refeicoes

  agent-check:
    name: Agent-first gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Tests
        run: |
          if ! pnpm test > /tmp/vitest.log 2>&1; then
            echo "Vitest failed. Showing the final 250 log lines:"
            tail -n 250 /tmp/vitest.log
            exit 1
          fi
          tail -n 80 /tmp/vitest.log

      - name: Upload Vitest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-vitest-log
          path: /tmp/vitest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Architecture check
        run: pnpm architecture:check

      - name: Documentation check
        run: pnpm docs:check

      - name: Build
        run: pnpm build

      - name: Agent check
        run: pnpm agent:check

      - name: CI gate docs check
        run: pnpm exec tsx scripts/check-ci-gate-docs.ts

      - name: Database integrity check
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          pnpm db:check-integrity
          {
            echo "## Agent-first gate"
            echo ""
            echo "Required status check: Agent-first gate"
            echo ""
            echo "Validated commands:"
            echo "- pnpm check"
            echo "- pnpm test"
            echo "- pnpm architecture:check"
            echo "- pnpm docs:check"
            echo "- pnpm build"
            echo "- pnpm agent:check"
            echo "- pnpm db:check-integrity"
            echo ""
            echo "Database integrity: executed with DATABASE_URL."
            echo "Vercel preview/deploy checks are complementary and do not replace this gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Database integrity check skipped
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "DATABASE_URL not available; pnpm db:check-integrity skipped."
          {
            echo "## Agent-first gate"
            echo ""
            echo "Required status check: Agent-first gate"
            echo ""
            echo "Validated commands:"
            echo "- pnpm check"
            echo "- pnpm test"
            echo "- pnpm architecture:check"
            echo "- pnpm docs:check"
            echo "- pnpm build"
            echo "- pnpm agent:check"
            echo ""
            echo "Database integrity: skipped because DATABASE_URL not available. PRs touching persistence must record alternative validation or residual risk."
            echo "Vercel preview/deploy checks are complementary and do not replace this gate."
          } >> "$GITHUB_STEP_SUMMARY"
