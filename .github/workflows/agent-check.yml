name: Issue 922 cycle 4 remediation

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-remediation:
    name: Apply issue 922 cycle 4 remediation
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: feat/922-ai-capabilities-meal-whatsapp
      EXPECTED_TARGET_SHA: 3f9c47002556024084edba1f7ff6a8ca4023232c

    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Freeze target and preserve canonical workflow
        run: |
          set -euxo pipefail
          git fetch origin "${TARGET_BRANCH}" --depth=1
          TARGET_SHA="$(git rev-parse FETCH_HEAD)"
          test "${TARGET_SHA}" = "${EXPECTED_TARGET_SHA}"
          git show "${TARGET_SHA}:.github/workflows/agent-check.yml" > /tmp/agent-check.yml
          echo "TARGET_SHA=${TARGET_SHA}" >> "${GITHUB_ENV}"

      - name: Decode remediation patch
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          parts = sorted(Path('.audit/issue-922-remediation').glob('remediation.patch.part*'))
          encoded = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          decoded = gzip.decompress(base64.b64decode(encoded, validate=True))
          output = Path('/tmp/issue-922-cycle4.patch')
          output.write_bytes(decoded)
          if output.stat().st_size == 0:
              raise SystemExit('decoded patch is empty')
          print(f'decoded {len(encoded)} base64 characters into {output.stat().st_size} bytes')
          PY

      - name: Apply remediation patch
        run: |
          set -euxo pipefail
          git apply --check /tmp/issue-922-cycle4.patch
          git apply --index /tmp/issue-922-cycle4.patch

      - name: Remove transport and restore workflow
        run: |
          set -euxo pipefail
          git rm .audit/issue-922-remediation/remediation.patch.part*
          cp /tmp/agent-check.yml .github/workflows/agent-check.yml
          git add .github/workflows/agent-check.yml

      - name: Create single functional commit
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TREE_SHA="$(git write-tree)"
          NEW_COMMIT="$(printf '%s\n' 'fix(ai): preflight OpenAI structured output schemas' | git commit-tree "${TREE_SHA}" -p "${TARGET_SHA}")"
          echo "NEW_COMMIT=${NEW_COMMIT}" >> "${GITHUB_ENV}"
          git push origin "${NEW_COMMIT}:refs/heads/${TARGET_BRANCH}"

      - name: Publish result
        run: |
          echo "Applied issue #922 cycle 4 remediation as ${NEW_COMMIT} on ${TARGET_BRANCH}." >> "${GITHUB_STEP_SUMMARY}"
