name: Issue 922 current live provider smoke

on:
  push:
    branches:
      - automation/922-cycle4-final-live-smoke

permissions:
  contents: read

jobs:
  live-provider-smoke:
    name: live-provider-smoke
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_WHATSAPP_INTENT_ENABLED: "true"
      AI_MEAL_TEXT_MAX_ATTEMPTS: "1"
      AI_MEAL_VISION_MAX_ATTEMPTS: "1"
      AI_WHATSAPP_INTENT_MAX_ATTEMPTS: "1"
      AI_MEAL_TEXT_FALLBACK_ENABLED: "false"
      AI_MEAL_VISION_FALLBACK_ENABLED: "false"
      AI_WHATSAPP_INTENT_FALLBACK_ENABLED: "false"

    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ca72f1dbe0fa1b86573d608fa8f8db161b58aa3a

      - name: Verify frozen candidate
        run: test "$(git rev-parse HEAD)" = "ca72f1dbe0fa1b86573d608fa8f8db161b58aa3a"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select available provider
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY}" ]; then
            echo "SMOKE_PROVIDER=openai" >> "${GITHUB_ENV}"
            echo "SMOKE_MODEL=gpt-4.1-mini" >> "${GITHUB_ENV}"
          elif [ -n "${GEMINI_API_KEY}" ]; then
            echo "SMOKE_PROVIDER=gemini" >> "${GITHUB_ENV}"
            echo "SMOKE_MODEL=gemini-2.5-flash" >> "${GITHUB_ENV}"
          else
            echo "Neither OPENAI_API_KEY nor GEMINI_API_KEY is configured for GitHub Actions." >&2
            exit 1
          fi

      - name: Run live text, photo and intent smoke
        run: |
          set -euo pipefail
          export AI_MEAL_TEXT_PROVIDER="${SMOKE_PROVIDER}"
          export AI_MEAL_TEXT_MODEL="${SMOKE_MODEL}"
          export AI_MEAL_VISION_PROVIDER="${SMOKE_PROVIDER}"
          export AI_MEAL_VISION_MODEL="${SMOKE_MODEL}"
          export AI_WHATSAPP_INTENT_PROVIDER="${SMOKE_PROVIDER}"
          export AI_WHATSAPP_INTENT_MODEL="${SMOKE_MODEL}"
          export OPENAI_WHATSAPP_INTENT_RETRIES="0"
          cat > .tmp-issue-922-live-smoke.ts <<'TS'
          import { extractWithAi } from "./server/mealAiExtraction";
          import { interpretWhatsappMessageWithDiagnostics } from "./server/modules/whatsapp/intentInterpreter";
          import type { WhatsappIntentContext } from "./server/modules/whatsapp/intentContext";

          const textResult = await extractWithAi({
            text: "Teste sintético: registrar 100 g de banana.",
            occurredAt: new Date("2026-07-28T12:00:00-03:00"),
            timeZone: "America/Sao_Paulo",
          });
          if (!textResult || textResult.items.length < 1) {
            throw new Error("MEAL_TEXT live smoke did not return a functional food item");
          }

          const visionResult = await extractWithAi({
            text: "Teste sintético: a imagem representa uma banana; registrar 1 banana.",
            imageUrl: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZQMcAAAAASUVORK5CYII=",
            occurredAt: new Date("2026-07-28T12:05:00-03:00"),
            timeZone: "America/Sao_Paulo",
          });
          if (!visionResult || visionResult.items.length < 1) {
            throw new Error("MEAL_VISION live smoke did not return a functional food item");
          }

          const context: WhatsappIntentContext = {
            version: "whatsapp-intent-context/v1",
            nowIso: "2026-07-28T15:10:00.000Z",
            timezone: "America/Sao_Paulo",
            mealAliases: {},
            latestMeal: null,
            mealsToday: [],
            recentFoodNames: [],
            contextualMemories: [],
            pendingClarification: null,
          };
          const intentResult = await interpretWhatsappMessageWithDiagnostics("registro", context);
          if (intentResult.source !== "llm" || intentResult.validationStatus !== "valid") {
            throw new Error("WHATSAPP_INTENT live smoke did not produce a validated LLM result");
          }

          console.log(JSON.stringify({
            provider: process.env.SMOKE_PROVIDER,
            mealTextItems: textResult.items.length,
            mealVisionItems: visionResult.items.length,
            intentSource: intentResult.source,
            intentValidation: intentResult.validationStatus,
          }));
          TS
          pnpm exec tsx .tmp-issue-922-live-smoke.ts
          rm .tmp-issue-922-live-smoke.ts
