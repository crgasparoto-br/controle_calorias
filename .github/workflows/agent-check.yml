name: Rebuild PR 870 on develop

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.ref == 'sync/870-rebuild-on-develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout synchronized branch
        uses: actions/checkout@v4
        with:
          ref: sync/870-rebuild-on-develop
          fetch-depth: 0

      - name: Merge validated billing foundation
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee /tmp/sync-870.log) 2>&1
          trap 'status=$?; echo "exit_status=${status}"; git status --short || true; git diff --name-only --diff-filter=U || true; exit ${status}' EXIT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop feat/869-billing-foundation

          source_sha="2460c9a06b13dccc54184a3a308d6953003707e1"
          git cat-file -e "${source_sha}^{commit}"

          set +e
          git merge --no-ff --no-commit "${source_sha}"
          merge_status=$?
          set -e

          if [[ "${merge_status}" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            printf 'conflicts=%s\n' "${conflicts[*]}"

            expected=("drizzle.config.ts")
            if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
              echo "Unexpected merge conflicts: ${conflicts[*]}" >&2
              exit 1
            fi

            cat > drizzle.config.ts <<'EOF'
          import { defineConfig } from "drizzle-kit";

          const connectionString = process.env.DATABASE_URL;

          if (!connectionString) {
            throw new Error("DATABASE_URL is required to run drizzle commands");
          }

          const useSsl = process.env.TIDB_ENABLE_SSL === "true";

          function buildDbCredentials() {
            if (!useSsl) {
              return {
                url: connectionString,
              };
            }

            const url = new URL(connectionString);

            return {
              host: url.hostname,
              port: Number(url.port || 4000),
              user: decodeURIComponent(url.username),
              password: decodeURIComponent(url.password),
              database: url.pathname.replace(/^\//, ""),
              ssl: {
                minVersion: "TLSv1.2",
              },
            };
          }

          export default defineConfig({
            schema: [
              "./drizzle/schema.ts",
              "./drizzle/food-signals-schema.ts",
              "./drizzle/professional-schema.ts",
              "./drizzle/billing-schema.ts",
            ],
            out: "./drizzle",
            dialect: "mysql",
            dbCredentials: buildDbCredentials(),
          });
          EOF

            git add drizzle.config.ts
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "${unresolved}" ]]; then
            echo "Unresolved merge conflicts remain:" >&2
            printf '%s\n' "${unresolved}" >&2
            exit 1
          fi

          git checkout origin/develop -- .github/workflows/agent-check.yml
          rm -f .github/workflows/sync-870-develop.yml .github/sync-870-trigger
          git add -A
          git diff --check --cached
          git commit -m "chore: synchronize billing foundation with develop"
          git push origin HEAD:sync/870-rebuild-on-develop

      - name: Upload synchronization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-870-diagnostics-${{ github.sha }}
          path: /tmp/sync-870.log
          if-no-files-found: warn
          retention-days: 3
