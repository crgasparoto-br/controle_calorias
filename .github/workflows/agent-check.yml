name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Delivery V2 risk
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      risk_profile: ${{ steps.risk.outputs.risk_profile }}
      requested_risk: ${{ steps.risk.outputs.requested_risk }}
      promoted: ${{ steps.risk.outputs.promoted }}
      docs_required: ${{ steps.risk.outputs.docs_required }}
      code_changed: ${{ steps.risk.outputs.code_changed }}
      database_required: ${{ steps.risk.outputs.database_required }}
      changed_paths_json: ${{ steps.risk.outputs.changed_paths_json }}
      reasons_json: ${{ steps.risk.outputs.reasons_json }}
    steps:
      - name: Checkout PR head for classifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Collect changed paths
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            require('node:fs').writeFileSync(
              '/tmp/delivery-v2-changed-paths.json',
              JSON.stringify(files.map((file) => file.filename))
            );

      - name: Classify PR deterministically
        id: risk
        env:
          DELIVERY_V2_REQUESTED_RISK: ${{ vars.DELIVERY_V2_RISK_PROFILE || 'auto' }}
        run: node scripts/delivery-v2-ci-classifier.mjs --paths-file /tmp/delivery-v2-changed-paths.json

      - name: Publish classification summary
        run: |
          {
            echo "## Delivery V2 risk"
            echo ""
            echo "- Requested: \`${{ steps.risk.outputs.requested_risk }}\`"
            echo "- Effective: \`${{ steps.risk.outputs.risk_profile }}\`"
            echo "- Promoted: \`${{ steps.risk.outputs.promoted }}\`"
            echo "- Reasons: \`${{ steps.risk.outputs.reasons_json }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  merge-preview-integration:
    name: Merge preview integration
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.result == 'success'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory

    steps:
      - name: Checkout merge preview
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: needs.classify.outputs.code_changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: needs.classify.outputs.code_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: needs.classify.outputs.code_changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: TypeScript integration check
        if: needs.classify.outputs.code_changed == 'true'
        run: pnpm check

      - name: Merge preview scope
        run: |
          echo "Merge preview intentionally validates integration/type compatibility only."
          echo "Vitest executes once on the exact PR head according to Delivery V2 risk."

  agent-check:
    name: Agent-first gate
    needs: [classify, merge-preview-integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_OPTIONS: --max-old-space-size=4096
      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
      VERIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DELIVERY_V2_RISK_PROFILE: ${{ github.event_name == 'pull_request' && needs.classify.outputs.risk_profile || 'critical' }}

    steps:
      - name: Require Delivery V2 classification
        if: github.event_name == 'pull_request' && needs.classify.result != 'success'
        run: |
          echo "Delivery V2 classification did not succeed: ${{ needs.classify.result }}"
          exit 1

      - name: Require merge-preview integration
        if: github.event_name == 'pull_request' && needs.merge-preview-integration.result != 'success'
        run: |
          echo "Merge preview integration did not succeed: ${{ needs.merge-preview-integration.result }}"
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.VERIFICATION_HEAD_SHA }}

      - name: Delivery V2 classifier self-test
        run: node --test scripts/delivery-v2-ci-classifier.test.mjs

      - name: Setup pnpm
        if: github.event_name != 'pull_request' || needs.classify.outputs.code_changed == 'true' || needs.classify.outputs.docs_required == 'true' || needs.classify.outputs.risk_profile != 'fast'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || needs.classify.outputs.code_changed == 'true' || needs.classify.outputs.docs_required == 'true' || needs.classify.outputs.risk_profile != 'fast'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        if: github.event_name != 'pull_request' || needs.classify.outputs.code_changed == 'true' || needs.classify.outputs.docs_required == 'true' || needs.classify.outputs.risk_profile != 'fast'
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        if: github.event_name != 'pull_request' || needs.classify.outputs.code_changed == 'true'
        run: |
          if ! pnpm check > /tmp/typescript-check.log 2>&1; then
            echo "TypeScript check failed. Showing the final 250 log lines:"
            tail -n 250 /tmp/typescript-check.log
            exit 1
          fi
          cat /tmp/typescript-check.log

      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-typescript-log
          path: /tmp/typescript-check.log
          if-no-files-found: ignore
          retention-days: 3

      - name: FAST related tests
        if: github.event_name == 'pull_request' && needs.classify.outputs.risk_profile == 'fast' && needs.classify.outputs.code_changed == 'true'
        env:
          NODE_ENV: test
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          git fetch --no-tags origin "${BASE_REF}"
          mapfile -t changed_files < <(git diff --name-only "origin/${BASE_REF}...HEAD")
          test_files=()
          source_files=()
          for file in "${changed_files[@]}"; do
            case "$file" in
              *.test.ts|*.test.tsx|*.test.js|*.test.jsx|*.spec.ts|*.spec.tsx|*.spec.js|*.spec.jsx)
                test_files+=("$file")
                ;;
              *.ts|*.tsx|*.js|*.jsx)
                source_files+=("$file")
                ;;
            esac
          done

          if [ "${#test_files[@]}" -gt 0 ]; then
            pnpm exec vitest run "${test_files[@]}" --passWithNoTests --maxWorkers=2 --minWorkers=1
          fi
          if [ "${#source_files[@]}" -gt 0 ]; then
            pnpm exec vitest related "${source_files[@]}" --run --passWithNoTests --maxWorkers=2 --minWorkers=1
          fi
          if [ "${#test_files[@]}" -eq 0 ] && [ "${#source_files[@]}" -eq 0 ]; then
            echo "No JavaScript/TypeScript files require focused Vitest execution."
          fi

      - name: Full tests
        if: github.event_name != 'pull_request' || needs.classify.outputs.risk_profile != 'fast'
        env:
          NODE_ENV: test
        run: |
          : > /tmp/vitest.log
          # Equivalent to pnpm test, split into sequential single-worker shards to bound memory.
          for shard_number in $(seq 1 24); do
            shard="${shard_number}/24"
            echo "Running Vitest shard ${shard}" | tee -a /tmp/vitest.log
            if ! pnpm exec vitest run --shard="${shard}" --maxWorkers=1 --minWorkers=1 >> /tmp/vitest.log 2>&1; then
              echo "Vitest shard ${shard} failed. Showing the final 250 log lines:"
              tail -n 250 /tmp/vitest.log
              exit 1
            fi
          done
          tail -n 120 /tmp/vitest.log

      - name: Upload Vitest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-vitest-log
          path: /tmp/vitest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Architecture check
        if: github.event_name != 'pull_request' || needs.classify.outputs.risk_profile != 'fast'
        run: pnpm architecture:check

      - name: Documentation check
        if: github.event_name != 'pull_request' || needs.classify.outputs.docs_required == 'true' || needs.classify.outputs.risk_profile == 'critical'
        run: |
          if ! pnpm docs:check > /tmp/docs-check.log 2>&1; then
            echo "Documentation check failed. Showing the final 250 log lines:"
            tail -n 250 /tmp/docs-check.log
            exit 1
          fi
          cat /tmp/docs-check.log

      - name: Upload documentation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-docs-log
          path: /tmp/docs-check.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build
        if: github.event_name != 'pull_request' || needs.classify.outputs.code_changed == 'true' || needs.classify.outputs.risk_profile != 'fast'
        run: pnpm build

      - name: Agent check
        if: github.event_name != 'pull_request' || needs.classify.outputs.risk_profile == 'critical'
        env:
          CI_SHARDED_TESTS_COMPLETE: "1"
        run: pnpm agent:check

      - name: Upload billing admin visual evidence
        if: github.event_name != 'pull_request' || needs.classify.outputs.risk_profile == 'critical'
        uses: actions/upload-artifact@v4
        with:
          name: billing-admin-visual-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/billing-admin
          if-no-files-found: error
          retention-days: 30

      - name: CI gate docs check
        if: github.event_name != 'pull_request' || needs.classify.outputs.risk_profile == 'critical'
        run: pnpm exec tsx scripts/check-ci-gate-docs.ts

      - name: Create exact-head verification manifest
        run: |
          mkdir -p /tmp/agent-first-verification
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          cat > /tmp/agent-first-verification/manifest.json <<MANIFEST
          {
            "schemaVersion": 3,
            "repository": "${GITHUB_REPOSITORY}",
            "headSha": "${VERIFICATION_HEAD_SHA}",
            "checkoutSha": "${CHECKOUT_SHA}",
            "eventSha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "workflow": "${GITHUB_WORKFLOW}",
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "riskProfile": "${DELIVERY_V2_RISK_PROFILE}",
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          MANIFEST
          node --input-type=module -e 'import fs from "node:fs"; const value = JSON.parse(fs.readFileSync("/tmp/agent-first-verification/manifest.json", "utf8")); if (value.headSha !== process.env.VERIFICATION_HEAD_SHA) throw new Error("verification manifest does not match PR head"); if (value.checkoutSha !== value.headSha) throw new Error(`exact-head gate executed ${value.checkoutSha} instead of ${value.headSha}`);'
          cat /tmp/agent-first-verification/manifest.json

      - name: Upload exact-head verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/agent-first-verification/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create exact-head repository bundle
        run: |
          mkdir -p /tmp/agent-first-repository
          git fetch --no-tags origin "${VERIFICATION_HEAD_SHA}"
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref || github.ref_name }}"
          git update-ref refs/orchestrator/head "${VERIFICATION_HEAD_SHA}"
          git update-ref refs/orchestrator/base "origin/${{ github.event.pull_request.base.ref || github.ref_name }}"
          git bundle create /tmp/agent-first-repository/repository.bundle \
            refs/orchestrator/head refs/orchestrator/base
          git bundle verify /tmp/agent-first-repository/repository.bundle
          cat > /tmp/agent-first-repository/manifest.json <<BUNDLE
          {
            "schemaVersion": 1,
            "repository": "${GITHUB_REPOSITORY}",
            "headSha": "${VERIFICATION_HEAD_SHA}",
            "baseRef": "${{ github.event.pull_request.base.ref || github.ref_name }}",
            "baseSha": "$(git rev-parse refs/orchestrator/base)",
            "runId": "${GITHUB_RUN_ID}",
            "createdAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          BUNDLE

      - name: Upload exact-head repository bundle
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-repository-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/agent-first-repository
          if-no-files-found: error
          retention-days: 7

      - name: Database integrity check
        if: ${{ env.DATABASE_URL != '' && (github.event_name != 'pull_request' || needs.classify.outputs.risk_profile == 'critical') }}
        run: pnpm db:check-integrity

      - name: Database integrity check skipped
        if: ${{ env.DATABASE_URL == '' && (github.event_name != 'pull_request' || needs.classify.outputs.risk_profile == 'critical') }}
        run: echo "DATABASE_URL not available; pnpm db:check-integrity skipped."

      - name: Gate summary
        if: always()
        run: |
          {
            echo "## Agent-first gate"
            echo ""
            echo "Required status check: Agent-first gate"
            echo "Delivery V2 risk profile: ${DELIVERY_V2_RISK_PROFILE}"
            echo ""
            echo "PR policy: FAST uses pnpm check + Vitest related + affected build/docs; STANDARD uses pnpm check + pnpm test equivalent once + architecture + build; CRITICAL and pushes use the complete gate."
            echo "Vercel preview/deploy checks are complementary and do not replace this gate."
          } >> "$GITHUB_STEP_SUMMARY"
