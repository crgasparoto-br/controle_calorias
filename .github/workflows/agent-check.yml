name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  apply-epic-779-regression-fixes:
    name: Apply epic 779 regression fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/779-concluir-auditoria
          fetch-depth: 0
      - name: Apply validated patch and restore official gate
        run: |
          base64 -d .github/issue779-round2/final.b64 > /tmp/round2.patch.gz
          gunzip -c /tmp/round2.patch.gz > /tmp/round2.patch
          git apply --index /tmp/round2.patch
          rm -rf .github/issue779-round2
          rm -rf .github/issue779-round2-files
          rm -f .github/workflows/apply-779-round2.yml
          git fetch origin develop
          git show origin/develop:.github/workflows/agent-check.yml > .github/workflows/agent-check.yml
          git add -A
      - name: Commit final regression alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test(whatsapp): alinhar regressões ao contrato final da epic 779"
          git push origin HEAD:fix/779-concluir-auditoria
