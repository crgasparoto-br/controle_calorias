name: Rebuild PR 870 on develop

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.pull_request.head.ref == 'sync/870-rebuild-on-develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout synchronized branch
        uses: actions/checkout@v4
        with:
          ref: sync/870-rebuild-on-develop
          fetch-depth: 0

      - name: Merge validated billing foundation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git fetch origin 2460c9a06b13dccc54184a3a308d6953003707e1

          set +e
          git merge --no-ff --no-commit 2460c9a06b13dccc54184a3a308d6953003707e1
          merge_status=$?
          set -e

          if [[ "$merge_status" -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=("docs/RELIABILITY.md" "drizzle.config.ts")

            if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
              echo "Unexpected merge conflicts: ${conflicts[*]}" >&2
              exit 1
            fi

            cat > drizzle.config.ts <<'EOF'
          import { defineConfig } from "drizzle-kit";

          const connectionString = process.env.DATABASE_URL;

          if (!connectionString) {
            throw new Error("DATABASE_URL is required to run drizzle commands");
          }

          const useSsl = process.env.TIDB_ENABLE_SSL === "true";

          function buildDbCredentials() {
            if (!useSsl) {
              return {
                url: connectionString,
              };
            }

            const url = new URL(connectionString);

            return {
              host: url.hostname,
              port: Number(url.port || 4000),
              user: decodeURIComponent(url.username),
              password: decodeURIComponent(url.password),
              database: url.pathname.replace(/^\//, ""),
              ssl: {
                minVersion: "TLSv1.2",
              },
            };
          }

          export default defineConfig({
            schema: [
              "./drizzle/schema.ts",
              "./drizzle/food-signals-schema.ts",
              "./drizzle/professional-schema.ts",
              "./drizzle/billing-schema.ts",
            ],
            out: "./drizzle",
            dialect: "mysql",
            dbCredentials: buildDbCredentials(),
          });
          EOF

            git checkout --ours docs/RELIABILITY.md

            python - <<'PY'
          from pathlib import Path

          path = Path("docs/RELIABILITY.md")
          text = path.read_text(encoding="utf-8")

          flow_line = "- Elegibilidade, capacidade profissional e eventos idempotentes de billing.\n"
          anchor = "- Migrações e integridade referencial.\n"
          if flow_line not in text:
              if anchor not in text:
                  raise SystemExit("Reliability flow anchor not found")
              text = text.replace(anchor, anchor + flow_line, 1)

          billing_section = """
          ## Guardrails de billing

          - `BILLING_ACCESS_MODE` permanece `open_access` até aprovação explícita da migração comercial; em `enforced`, indisponibilidade da fonte falha fechada.
          - Evento do provider é idempotente por `(provider, providerEventId)` e nunca depende do retorno do navegador para ativar acesso.
          - Reserva de capacidade bloqueia a assinatura dentro da transação; concorrência pela última vaga deve produzir um vencedor e uma rejeição clara.
          - Reserva, liberação e revogação são repetíveis sem duplicar vaga, entitlement ou auditoria.
          - Falha após reserva comercial deve ser compensada; revogação iniciada pelo paciente não pode ser bloqueada por indisponibilidade comercial.
          - O workflow `Billing persistence TiDB gate` valida migration, drift Drizzle, concorrência, idempotência, sanitização e integridade antes do merge.
          """.strip()

          if "## Guardrails de billing" not in text:
              text = text.rstrip() + "\n\n" + billing_section + "\n"

          path.write_text(text, encoding="utf-8")
          PY

            git add docs/RELIABILITY.md drizzle.config.ts
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git checkout origin/develop -- .github/workflows/agent-check.yml
          rm -f .github/workflows/sync-870-develop.yml .github/sync-870-trigger
          git add -A
          git diff --check --cached
          git commit -m "chore: synchronize billing foundation with develop"
          git push origin HEAD:sync/870-rebuild-on-develop
