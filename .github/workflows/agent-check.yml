name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  agent-check:
    if: github.head_ref == 'fix/whatsapp-generic-clarification-consistency'
    name: Agent-first gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-generic-clarification-consistency
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update legacy assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path("server/modules/whatsapp/llmIntentActions.test.ts")
          text = path.read_text(encoding="utf-8")
          old = '      reply: expect.stringContaining("Você quer registrar ou consultar?"),'
          new = '      reply: expect.stringContaining(WHATSAPP_GENERIC_CLARIFICATION_MESSAGE),'
          if old not in text:
              raise SystemExit("Legacy assertion not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Restore official gate definition
        run: |
          git fetch origin develop
          git show origin/develop:.github/workflows/agent-check.yml > .github/workflows/agent-check.yml

      - name: Validate focused tests
        run: |
          pnpm check
          pnpm vitest run server/modules/whatsapp/genericClarificationMessage.test.ts server/modules/whatsapp/service.test.ts server/modules/whatsapp/llmIntentActions.test.ts
          pnpm docs:check

      - name: Commit corrected assertion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/agent-check.yml server/modules/whatsapp/llmIntentActions.test.ts
          git commit -m "test(whatsapp): alinhar baixa confianca com mensagem canonica"
          git push origin HEAD:fix/whatsapp-generic-clarification-consistency
