name: Export issue 879 implementation source

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'feat/875-professional-context-routes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Archive repository with Git history
        run: |
          mkdir -p artifacts/source
          printf '{"headSha":"%s","baseRef":"develop","issue":879}\n' "$(git rev-parse HEAD)" > artifacts/source/source.json
          tar --exclude='./node_modules' --exclude='./artifacts' -czf artifacts/source/controle_calorias-with-git.tar.gz .

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: issue-879-source-${{ github.event.pull_request.head.sha }}
          path: artifacts/source
          if-no-files-found: error
          retention-days: 7
