name: Cleanup PR 870 temporary branches

on:
  pull_request:
    branches:
      - develop
    types:
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'audit/870-exact-sha-export'
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary synchronization branches
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            sync/870-develop-into-billing-foundation
            sync/870-develop-into-billing-foundation-copy
            sync/870-develop-into-billing-foundation-2
            sync/870-develop-into-billing-foundation-final
            sync/870-develop-into-billing-foundation-actual
            sync/870-develop-into-billing-foundation-check
            sync/870-develop-into-billing-foundation-pr
            sync/870-rebuild-on-develop
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${branch}" >/dev/null 2>&1; then
              git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete "${branch}"
            fi
          done

          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete audit/870-exact-sha-export
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
