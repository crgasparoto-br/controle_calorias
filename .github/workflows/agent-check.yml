name: Export exact PR 870 repository

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  export-exact-repository:
    if: github.event.pull_request.head.ref == 'audit/870-exact-sha-export'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validated SHA
        uses: actions/checkout@v4
        with:
          ref: 7dcfd45bedf7a6eab7ac8c2a068f9d4deb13c84e
          fetch-depth: 0

      - name: Verify exact repository state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7dcfd45bedf7a6eab7ac8c2a068f9d4deb13c84e"
          git cat-file -e cbc7ad98f78cd4b95e336efe009b57a7d5cc2b22^{commit}
          test -z "$(git status --porcelain)"
          git fsck --no-dangling

      - name: Package exact repository
        shell: bash
        run: |
          set -euo pipefail
          git gc --prune=now
          mkdir -p /tmp/issue-870-exact
          cp -a . /tmp/issue-870-exact/repository
          tar -C /tmp/issue-870-exact -czf /tmp/controle-calorias-870-exact.tgz repository
          sha256sum /tmp/controle-calorias-870-exact.tgz | tee /tmp/controle-calorias-870-exact.sha256

      - name: Upload exact repository
        uses: actions/upload-artifact@v4
        with:
          name: issue-870-exact-repository-7dcfd45bedf7a6eab7ac8c2a068f9d4deb13c84e
          path: |
            /tmp/controle-calorias-870-exact.tgz
            /tmp/controle-calorias-870-exact.sha256
          if-no-files-found: error
          retention-days: 3
