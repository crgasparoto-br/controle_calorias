name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  agent-check:
    name: Agent-first gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Tests
        run: |
          if ! pnpm test > /tmp/vitest.log 2>&1; then
            echo "Vitest failed. Showing the final 250 log lines:"
            tail -n 250 /tmp/vitest.log
            exit 1
          fi
          tail -n 80 /tmp/vitest.log

      - name: Upload Vitest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-vitest-log
          path: /tmp/vitest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Architecture check
        run: pnpm architecture:check

      - name: Documentation check
        run: |
          if ! pnpm docs:check > /tmp/docs-check.log 2>&1; then
            echo "Documentation check failed. Showing the final 250 log lines:"
            tail -n 250 /tmp/docs-check.log
            exit 1
          fi
          cat /tmp/docs-check.log

      - name: Upload documentation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-docs-log
          path: /tmp/docs-check.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build
        run: pnpm build

      - name: Agent check
        run: pnpm agent:check

      - name: CI gate docs check
        run: pnpm exec tsx scripts/check-ci-gate-docs.ts

      - name: Create verification manifest
        run: |
          mkdir -p /tmp/issue-857-verification
          cat > /tmp/issue-857-verification/manifest.json <<EOF
          {
            "schemaVersion": 1,
            "issue": 857,
            "repository": "${GITHUB_REPOSITORY}",
            "commitSha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "workflow": "${GITHUB_WORKFLOW}",
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat /tmp/issue-857-verification/manifest.json

      - name: Upload verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: issue-857-verification-${{ github.sha }}
          path: /tmp/issue-857-verification/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Database integrity check
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          pnpm db:check-integrity
          {
            echo "## Agent-first gate"
            echo ""
            echo "Required status check: Agent-first gate"
            echo ""
            echo "Validated commands:"
            echo "- pnpm check"
            echo "- pnpm test"
            echo "- pnpm architecture:check"
            echo "- pnpm docs:check"
            echo "- pnpm build"
            echo "- pnpm agent:check"
            echo "- pnpm db:check-integrity"
            echo ""
            echo "Database integrity: executed with DATABASE_URL."
            echo "Vercel preview/deploy checks are complementary and do not replace this gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Database integrity check skipped
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "DATABASE_URL not available; pnpm db:check-integrity skipped."
          {
            echo "## Agent-first gate"
            echo ""
            echo "Required status check: Agent-first gate"
            echo ""
            echo "Validated commands:"
            echo "- pnpm check"
            echo "- pnpm test"
            echo "- pnpm architecture:check"
            echo "- pnpm docs:check"
            echo "- pnpm build"
            echo "- pnpm agent:check"
            echo ""
            echo "Database integrity: skipped because DATABASE_URL not available. PRs touching persistence must record alternative validation or residual risk."
            echo "Vercel preview/deploy checks are complementary and do not replace this gate."
          } >> "$GITHUB_STEP_SUMMARY"

  align-food-signal-schema:
    name: Align historical food signal schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/874-whatsapp-correction-completion
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add historical tables to canonical schema
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "drizzle/schema.ts";
          const content = fs.readFileSync(path, "utf8");
          const marker = 'export const userFoodFavorites = mysqlTable("user_food_favorites"';
          if (content.includes(marker)) process.exit(0);
          const anchor = `\nexport const foodAliases = mysqlTable("food_aliases", {`;
          if (!content.includes(anchor)) throw new Error("Schema anchor not found.");
          const tables = `
export const userFoodFavorites = mysqlTable("user_food_favorites", {
  id: int("id").autoincrement().primaryKey(),
  userId: int("user_id").notNull().references(() => users.id, { onDelete: "cascade" }),
  foodId: int("food_id").notNull().references(() => foods.id, { onDelete: "cascade" }),
  createdAt: timestamp("created_at").defaultNow().notNull(),
}, table => ({
  userFoodUnique: uniqueIndex("user_food_favorites_user_food_unique").on(table.userId, table.foodId),
  userIdIdx: index("user_food_favorites_user_id_idx").on(table.userId),
  foodIdIdx: index("user_food_favorites_food_id_idx").on(table.foodId),
}));

export const userFoodUsageStats = mysqlTable("user_food_usage_stats", {
  id: int("id").autoincrement().primaryKey(),
  userId: int("user_id").notNull().references(() => users.id, { onDelete: "cascade" }),
  foodId: int("food_id").notNull().references(() => foods.id, { onDelete: "cascade" }),
  usageCount: int("usage_count").default(0).notNull(),
  lastUsedAt: timestamp("last_used_at").defaultNow().notNull(),
  createdAt: timestamp("created_at").defaultNow().notNull(),
  updatedAt: timestamp("updated_at").defaultNow().onUpdateNow().notNull(),
}, table => ({
  userFoodUnique: uniqueIndex("user_food_usage_stats_user_food_unique").on(table.userId, table.foodId),
  userRecentIdx: index("user_food_usage_stats_user_recent_idx").on(table.userId, table.lastUsedAt),
  foodIdIdx: index("user_food_usage_stats_food_id_idx").on(table.foodId),
}));
`;
          fs.writeFileSync(path, content.replace(anchor, `\n${tables}${anchor}`));
          NODE
          pnpm exec prettier --write drizzle/schema.ts

      - name: Align latest snapshot without duplicate migration
        run: |
          cp drizzle/meta/0035_snapshot.json /tmp/original-0035-snapshot.json
          cp drizzle/meta/_journal.json /tmp/original-journal.json
          find drizzle/meta -maxdepth 1 -name '*_snapshot.json' -printf '%f\n' | sort > /tmp/snapshots-before.txt
          pnpm exec drizzle-kit generate --name issue874_schema_alignment > /tmp/schema-alignment-generate.log 2>&1
          find drizzle/meta -maxdepth 1 -name '*_snapshot.json' -printf '%f\n' | sort > /tmp/snapshots-after.txt
          comm -13 /tmp/snapshots-before.txt /tmp/snapshots-after.txt > /tmp/new-snapshots.txt
          test "$(wc -l < /tmp/new-snapshots.txt)" -eq 1
          new_snapshot="drizzle/meta/$(cat /tmp/new-snapshots.txt)"
          new_sql="$(find drizzle -maxdepth 1 -type f -name '*issue874_schema_alignment.sql' -print -quit)"
          test -n "$new_sql"
          node --input-type=module - "$new_snapshot" <<'NODE'
          import fs from "node:fs";
          const generatedPath = process.argv[2];
          const original = JSON.parse(fs.readFileSync("/tmp/original-0035-snapshot.json", "utf8"));
          const generated = JSON.parse(fs.readFileSync(generatedPath, "utf8"));
          generated.prevId = original.prevId;
          fs.writeFileSync("drizzle/meta/0035_snapshot.json", `${JSON.stringify(generated, null, 2)}\n`);
          NODE
          rm "$new_snapshot" "$new_sql"
          cp /tmp/original-journal.json drizzle/meta/_journal.json
          pnpm exec prettier --write drizzle/meta/0035_snapshot.json

      - name: Regenerate database documentation
        run: pnpm docs:generate:db

      - name: Prove schema generation is neutral
        run: |
          cp drizzle/meta/_journal.json /tmp/verify-journal.json
          find drizzle/meta -maxdepth 1 -name '*_snapshot.json' -printf '%f\n' | sort > /tmp/verify-before.txt
          pnpm exec drizzle-kit generate --name issue874_schema_verify > /tmp/schema-verify.log 2>&1
          find drizzle/meta -maxdepth 1 -name '*_snapshot.json' -printf '%f\n' | sort > /tmp/verify-after.txt
          comm -13 /tmp/verify-before.txt /tmp/verify-after.txt > /tmp/verify-new.txt
          if test -s /tmp/verify-new.txt || find drizzle -maxdepth 1 -type f -name '*issue874_schema_verify.sql' | grep -q .; then
            cat /tmp/schema-verify.log
            exit 1
          fi
          cmp -s drizzle/meta/_journal.json /tmp/verify-journal.json

      - name: Validate schema alignment
        run: |
          pnpm check
          pnpm agent:check
          pnpm build
          git diff --check
          grep -q 'user_food_favorites' drizzle/schema.ts
          grep -q 'user_food_usage_stats' drizzle/schema.ts
          grep -q 'user_food_favorites' drizzle/meta/0035_snapshot.json
          grep -q 'user_food_usage_stats' drizzle/meta/0035_snapshot.json
          grep -q 'user_food_favorites' docs/generated/db-schema.md
          grep -q 'user_food_usage_stats' docs/generated/db-schema.md

      - name: Commit validated schema alignment
        run: |
          rm -f schema-alignment-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/schema.ts drizzle/meta/0035_snapshot.json docs/generated/db-schema.md
          git commit -m "fix: alinhar schema dos sinais alimentares"
          git push origin HEAD:fix/874-whatsapp-correction-completion

      - name: Publish failure diagnostic
        if: failure()
        run: |
          {
            echo "Schema alignment failed."
            echo
            echo "Generate log:"
            cat /tmp/schema-alignment-generate.log 2>/dev/null || true
            echo
            echo "Verify log:"
            cat /tmp/schema-verify.log 2>/dev/null || true
            echo
            echo "Git status:"
            git status --short
          } > schema-alignment-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schema-alignment-diagnostic.txt
          git commit -m "chore: registrar diagnostico do alinhamento de schema" || true
          git push origin HEAD:fix/874-whatsapp-correction-completion || true
