name: Agent-first gate

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  agent-check:
    name: Agent-first gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_OPTIONS: --max-old-space-size=4096
      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
      VERIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare and validate issue 880 corrected source
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/875-professional-context-routes'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          workspace = Path("client/src/pages/professional/ProfessionalPatientWorkspace.tsx")
          source = workspace.read_text(encoding="utf-8")

          hook_old = "function useUnsavedNavigationGuard(dirty: boolean, currentPath: string) {"
          hook_new = "export function useUnsavedNavigationGuard(dirty: boolean, currentPath: string) {"
          if source.count(hook_old) != 1:
              raise SystemExit("expected one unsaved navigation hook declaration")
          source = source.replace(hook_old, hook_new, 1)

          selector_old = "[data-professional-navigation], nav[aria-label='Navegação da Área Profissional'] button, button[aria-label='Ir para o início da Área Profissional']"
          selector_new = "[data-professional-navigation], nav[aria-label='Navegação da Área Profissional'] button, [data-sidebar='footer'] button, button[aria-label='Ir para o início da Área Profissional']"
          if source.count(selector_old) != 1:
              raise SystemExit("expected one professional navigation selector")
          source = source.replace(selector_old, selector_new, 1)

          old_can_navigate = '''    canNavigate() {
              if (!dirty || window.confirm(UNSAVED_MESSAGE)) {
                allowNavigationRef.current = true;
                return true;
              }
              return false;
            },'''.replace("              ", "      ")
          new_can_navigate = '''    canNavigate() {
              if (allowNavigationRef.current || !dirty) {
                allowNavigationRef.current = true;
                return true;
              }
              if (window.confirm(UNSAVED_MESSAGE)) {
                allowNavigationRef.current = true;
                return true;
              }
              return false;
            },'''.replace("              ", "      ")
          if source.count(old_can_navigate) != 1:
              raise SystemExit("expected one current canNavigate implementation")
          workspace.write_text(
              source.replace(old_can_navigate, new_can_navigate, 1),
              encoding="utf-8",
          )

          test = Path("client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx")
          test.write_text(r'''// @vitest-environment jsdom
import React from "react";
import { cleanup, render, screen } from "@testing-library/react";
import userEvent from "@testing-library/user-event";
import { afterEach, describe, expect, it, vi } from "vitest";
import { useUnsavedNavigationGuard } from "./professional/ProfessionalPatientWorkspace";

function NavigationHarness({
  direct = false,
  dirty = true,
  footer = false,
  onNavigate,
}: {
  direct?: boolean;
  dirty?: boolean;
  footer?: boolean;
  onNavigate: () => void;
}) {
  const guard = useUnsavedNavigationGuard(
    dirty,
    "/professional/patients/41/assessment"
  );
  const button = (
    <button
      type="button"
      data-professional-navigation={footer ? undefined : true}
      onClick={() => {
        if (direct || guard.canNavigate()) onNavigate();
      }}
    >
      Navegar
    </button>
  );
  return footer ? <div data-sidebar="footer">{button}</div> : button;
}

afterEach(() => {
  cleanup();
  vi.restoreAllMocks();
});

describe("professional workspace unsaved navigation", () => {
  it("uses exactly one confirmation when discard is accepted", async () => {
    const confirm = vi.spyOn(window, "confirm").mockReturnValue(true);
    const onNavigate = vi.fn();
    render(<NavigationHarness onNavigate={onNavigate} />);

    await userEvent.click(screen.getByRole("button", { name: "Navegar" }));

    expect(confirm).toHaveBeenCalledTimes(1);
    expect(onNavigate).toHaveBeenCalledTimes(1);
  });

  it("preserves the draft when navigation is cancelled", async () => {
    const confirm = vi.spyOn(window, "confirm").mockReturnValue(false);
    const onNavigate = vi.fn();
    render(<NavigationHarness onNavigate={onNavigate} />);

    await userEvent.click(screen.getByRole("button", { name: "Navegar" }));

    expect(confirm).toHaveBeenCalledTimes(1);
    expect(onNavigate).not.toHaveBeenCalled();
  });

  it("protects the direct Minha alimentação footer exit", async () => {
    const confirm = vi.spyOn(window, "confirm").mockReturnValue(false);
    const onNavigate = vi.fn();
    render(<NavigationHarness direct footer onNavigate={onNavigate} />);

    await userEvent.click(screen.getByRole("button", { name: "Navegar" }));

    expect(confirm).toHaveBeenCalledTimes(1);
    expect(onNavigate).not.toHaveBeenCalled();
  });

  it("does not ask for confirmation after the draft is clean", async () => {
    const confirm = vi.spyOn(window, "confirm");
    const onNavigate = vi.fn();
    render(<NavigationHarness dirty={false} onNavigate={onNavigate} />);

    await userEvent.click(screen.getByRole("button", { name: "Navegar" }));

    expect(confirm).not.toHaveBeenCalled();
    expect(onNavigate).toHaveBeenCalledTimes(1);
  });
});
''', encoding="utf-8")

          docs = Path("docs/testing/professional-workspace-routing.md")
          documentation = docs.read_text(encoding="utf-8")
          section = '''

## Proteção completa das saídas com rascunho — issue #880

- Toda saída visível do workspace, incluindo **Minha alimentação**, subnavegação, navegação principal, retorno à carteira e troca de paciente, participa do mesmo contrato de proteção de rascunho.
- A confirmação ocorre no máximo uma vez por tentativa de navegação. Uma confirmação já aceita pelo interceptor é reutilizada pelo handler da mesma transição.
- Cancelar preserva rota, paciente e campos montados; confirmar o descarte permite a navegação e o remount da rota de destino; após salvar, não há diálogo.
- O teste comportamental deve clicar nos controles protegidos, verificar o número de chamadas a `window.confirm` e comprovar que a navegação foi executada ou bloqueada conforme a decisão.
'''
          if "## Proteção completa das saídas com rascunho — issue #880" not in documentation:
              docs.write_text(documentation.rstrip() + section, encoding="utf-8")

          output = Path("artifacts/issue-880-corrected-source")
          (output / "client/src/pages/professional").mkdir(parents=True, exist_ok=True)
          (output / "client/src/pages").mkdir(parents=True, exist_ok=True)
          (output / "docs/testing").mkdir(parents=True, exist_ok=True)
          (output / "client/src/pages/professional/ProfessionalPatientWorkspace.tsx").write_text(
              workspace.read_text(encoding="utf-8"), encoding="utf-8"
          )
          (output / "client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx").write_text(
              test.read_text(encoding="utf-8"), encoding="utf-8"
          )
          (output / "docs/testing/professional-workspace-routing.md").write_text(
              docs.read_text(encoding="utf-8"), encoding="utf-8"
          )
          (output / "manifest.json").write_text(
              json.dumps(
                  {
                      "headSha": "${{ github.event.pull_request.head.sha }}",
                      "checkoutSha": "${{ github.sha }}",
                      "files": [
                          "client/src/pages/professional/ProfessionalPatientWorkspace.tsx",
                          "client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx",
                          "docs/testing/professional-workspace-routing.md",
                      ],
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY
          git diff --check
          pnpm exec vitest run \
            client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx \
            client/src/pages/ProfessionalAreaPage.draftDiscard.test.tsx \
            --maxWorkers=1 --minWorkers=1

      - name: Upload issue 880 corrected source
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/875-professional-context-routes'
        uses: actions/upload-artifact@v4
        with:
          name: issue-880-corrected-source-${{ github.event.pull_request.head.sha }}
          path: artifacts/issue-880-corrected-source
          if-no-files-found: error
          retention-days: 3

      - name: TypeScript check
        run: |
          if ! pnpm check > /tmp/typescript-check.log 2>&1; then
            echo "TypeScript check failed. Showing the final 250 log lines:"
            tail -n 250 /tmp/typescript-check.log
            exit 1
          fi
          cat /tmp/typescript-check.log

      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-typescript-log
          path: /tmp/typescript-check.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Tests
        env:
          NODE_ENV: test
        run: |
          : > /tmp/vitest.log
          # Equivalent to pnpm test, split into sequential single-worker shards to bound memory.
          for shard_number in $(seq 1 24); do
            shard="${shard_number}/24"
            echo "Running Vitest shard ${shard}" | tee -a /tmp/vitest.log
            if ! pnpm exec vitest run --shard="${shard}" --maxWorkers=1 --minWorkers=1 >> /tmp/vitest.log 2>&1; then
              echo "Vitest shard ${shard} failed. Showing the final 250 log lines:"
              tail -n 250 /tmp/vitest.log
              exit 1
            fi
          done
          tail -n 120 /tmp/vitest.log

      - name: Upload Vitest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-vitest-log
          path: /tmp/vitest.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Architecture check
        run: pnpm architecture:check

      - name: Documentation check
        run: |
          if ! pnpm docs:check > /tmp/docs-check.log 2>&1; then
            echo "Documentation check failed. Showing the final 250 log lines:"
            tail -n 250 /tmp/docs-check.log
            exit 1
          fi
          cat /tmp/docs-check.log

      - name: Upload documentation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-docs-log
          path: /tmp/docs-check.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build
        run: pnpm build

      - name: Agent check
        env:
          CI_SHARDED_TESTS_COMPLETE: "1"
        run: pnpm agent:check

      - name: CI gate docs check
        run: pnpm exec tsx scripts/check-ci-gate-docs.ts

      - name: Create exact-head verification manifest
        run: |
          mkdir -p /tmp/agent-first-verification
          cat > /tmp/agent-first-verification/manifest.json <<EOF
          {
            "schemaVersion": 2,
            "repository": "${GITHUB_REPOSITORY}",
            "headSha": "${VERIFICATION_HEAD_SHA}",
            "checkoutSha": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "workflow": "${GITHUB_WORKFLOW}",
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF}",
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          node --input-type=module -e 'import fs from "node:fs"; const value = JSON.parse(fs.readFileSync("/tmp/agent-first-verification/manifest.json", "utf8")); if (value.headSha !== process.env.VERIFICATION_HEAD_SHA) throw new Error("verification manifest does not match PR head");'
          cat /tmp/agent-first-verification/manifest.json

      - name: Upload exact-head verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: agent-first-verification-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/agent-first-verification/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Database integrity check
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          pnpm db:check-integrity
          {
            echo "## Agent-first gate"
            echo ""
            echo "Required status check: Agent-first gate"
            echo ""
            echo "Validated commands:"
            echo "- pnpm check"
            echo "- pnpm test (24 sequential single-worker shards)"
            echo "- pnpm architecture:check"
            echo "- pnpm docs:check"
            echo "- pnpm build"
            echo "- pnpm agent:check"
            echo "- pnpm db:check-integrity"
            echo ""
            echo "Database integrity: executed with DATABASE_URL."
            echo "Vercel preview/deploy checks are complementary and do not replace this gate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Database integrity check skipped
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "DATABASE_URL not available; pnpm db:check-integrity skipped."
          {
            echo "## Agent-first gate"
            echo ""
            echo "Required status check: Agent-first gate"
            echo ""
            echo "Validated commands:"
            echo "- pnpm check"
            echo "- pnpm test (24 sequential single-worker shards)"
            echo "- pnpm architecture:check"
            echo "- pnpm docs:check"
            echo "- pnpm build"
            echo "- pnpm agent:check"
            echo ""
            echo "Database integrity: skipped because DATABASE_URL not available. PRs touching persistence must record alternative validation or residual risk."
            echo "Vercel preview/deploy checks are complementary and do not replace this gate."
          } >> "$GITHUB_STEP_SUMMARY"
