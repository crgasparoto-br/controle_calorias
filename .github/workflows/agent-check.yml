name: Issue 922 cycle 7 documentation finalization

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize-remediation:
    name: Finalize issue 922 canonical documentation
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: feat/922-ai-capabilities-meal-whatsapp-rebased
      REQUIRED_ANCESTOR_SHA: 8a31c9e290685a5c4e8c3cb056f72589c2708473
      EXPECTED_DOC_PATCH_BLOB: eaca261db139015ff9600c9bb9fd8b7a5754c06d
      EXPECTED_FINALIZER_BLOB: 8f147282d68b2482aa1e21a01e415dac5eeac09f

    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Freeze compatible target branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${TARGET_BRANCH}"
          TARGET_SHA="$(git rev-parse FETCH_HEAD)"
          git merge-base --is-ancestor "${REQUIRED_ANCESTOR_SHA}" "${TARGET_SHA}"
          test "$(git rev-parse "${TARGET_SHA}:.audit/issue-922-docs.patch")" = "${EXPECTED_DOC_PATCH_BLOB}"
          test "$(git rev-parse "${TARGET_SHA}:.github/workflows/issue-922-finalize-remediation.yml")" = "${EXPECTED_FINALIZER_BLOB}"
          echo "TARGET_SHA=${TARGET_SHA}" >> "${GITHUB_ENV}"

      - name: Apply canonical documentation and remove staging
        run: |
          set -euo pipefail
          git checkout --detach "${TARGET_SHA}"
          git apply --check .audit/issue-922-docs.patch
          git apply .audit/issue-922-docs.patch
          git rm .audit/issue-922-docs.patch
          git rm .github/workflows/issue-922-finalize-remediation.yml
          git add README.md docs/PRIVACY_LGPD.md docs/RELIABILITY.md docs/design-docs/whatsapp-ingestion.md
          git diff --cached --check

      - name: Publish atomic documentation commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TREE_SHA="$(git write-tree)"
          NEW_COMMIT="$(printf '%s\n' 'docs(ai): finalize issue 922 production fallback contract' | git commit-tree "${TREE_SHA}" -p "${TARGET_SHA}")"
          git push origin "${NEW_COMMIT}:refs/heads/${TARGET_BRANCH}"
          echo "Published ${NEW_COMMIT} to ${TARGET_BRANCH}." >> "${GITHUB_STEP_SUMMARY}"
