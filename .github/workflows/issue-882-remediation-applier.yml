name: Apply issue 882 remediation

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/issue-882-remediation-applier.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/875-professional-context-routes

      - name: Apply verified remediation and remove trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "25702f3bbfbff8e0e7f1abc8fd273f9deefb5cf8"
          cat > /tmp/issue882.patch.b64 <<'PATCH_BASE64'
           HByb2Zlc3Npb25hbFVzZXJJZCA9ICR7cHJvZmVzc2lvbmFsVXNlcklkfQorICAgICAgICAgIEFORCBwYXRpZW50VXNlcklkID0gJHtpbnB1dC5wYXRpZW50SWR9CisgICAgICAgICAgQU5EI HN0YXRlID0gJ3BlbmRpbmcnCisgICAgICAgICAgQU5EI 
          PATCH_BASE64
          base64 -d /tmp/issue882.patch.b64 > /tmp/issue882.patch
          echo "569c09cb4028c5b86436d877f23f3f158d025daef331e8fae330e4c4046df9e4  /tmp/issue882.patch" | sha256sum -c -
          git apply --check /tmp/issue882.patch
          git apply /tmp/issue882.patch
          rm .github/workflows/issue-882-remediation-applier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/components/professional/ProfessionalMessagesExperience.tsx \
            client/src/components/professional/ProfessionalMessagesExperience.test.tsx \
            server/modules/professionals/messageService.ts \
            server/modules/professionals/messageService.idempotency.test.ts \
            .github/workflows/issue-882-remediation-applier.yml
          git commit -m "fix: close issue 882 audit findings"
          git push origin HEAD:feat/875-professional-context-routes
