name: Export branch source

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/export-branch-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove git metadata
        run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: controle-calorias-source
          path: .
          include-hidden-files: true
          retention-days: 1
