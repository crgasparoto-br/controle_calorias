name: Issue 923 remediation apply

on:
  push:
    branches:
      - feat/923-ai-capabilities-question-nutrition-embedding

permissions:
  contents: write

concurrency:
  group: issue-923-remediation-apply
  cancel-in-progress: false

jobs:
  apply-remediation:
    if: github.event.head_commit.message == 'ci: apply issue 923 remediation patch' || github.event.head_commit.message == 'ci: retrigger issue 923 remediation patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify trusted branch and delta
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "crgasparoto-br/controle_calorias"
          test "${GITHUB_REF_NAME}" = "feat/923-ai-capabilities-question-nutrition-embedding"
          git merge-base --is-ancestor e53deec63f9efdaae34c0a8fcf0b4f264dcdc48c HEAD
          unexpected="$(git diff --name-only e53deec63f9efdaae34c0a8fcf0b4f264dcdc48c...HEAD | grep -Ev '^(\.github/workflows/issue-923-remediation-apply\.yml|\.automation/issue923-remediation-trigger)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed before remediation:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Reconstruct and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/issue923.patch.gz.b64
          for blob in \
            17a32fa4959480a7e762730513e15ba6af5f9aea \
            c9e8efc933202e72f617322b951ee7a27589fa64 \
            7aee701c32eee90276d1ea205f6519586e074bd9 \
            8b95ff0a12095621de07a029eee63e54997a5a17 \
            213345872e5a503782c566b662d602197ab86cb6 \
            97fa4ce22736a7c65665f8f5a2091ce38be39fd4
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" --jq .content \
              | tr -d '\n' | base64 -d >> /tmp/issue923.patch.gz.b64
          done
          echo "956e591e14dce6b5721e71672f64fc35a623c1cf9e4356e08a8fec6582048578  /tmp/issue923.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/issue923.patch.gz.b64 | gzip -d > /tmp/issue923.patch
          echo "8e1118b4c2609b0a95b19cd4a55a09a7a35947c628cf6287930b4cfed358a317  /tmp/issue923.patch" | sha256sum -c -
          git apply --index --whitespace=error-all /tmp/issue923.patch
          git rm .github/workflows/issue-923-remediation-apply.yml
          if [ -f .automation/issue923-remediation-trigger ]; then
            git rm .automation/issue923-remediation-trigger
          fi
          git diff --cached --check

      - name: Commit and push remediation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ai): remediate issue 923 audit findings"
          git push origin HEAD:feat/923-ai-capabilities-question-nutrition-embedding
