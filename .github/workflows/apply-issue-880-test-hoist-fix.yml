name: Apply issue 880 test hoist fix

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/apply-issue-880-test-hoist-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-issue-880-test-hoist-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Apply verified Vitest hoist fix
        run: python3 .tmp/issue-880-test-hoist-fix/apply.py
      - name: Validate patch shape
        run: |
          git diff --check
          grep -q 'const mutation = vi.hoisted' client/src/pages/professional/ProfessionalPatientWorkspace.auditCorrections.test.tsx
      - name: Commit correction and remove temporary applicator
        run: |
          rm -rf .tmp/issue-880-test-hoist-fix
          rm -f .github/workflows/apply-issue-880-test-hoist-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: corrigir hoist do mock profissional"
          git push origin HEAD:feat/875-professional-context-routes
