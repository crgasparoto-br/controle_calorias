name: Sync develop for issue 879 final gate

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/sync-develop-879-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Merge current develop and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --no-ff --no-commit origin/develop
          git rm .github/workflows/sync-develop-879-final.yml
          git diff --cached --check
          git commit -m "chore: sync issue 879 final candidate with develop"
          git push origin HEAD:feat/875-professional-context-routes
