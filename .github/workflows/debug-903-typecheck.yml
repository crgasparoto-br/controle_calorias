name: Debug 903 TypeScript

on:
  pull_request:
    branches: [develop]

jobs:
  typecheck-diagnostics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          pnpm check > typecheck-903.log 2>&1
          status=$?
          cat typecheck-903.log
          echo "$status" > typecheck-903.status
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-903-diagnostics
          path: |
            typecheck-903.log
            typecheck-903.status
          if-no-files-found: error
