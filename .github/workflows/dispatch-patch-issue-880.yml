name: Dispatch issue 880 corrections

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/dispatch-patch-issue-880.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch correction workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/patch-issue-880-audit-findings.yml/dispatches \
            --data '{"ref":"feat/875-professional-context-routes"}'
