name: Issue 883 remediation bootstrap

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - .github/workflows/issue-883-remediation.yml

permissions:
  contents: write

jobs:
  apply-remediation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Apply audited remediation and regression test
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          source = Path("client/src/pages/professional/ProfessionalPatients.tsx")
          text = source.read_text()
          old = '''  const displayName =
            item.patientName ??
            (accessible ? item.patientEmail : null) ??
            `Paciente ${item.patientUserId}`;
          '''
          new = '''  const displayName =
            item.patientName ?? (accessible ? item.patientEmail : null) ?? "Paciente";
          '''
          if old not in text:
              raise SystemExit("expected patient display fallback was not found")
          source.write_text(text.replace(old, new))

          test = Path("client/src/pages/professional/ProfessionalPatients.test.tsx")
          text = test.read_text()
          marker = '''  it("validates the exact record resource before navigating to the contextual route", async () => {
          '''
          addition = '''  it("uses a neutral fallback without exposing the internal patient identifier", () => {
            window.history.replaceState({}, "", "/professional/patients");
            portfolioUseQuery.mockImplementation(() =>
              queryResult(
                1,
                [
                  {
                    authorizationId: "approved-without-identification",
                    patientUserId: 987654321,
                    patientName: null,
                    patientEmail: null,
                    authorizationStatus: "approved",
                    trackingStatus: "not_started",
                    lastFoodActivityAt: null,
                    nextReviewAt: null,
                  },
                ],
                1
              )
            );

            render(<ProfessionalPatients />);

            expect(screen.getByRole("heading", { name: "Paciente" })).not.toBeNull();
            expect(screen.getByText("Identificação não informada")).not.toBeNull();
            expect(screen.queryByText("Paciente 987654321")).toBeNull();
            expect(document.body.textContent).not.toContain("987654321");
          });

          '''
          if marker not in text:
              raise SystemExit("expected test insertion point was not found")
          if "uses a neutral fallback without exposing the internal patient identifier" in text:
              raise SystemExit("regression test already exists")
          test.write_text(text.replace(marker, addition + marker))
          PY

      - name: Commit remediation and remove bootstrap workflow
        shell: bash
        run: |
          git rm .github/workflows/issue-883-remediation.yml
          git add client/src/pages/professional/ProfessionalPatients.tsx \
            client/src/pages/professional/ProfessionalPatients.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: ocultar identificador interno na carteira profissional"
          git push origin HEAD:feat/875-professional-context-routes
