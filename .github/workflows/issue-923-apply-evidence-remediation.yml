name: Issue 923 evidence remediation applicator

on:
  push:
    branches:
      - feat/923-ai-capabilities-question-nutrition-embedding

permissions:
  contents: write

concurrency:
  group: issue-923-evidence-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: feat/923-ai-capabilities-question-nutrition-embedding
          fetch-depth: 0

      - name: Apply verified remediation
        shell: bash
        run: |
          set -euo pipefail
          cat .issue-loop/923/chunk-*.b64 | base64 --decode > /tmp/issue-923-evidence-fix.patch
          echo "0a3560d284838b8df93fb74497536cdee53a85e7f47700f6a918c0bb02ec4e69  /tmp/issue-923-evidence-fix.patch" | sha256sum -c -
          git apply --check /tmp/issue-923-evidence-fix.patch
          git apply /tmp/issue-923-evidence-fix.patch
          rm -rf .issue-loop/923
          rm -f .github/workflows/issue-923-apply-evidence-remediation.yml
          git diff --check
          node --experimental-strip-types --check server/nutritionEvidenceValidation.ts
          node --experimental-strip-types --check server/catalogSemanticSearch.ts
          node --experimental-strip-types --check server/nutritionEvidenceValidation.test.ts
          node --experimental-strip-types --check server/catalogSemanticSearch.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): validar concordância da evidência nutricional"
          git push origin HEAD:feat/923-ai-capabilities-question-nutrition-embedding
