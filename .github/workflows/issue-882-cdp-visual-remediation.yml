name: Apply issue 882 CDP visual remediation

on:
  pull_request:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".audit/issue-882-cdp-visual-remediation-trigger.txt"

permissions:
  contents: write

concurrency:
  group: issue-882-cdp-visual-remediation
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'chore/issue-882-cdp-visual-remediation-trigger'
    runs-on: ubuntu-latest
    env:
      PATCH_SHA256: 352a33967d4520e9c43903a1ac5a13c8baa2e99a649551f3137173bdfee427c7
      PATCH_BLOB: fe0f1455b99cb41997149323f12c47510ff81588
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 2

      - name: Fetch and verify CDP remediation patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB}" \
            | jq -r '.content' \
            | tr -d '\n' \
            | base64 -d \
            > /tmp/issue-882-cdp.patch
          echo "${PATCH_SHA256}  /tmp/issue-882-cdp.patch" | sha256sum -c -
          git apply --check /tmp/issue-882-cdp.patch

      - name: Apply CDP remediation and remove applicator
        run: |
          git apply --index /tmp/issue-882-cdp.patch
          git rm .github/workflows/issue-882-cdp-visual-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: capture issue 882 visual evidence through CDP"
          git push origin HEAD:feat/875-professional-context-routes
