name: Issue 875 visual audit

on:
  pull_request:
    branches: [develop]

jobs:
  capture-professional-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare visual fixture
        shell: bash
        run: |
          mkdir -p .visual-audit/screenshots
          cat > .visual-audit/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Área Profissional</title></head><body><div id="root"></div><script type="module" src="/main.tsx"></script></body></html>
          EOF
          cat > .visual-audit/mockAuth.ts <<'EOF'
          export function useAuth() {
            return {
              loading: false,
              user: { professionalProfileActive: true },
              refresh: async () => undefined,
            };
          }
          EOF
          cat > .visual-audit/mockWouter.ts <<'EOF'
          import { useState } from "react";
          export function useLocation() {
            const [location, setLocation] = useState("/professional");
            return [location, setLocation] as const;
          }
          EOF
          cat > .visual-audit/mockTrpc.ts <<'EOF'
          const resolved = async () => undefined;
          const query = (data: unknown) => ({
            data,
            isLoading: false,
            isError: false,
            isSuccess: true,
            isFetching: false,
            refetch: resolved,
          });
          const cache = { cancel: resolved, reset: resolved, invalidate: resolved };
          export const trpc = {
            useUtils: () => ({
              nutrition: { professionals: {
                patientTimeZone: cache,
                patientDashboard: cache,
                patientPeriodBundle: cache,
                history: cache,
              } },
              professionalRecord: {
                get: cache,
                messages: { list: cache },
                operationalAlerts: { list: cache },
                ai: { priorities: cache },
              },
            }),
            nutrition: { professionals: {
              profile: { useQuery: () => query({ active: true }) },
              myAccesses: { useQuery: () => query([]) },
              portfolio: { useQuery: () => query({
                items: [],
                pagination: { page: 1, pageSize: 10, total: 12, totalPages: 2 },
                summary: {
                  active: 8,
                  paused: 1,
                  ended: 2,
                  notStarted: 1,
                  pendingRequests: 3,
                  pendingReviews: 4,
                  pendingWeighings: 2,
                },
              }) },
            } },
            professionalRecord: { ai: { priorities: { useQuery: () => query([
              {
                patientId: 41,
                displayName: "Ana Carolina de Souza",
                highestSeverity: "urgent",
                alertCount: 3,
                updatedAt: Date.now() - 900000,
                signals: [
                  { type: "goal_review", label: "Revisão de meta", suggestedAction: "Revisar a meta nutricional e registrar a decisão." },
                  { type: "weighing", label: "Pesagem pendente", suggestedAction: "Solicitar uma nova pesagem." },
                ],
              },
              {
                patientId: 52,
                displayName: "Bruno Almeida com nome profissionalmente longo",
                highestSeverity: "attention",
                alertCount: 1,
                updatedAt: Date.now() - 3600000,
                signals: [
                  { type: "record", label: "Sem registros recentes", suggestedAction: "Verificar o relatório do período." },
                ],
              },
            ]) } } },
          };
          EOF
          cat > .visual-audit/main.tsx <<'EOF'
          import React from "react";
          import { createRoot } from "react-dom/client";
          import { TooltipProvider } from "@/components/ui/tooltip";
          import ProfessionalLayout from "@/components/ProfessionalLayout";
          import ProfessionalHome from "@/pages/professional/ProfessionalHome";
          import "@/index.css";

          createRoot(document.getElementById("root")!).render(
            <React.StrictMode>
              <TooltipProvider>
                <ProfessionalLayout>
                  <ProfessionalHome />
                </ProfessionalLayout>
              </TooltipProvider>
            </React.StrictMode>
          );
          EOF
          cat > .visual-audit/vite.config.ts <<'EOF'
          import tailwindcss from "@tailwindcss/vite";
          import react from "@vitejs/plugin-react";
          import path from "node:path";
          import { defineConfig } from "vite";

          const repo = path.resolve(import.meta.dirname, "..");
          export default defineConfig({
            root: import.meta.dirname,
            plugins: [react(), tailwindcss()],
            resolve: { alias: [
              { find: "@/_core/hooks/useAuth", replacement: path.resolve(import.meta.dirname, "mockAuth.ts") },
              { find: "@/lib/trpc", replacement: path.resolve(import.meta.dirname, "mockTrpc.ts") },
              { find: "wouter", replacement: path.resolve(import.meta.dirname, "mockWouter.ts") },
              { find: "@", replacement: path.resolve(repo, "client/src") },
            ] },
            server: { host: "127.0.0.1", port: 4173, fs: { allow: [repo] } },
          });
          EOF
          cat > .visual-audit/package.json <<'EOF'
          {"private":true,"type":"module","dependencies":{"playwright":"1.55.0"}}
          EOF
          cat > .visual-audit/capture.mjs <<'EOF'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";

          const browser = await chromium.launch({ headless: true });
          const viewports = [
            [1440, 900],
            [1366, 768],
            [1024, 768],
            [390, 844],
          ];
          const results = [];
          for (const [width, height] of viewports) {
            const context = await browser.newContext({ viewport: { width, height }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            await page.goto("http://127.0.0.1:4173", { waitUntil: "networkidle" });
            await page.getByRole("heading", { name: "Prioridades de hoje" }).waitFor();
            const initial = await page.evaluate(() => ({
              viewport: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth,
            }));
            await page.screenshot({ path: `.visual-audit/screenshots/home-${width}x${height}-initial.png`, fullPage: true });
            const trigger = page.getByRole("button", { name: "Abrir ou recolher navegação profissional" });
            await trigger.click();
            await page.waitForTimeout(300);
            const toggled = await page.evaluate(() => ({
              viewport: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
              overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth,
            }));
            await page.screenshot({ path: `.visual-audit/screenshots/home-${width}x${height}-toggled.png`, fullPage: true });
            results.push({ width, height, initial, toggled });
            await context.close();
          }
          await fs.writeFile(".visual-audit/screenshots/audit-results.json", JSON.stringify(results, null, 2));
          await browser.close();
          if (results.some(result => result.initial.overflow || result.toggled.overflow)) process.exitCode = 1;
          EOF
      - name: Install audit browser
        run: |
          npm install --prefix .visual-audit --no-audit --no-fund
          .visual-audit/node_modules/.bin/playwright install chromium
      - name: Start visual fixture
        shell: bash
        run: |
          pnpm exec vite --config .visual-audit/vite.config.ts --host 127.0.0.1 --port 4173 > .visual-audit/vite.log 2>&1 &
          echo $! > .visual-audit/vite.pid
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0
            sleep 1
          done
          cat .visual-audit/vite.log
          exit 1
      - name: Capture responsive screenshots
        run: node .visual-audit/capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue875-visual-audit
          path: |
            .visual-audit/screenshots
            .visual-audit/vite.log
          retention-days: 1
