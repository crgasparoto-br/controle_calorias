name: Debug epic 779 typecheck

on:
  push:
    branches:
      - fix/779-concluir-auditoria
    paths:
      - .github/workflows/debug-779-typecheck.yml

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/779-concluir-auditoria
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture TypeScript output
        run: pnpm check > .github/typecheck-779.log 2>&1 || true
      - name: Publish diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/typecheck-779.log
          git commit -m "ci: publicar diagnóstico temporário do typecheck"
          git push origin HEAD:fix/779-concluir-auditoria
