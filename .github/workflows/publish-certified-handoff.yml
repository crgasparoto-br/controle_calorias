name: Publish certified handoff (trusted)

# Trusted workflow_run events load code from the protected default branch.
# This wrapper executes only a SHA-pinned official Skill reusable workflow;
# it never checks out or evaluates PR candidate code with contents:write.
on:
  workflow_run:
    workflows: ["Collect and certify exact-SHA handoff"]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  publish:
    name: Verified handoff result-only publication
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: crgasparoto-br/skill/.github/workflows/reusable-publish-handoff.yml@71217ab40be73f64180f253816d7b5214cb23100
    with:
      base-ref: develop
      tooling-repository: crgasparoto-br/skill
      producer-path: .github/workflows/collect-certified-handoff.yml
      required-checks: Collect and certify exact-SHA handoff
