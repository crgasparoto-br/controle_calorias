name: Apply audited issue 801 fixes

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/801-soft-delete-food-catalog' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply audited fixes
        run: |
          cat > /tmp/fix-issue-801.cjs <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(path, before, after) {
            const current = fs.readFileSync(path, 'utf8');
            if (!current.includes(before)) throw new Error(`Expected snippet not found in ${path}`);
            fs.writeFileSync(path, current.replace(before, after));
          }

          replaceOnce(
            'server/modules/foods/service.ts',
            `const legacyFoodDeletionService = createLegacyFoodDeletionService({\n  getDb,\n  searchFoods,\n`,
            `const legacyFoodDeletionService = createLegacyFoodDeletionService({\n  getDb: () => getDb(),\n  searchFoods: (userId, query, limit) => searchFoods(userId, query, limit),\n`
          );

          replaceOnce(
            'server/modules/foods/catalog.ts',
            `      const activeRows = rows.filter(\n`,
            `      const scopedRows = rows.filter(\n        row => !row.createdByUserId || row.createdByUserId === userId\n      );\n      const activeRows = scopedRows.filter(\n`
          );
          replaceOnce(
            'server/modules/foods/catalog.ts',
            `      const deprecatedOwnRows = rows.filter(\n`,
            `      const deprecatedOwnRows = scopedRows.filter(\n`
          );
          replaceOnce(
            'server/modules/foods/catalog.ts',
            `      const blockedKeys = getDeprecatedIdentityKeys(userId);\n      for (const row of deprecatedOwnRows) {\n`,
            `      const blockedKeys = getDeprecatedIdentityKeys(userId);\n      for (const key of activeOwnKeys) blockedKeys.delete(key);\n      for (const row of deprecatedOwnRows) {\n`
          );

          fs.writeFileSync('server/modules/foods/legacyDeletion.test.ts', `import { describe, expect, it, vi } from "vitest";
          import {
            createLegacyFoodDeletionService,
            LegacyFoodDeletePersistenceError,
            LegacyFoodNotFoundError,
          } from "./legacyDeletion";

          describe("legacy food deletion", () => {
            it("deprecates an owned active food and removes the favorite in one transaction", async () => {
              const execute = vi.fn()
                .mockResolvedValueOnce([[{ id: 10, name: "Panqueca", aliases: '["massa"]', status: "active" }]])
                .mockResolvedValueOnce([{ affectedRows: 1 }])
                .mockResolvedValueOnce([{ affectedRows: 1 }]);
              const transaction = vi.fn(async callback => callback({ execute }));
              const service = createLegacyFoodDeletionService({
                getDb: async () => ({ execute, transaction }),
                searchFoods: async () => [],
                onWarning: vi.fn(),
              });

              await expect(service.deleteFood(7, 10)).resolves.toMatchObject({
                success: true,
                status: "deprecated",
                alreadyDeprecated: false,
              });
              expect(transaction).toHaveBeenCalledTimes(1);
              expect(execute).toHaveBeenCalledTimes(3);
            });

            it("is idempotent for an already deprecated owned food", async () => {
              const execute = vi.fn()
                .mockResolvedValueOnce([[{ id: 10, name: "Panqueca", aliases: "[]", status: "deprecated" }]])
                .mockResolvedValueOnce([{ affectedRows: 1 }]);
              const service = createLegacyFoodDeletionService({
                getDb: async () => ({ execute, transaction: async callback => callback({ execute }) }),
                searchFoods: async () => [],
                onWarning: vi.fn(),
              });

              await expect(service.deleteFood(7, 10)).resolves.toMatchObject({ alreadyDeprecated: true });
              expect(execute).toHaveBeenCalledTimes(2);
            });

            it("does not allow global, cross-user or nonexistent foods", async () => {
              const execute = vi.fn(async () => [[]]);
              const service = createLegacyFoodDeletionService({
                getDb: async () => ({ execute, transaction: async callback => callback({ execute }) }),
                searchFoods: async () => [],
                onWarning: vi.fn(),
              });
              await expect(service.deleteFood(7, 999)).rejects.toBeInstanceOf(LegacyFoodNotFoundError);
            });

            it("suppresses a deleted food in memory-only mode", async () => {
              const searchFoods = vi.fn(async () => [{
                id: 100,
                name: "Panqueca",
                brandName: null,
                servingSize: 100,
                servingUnit: "g",
                calories: 200,
                protein: 8,
                carbs: 30,
                fat: 5,
                fiber: null,
                isFruit: false,
                isVegetable: false,
                isUltraProcessed: false,
                source: "manual",
                foodType: "generic" as const,
                isUserCreated: true,
                createdByUserId: 70,
                isFavorite: false,
                lastUsedAt: null,
              }]);
              const service = createLegacyFoodDeletionService({
                getDb: async () => null,
                searchFoods,
                onWarning: vi.fn(),
              });

              await expect(service.deleteFood(70, 100)).resolves.toMatchObject({ success: true, alreadyDeprecated: false });
              await expect(service.deleteFood(70, 100)).resolves.toMatchObject({ success: true, alreadyDeprecated: true });
              expect(searchFoods).toHaveBeenCalledTimes(1);
            });

            it("does not report success when the database transaction fails", async () => {
              const failure = new Error("database unavailable");
              const onWarning = vi.fn();
              const service = createLegacyFoodDeletionService({
                getDb: async () => ({ execute: vi.fn(), transaction: async () => { throw failure; } }),
                searchFoods: async () => [],
                onWarning,
              });
              await expect(service.deleteFood(7, 10)).rejects.toBeInstanceOf(LegacyFoodDeletePersistenceError);
              expect(onWarning).toHaveBeenCalledWith("Legacy food deletion failed", failure);
            });
          });
          `);

          fs.writeFileSync('client/src/pages/foodsPageState.ts', `export function canDeleteLegacyFood(params: {
            isUserCreated: boolean;
            createdByUserId?: number | null;
            currentUserId?: number | null;
          }) {
            return params.isUserCreated && params.currentUserId != null && params.createdByUserId === params.currentUserId;
          }

          export function getFoodCardActionState(params: {
            isFavoritePending: boolean;
            isDeletePending: boolean;
          }) {
            return {
              editDisabled: params.isDeletePending,
              favoriteDisabled: params.isFavoritePending || params.isDeletePending,
              deleteDisabled: params.isDeletePending,
            };
          }
          `);

          fs.writeFileSync('client/src/pages/foodsPageState.test.ts', `import { describe, expect, it } from "vitest";
          import { canDeleteLegacyFood, getFoodCardActionState } from "./foodsPageState";

          describe("foods page action state", () => {
            it("allows deletion only for an entry created by the current user", () => {
              expect(canDeleteLegacyFood({ isUserCreated: true, createdByUserId: 7, currentUserId: 7 })).toBe(true);
              expect(canDeleteLegacyFood({ isUserCreated: true, createdByUserId: 8, currentUserId: 7 })).toBe(false);
              expect(canDeleteLegacyFood({ isUserCreated: false, createdByUserId: null, currentUserId: 7 })).toBe(false);
            });

            it("blocks edit, favorite and duplicate delete actions while deleting", () => {
              expect(getFoodCardActionState({ isFavoritePending: false, isDeletePending: true })).toEqual({
                editDisabled: true,
                favoriteDisabled: true,
                deleteDisabled: true,
              });
            });

            it("keeps only favorite blocked during a favorite mutation", () => {
              expect(getFoodCardActionState({ isFavoritePending: true, isDeletePending: false })).toEqual({
                editDisabled: false,
                favoriteDisabled: true,
                deleteDisabled: false,
              });
            });
          });
          `);

          replaceOnce('client/src/pages/FoodsPage.tsx', `import { trpc } from "@/lib/trpc";\n`, `import { trpc } from "@/lib/trpc";\nimport { canDeleteLegacyFood, getFoodCardActionState } from "./foodsPageState";\n`);
          replaceOnce('client/src/pages/FoodsPage.tsx', `                            canDelete={\n                              food.isUserCreated &&\n                              food.createdByUserId === user?.id\n                            }\n`, `                            canDelete={canDeleteLegacyFood({\n                              isUserCreated: food.isUserCreated,\n                              createdByUserId: food.createdByUserId,\n                              currentUserId: user?.id,\n                            })}\n`);
          replaceOnce('client/src/pages/FoodsPage.tsx', `  isDeletePending: boolean;\n  onDelete: () => void;\n}) {\n  return (\n`, `  isDeletePending: boolean;\n  onDelete: () => void;\n}) {\n  const actionState = getFoodCardActionState({ isFavoritePending, isDeletePending });\n\n  return (\n`);
          replaceOnce('client/src/pages/FoodsPage.tsx', `              onClick={onEdit}\n              aria-label={\`Editar \${food.name}\`}\n`, `              onClick={onEdit}\n              disabled={actionState.editDisabled}\n              aria-label={\`Editar \${food.name}\`}\n`);
          replaceOnce('client/src/pages/FoodsPage.tsx', `            disabled={isFavoritePending}\n            aria-label={\n`, `            disabled={actionState.favoriteDisabled}\n            aria-label={\n`);
          replaceOnce('client/src/pages/FoodsPage.tsx', `              disabled={isDeletePending}\n              aria-label={\`Excluir alimento \${food.name}\`}\n`, `              disabled={actionState.deleteDisabled}\n              aria-label={\`Excluir alimento \${food.name}\`}\n`);

          replaceOnce(
            'server/modules/foods/catalog.test.ts',
            `  it("clears user-created foods and favorites from memory", async () => {\n`,
            `  it("reuses a new active own entry after the old identity was deprecated", async () => {\n    const global = catalogRow({ id: 20, name: "Panqueca", aliases: "[]", status: "active" });\n    const deprecatedOwn = catalogRow({ id: 21, name: "Panqueca", aliases: "[]", status: "deprecated", isUserCreated: 1, createdByUserId: 7 });\n    const activeOwn = catalogRow({ id: 99, name: "Panqueca", aliases: "[]", status: "active", isUserCreated: 1, createdByUserId: 7 });\n    const repository = createFakeFoodCatalogRepository({\n      findForResolution: vi.fn(async () => [global, deprecatedOwn, activeOwn]),\n      insert: vi.fn(async () => 100),\n    });\n    const service = createService({ foodCatalogRepository: repository, getDb: async () => ({}) });\n\n    const resolved = await service.resolveFoodCatalogIds([{ canonicalName: "Panqueca", foodName: "Panqueca" } as any], 7);\n\n    expect(resolved.get("Panqueca")).toBe(99);\n    expect(repository.insert).not.toHaveBeenCalled();\n  });\n\n  it("rejects a direct id owned by another user even if a repository returns it", async () => {\n    const foreignFood = catalogRow({ id: 88, name: "Panqueca", aliases: "[]", status: "active", isUserCreated: 1, createdByUserId: 8 });\n    const repository = createFakeFoodCatalogRepository({ findForResolution: vi.fn(async () => [foreignFood]) });\n    const service = createService({ foodCatalogRepository: repository, getDb: async () => ({}) });\n\n    const resolved = await service.resolveFoodCatalogIds([{ foodCatalogId: 88, canonicalName: "Panqueca", foodName: "Panqueca" } as any], 7);\n\n    expect(resolved.has("catalog:88")).toBe(false);\n    expect(resolved.has("Panqueca")).toBe(false);\n  });\n\n  it("clears user-created foods and favorites from memory", async () => {\n`
          );
          NODE
          node /tmp/fix-issue-801.cjs

      - name: Format and validate focused changes
        run: |
          pnpm exec prettier --write \
            server/modules/foods/service.ts \
            server/modules/foods/catalog.ts \
            server/modules/foods/catalog.test.ts \
            server/modules/foods/legacyDeletion.test.ts \
            client/src/pages/FoodsPage.tsx \
            client/src/pages/foodsPageState.ts \
            client/src/pages/foodsPageState.test.ts
          pnpm check
          pnpm exec vitest run \
            server/modules/foods/legacyDeletion.test.ts \
            server/modules/foods/catalog.test.ts \
            client/src/pages/foodsPageState.test.ts

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/modules/foods/service.ts \
            server/modules/foods/catalog.ts \
            server/modules/foods/catalog.test.ts \
            server/modules/foods/legacyDeletion.test.ts \
            client/src/pages/FoodsPage.tsx \
            client/src/pages/foodsPageState.ts \
            client/src/pages/foodsPageState.test.ts
          git commit -m "fix: harden legacy food deletion flow (#801)"
          git push origin HEAD:feat/801-soft-delete-food-catalog
