name: Diagnose issue 801

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feat/801-soft-delete-food-catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Capture TypeScript diagnostics
        run: |
          set +e
          pnpm check > /tmp/issue-801-tsc.log 2>&1
          status=$?
          cat /tmp/issue-801-tsc.log
          exit "$status"

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-801-tsc-log
          path: /tmp/issue-801-tsc.log
          if-no-files-found: error
          retention-days: 3
