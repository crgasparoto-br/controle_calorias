name: Collect and certify exact-SHA handoff

# M1 pilot. Never emit a certificate unless the official Skill has validated
# a reviewed requirement closure, real JUnit controls and exact-SHA evidence.
# Label opt-in avoids failing unrelated PRs before the policy is installed.
on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  collect:
    name: Certified semantic handoff pilot (fail closed)
    if: ${{ github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'solverit-certified-handoff') }}
    uses: crgasparoto-br/skill/.github/workflows/reusable-handoff.yml@71217ab40be73f64180f253816d7b5214cb23100
    with:
      base-ref: develop
      tooling-repository: crgasparoto-br/skill
      python-version: '3.12'
      # Preserve Python governance JUnit, all 24 Vitest shards and Node adversarial
      # test executions; none become semantic closure automatically.
      install-command: 'npm install --global pnpm@10.4.1 && pnpm install --frozen-lockfile'
      test-command: 'python -m pytest -vv tests/test_operator_session_preflight.py tests/test_wrap_node_junit.py tests/test_collect_official_session_junit.py tests/test_issue1345_readiness_docs.py tests/test_session_m1_controls.py --junitxml="$EVIDENCE_DIR/pytest-exact-head.xml" && NODE_OPTIONS=--max-old-space-size=4096 bash scripts/collect-solverit-certification-tests.sh'
      # A separately reviewed semantic closure is mandatory. Missing closure
      # is a failure, never equivalent to absence of findings or success.
      evidence-command: 'python "$HANDOFF_TOOLING/entregar-issue/scripts/produce_actions_handoff_evidence.py" --root . --out "$EVIDENCE_DIR" --event "$GITHUB_EVENT_PATH" --base-ref "$BASE_REF"'
