name: Apply issue 882 replay hardening

on:
  pull_request:
    branches:
      - feat/875-professional-context-routes

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'chore/issue-882-apply-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Verify applicator-only commits
        run: |
          git merge-base --is-ancestor 51dd9ca9ba4ffde07ea2eafdfb7fb7c81efda1ea HEAD
          test "$(git diff --name-only 51dd9ca9ba4ffde07ea2eafdfb7fb7c81efda1ea HEAD | sort -u)" = ".github/workflows/issue-882-replay-apply.yml"

      - name: Retrieve and verify patch
        run: |
          git fetch origin chore/issue-882-apply-trigger
          git show origin/chore/issue-882-apply-trigger:.issue-loop/issue882-replay/replay-v2.patch.b64 \
            | base64 -d > /tmp/issue882-replay.patch
          test "$(wc -c < /tmp/issue882-replay.patch)" = "5400"
          echo 'de11f6f8bfe92177788f68586bbe55fc8a9cd4784b7ffd86d2d28da22a79bfc4  /tmp/issue882-replay.patch' | sha256sum -c -
          git apply --check /tmp/issue882-replay.patch
          git apply /tmp/issue882-replay.patch
          bash -n scripts/render-professional-patient-workspace-visual.sh
          git diff --check

      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/modules/professionals/messageService.ts \
            server/modules/professionals/messageService.idempotency.test.ts \
            scripts/test-professional-message-idempotency-tidb.ts \
            scripts/render-professional-patient-workspace-visual.sh
          git commit -m 'fix: harden equivalent message replay and visual runner'
          git push --force origin HEAD:chore/issue-882-replay-candidate
