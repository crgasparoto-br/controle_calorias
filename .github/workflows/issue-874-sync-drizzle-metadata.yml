name: Issue 874 sync Drizzle metadata

on:
  push:
    branches:
      - fix/874-whatsapp-correction-completion
    paths:
      - ".github/workflows/issue-874-sync-drizzle-metadata.yml"
      - ".github/issue-874-sync-metadata.trigger"

permissions:
  contents: write

concurrency:
  group: issue-874-sync-drizzle-metadata
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/874-whatsapp-correction-completion
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Synchronize latest snapshot without duplicate migration
        run: |
          cp drizzle/meta/0035_snapshot.json /tmp/0035_snapshot.json
          cp drizzle/meta/_journal.json /tmp/_journal.json
          pnpm exec drizzle-kit generate
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const currentPath = "drizzle/meta/0035_snapshot.json";
          const generatedPath = "drizzle/meta/0036_snapshot.json";
          const current = JSON.parse(fs.readFileSync("/tmp/0035_snapshot.json", "utf8"));
          const generated = JSON.parse(fs.readFileSync(generatedPath, "utf8"));

          generated.id = current.id;
          generated.prevId = current.prevId;
          fs.writeFileSync(currentPath, `${JSON.stringify(generated, null, 2)}\n`);
          fs.rmSync(generatedPath);
          for (const file of fs.readdirSync("drizzle")) {
            if (/^0036_.*\.sql$/.test(file)) fs.rmSync(`drizzle/${file}`);
          }
          fs.copyFileSync("/tmp/_journal.json", "drizzle/meta/_journal.json");
          NODE

          pnpm exec drizzle-kit generate
          test ! -f drizzle/meta/0036_snapshot.json
          test -z "$(find drizzle -maxdepth 1 -name '0036_*.sql' -print -quit)"
          git diff --check

      - name: Commit synchronized metadata and remove temporary workflow
        run: |
          rm -f .github/workflows/issue-874-sync-drizzle-metadata.yml
          rm -f .github/issue-874-sync-metadata.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle/meta/0035_snapshot.json .github/workflows/issue-874-sync-drizzle-metadata.yml .github/issue-874-sync-metadata.trigger
          git commit -m "fix(db): sincronizar metadata dos sinais alimentares"
          git push origin HEAD:fix/874-whatsapp-correction-completion
