name: Export issue 793 source

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/795-timezone-backend-reports

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'feat/796-timezone-whatsapp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/796-timezone-whatsapp
          fetch-depth: 1
          show-progress: false

      - name: Package source
        shell: bash
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/controle-calorias-793.tgz .

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: controle-calorias-793-source
          path: /tmp/controle-calorias-793.tgz
          retention-days: 1
