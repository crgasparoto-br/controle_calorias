name: Export issue 793 tree

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - feat/795-timezone-backend-reports

permissions:
  contents: read

jobs:
  export-tree:
    if: github.head_ref == 'feat/796-timezone-whatsapp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/796-timezone-whatsapp
          fetch-depth: 1
          show-progress: false

      - name: Capture tree metadata
        shell: bash
        run: |
          git rev-parse HEAD > /tmp/commit-sha.txt
          git rev-parse HEAD^{tree} > /tmp/tree-sha.txt

      - name: Upload tree metadata
        uses: actions/upload-artifact@v4
        with:
          name: controle-calorias-793-tree
          path: |
            /tmp/commit-sha.txt
            /tmp/tree-sha.txt
          retention-days: 1
