name: Apply issue 880 pre-audit helper

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/875-professional-context-routes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Apply corrections
        run: |
          mkdir -p artifacts
          python scripts/patch-issue-880-preaudit.py 2>&1 | tee artifacts/patch-issue-880.log
          git diff --check
          git status --short
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-issue-880-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/patch-issue-880.log
          if-no-files-found: error
          retention-days: 3
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/professional/ProfessionalPatientWorkspace.tsx server/modules/professionals/recordService.ts
          git rm scripts/patch-issue-880-preaudit.py .github/workflows/apply-issue-880-preaudit.yml
          git diff --cached --check
          git commit -m "fix: close issue 880 pre-audit gaps"
          git push origin HEAD:feat/875-professional-context-routes
