name: Patch issue 880 pending audit findings

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/patch-issue-880-single-confirmation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-880-draft-guard-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.head_ref == 'feat/875-professional-context-routes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0

      - name: Apply draft navigation corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path("client/src/pages/professional/ProfessionalPatientWorkspace.tsx")
          source = workspace.read_text(encoding="utf-8")

          hook_old = "function useUnsavedNavigationGuard(dirty: boolean, currentPath: string) {"
          hook_new = "export function useUnsavedNavigationGuard(dirty: boolean, currentPath: string) {"
          if source.count(hook_old) != 1:
              raise SystemExit("expected one unsaved navigation hook declaration")
          source = source.replace(hook_old, hook_new)

          old_can_navigate = "    canNavigate() {\n      if (!dirty || window.confirm(UNSAVED_MESSAGE)) {\n        allowNavigationRef.current = true;\n        return true;\n      }\n      return false;\n    },"
          new_can_navigate = "    canNavigate() {\n      if (allowNavigationRef.current || !dirty) {\n        allowNavigationRef.current = true;\n        return true;\n      }\n      if (window.confirm(UNSAVED_MESSAGE)) {\n        allowNavigationRef.current = true;\n        return true;\n      }\n      return false;\n    },"
          if source.count(old_can_navigate) != 1:
              raise SystemExit("expected one unsaved navigation canNavigate block")
          workspace.write_text(source.replace(old_can_navigate, new_can_navigate), encoding="utf-8")

          layout = Path("client/src/components/ProfessionalLayout.tsx")
          layout_source = layout.read_text(encoding="utf-8")
          old_personal_button = '''            <Button
              type="button"
              variant="ghost"
              className="w-full justify-start group-data-[collapsible=icon]:justify-center"'''
          new_personal_button = '''            <Button
              type="button"
              data-professional-navigation
              variant="ghost"
              className="w-full justify-start group-data-[collapsible=icon]:justify-center"'''
          if layout_source.count(old_personal_button) != 1:
              raise SystemExit("expected one Minha alimentação sidebar button")
          layout.write_text(layout_source.replace(old_personal_button, new_personal_button), encoding="utf-8")

          test = Path("client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx")
          test.write_text(r'''// @vitest-environment jsdom
import React from "react";
import { cleanup, render, screen } from "@testing-library/react";
import userEvent from "@testing-library/user-event";
import { afterEach, describe, expect, it, vi } from "vitest";
import layoutSource from "@/components/ProfessionalLayout.tsx?raw";
import { useUnsavedNavigationGuard } from "./professional/ProfessionalPatientWorkspace";

function NavigationHarness({
  direct = false,
  dirty = true,
  onNavigate,
}: {
  direct?: boolean;
  dirty?: boolean;
  onNavigate: () => void;
}) {
  const guard = useUnsavedNavigationGuard(
    dirty,
    "/professional/patients/41/assessment"
  );
  return (
    <button
      type="button"
      data-professional-navigation
      onClick={() => {
        if (direct || guard.canNavigate()) onNavigate();
      }}
    >
      Navegar
    </button>
  );
}

afterEach(() => {
  cleanup();
  vi.restoreAllMocks();
});

describe("professional workspace unsaved navigation", () => {
  it("uses one confirmation when discard is accepted", async () => {
    const confirm = vi.spyOn(window, "confirm").mockReturnValue(true);
    const onNavigate = vi.fn();
    render(<NavigationHarness onNavigate={onNavigate} />);

    await userEvent.click(screen.getByRole("button", { name: "Navegar" }));

    expect(confirm).toHaveBeenCalledTimes(1);
    expect(onNavigate).toHaveBeenCalledTimes(1);
  });

  it("preserves the draft when navigation is cancelled", async () => {
    const confirm = vi.spyOn(window, "confirm").mockReturnValue(false);
    const onNavigate = vi.fn();
    render(<NavigationHarness onNavigate={onNavigate} />);

    await userEvent.click(screen.getByRole("button", { name: "Navegar" }));

    expect(confirm).toHaveBeenCalledTimes(1);
    expect(onNavigate).not.toHaveBeenCalled();
  });

  it("protects direct sidebar exits through the shared navigation marker", async () => {
    const confirm = vi.spyOn(window, "confirm").mockReturnValue(false);
    const onNavigate = vi.fn();
    render(<NavigationHarness direct onNavigate={onNavigate} />);

    await userEvent.click(screen.getByRole("button", { name: "Navegar" }));

    expect(confirm).toHaveBeenCalledTimes(1);
    expect(onNavigate).not.toHaveBeenCalled();
    expect(layoutSource).toMatch(
      /<Button[\s\S]{0,240}data-professional-navigation[\s\S]{0,500}Minha alimentação/
    );
  });

  it("does not ask for confirmation after the draft is clean", async () => {
    const confirm = vi.spyOn(window, "confirm");
    const onNavigate = vi.fn();
    render(<NavigationHarness dirty={false} onNavigate={onNavigate} />);

    await userEvent.click(screen.getByRole("button", { name: "Navegar" }));

    expect(confirm).not.toHaveBeenCalled();
    expect(onNavigate).toHaveBeenCalledTimes(1);
  });
});
''', encoding="utf-8")

          docs = Path("docs/testing/professional-workspace-routing.md")
          documentation = docs.read_text(encoding="utf-8")
          addition = '''

## Proteção completa das saídas com rascunho — issue #880

- Toda saída visível do workspace, incluindo **Minha alimentação**, subnavegação, navegação principal, retorno à carteira e troca de paciente, participa do mesmo contrato de proteção de rascunho.
- A confirmação ocorre no máximo uma vez por tentativa de navegação. Uma confirmação já aceita pelo interceptor é reutilizada pelo handler da mesma transição.
- Cancelar preserva rota, paciente e campos montados; confirmar o descarte permite a navegação e o remount da rota de destino; após salvar, não há diálogo.
- O teste comportamental deve clicar em um controle real marcado para navegação, verificar o número de chamadas a `window.confirm` e comprovar que o callback de navegação foi executado ou bloqueado conforme a decisão.
'''
          if "## Proteção completa das saídas com rascunho — issue #880" not in documentation:
              docs.write_text(documentation.rstrip() + addition, encoding="utf-8")
          PY

          git diff --check
          # Full verification runs on the resulting PR head through the repository gates.

      - name: Commit corrections and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
            client/src/components/ProfessionalLayout.tsx \
            client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx \
            docs/testing/professional-workspace-routing.md
          git rm .github/workflows/patch-issue-880-single-confirmation.yml
          git diff --cached --check
          git commit -m "fix: protect all workspace draft exits (#880)"
          git push origin HEAD:feat/875-professional-context-routes
