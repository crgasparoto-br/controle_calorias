name: Temporary CI mock fix issue 1054
on:
  push:
    branches:
      - tmp/1054-ci-mock-fix-20260909
permissions:
  contents: write
jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/1054-ci-mock-fix-20260909
          fetch-depth: 0
      - name: Add new nutrition export to legacy mock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/modules/whatsapp/intentActions.issue997.test.ts')
          text = path.read_text()
          old = '  processMealInput: vi.fn(),\n}))'
          new = '  processMealInput: vi.fn(),\n  resolveCommercialFoodIdentity: vi.fn(),\n}))'
          if old not in text:
              raise SystemExit('legacy nutrition mock block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git add server/modules/whatsapp/intentActions.issue997.test.ts
          git rm .github/workflows/tmp-ci-mock-fix-1054.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(whatsapp): expose commercial identity resolver in legacy mock"
          git push origin HEAD:tmp/1054-ci-mock-fix-20260909
