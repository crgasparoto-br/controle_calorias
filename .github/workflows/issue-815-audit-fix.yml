name: Apply issue 815 audit corrections

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: issue-815-audit-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/815-retire-professional-legacy
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply audit corrections
        id: transform
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/issue-815-audit-fix.mjs 2>&1 | tee /tmp/issue-815-audit-transform.log

      - name: Publish transform diagnostics
        if: steps.transform.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Diagnóstico da correção de auditoria da issue #815"
            echo
            echo '```text'
            tail -n 100 /tmp/issue-815-audit-transform.log
            echo '```'
          } > /tmp/issue-815-audit-comment.md
          gh pr comment 864 --body-file /tmp/issue-815-audit-comment.md
          exit 1

      - name: Format and regenerate documentation
        run: |
          pnpm exec prettier --write \
            server/repositories/professionalRepository.ts \
            server/modules/professionals/persistenceService.ts \
            server/modules/professionals/legacyRetirement.test.ts \
            scripts/test-professional-persistence-tidb.ts \
            scripts/retire-professional-legacy-preferences.ts \
            docs/runbooks/professional-legacy-retirement.md
          pnpm docs:generate:trpc

      - name: Validate repository gates
        run: |
          pnpm check
          pnpm test
          pnpm architecture:check
          pnpm docs:check
          pnpm build
          pnpm agent:check

      - name: Remove one-shot automation
        run: |
          rm scripts/issue-815-audit-fix.mjs
          rm .github/workflows/issue-815-audit-fix.yml

      - name: Commit audit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(professional): close issue 815 audit gaps"
          git push origin HEAD:cleanup/815-retire-professional-legacy
