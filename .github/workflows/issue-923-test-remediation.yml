name: Issue 923 test remediation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - develop
    paths:
      - .github/workflows/issue-923-test-remediation.yml

permissions:
  contents: write

concurrency:
  group: issue-923-test-remediation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/923-ai-capabilities-question-nutrition-embedding'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Apply test remediation
        shell: bash
        env:
          EXPECTED_HEAD: 9fe47c83d2c8d9649ab433bb7623eca33c2580f0
          TARGET_BRANCH: feat/923-ai-capabilities-question-nutrition-embedding
          PATCH_SHA256: cc1822009e5407b3e2f0e4fba6fbfa2277b4bf5894bf557b05e775bacb8c2ce4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          printf '%s' '' > /tmp/issue923-test-fix.patch.gz.b64
          base64 -d /tmp/issue923-test-fix.patch.gz.b64 | gzip -d > /tmp/issue923-test-fix.patch
          test "$(sha256sum /tmp/issue923-test-fix.patch | awk '{print $1}')" = "${PATCH_SHA256}"
          git apply --index /tmp/issue923-test-fix.patch
          git config user.name "Issue 923 Test Remediation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(ai): align provenance tests with single-call boundary"
          git push origin "HEAD:${TARGET_BRANCH}"
