name: Patch request refresh resilience for issue 879

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/patch-request-refresh-879.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make refresh failure non-blocking and add regression
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("client/src/pages/professional/ProfessionalPatients.tsx")
          source = page.read_text(encoding="utf-8")
          old = (
              "      await Promise.all([\n"
              "        utils.nutrition.professionals.myAccesses.invalidate(),\n"
              "        portfolio.refetch(),\n"
              "      ]);\n"
              "      setLocation(\n"
              "        `/professional/patients?authorization=${success.authorizationStatus}`,\n"
              "        { replace: true }\n"
              "      );"
          )
          new = (
              "      setLocation(\n"
              "        `/professional/patients?authorization=${success.authorizationStatus}`,\n"
              "        { replace: true }\n"
              "      );\n"
              "      await Promise.allSettled([\n"
              "        utils.nutrition.professionals.myAccesses.invalidate(),\n"
              "        portfolio.refetch(),\n"
              "      ]);"
          )
          if source.count(old) != 1:
              raise SystemExit("expected one request refresh block")
          page.write_text(source.replace(old, new), encoding="utf-8")

          test = Path("client/src/pages/professional/ProfessionalPatients.test.tsx")
          source = test.read_text(encoding="utf-8")
          anchor = '  it("keeps an already approved relationship in the approved view", async () => {'
          insertion = '''  it("keeps the persisted success visible when the portfolio refresh fails", async () => {
            window.history.replaceState(
              {},
              "",
              "/professional/patients?search=ana&authorization=approved&page=3"
            );
            refetch.mockRejectedValueOnce(new Error("temporary refresh failure"));
            render(<ProfessionalPatients />);

            submitRequest();

            await waitFor(() => {
              expect(window.location.search).toBe("?authorization=pending");
              expect(screen.getByRole("status").textContent).toContain(
                "Solicitação registrada."
              );
            });
            expect(refetch).toHaveBeenCalledTimes(1);
            expect(invalidate).toHaveBeenCalledTimes(1);
          });

'''
          if source.count(anchor) != 1:
              raise SystemExit("expected one approved relationship test anchor")
          test.write_text(source.replace(anchor, insertion + anchor), encoding="utf-8")
          PY
          pnpm exec prettier --write client/src/pages/professional/ProfessionalPatients.tsx client/src/pages/professional/ProfessionalPatients.test.tsx
          git diff --check
      - name: Run focused regression
        run: pnpm exec vitest run client/src/pages/professional/ProfessionalPatients.test.tsx --maxWorkers=1 --minWorkers=1
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add client/src/pages/professional/ProfessionalPatients.tsx client/src/pages/professional/ProfessionalPatients.test.tsx
          git commit -m "fix: preservar sucesso quando refresh da carteira falhar (#879)"
          git push origin HEAD:feat/875-professional-context-routes
