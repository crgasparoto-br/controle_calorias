name: Apply issue 882 implementation

on:
  push:
    branches:
      - feat/875-professional-context-routes

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact implementation patch
        run: |
          cat .issue-loop/issue882-patch.part-* | base64 -d | xz -d > /tmp/issue-882.patch
          git apply --check /tmp/issue-882.patch
          git apply /tmp/issue-882.patch
          rm -rf .issue-loop
          rm .github/workflows/issue-882-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: complete contextual professional messaging'
          git push origin HEAD:feat/875-professional-context-routes
