name: Apply issue 882 remediation v2

on:
  push:
    branches:
      - feat/875-professional-context-routes

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/875-professional-context-routes

      - name: Extract, verify and apply remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib

          source = Path('.github/workflows/issue-882-remediation-applier.yml').read_text()
          payload = source.split("<<'PATCH_BASE64'\n", 1)[1].split("\n          PATCH_BASE64", 1)[0]
          raw = base64.b64decode(''.join(payload.split()))
          expected = '569c09cb4028c5b86436d877f23f3f158d025daef331e8fae330e4c4046df9e4'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise SystemExit(f'patch hash mismatch: {actual}')
          Path('/tmp/issue882.patch').write_bytes(raw)
          PY
          git apply --check /tmp/issue882.patch
          git apply /tmp/issue882.patch
          rm -f \
            .github/workflows/issue-882-remediation-applier.yml \
            .github/workflows/issue-882-remediation-applier-v2.yml \
            .github/issue-882-remediation-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close issue 882 audit findings"
          git push origin HEAD:feat/875-professional-context-routes
