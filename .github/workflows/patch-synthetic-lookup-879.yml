name: Patch synthetic lookup 879

on:
  push:
    branches:
      - feat/875-professional-context-routes
    paths:
      - ".github/workflows/patch-synthetic-lookup-879.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Apply explicit test fixture guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("server/modules/professionals/service.ts")
          source = path.read_text(encoding="utf-8")
          old = 'if (process.env.NODE_ENV === "test" || process.env.VITEST === "true") {'
          new = 'if (process.env.PROFESSIONAL_SYNTHETIC_USER_LOOKUP === "enabled") {'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one synthetic lookup guard, found {count}")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          grep -n 'PROFESSIONAL_SYNTHETIC_USER_LOOKUP' server/modules/professionals/service.ts
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/modules/professionals/service.ts
          git rm .github/workflows/patch-synthetic-lookup-879.yml
          git diff --cached --check
          git commit -m "fix: gate synthetic patient lookup behind explicit test flag (#879)"
          git push origin HEAD:feat/875-professional-context-routes
