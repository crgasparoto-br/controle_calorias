name: Onboarding activation TiDB gate

on:
  pull_request:
    paths:
      - "drizzle/0016_whatsapp_onboarding_leads.sql"
      - "drizzle/0037_whatsapp_onboarding_activation.sql"
      - "server/modules/onboarding/**"
      - "server/modules/billing/router.ts"
      - "scripts/test-whatsapp-onboarding-activation-tidb.ts"
      - ".github/workflows/onboarding-activation-tidb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding-activation:
    name: Onboarding activation persistence
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start TiDB
        run: |
          docker run -d --name onboarding-activation-tidb -p 4000:4000 pingcap/tidb:v8.5.1
          for attempt in $(seq 1 90); do
            if node --input-type=module -e 'import mysql from "mysql2/promise"; const connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" }); await connection.query("CREATE DATABASE IF NOT EXISTS controle_calorias"); await connection.end();'; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 onboarding-activation-tidb
          exit 1

      - name: Validate migration and concurrent transitions
        id: onboarding-test
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm exec tsx scripts/test-whatsapp-onboarding-activation-tidb.ts 2>&1 | tee onboarding-activation-test.log

      - name: Preserve onboarding activation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-activation-test-${{ github.sha }}
          path: onboarding-activation-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Fail on onboarding activation regression
        if: steps.onboarding-test.outcome == 'failure'
        run: |
          echo "Onboarding activation integration failed. Inspect the uploaded diagnostic artifact."
          exit 1

      - name: Show TiDB logs on failure
        if: failure()
        run: docker logs --tail 100 onboarding-activation-tidb
