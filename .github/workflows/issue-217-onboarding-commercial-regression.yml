name: Issue 217 onboarding commercial regression

on:
  pull_request:
    paths:
      - "server/auth.whatsappOnboarding.test.ts"
      - "server/modules/onboarding/**"
      - "server/modules/billing/**"
      - "scripts/test-issue-217-regression.ts"
      - "scripts/test-whatsapp-onboarding-activation-tidb.ts"
      - "scripts/test-whatsapp-active-phone-migration-tidb.ts"
      - "scripts/test-billing-*-tidb.ts"
      - "scripts/test-asaas-concurrency-tidb.ts"
      - "scripts/test-professional-capacity-alert-lifecycle-tidb.ts"
      - "scripts/test-usage-governance-retention-tidb.ts"
      - "docs/testing/issue-217-onboarding-commercial-regression.md"
      - ".github/workflows/issue-217-onboarding-commercial-regression.yml"
  push:
    branches:
      - develop
    paths:
      - "server/auth.whatsappOnboarding.test.ts"
      - "server/modules/onboarding/**"
      - "server/modules/billing/**"
      - "scripts/test-issue-217-regression.ts"
      - "scripts/test-whatsapp-onboarding-activation-tidb.ts"
      - "scripts/test-whatsapp-active-phone-migration-tidb.ts"
      - "scripts/test-billing-*-tidb.ts"
      - "scripts/test-asaas-concurrency-tidb.ts"
      - "scripts/test-professional-capacity-alert-lifecycle-tidb.ts"
      - "scripts/test-usage-governance-retention-tidb.ts"
      - "docs/testing/issue-217-onboarding-commercial-regression.md"
      - ".github/workflows/issue-217-onboarding-commercial-regression.yml"

permissions:
  contents: read

jobs:
  focused-regression:
    name: Issue 217 focused regression
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate matrix and run focused Vitest regression
        run: pnpm exec tsx scripts/test-issue-217-regression.ts

  tidb-regression:
    name: Issue 217 TiDB regression
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: test
      PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TiDB regression when database credentials are available
        shell: bash
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL unavailable; TiDB regression remains covered by the repository-specific TiDB workflows."
            exit 0
          fi
          pnpm exec tsx scripts/test-issue-217-regression.ts --tidb-only
