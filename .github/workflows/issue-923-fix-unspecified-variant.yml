name: Issue 923 allow unspecified validated variant

on:
  push:
    branches:
      - feat/923-ai-capabilities-question-nutrition-embedding

permissions:
  contents: write

concurrency:
  group: issue-923-fix-unspecified-variant
  cancel-in-progress: true

jobs:
  fix-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep explicit variant conflict protection
        env:
          TARGET_BRANCH: feat/923-ai-capabilities-question-nutrition-embedding
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'server/catalogSemanticSearch.ts';
          const before = `  if (requestedVariants.size) {
    if ([...requestedVariants].some(token => !candidateVariants.includes(token))) return false;
  } else if (candidateVariants.length) {
    return false;
  }`;
          const after = `  if (
    requestedVariants.size
    && [...requestedVariants].some(token => !candidateVariants.includes(token))
  ) {
    return false;
  }`;
          const content = fs.readFileSync(path, 'utf8');
          const count = content.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected one variant guard, found ${count}`);
          fs.writeFileSync(path, content.replace(before, after));
          NODE
          git rm .github/workflows/issue-923-fix-unspecified-variant.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/catalogSemanticSearch.ts
          git commit -m "fix(nutrition): allow unspecified validated product variant"
          git push origin "HEAD:${TARGET_BRANCH}"
