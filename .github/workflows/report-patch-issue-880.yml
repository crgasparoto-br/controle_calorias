name: Execute issue 880 functional corrections

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/report-patch-issue-880.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audited functional corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/patch-issue-880-audit-findings.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          ) + '\n'

          old = '    replace_once(professional_service, old, new)'
          new = (
              '    file = Path(professional_service)\n'
              '    current = file.read_text(encoding="utf-8")\n'
              '    expected = 2 if "const timeZone = await getEffectiveUserTimeZone" in old else 1\n'
              '    count = current.count(old)\n'
              '    if count != expected:\n'
              '        raise SystemExit(\n'
              '            f"{professional_service}: expected {expected} anchors, found {count}: {old[:100]!r}"\n'
              '        )\n'
              '    file.write_text(current.replace(old, new), encoding="utf-8")'
          )
          if script.count(old) != 1:
              raise SystemExit('expected one professional service loop call in embedded script')
          script = script.replace(old, new, 1)

          obsolete_start = 'route_guard_test = "client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx"'
          obsolete_end = 'authorship_test = "server/modules/professionals/recordService.authorship.test.ts"'
          block_start = script.index(obsolete_start)
          block_end = script.index(obsolete_end, block_start)
          script = script[:block_start] + script[block_end:]

          Path('/tmp/apply-issue-880.py').write_text(script, encoding='utf-8')
          PY
          set -o pipefail
          python /tmp/apply-issue-880.py 2>&1 | tee /tmp/apply-issue-880.log
          cat > client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx <<'EOF'
          // @vitest-environment jsdom
          import React from "react";
          import { cleanup, render, screen, waitFor } from "@testing-library/react";
          import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";

          let route = "/professional/patients/41";
          const setLocation = vi.fn();
          let selectedPatient:
            | {
                patientId: number;
                displayName: string;
                trackingStatus: "active" | "ended";
              }
            | null = {
            patientId: 41,
            displayName: "Ana",
            trackingStatus: "active",
          };

          vi.mock("@/components/ProfessionalLayout", () => ({
            useProfessionalWorkspace: () => ({ selectedPatient, clearPatient: vi.fn() }),
          }));
          vi.mock("wouter", () => ({ useLocation: () => [route, setLocation] }));
          vi.mock("./ProfessionalPatientWorkspace", () => ({
            default: () => <div>Workspace contextual do paciente</div>,
          }));

          beforeEach(() => {
            route = "/professional/patients/41";
            setLocation.mockReset();
            selectedPatient = {
              patientId: 41,
              displayName: "Ana",
              trackingStatus: "active",
            };
          });

          afterEach(cleanup);

          describe("ProfessionalPatientRouteGuard", () => {
            it.each([
              "/professional/patients/41",
              "/professional/patients/41/assessment",
              "/professional/patients/41/goals",
              "/professional/patients/41/guidance",
              "/professional/patients/41/notes",
              "/professional/patients/41/reports",
              "/professional/patients/41/messages",
              "/professional/patients/41/history",
            ])("keeps %s inside the shared patient workspace", async patientRoute => {
              route = patientRoute;
              const { default: Guard } = await import("./ProfessionalPatientRouteGuard");
              render(<Guard />);
              expect(screen.getByText("Workspace contextual do paciente")).toBeTruthy();
            });

            it("redirects ended tracking to the audit history surface", async () => {
              route = "/professional/patients/41/assessment";
              selectedPatient = {
                patientId: 41,
                displayName: "Ana",
                trackingStatus: "ended",
              };
              const { default: Guard } = await import("./ProfessionalPatientRouteGuard");
              render(<Guard />);

              expect(screen.getByText("Acompanhamento encerrado")).toBeTruthy();
              expect(screen.queryByText("Workspace contextual do paciente")).toBeNull();
              await waitFor(() =>
                expect(setLocation).toHaveBeenCalledWith(
                  "/professional/patients/41/history"
                )
              );
            });

            it("keeps ended tracking inside the audit history route", async () => {
              route = "/professional/patients/41/history";
              selectedPatient = {
                patientId: 41,
                displayName: "Ana",
                trackingStatus: "ended",
              };
              const { default: Guard } = await import("./ProfessionalPatientRouteGuard");
              render(<Guard />);

              expect(screen.getByText("Workspace contextual do paciente")).toBeTruthy();
              expect(setLocation).not.toHaveBeenCalled();
            });

            it("keeps protected content hidden without a validated patient context", async () => {
              selectedPatient = null;
              const { default: Guard } = await import("./ProfessionalPatientRouteGuard");
              render(<Guard />);
              expect(screen.getByText("Selecione um paciente")).toBeTruthy();
              expect(screen.queryByText("Workspace contextual do paciente")).toBeNull();
            });
          });
          EOF
      - name: Upload apply diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-880-apply-diagnostics-${{ github.run_id }}
          path: /tmp/apply-issue-880.log
          if-no-files-found: error
          retention-days: 3
      - name: Format corrected files
        run: |
          pnpm exec prettier --write \
            client/src/pages/professional/ProfessionalPatientRouteGuard.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
            client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx \
            client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx \
            server/modules/professionals/recordService.ts \
            server/modules/professionals/recordService.authorship.test.ts \
            server/modules/professionals/service.ts \
            server/modules/professionals/service.test.ts \
            server/modules/professionals/messageService.ts \
            server/modules/professionals/messageService.endedAccess.test.ts \
            docs/testing/professional-workspace-routing.md \
            docs/design-docs/professional-navigation.md
      - name: Run focused verification
        env:
          NODE_ENV: test
          PROFESSIONAL_ACCESS_RECEIPT_STORAGE: memory
        run: |
          set -o pipefail
          {
            pnpm exec vitest run \
              client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx \
              client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx \
              server/modules/professionals/recordService.authorship.test.ts \
              server/modules/professionals/service.test.ts \
              server/modules/professionals/messageService.endedAccess.test.ts \
              --maxWorkers=1 --minWorkers=1
            pnpm check
            pnpm docs:check
            bash scripts/render-professional-patient-workspace-visual.sh
          } 2>&1 | tee /tmp/verify-issue-880.log
      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-880-verification-diagnostics-${{ github.run_id }}
          path: /tmp/verify-issue-880.log
          if-no-files-found: error
          retention-days: 3
      - name: Commit functional corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            client/src/pages/professional/ProfessionalPatientRouteGuard.tsx \
            client/src/pages/professional/ProfessionalPatientWorkspace.tsx \
            client/src/pages/professional/ProfessionalPatientRouteGuard.test.tsx \
            client/src/pages/ProfessionalPatientWorkspace.unsavedNavigation.test.tsx \
            server/modules/professionals/recordService.ts \
            server/modules/professionals/recordService.authorship.test.ts \
            server/modules/professionals/service.ts \
            server/modules/professionals/service.test.ts \
            server/modules/professionals/messageService.ts \
            server/modules/professionals/messageService.endedAccess.test.ts \
            docs/testing/professional-workspace-routing.md \
            docs/design-docs/professional-navigation.md \
            scripts/render-professional-patient-workspace-visual.sh
          git diff --cached --check
          git commit -m "fix: resolve issue 880 audit findings (#880)"
          git push origin HEAD:feat/875-professional-context-routes
      - name: Report implementation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULT: ${{ job.status }}
        run: |
          details=$(tail -n 40 /tmp/verify-issue-880.log 2>/dev/null || tail -n 40 /tmp/apply-issue-880.log 2>/dev/null || true)
          body=$(printf '## Implementação das pendências da issue #880\n\n- workflow run: `%s`\n- resultado: `%s`\n- head de entrada: `%s`\n\n### Diagnóstico\n```text\n%s\n```\n\nEsta é uma verificação interna do contexto de implementação e não substitui auditoria independente.' "${GITHUB_RUN_ID}" "${RESULT}" "${GITHUB_SHA}" "${details}")
          jq -n --arg body "$body" '{body:$body}' > /tmp/issue-880-result.json
          curl --fail --silent --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --data-binary @/tmp/issue-880-result.json
