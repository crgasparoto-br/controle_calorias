name: Repair and dispatch issue 880 implementation

on:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/report-patch-issue-880.yml"

permissions:
  actions: write
  contents: write

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/875-professional-context-routes
          fetch-depth: 0
      - name: Repair implementation workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/patch-issue-880-audit-findings.yml')
          source = path.read_text(encoding='utf-8')

          old_loop = '          ]:\n              replace_once(professional_service, old, new)\n'
          new_loop = (
              '          ]:\n'
              '              file = Path(professional_service)\n'
              '              source = file.read_text(encoding="utf-8")\n'
              '              expected = 2 if "const timeZone = await getEffectiveUserTimeZone" in old else 1\n'
              '              count = source.count(old)\n'
              '              if count != expected:\n'
              '                  raise SystemExit(\n'
              '                      f"{professional_service}: expected {expected} anchors, found {count}: {old[:100]!r}"\n'
              '                  )\n'
              '              file.write_text(source.replace(old, new), encoding="utf-8")\n'
          )
          if source.count(old_loop) != 1:
              raise SystemExit('expected one professional service loop anchor')
          source = source.replace(old_loop, new_loop, 1)

          old_permissions = 'permissions:\n  contents: write\n'
          new_permissions = (
              'permissions:\n'
              '  contents: write\n'
              '  issues: write\n'
              '  pull-requests: write\n'
          )
          if source.count(old_permissions) != 1:
              raise SystemExit('expected one correction workflow permissions block')
          source = source.replace(old_permissions, new_permissions, 1)

          report_step = (
              '\n      - name: Report correction workflow result\n'
              '        if: always()\n'
              '        env:\n'
              '          GH_TOKEN: ${{ github.token }}\n'
              '          PR_NUMBER: "888"\n'
              '        run: |\n'
              '          conclusion="${{ job.status }}"\n'
              "          body=$(printf '## Implementação das pendências da issue #880\\n\\n- workflow run: `%s`\\n- resultado: `%s`\\n- head de entrada: `%s`\\n\\nO resultado é uma verificação interna do contexto de implementação e não substitui auditoria independente.' \"${GITHUB_RUN_ID}\" \"$conclusion\" \"${GITHUB_SHA}\")\n"
              '          jq -n --arg body "$body" \'{body:$body}\' > /tmp/issue-880-result.json\n'
              '          curl --fail --silent --location \\\n'
              '            --request POST \\\n'
              '            --header "Accept: application/vnd.github+json" \\\n'
              '            --header "Authorization: Bearer ${GH_TOKEN}" \\\n'
              '            --header "X-GitHub-Api-Version: 2022-11-28" \\\n'
              '            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \\\n'
              '            --data-binary @/tmp/issue-880-result.json\n'
          )
          if 'Report correction workflow result' in source:
              raise SystemExit('correction workflow already contains result reporter')
          source = source.rstrip() + '\n' + report_step
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit repaired implementation workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/patch-issue-880-audit-findings.yml
          git diff --cached --check
          git commit -m "ci: repair issue 880 implementation workflow"
          git push origin HEAD:feat/875-professional-context-routes
      - name: Dispatch repaired implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/patch-issue-880-audit-findings.yml/dispatches \
            --data '{"ref":"feat/875-professional-context-routes"}'
