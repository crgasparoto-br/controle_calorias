name: Professional persistence TiDB gate

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "server/modules/professionals/**"
      - "server/repositories/professionalRepository.ts"
      - "server/repositories/professionalContentRepository.ts"
      - "server/repositories/professionalGoalPrivacyRepository.ts"
      - "server/modules/goals/**"
      - "server/nutritionRouter.ts"
      - "scripts/migrate-professional-persistence.ts"
      - "scripts/test-professional-persistence-tidb.ts"
      - "package.json"
      - ".github/workflows/professional-persistence-tidb.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  professional-persistence:
    name: Professional persistence TiDB
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start TiDB
        run: |
          docker run -d --name professional-persistence-tidb -p 4000:4000 pingcap/tidb:v8.5.1
          for attempt in $(seq 1 90); do
            if node --input-type=module -e 'import mysql from "mysql2/promise"; const connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" }); await connection.query("CREATE DATABASE IF NOT EXISTS controle_calorias"); await connection.end();'; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 professional-persistence-tidb
          exit 1

      - name: Apply current repository schema
        run: pnpm exec drizzle-kit push --force

      - name: Inspect Drizzle metadata drift
        id: drizzle-drift
        continue-on-error: true
        run: |
          pnpm exec drizzle-kit generate
          git diff --exit-code -- drizzle

      - name: Preserve Drizzle drift diagnostics
        if: steps.drizzle-drift.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-drift-${{ github.sha }}
          path: drizzle/
          if-no-files-found: error
          retention-days: 3

      - name: Commit missing snapshot for migration 0032
        if: steps.drizzle-drift.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          if [ -f drizzle/meta/0032_snapshot.json ]; then
            echo "Snapshot 0032 already exists; no repair commit required."
            exit 0
          fi

          generated_snapshot=$(find drizzle/meta -maxdepth 1 -name '0033_snapshot.json' -print -quit)
          generated_migration=$(find drizzle -maxdepth 1 -name '0033_*.sql' -print -quit)
          if [ -z "$generated_snapshot" ] || [ -z "$generated_migration" ]; then
            echo "Expected generated snapshot and migration were not found."
            exit 1
          fi

          if ! grep -q 'CREATE TABLE `professionalOfficialGoals`' "$generated_migration" || \
             ! grep -q 'CREATE TABLE `professionalGoalReviewRequests`' "$generated_migration" || \
             ! grep -q 'CREATE TABLE `professionalGoalNotifications`' "$generated_migration"; then
            echo "Generated migration contains unexpected schema drift."
            exit 1
          fi

          cp "$generated_snapshot" drizzle/meta/0032_snapshot.json
          git checkout -- drizzle/meta/_journal.json
          rm -f "$generated_migration" "$generated_snapshot"
          git add drizzle/meta/0032_snapshot.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(db): registrar snapshot da migration 0032"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Restore repository migrations after drift inspection
        if: always()
        run: git checkout -- drizzle

      - name: Validate professional migration and repository
        run: |
          log_file=/tmp/professional-persistence.log
          setsid pnpm db:test:professionals >"$log_file" 2>&1 &
          test_pid=$!
          success_marker='"event":"professional.persistence.integration.passed"'

          for attempt in $(seq 1 150); do
            if grep -q "$success_marker" "$log_file"; then
              cat "$log_file"
              kill -TERM -- "-$test_pid" 2>/dev/null || true
              sleep 2
              kill -KILL -- "-$test_pid" 2>/dev/null || true
              wait "$test_pid" 2>/dev/null || true
              echo "Professional persistence integration completed successfully."
              exit 0
            fi

            if ! kill -0 "$test_pid" 2>/dev/null; then
              set +e
              wait "$test_pid"
              test_status=$?
              set -e
              cat "$log_file"
              if [ "$test_status" -eq 0 ] && grep -q "$success_marker" "$log_file"; then
                echo "Professional persistence integration completed successfully."
                exit 0
              fi
              echo "Professional persistence integration exited before its success marker."
              exit "${test_status:-1}"
            fi

            sleep 2
          done

          cat "$log_file"
          kill -TERM -- "-$test_pid" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-$test_pid" 2>/dev/null || true
          wait "$test_pid" 2>/dev/null || true
          echo "Professional persistence integration timed out before its success marker."
          exit 1

      - name: Validate backfill command idempotency
        run: |
          pnpm db:migrate:professionals
          pnpm db:migrate:professionals

      - name: Validate referential integrity
        run: pnpm db:check-integrity

      - name: Fail on Drizzle metadata drift
        if: steps.drizzle-drift.outcome == 'failure'
        run: |
          echo "Drizzle metadata drift detected. Inspect the uploaded artifact before merging."
          exit 1

      - name: Show TiDB logs on failure
        if: failure()
        run: docker logs --tail 100 professional-persistence-tidb
