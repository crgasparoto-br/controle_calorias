name: Professional persistence TiDB gate

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "server/modules/professionals/**"
      - "server/repositories/professionalRepository.ts"
      - "server/nutritionRouter.ts"
      - "scripts/migrate-professional-persistence.ts"
      - "scripts/test-professional-persistence-tidb.ts"
      - "package.json"
      - ".github/implementation-payload.ready"
      - ".github/workflows/professional-persistence-tidb.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply-payload:
    name: Apply validated professional payload
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      applied: ${{ steps.apply.outputs.applied }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply and publish payload
        id: apply
        shell: bash
        run: |
          if [[ ! -f .github/implementation-payload.ready ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat .github/implementation-payload.part* | base64 --decode > /tmp/professional-phase.tar.gz
          echo "746b55fba7a08a401060c23448ba6001a13e76fe9e2155ab44af8743dc1e1a33  /tmp/professional-phase.tar.gz" | sha256sum -c -
          tar -xzf /tmp/professional-phase.tar.gz
          rm -f .github/implementation-payload.part* .github/implementation-payload.ready
          rm -f .github/workflows/apply-professional-phase-payload.yml
          rm -f .github/workflows/branch-source-snapshot.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(professional): concluir persistencia das fases 804 e 805"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "applied=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch validation on published head
        if: steps.apply.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run professional-persistence-tidb.yml --ref "$HEAD_BRANCH"

  professional-persistence:
    name: Professional persistence TiDB
    needs: apply-payload
    if: always() && (github.event_name == 'workflow_dispatch' || needs.apply-payload.outputs.applied != 'true')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start TiDB
        run: |
          docker run -d --name professional-persistence-tidb -p 4000:4000 pingcap/tidb:v8.5.1
          for attempt in $(seq 1 90); do
            if node --input-type=module -e 'import mysql from "mysql2/promise"; const connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" }); await connection.query("CREATE DATABASE IF NOT EXISTS controle_calorias"); await connection.end();'; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 professional-persistence-tidb
          exit 1

      - name: Apply current repository schema
        run: pnpm exec drizzle-kit push --force

      - name: Ensure Drizzle metadata is stable
        run: |
          pnpm exec drizzle-kit generate
          git diff --exit-code -- drizzle

      - name: Validate professional migration and repository
        run: pnpm db:test:professionals

      - name: Validate backfill command idempotency
        run: |
          pnpm db:migrate:professionals
          pnpm db:migrate:professionals

      - name: Validate referential integrity
        run: pnpm db:check-integrity

      - name: Show TiDB logs on failure
        if: failure()
        run: docker logs --tail 100 professional-persistence-tidb
