name: Professional persistence TiDB gate

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "server/modules/professionals/**"
      - "server/repositories/professionalRepository.ts"
      - "server/repositories/professionalContentRepository.ts"
      - "server/repositories/professionalGoalPrivacyRepository.ts"
      - "server/repositories/professionalPortfolioRepository.ts"
      - "server/repositories/professionalPortfolioRepository.test.ts"
      - "server/modules/goals/**"
      - "server/nutritionRouter.ts"
      - "scripts/migrate-professional-persistence.ts"
      - "scripts/test-professional-persistence-tidb.ts"
      - "scripts/test-professional-operational-alerts-tidb.ts"
      - "scripts/test-professional-portfolio-report-timezone-tidb.ts"
      - "scripts/test-professional-access-receipts-tidb.ts"
      - "scripts/test-professional-access-public-boundary-tidb.ts"
      - "package.json"
      - ".github/workflows/professional-persistence-tidb.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  professional-persistence:
    name: Professional persistence TiDB
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root@127.0.0.1:4000/controle_calorias

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p artifacts

      - name: Start TiDB
        run: |
          docker run -d --name professional-persistence-tidb -p 4000:4000 pingcap/tidb:v8.5.1
          for attempt in $(seq 1 90); do
            if node --input-type=module -e 'import mysql from "mysql2/promise"; const connection = await mysql.createConnection({ host: "127.0.0.1", port: 4000, user: "root" }); await connection.query("CREATE DATABASE IF NOT EXISTS controle_calorias"); await connection.end();'; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 professional-persistence-tidb
          exit 1

      - name: Apply current repository schema
        run: pnpm exec drizzle-kit push --force

      - name: Inspect Drizzle metadata drift
        id: drizzle-drift
        continue-on-error: true
        run: |
          pnpm exec drizzle-kit generate
          git diff --exit-code -- drizzle

      - name: Preserve Drizzle drift diagnostics
        if: steps.drizzle-drift.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: drizzle-drift-${{ github.sha }}
          path: drizzle/
          if-no-files-found: error
          retention-days: 3

      - name: Restore repository migrations after drift inspection
        if: always()
        run: git checkout -- drizzle

      - name: Validate professional migration and repository
        run: |
          set -euo pipefail

          run_integration() {
            script_path="$1"
            success_marker="$2"
            log_slug="$3"
            log_file="artifacts/${log_slug}.log"
            : >"$log_file"

            setsid pnpm exec tsx "$script_path" >"$log_file" 2>&1 &
            test_pid=$!

            for attempt in $(seq 1 150); do
              if grep -q "$success_marker" "$log_file"; then
                cat "$log_file"
                kill -TERM -- "-$test_pid" 2>/dev/null || true
                sleep 1
                kill -KILL -- "-$test_pid" 2>/dev/null || true
                wait "$test_pid" 2>/dev/null || true
                echo "${log_slug} completed successfully."
                return 0
              fi

              if ! kill -0 "$test_pid" 2>/dev/null; then
                set +e
                wait "$test_pid"
                test_status=$?
                set -e
                cat "$log_file"
                if [ "$test_status" -eq 0 ] && grep -q "$success_marker" "$log_file"; then
                  echo "${log_slug} completed successfully."
                  return 0
                fi
                echo "${log_slug} exited before its success marker."
                if [ "$test_status" -eq 0 ]; then return 1; fi
                return "$test_status"
              fi

              sleep 2
            done

            cat "$log_file"
            kill -TERM -- "-$test_pid" 2>/dev/null || true
            sleep 1
            kill -KILL -- "-$test_pid" 2>/dev/null || true
            wait "$test_pid" 2>/dev/null || true
            echo "${log_slug} timed out before its success marker."
            return 1
          }

          run_integration \
            scripts/test-professional-persistence-tidb.ts \
            '"event":"professional.persistence.integration.passed"' \
            professional-persistence
          run_integration \
            scripts/test-professional-operational-alerts-tidb.ts \
            '"event":"professional.operational-alerts.integration.passed"' \
            professional-operational-alerts
          run_integration \
            scripts/test-professional-portfolio-report-timezone-tidb.ts \
            '"event":"professional.portfolio_report_timezone.integration.passed"' \
            professional-portfolio-report-timezone

      - name: Validate privacy-safe access receipts
        run: |
          log_file=artifacts/professional-access-receipts.log
          set +e
          timeout --signal=TERM --kill-after=5s 120s \
            pnpm exec tsx scripts/test-professional-access-receipts-tidb.ts \
            >"$log_file" 2>&1
          test_status=$?
          set -e
          cat "$log_file"
          if grep -q '"event":"professional.access_receipts.integration.passed"' "$log_file"; then
            echo "Professional access receipt integration completed successfully."
            exit 0
          fi
          echo "Professional access receipt integration failed before its success marker."
          if [ "$test_status" -eq 0 ]; then exit 1; fi
          exit "$test_status"

      - name: Validate public access boundary by email and phone
        run: |
          log_file=artifacts/professional-access-public-boundary.log
          set +e
          timeout --signal=TERM --kill-after=5s 150s \
            pnpm exec tsx scripts/test-professional-access-public-boundary-tidb.ts \
            >"$log_file" 2>&1
          test_status=$?
          set -e
          cat "$log_file"
          if grep -q '"event":"professional.access_public_boundary.integration.passed"' "$log_file"; then
            echo "Professional public access boundary integration completed successfully."
            exit 0
          fi
          echo "Professional public access boundary integration failed before its success marker."
          if [ "$test_status" -eq 0 ]; then exit 1; fi
          exit "$test_status"

      - name: Preserve access boundary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-access-boundary-${{ github.sha }}
          path: artifacts/*.log
          if-no-files-found: error
          retention-days: 3

      - name: Validate backfill command idempotency
        run: |
          pnpm db:migrate:professionals
          pnpm db:migrate:professionals

      - name: Validate referential integrity
        run: pnpm db:check-integrity

      - name: Fail on Drizzle metadata drift
        if: steps.drizzle-drift.outcome == 'failure'
        run: |
          echo "Drizzle metadata drift detected. Inspect the uploaded artifact before merging."
          exit 1

      - name: Show TiDB logs on failure
        if: failure()
        run: docker logs --tail 100 professional-persistence-tidb
